[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metacom-pm"
version = "4.0.0"
description = "Leakage-controlled pre-evidence resource allocation for longitudinal emotional support"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "tiktoken>=0.12,<0.13",
  "torch>=2.3,<3",
  "transformers>=4.44,<5",
  "huggingface-hub>=0.24,<1",
  "networkx>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
official-rag = [
  "faiss-cpu==1.12.0",
  "langchain-community==0.3.28",
  "langchain-huggingface==0.3.1",
  "sentence-transformers==5.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires a local CUDA GPU and the torch/sentence-transformers extras (deselect with -m 'not gpu')",
]
