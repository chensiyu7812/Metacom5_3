."}, "H008:T010": {"id": "H008:T010", "role": "seeker", "text": "I know you're right, but every time I think about it, my anxiety flares up. It's like I'm trapped in this cycle."}, "H008:T011": {"id": "H008:T011", "role": "supporter", "text": "It's understandable considering your past experiences with panic and stress at work. Maybe you could start by writing down your thoughts before you approach the conversation. It might help ease some anxiety."}, "H008:T012": {"id": "H008:T012", "role": "seeker", "text": "That could be a good idea. Organizing my thoughts might give me the confidence to bring up the conversation."}, "H008:T013": {"id": "H008:T013", "role": "supporter", "text": "Absolutely. Plus, it might help you feel more in control and prepared. Sometimes a little structure can make a big difference."}, "H008:T014": {"id": "H008:T014", "role": "seeker", "text": "I'll try that. I just wish I could find a way to manage all of this stress better."}, "H008:T015": {"id": "H008:T015", "role": "supporter", "text": "It's definitely not easy, especially with your ongoing sleep issues. Have you been able to take any steps for self-care recently?"}, "H008:T016": {"id": "H008:T016", "role": "seeker", "text": "Not as much as I'd like. It's just so overwhelming right now, but I know I need to prioritize it more."}, "H008:T017": {"id": "H008:T017", "role": "supporter", "text": "Self-care often falls to the wayside when things get tough, but it's crucial. Even small steps, like a daily walk or setting a bedtime routine, can be beneficial."}, "H008:T018": {"id": "H008:T018", "role": "seeker", "text": "Maybe I can start with that. Create a small routine that grounds me a bit each day."}, "H008:T019": {"id": "H008:T019", "role": "supporter", "text": "That sounds like a positive step, Charlotte. Remember, it's about finding balance and small adjustments can have a big impact."}, "H008:T020": {"id": "H008:T020", "role": "seeker", "text": "Thank you for being there and listening. It means so much to know I'm not in this alone."}, "H008:T021": {"id": "H008:T021", "role": "supporter", "text": "You're never alone. I'm here for you. Feel free to reach out anytime you need to talk or share."}, "H008:T022": {"id": "H008:T022", "role": "seeker", "text": "I will. Just having this conversation has already lightened the load a bit."}, "H008:T023": {"id": "H008:T023", "role": "supporter", "text": "I'm really glad to hear that. Keep taking it one day at a time. You've got this."}, "H008:T024": {"id": "H008:T024", "role": "seeker", "text": "One day at a time. I'll remember that. Thanks again."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hey, I really need someone to talk to right now."}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Of course, Charlotte. What's on your mind?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "I just had a falling out with one of my closest friends. She said I've been distant lately."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "I'm sorry to hear that. It must be so hard to hear those words from a friend."}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "Yeah, it really hurt. I didn't even realize I was being distant."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "It sounds like you're dealing with a lot on your plate. Sometimes, things just pile up and we don't even realize how it's affecting those around us."}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "Exactly. Work has been a mess lately. I feel like I'm drowning, and now this with my friend... it's just too much."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "With all that's happened at work, it's understandable you might feel overwhelmed. Remember how you handled the panic attack at work the last time? It can feel like there's no way out, but you managed then."}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "I remember. It took a lot out of me to get through that period, though. Now with the added stress of this disagreement... I don't know what to do."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "It's completely normal to feel this way. You've been managing a lot between the work stress, the criticism from your boss, and now these long hours."}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "I just feel like I can't catch my breath. Every time I think things are getting better, something else happens."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "I'm really sorry you're feeling this way, Charlotte. It's important to acknowledge how you're feeling and give yourself some grace."}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "Thanks. I think I need to find a way to communicate with my friend and maybe even try and talk to my boss about cutting back my hours."}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "That sounds like a good plan. Communication can sometimes be that bridge to understanding. Approaching your friend with openness might bring clarity."}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "I hope so. I'm just worried that she'll be too hurt or that I'll mess things up with my boss."}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "It's okay to feel worried, but acknowledging how you feel is the first step. When you reach out, it can help to be genuine and share how overwhelmed life's been for you."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "Right. I guess honesty would be best. I've been avoiding it because I'm scared of saying the wrong thing."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "That's totally understandable. Remember, you're human and it's okay to feel vulnerable at times. Trying to be honest with yourself and them might help."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "Thanks for listening. I didn't realize how much I needed this talk."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "Anytime, Charlotte. You're not alone in this, and I'm here whenever you need to chat or just vent."}, "H009:T020": {"id": "H009:T020", "role": "seeker", "text": "I appreciate it more than you know. I'll try to take it a step at a time."}, "H009:T021": {"id": "H009:T021", "role": "supporter", "text": "Exactly, small steps are key. Take care of yourself and remember, progress is still progress, no matter the pace."}, "H010:T000": {"id": "H010:T000", "role": "supporter", "text": "Hey Charlotte, I saw your message. How are you holding up today?"}, "H010:T001": {"id": "H010:T001", "role": "seeker", "text": "Hi, it's been a tough day again. I had another disagreement at work with a coworker."}, "H010:T002": {"id": "H010:T002", "role": "supporter", "text": "I'm sorry to hear that. What happened with your coworker?"}, "H010:T003": {"id": "H010:T003", "role": "seeker", "text": "We got into it because they felt I wasn't contributing enough to the team."}, "H010:T004": {"id": "H010:T004", "role": "supporter", "text": "That sounds really frustrating, especially with everything you've been dealing with lately."}, "H010:T005": {"id": "H010:T005", "role": "seeker", "text": "It just hit me hard. I’ve been putting in extra hours and still feel like it’s never enough."}, "H010:T006": {"id": "H010:T006", "role": "supporter", "text": "That makes sense, considering you've had your work hours extended unofficially. That's a lot of pressure."}, "H010:T007": {"id": "H010:T007", "role": "seeker", "text": "Exactly. And it's starting to take a toll on me, both physically and mentally."}, "H010:T008": {"id": "H010:T008", "role": "supporter", "text": "It's completely understandable to feel that way. Are you managing to get any rest?"}, "H010:T009": {"id": "H010:T009", "role": "seeker", "text": "Not really. My sleep's been all over the place, and I can't seem to shake off this constant stress."}, "H010:T010": {"id": "H010:T010", "role": "supporter", "text": "Lack of sleep can definitely amplify stress. Have you tried any methods to relax before bed?"}, "H010:T011": {"id": "H010:T011", "role": "seeker", "text": "I used to try meditation, but I just don’t have the energy these days."}, "H010:T012": {"id": "H010:T012", "role": "supporter", "text": "Even small moments of self-care can sometimes help, though I can imagine it feels overwhelming to think about."}, "H010:T013": {"id": "H010:T013", "role": "seeker", "text": "Yeah, it's hard to even think about self-care right now, with so much going on."}, "H010:T014": {"id": "H010:T014", "role": "supporter", "text": "Maybe it would help to take a step back and acknowledge how much you're managing to do despite everything."}, "H010:T015": {"id": "H010:T015", "role": "seeker", "text": "It's just hard when it feels like all eyes are on me, waiting for me to mess up."}, "H010:T016": {"id": "H010:T016", "role": "supporter", "text": "It's understandable to feel that pressure. People often only see the surface, not all the hard work you're putting in."}, "H010:T017": {"id": "H010:T017", "role": "seeker", "text": "That's true. I have been trying really hard, just wish it was recognized more."}, "H010:T018": {"id": "H010:T018", "role": "supporter", "text": "It's important to recognize it for yourself, too. You’ve been through a lot and are still pushing forward."}, "H010:T019": {"id": "H010:T019", "role": "seeker", "text": "Thanks for saying that. It means a lot to hear someone understands."}, "H010:T020": {"id": "H010:T020", "role": "supporter", "text": "Of course, Charlotte. You’re doing the best you can, and that's something to be proud of."}, "H010:T021": {"id": "H010:T021", "role": "seeker", "text": "I need to keep reminding myself of that. Thanks for listening. It’s really helped."}, "H010:T022": {"id": "H010:T022", "role": "supporter", "text": "Anytime. Feel free to reach out anytime you need to talk or just need a break."}, "H010:T023": {"id": "H010:T023", "role": "seeker", "text": "I will. Thanks again for being there."}, "H010:T024": {"id": "H010:T024", "role": "supporter", "text": "Take care, Charlotte. You've got this."}, "H011:T000": {"id": "H011:T000", "role": "supporter", "text": "Hey Charlotte, how have you been holding up recently?"}, "H011:T001": {"id": "H011:T001", "role": "seeker", "text": "Hi, it's been a bit of a rollercoaster lately. I recently went to a social gathering, and my nerves were all over the place."}, "H011:T002": {"id": "H011:T002", "role": "supporter", "text": "Social events can be overwhelming, especially if there's a lot going on. What was the gathering about?"}, "H011:T003": {"id": "H011:T003", "role": "seeker", "text": "It was supposed to be just a casual meet-up, but there were a lot of potential networking opportunities. It felt really high-stakes for me."}, "H011:T004": {"id": "H011:T004", "role": "supporter", "text": "That does sound intense. How did you feel being in that environment?"}, "H011:T005": {"id": "H011:T005", "role": "seeker", "text": "I was really anxious at first. I've been feeling a lot of pressure at work lately, and it just sort of carried over."}, "H011:T006": {"id": "H011:T006", "role": "supporter", "text": "Considering everything that's been happening at work, it's understandable to feel that way. How did you manage your anxiety while you were there?"}, "H011:T007": {"id": "H011:T007", "role": "seeker", "text": "I tried to focus on engaging one-on-one, which helped a bit, but it was hard to shake the feeling of being judged or not doing enough."}, "H011:T008": {"id": "H011:T008", "role": "supporter", "text": "That's a smart strategy, reaching out in smaller settings. It's important to remember that these situations aren't always about being perfect, just about making connections."}, "H011:T009": {"id": "H011:T009", "role": "seeker", "text": "Yeah, I guess I keep remembering the times my boss publicly criticized me for inaccuracies. It's like I'm scared of making a mistake again, but now in any setting."}, "H011:T010": {"id": "H011:T010", "role": "supporter", "text": "That experience left a big impact on you. It's understandable to be cautious, but networking is really more about building relationships than being flawless."}, "H011:T011": {"id": "H011:T011", "role": "seeker", "text": "I know you're right. I did meet a couple of interesting people, and a friend there was really supportive. It was nice to not feel so stuck in my head for once."}, "H011:T012": {"id": "H011:T012", "role": "supporter", "text": "That's so great to hear! Having support, especially from friends, can make such a difference in these moments. How did the evening wrap up for you?"}, "H011:T013": {"id": "H011:T013", "role": "seeker", "text": "Actually, by the end of the night, I felt a bit more relaxed. We ended up talking and laughing about random things. It was a nice distraction from work issues."}, "H011:T014": {"id": "H011:T014", "role": "supporter", "text": "It sounds like you found some brightness in those connections despite the initial stress. Do you feel like you could attend more events like this in the future?"}, "H011:T015": {"id": "H011:T015", "role": "seeker", "text": "I think I could. This experience taught me that not everything has to revolve around job performance. It's okay to just enjoy the moment."}, "H011:T016": {"id": "H011:T016", "role": "supporter", "text": "Exactly, sometimes it's the small joys that help us regain balance. Have you thought about discussing these experiences with your therapist?"}, "H011:T017": {"id": "H011:T017", "role": "seeker", "text": "I might bring it up. Therapy's been a space where I can talk candidly about my work stress. Talking about the better moments could be helpful too."}, "H011:T018": {"id": "H011:T018", "role": "supporter", "text": "That sounds like a great plan. Remember, progress isn't always linear, but acknowledging the positive steps is just as important."}, "H011:T019": {"id": "H011:T019", "role": "seeker", "text": "Thanks, I agree. I'll try to hold onto these good moments as I move forward."}, "H012:T000": {"id": "H012:T000", "role": "seeker", "text": "Hey there, can we chat for a bit? I've got some things on my mind."}, "H012:T001": {"id": "H012:T001", "role": "supporter", "text": "Of course, Charlotte. I'm here for you. What's been happening?"}, "H012:T002": {"id": "H012:T002", "role": "seeker", "text": "So, I went on this New Year's trip and made a new friend. It's been nice having someone new to talk to, but I can't shake some underlying stress."}, "H012:T003": {"id": "H012:T003", "role": "supporter", "text": "That sounds exciting, meeting someone new can bring fresh perspectives. But it's also understandable to feel stress, especially after everything you've experienced."}, "H012:T004": {"id": "H012:T004", "role": "seeker", "text": "Yeah, it seems like things have piled up since last fall, like the panic attack at work and the extended hours."}, "H012:T005": {"id": "H012:T005", "role": "supporter", "text": "Those were significant challenges. And I remember your workload and social conflicts taking a toll on you. How are you managing those feeling now?"}, "H012:T006": {"id": "H012:T006", "role": "seeker", "text": "Honestly, sometimes it feels overwhelming. Making this new friend was a good distraction, but there's still tension lingering from the office issues."}, "H012:T007": {"id": "H012:T007", "role": "supporter", "text": "It sounds like you're carrying a lot. Finding a new connection can be refreshing, but it's okay to still feel burdened by past stress. Have you been able to talk about this with your therapist, though?"}, "H012:T008": {"id": "H012:T008", "role": "seeker", "text": "Yes, I've mentioned it in our sessions. We've been working through some stress management techniques, but it's a slow process."}, "H012:T009": {"id": "H012:T009", "role": "supporter", "text": "Taking it slowly is important. It's great to hear you're working on it in therapy. How do you feel about the progress so far?"}, "H012:T010": {"id": "H012:T010", "role": "seeker", "text": "Some days are better than others. There are moments where I feel like things are improving, but then something small can trigger that anxiety again."}, "H012:T011": {"id": "H012:T011", "role": "supporter", "text": "Recovery has its ups and downs. It's very brave of you to acknowledge where you're at. Maybe focusing on your victories, like forming new friendships, can help you move forward."}, "H012:T012": {"id": "H012:T012", "role": "seeker", "text": "That's true. This new friend has been understanding. We both need a fresh start this year, and it's comforting to know I'm not alone in this."}, "H012:T013": {"id": "H012:T013", "role": "supporter", "text": "It's wonderful to have someone who comprehends what you're going through. Have you considered if they might be open to sharing support with each other?"}, "H012:T014": {"id": "H012:T014", "role": "seeker", "text": "We have talked a lot, and it seems like we're both open to supportive friendship. It's nice to feel connected like that."}, "H012:T015": {"id": "H012:T015", "role": "supporter", "text": "That's so key—to have someone to lean on. Think of them as a partner in your journey. It's also important to continue prioritizing your mental well-being."}, "H012:T016": {"id": "H012:T016", "role": "seeker", "text": "You're right. I need to keep working through this with therapy and allow myself to enjoy new experiences."}, "H012:T017": {"id": "H012:T017", "role": "supporter", "text": "Absolutely. Celebrate the steps you've taken already. It’s okay to lean on friends for support, and accepting help doesn’t mean you’re not strong."}, "H012:T018": {"id": "H012:T018", "role": "seeker", "text": "Thanks for listening. I feel a bit lighter after talking with you."}, "H012:T019": {"id": "H012:T019", "role": "supporter", "text": "I'm glad to hear that. Remember, I'm always here whenever you need to talk. Take care of yourself, Charlotte."}}, "current_date": "2025-01-12", "last_seeker": "I think I need to talk about this in therapy. My sessions have been helping a lot with stress and career stuff. Maybe it'll help here too."}, "166b4b543211286ecac5e3bd6e5ff39bd46e7f646113d73e095196342f8722b7": {"turns": {"C:T000": {"id": "C:T000", "role": "supporter", "text": "Hi Amanda! I just wanted to check in and see how you’re doing lately."}, "C:T001": {"id": "C:T001", "role": "seeker", "text": "Hey, thanks for asking. I'm feeling a bit overwhelmed, to be honest."}, "C:T002": {"id": "C:T002", "role": "supporter", "text": "I’m sorry to hear that. It sounds like a lot is going on right now. Would you like to talk about what’s been happening?"}, "C:T003": {"id": "C:T003", "role": "seeker", "text": "Yeah, it's just everything piling up. I recently found out that my family member’s illness is much more serious than we thought."}, "C:T004": {"id": "C:T004", "role": "supporter", "text": "Oh no, Amanda. That must be incredibly difficult news to process. How are you coping with it?"}, "C:T005": {"id": "C:T005", "role": "seeker", "text": "It's been really tough. My mind is constantly racing, worrying about what might happen next."}, "C:T006": {"id": "C:T006", "role": "supporter", "text": "It’s completely understandable to feel that way. It seems like there are a lot of uncertainties right now. Have you been able to talk to anyone in your family about it?"}, "C:T007": {"id": "C:T007", "role": "seeker", "text": "Not really. Everyone's trying to stay strong, but honestly, I feel kind of alone in all this."}, "C:T008": {"id": "C:T008", "role": "supporter", "text": "Feeling isolated during tough times is so challenging. Do you think talking with them could help you feel more connected?"}, "C:T009": {"id": "C:T009", "role": "seeker", "text": "Maybe. I just don’t want to burden them with my emotions when they’re handling their own."}, "C:T010": {"id": "C:T010", "role": "supporter", "text": "I get that. But remember, sharing how you feel can also be a way to support each other. It might be comforting for them to know they’re not alone in their worries either."}, "C:T011": {"id": "C:T011", "role": "seeker", "text": "Yeah, I guess you’re right. I’ll try to reach out more."}, "C:T012": {"id": "C:T012", "role": "supporter", "text": "That’s a brave step, Amanda, and I’m really proud of you for considering it. How's everything else with work and personal life? Are they adding to your stress?"}, "C:T013": {"id": "C:T013", "role": "seeker", "text": "Work has been demanding too. I'm worried about the new promotion. It's great, but the responsibility is daunting, especially now."}, "C:T014": {"id": "C:T014", "role": "supporter", "text": "Taking on more responsibility, while all of this is happening, must feel overwhelming. Have you thought about what help or changes could make it more manageable for you?"}, "C:T015": {"id": "C:T015", "role": "seeker", "text": "I’ve been thinking of discussing some workload adjustments with my supervisor, but I'm not sure how they’ll react."}, "H001:T000": {"id": "H001:T000", "role": "seeker", "text": "hi there"}, "H001:T001": {"id": "H001:T001", "role": "supporter", "text": "Hello! How are you doing? "}, "H001:T002": {"id": "H001:T002", "role": "seeker", "text": "I'm not doing so good at the moment. I'm feeling very stressed and burned out from work"}, "H001:T003": {"id": "H001:T003", "role": "supporter", "text": "That sounds very frustrating. Is this a recent development at your job? "}, "H001:T004": {"id": "H001:T004", "role": "seeker", "text": "It's been building up for a while now, but it's really starting to get a but overwhelming"}, "H001:T005": {"id": "H001:T005", "role": "supporter", "text": "I can understand how that can have an effect on your mental well-being. Have you spoken to your supervisor about your frustrations at work? "}, "H001:T006": {"id": "H001:T006", "role": "seeker", "text": "I have, but sometimes I feel like she doesn't really listen and she sort of talks over me a lot"}, "H001:T007": {"id": "H001:T007", "role": "supporter", "text": "It sounds like you don't feel listened to. "}, "H001:T008": {"id": "H001:T008", "role": "seeker", "text": "That's right... I guess that is quite a lot of the problem. "}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "I don't mind so much the work, I know it is busy for everyone right now, it's a combination of the workload plus not being listened to"}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "I had a similar issue at my last job. My supervisor constantly spoke over me in meetings, and it would drive me crazy. I never could get a word in edge-wise. "}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "Yeah, that sounds a lot like what I am experiencing"}, "H001:T012": {"id": "H001:T012", "role": "supporter", "text": "Are you considering switching jobs? "}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "It's been in the back of my mind, but it's a hard time just now with everything else going on"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "Absolutely. It's a rough time job searching under the best of circumstances. "}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "It is. "}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "Have you tried reaching out to anyone in your network to look for a new position? It helped me when I was previously job searching. "}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "I haven't, but it might be worth getting in touch with some people"}, "H001:T018": {"id": "H001:T018", "role": "supporter", "text": "Absolutely. I also spoke with a therapist before and it helped me a lot. "}, "H001:T019": {"id": "H001:T019", "role": "supporter", "text": "Have you considered reaching out to a professional to talk to? "}, "H001:T020": {"id": "H001:T020", "role": "seeker", "text": "I did consider that, but aren't they expensive?"}, "H001:T021": {"id": "H001:T021", "role": "supporter", "text": "They can be, but many local governments and municipalities have therapists that work on a sliding scale if the financial aspect of therapy is a concern. "}, "H001:T022": {"id": "H001:T022", "role": "supporter", "text": "Therapy can definitely be a large expense though. "}, "H001:T023": {"id": "H001:T023", "role": "seeker", "text": "It might be worth it in the long run though I guess, if it helps how I am feeling"}, "H001:T024": {"id": "H001:T024", "role": "supporter", "text": "If it helps to reframe the expense, you can try to think of it as an investment in your mental health. "}, "H001:T025": {"id": "H001:T025", "role": "seeker", "text": "Yes, that sounds like a more positive way of thinking of it"}, "H001:T026": {"id": "H001:T026", "role": "supporter", "text": "The therapist could likely give you some tools to help manage the frustrations at your workplace more constructively. "}, "H001:T027": {"id": "H001:T027", "role": "seeker", "text": "Yes, I imagine they will have come across this before so will be able to help"}, "H001:T028": {"id": "H001:T028", "role": "supporter", "text": "Absolutely. I hope that you're able to find some peace at your workplace with your boss. "}, "H001:T029": {"id": "H001:T029", "role": "seeker", "text": "Thank you, you have helped a lot"}, "H001:T030": {"id": "H001:T030", "role": "seeker", "text": "Helped give me some ideas to try to help"}, "H001:T031": {"id": "H001:T031", "role": "supporter", "text": "It's my pleasure. I'm happy to have helped you. "}, "H001:T032": {"id": "H001:T032", "role": "supporter", "text": "Is there anything else I can help you with? "}, "H002:T000": {"id": "H002:T000", "role": "seeker", "text": "I feel sad, and feel like need help"}, "H002:T001": {"id": "H002:T001", "role": "supporter", "text": "Can you identify why you feel sad?"}, "H002:T002": {"id": "H002:T002", "role": "seeker", "text": "yes, my aunt pass away a couple weeks ago"}, "H002:T003": {"id": "H002:T003", "role": "seeker", "text": "and since then im feeling really sad"}, "H002:T004": {"id": "H002:T004", "role": "supporter", "text": "It is natural to feel sad when someone you care about dies."}, "H002:T005": {"id": "H002:T005", "role": "seeker", "text": "IS there something I can do to feel better?"}, "H002:T006": {"id": "H002:T006", "role": "supporter", "text": "Are you with family?   Sometimes it helps to be with others who are grieving?"}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "No, I live alone, my family lives in another state"}, "H002:T008": {"id": "H002:T008", "role": "supporter", "text": "Being by yourself is rough after a death.    Can you talk with your family by phone?   Do you have a friend who has gone through a similar loss?"}, "H002:T009": {"id": "H002:T009", "role": "seeker", "text": "I feel like everybody is in their own bussines and have no time to hear my complains"}, "H002:T010": {"id": "H002:T010", "role": "seeker", "text": "I talk to my family, but the whole family is not doing really fine"}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "It sounds like you feel people think you are complaining when you talk about your Aunt's death making you sad.    Is that correct?"}, "H002:T012": {"id": "H002:T012", "role": "seeker", "text": "yes"}, "H002:T013": {"id": "H002:T013", "role": "supporter", "text": "Do you feel you are complaining?"}, "H002:T014": {"id": "H002:T014", "role": "seeker", "text": "yes, I feel like noone wants to listen"}, "H002:T015": {"id": "H002:T015", "role": "seeker", "text": "I need to do something by mnyself"}, "H002:T016": {"id": "H002:T016", "role": "seeker", "text": "Can you recommend someting for me to do to feel better?"}, "H002:T017": {"id": "H002:T017", "role": "supporter", "text": "My own experiences with family deaths is they are sad.    I just wanted to \"feel better\".    My experience was it did not help to complain about \"being sad\" but it did help to talk about why I missed my family member.     If no one was available,   sometimes I would journal.   Do you think that might help you?"}, "H002:T018": {"id": "H002:T018", "role": "seeker", "text": "Well maybe it could works, to mantain distracted"}, "H002:T019": {"id": "H002:T019", "role": "seeker", "text": "thank you"}, "H002:T020": {"id": "H002:T020", "role": "supporter", "text": "You are welcome.    I am sorry about your Aunt."}, "H002:T021": {"id": "H002:T021", "role": "seeker", "text": "Thnak you, I think it helps to have someone to chat"}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "Makes me feel better to chat a bit with you, helped me to relax"}, "H002:T023": {"id": "H002:T023", "role": "supporter", "text": "That is why I am here.     Is there anything else you would like to chat about?"}, "H002:T024": {"id": "H002:T024", "role": "seeker", "text": "I hink, Im fine for now. I will try to keep myself focus on different things"}, "H002:T025": {"id": "H002:T025", "role": "seeker", "text": "and try to chat a bit more at leaat with my family"}, "H002:T026": {"id": "H002:T026", "role": "supporter", "text": "Good bye?"}, "H002:T027": {"id": "H002:T027", "role": "seeker", "text": "Good bye!"}, "H003:T000": {"id": "H003:T000", "role": "supporter", "text": "Hi Amanda, it's good to see you online. How have you been doing lately?"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "Hey! I've been feeling a bit off after attending my aunt's memorial service last week."}, "H003:T002": {"id": "H003:T002", "role": "supporter", "text": "I'm sorry to hear that. It must have been an emotional experience for you."}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "Yeah, it really was. Not only because we were saying goodbye, but also because I got to see so many relatives I hadn't seen in years."}, "H003:T004": {"id": "H003:T004", "role": "supporter", "text": "That sounds like it brought up a lot of feelings. How did that affect you?"}, "H003:T005": {"id": "H003:T005", "role": "seeker", "text": "It was bittersweet. On one hand, it was wonderful to reconnect, but on the other hand, it made me realize how distant I've become from them."}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "It sounds like you're processing a mix of emotions—grief and perhaps some regret?"}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "Exactly. I feel guilty for not staying in touch more. It was strange talking about memories with people I used to be so close to."}, "H003:T008": {"id": "H003:T008", "role": "supporter", "text": "That's understandable. Guilt can be hard to shake off, but reconnecting at the memorial could be a new beginning."}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "I hope so. I exchanged numbers with a few of them and promised to keep in touch."}, "H003:T010": {"id": "H003:T010", "role": "supporter", "text": "That's a great step forward. How does it feel to have taken that initiative?"}, "H003:T011": {"id": "H003:T011", "role": "seeker", "text": "A little reassuring, honestly. But there's still this nagging feeling of having missed out on so much with them."}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "It's natural to feel that way, but it's important to give yourself grace. Every relationship has its own timeline."}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "You're right. I guess I should focus on making the most of the present."}, "H003:T014": {"id": "H003:T014", "role": "supporter", "text": "That's a positive perspective. How do you plan to keep your connections going from here?"}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "I'm thinking of arranging a small family gathering, something more joy-filled, to keep everyone in touch."}, "H003:T016": {"id": "H003:T016", "role": "supporter", "text": "That sounds like a wonderful idea! It could be a new tradition that brings everyone closer."}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "I hope so. It feels good just talking about it. Thanks for listening and helping me work through this."}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "Anytime, Amanda. Remember, you're taking meaningful steps. Keep nurturing those connections."}, "H004:T000": {"id": "H004:T000", "role": "supporter", "text": "Hello, how are you doing today?"}, "H004:T001": {"id": "H004:T001", "role": "seeker", "text": "I am feeling angry today about work. "}, "H004:T002": {"id": "H004:T002", "role": "supporter", "text": "Oh no, what happened to make you feel this way?"}, "H004:T003": {"id": "H004:T003", "role": "seeker", "text": "My coworker expects me to do things the way she does and is constantly critical. I just want her to understand that I am able to do things my way and it is still okay. I told her this and she ignored me. "}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "I'm sure that's terribly frustrating having someone treat you like that. Is this something that your boss is aware of?"}, "H004:T005": {"id": "H004:T005", "role": "seeker", "text": "I have not told her yet. I do not want to get her into trouble and I want to have a good relationship with her. "}, "H004:T006": {"id": "H004:T006", "role": "supporter", "text": "Can you discuss it with her in a respectful way to get her to understand that you're not trying to undermine her but that this is how you work most efficiently? And maybe mention that you don't want to involve the boss?"}, "H004:T007": {"id": "H004:T007", "role": "seeker", "text": "That's something I could try. I really care about my coworker and it makes me so angry that she treats me this way. "}, "H004:T008": {"id": "H004:T008", "role": "supporter", "text": "I think sometimes it's easy to jump to anger when you feel hurt. It might be worth telling her how you feel and also maybe ask why she thinks you should be doing things her way. Maybe there's a give and take in this situation. Some of her methods could be beneficial."}, "H004:T009": {"id": "H004:T009", "role": "seeker", "text": "Do you have any advice on how to start my conversation with her? I have found some of her ideas to be beneficial. I just would like my ideas expressed as well. I feel we can learn from each other. "}, "H004:T010": {"id": "H004:T010", "role": "supporter", "text": "Tell her the things that you like about her method and maybe suggest some of your methods to her as well. Maybe she'll find them to be more efficient. Make it a partnership rather than a fight for whose method is better."}, "H004:T011": {"id": "H004:T011", "role": "supporter", "text": "She could feel threatened by you so it's worth digging into those feelings with her and proving to her that you're working toward the same goal."}, "H004:T012": {"id": "H004:T012", "role": "seeker", "text": "That's a great idea. It is possible. I am the new kid on the block. I will try by being non confrontational. Any specific ideas to how  I can do that? She gets offended easily. I want her to know I am helping. "}, "H004:T013": {"id": "H004:T013", "role": "supporter", "text": "I'd suggest how much she's helped you since you are in fact the new kid on the block.  And tell her that you want to work with her to have the most efficient partnership possible and use each of your talents to the best of your ability. Then you can lay out how you work best and see where it goes from there."}, "H004:T014": {"id": "H004:T014", "role": "seeker", "text": "Thanks! I will try that. You made me feel so much better! "}, "H004:T015": {"id": "H004:T015", "role": "supporter", "text": "I'm so glad, these can be frustrating situations but sometimes it's worth looking at the other person's perspective."}, "H004:T016": {"id": "H004:T016", "role": "seeker", "text": "I agree. Sometimes you just have to take a step back and have a conversation with someone not in the thick of it. "}, "H004:T017": {"id": "H004:T017", "role": "supporter", "text": "Absolutely, I have no emotional stake in this. The two of you do and that can cloud things sometimes."}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "I think people get territorial when they have worked somewhere and a new person comes in. I see that now. I am optimistic we will work it out and be a great team!"}, "H004:T019": {"id": "H004:T019", "role": "supporter", "text": "That's great to hear, I'm glad we were able to chat!"}, "H004:T020": {"id": "H004:T020", "role": "seeker", "text": "Me too! You really helped me. Have a wonderful day! I know I will since you helped me out. "}, "H004:T021": {"id": "H004:T021", "role": "supporter", "text": "That's great, good luck!"}, "H005:T000": {"id": "H005:T000", "role": "seeker", "text": "Hello, how are you ?"}, "H005:T001": {"id": "H005:T001", "role": "supporter", "text": "Hello"}, "H005:T002": {"id": "H005:T002", "role": "supporter", "text": "I am good, how are you?"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "I'm doing well, but it could have been better"}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "What seems to be bothering you tonight?"}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "Yes, my boy friend of 3 years has refused to take our relationship to the next level and I'm kind of getting tired, I don't want to play games anymore"}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "So just to make sure I understand completely, you are ready to move on to the next step of your relationship and you don't feel as though your boyfriend is and this is making you anxious and upset, "}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "exactly, I hate to feel that I'm wasting my time"}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "I completely understand that, as I was in a long term relationship and I felt as though my girlfriend at the time did not want to take things to the next step and I was not happy about it. "}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "Yes, I love him so dearly to want to settle down with him, but if he doesn't want that for me I would rather call it quits now than continue and be disappointed at the long run. "}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "Have you had that conversation with him? I know it might be a difficult conversation to have, but it is often good to get expectations out in the open so you are on the same page with your partner. "}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "Yes, sort of and he gave me the impression that he is not there yet and that was a like almost a year ago, I don't want it to look like I'm pushing him if I try to talk to him again about it. His nonchalant attitude in not seeing the seriousness of it is killing me, I'm just not happy. "}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "That is tough, but sometimes people just portray things differently, for instance I am also very laid back and nonchalant about most things which can lead to miscommunications. "}, "H005:T013": {"id": "H005:T013", "role": "supporter", "text": "I don't think it would be pushing if you haven't had that conversation in almost a year."}, "H005:T014": {"id": "H005:T014", "role": "seeker", "text": "I hope you are right, just don't want to come across as a desperate person and that's why I'm setting myself up to call it quits if he tries to sound like he sounded the last time. "}, "H005:T015": {"id": "H005:T015", "role": "supporter", "text": "You need to know where he is so you can make a good decision for yourself!"}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "I know it is difficult, but I know you can get through it!"}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "You are right, that's exactly what I'm going to do because the wait is killing me. "}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "Good, I am happy for you!"}, "H005:T019": {"id": "H005:T019", "role": "seeker", "text": "Thank you very much, you've been a great help"}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "I am glad I was able to help!"}, "H005:T021": {"id": "H005:T021", "role": "seeker", "text": "Thanks, it was nice chatting with you."}, "H005:T022": {"id": "H005:T022", "role": "supporter", "text": "You're welcome! If you need any more help just chat back with us again."}, "H005:T023": {"id": "H005:T023", "role": "seeker", "text": "no problem, take care."}, "H005:T024": {"id": "H005:T024", "role": "supporter", "text": "You as well!"}, "H006:T000": {"id": "H006:T000", "role": "seeker", "text": "Hey, I just needed someone to talk to and thought of you."}, "H006:T001": {"id": "H006:T001", "role": "supporter", "text": "Of course, Amanda. I'm here for you. What's on your mind?"}, "H006:T002": {"id": "H006:T002", "role": "seeker", "text": "Well, a lot has been happening lately, but something unexpected happened at work today."}, "H006:T003": {"id": "H006:T003", "role": "supporter", "text": "Oh? What happened?"}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "Remember the conflict I had with a coworker a while back? They actually apologized today."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "That's quite significant! How did that make you feel?"}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "Honestly, it was a relief. We've had tension for months, and their apology felt genuine."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "I'm really glad to hear that. A genuine apology can make a big difference in working relationships."}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "Yes, definitely. It's made me hopeful about working together more positively from now on."}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "That's a great mindset to have. Collaborative work environments can be much more fulfilling."}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "It got me thinking about my aunt's memorial service, too, and how I reconnected with my family then."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "Those events can open old wounds and start new chapters. How has reconnecting with your family been?"}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "It's been good but also overwhelming. There are so many emotions to process, especially with reconnecting after so long."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "It sounds like you've been navigating a lot of complex feelings. It's natural to feel overwhelmed."}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "Yeah, it can be hard sometimes. But at work, at least, things feel like they're on a better track."}, "H006:T015": {"id": "H006:T015", "role": "supporter", "text": "That's wonderful. It seems like you're making positive strides in different areas of your life."}, "H006:T016": {"id": "H006:T016", "role": "seeker", "text": "Thanks. I'm trying to keep a positive outlook. It helps to talk it through with someone, so I appreciate you being there."}, "H006:T017": {"id": "H006:T017", "role": "supporter", "text": "I'm always here for you, Amanda. It's important to have someone to share these moments with. You're doing great."}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Amanda, how have you been holding up lately?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hi, honestly, it's been a tough couple of days. I finally had the big talk with Bill, and we decided to break up."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "I'm really sorry to hear that. It sounds like a really difficult decision to come to. Do you want to talk about what happened?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "Yeah, it's just... we've been together for three years, but we've been stuck on what our future looks like. Our life goals just don't align anymore."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "That must be so hard, especially after investing so much time and emotion into the relationship. How are you feeling about it all?"}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "A mix of emotions, really. I feel sad and a little lost. But there's also relief, you know? Like, at least now I can move forward instead of being in limbo."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "It's understandable to feel conflicted. Breakups can bring about such a wide range of emotions. It's good you're finding some silver lining in it."}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "Yeah, it's just that I thought we were going to build a life together, and now it's like I have to start over in a way."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "It definitely feels overwhelming having to rethink your future plans. Do you feel like talking to your relatives again has given you any support?"}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "Actually, yes. Since I reconnected with my family at my aunt's memorial, they've been really supportive. It's nice to know they're there for me."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "That's so important, having a support system to lean on. Have you spoken to any of your friends or coworkers about it?"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "I told a few friends, and they've been great. Work's been a distraction, and ever since my coworker and I made up, it's been a more positive environment."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "It sounds like you're doing a great job surrounding yourself with positive energy and support. What about self-care? Are you finding time for yourself?"}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "I'm trying to. I watched a favorite movie and went for a long walk yesterday to clear my head. It's the little things, I guess."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "Definitely, those small acts of self-care can make such a big difference. What do you feel like you need most right now?"}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "I think I just need time to process everything, to let myself feel and heal without rushing into anything new."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "Taking the time you need is so important. Give yourself grace, and don't hesitate to reach out if you need someone to talk to."}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "Thank you, that means a lot. I'll definitely keep that in mind."}, "H008:T000": {"id": "H008:T000", "role": "supporter", "text": "Hey Amanda, it looks like you've been experiencing a lot lately. How are you holding up?"}, "H008:T001": {"id": "H008:T001", "role": "seeker", "text": "Hi, yeah, it's been a bit rough. Work is really getting to me right now."}, "H008:T002": {"id": "H008:T002", "role": "supporter", "text": "I'm sorry to hear that. Is it your supervisor again?"}, "H008:T003": {"id": "H008:T003", "role": "seeker", "text": "Yes, exactly. I just feel like no matter how hard I try, my efforts aren't valued."}, "H008:T004": {"id": "H008:T004", "role": "supporter", "text": "That sounds incredibly frustrating. It's understandable to feel that way when you're working so hard. What happened recently that's making it worse?"}, "H008:T005": {"id": "H008:T005", "role": "seeker", "text": "Yesterday, I suggested a new project plan, but he just dismissed it without even giving it a second thought. I felt humiliated in front of my team."}, "H008:T006": {"id": "H008:T006", "role": "supporter", "text": "That must have been so discouraging. Knowing that this has been an ongoing issue, how are you coping with the stress?"}, "H008:T007": {"id": "H008:T007", "role": "seeker", "text": "I'm trying to stay focused on the projects and find satisfaction in my work itself, but it's tough."}, "H008:T008": {"id": "H008:T008", "role": "supporter", "text": "It's admirable that you're trying to find inner satisfaction. Have you been able to talk about this with anyone else at work, maybe someone who could support your ideas?"}, "H008:T009": {"id": "H008:T009", "role": "seeker", "text": "I talked with a coworker who apologized for past issues a while ago. They seem supportive, but there's only so much they can do."}, "H008:T010": {"id": "H008:T010", "role": "supporter", "text": "It's good to have even a little bit of support. Have you considered any strategies to improve the situation with your supervisor?"}, "H008:T011": {"id": "H008:T011", "role": "seeker", "text": "I've thought about it, but honestly, I feel stuck. I want to have an open dialogue, but every time I try, it backfires."}, "H008:T012": {"id": "H008:T012", "role": "supporter", "text": "That sounds incredibly challenging. It seems like you're stuck between a rock and a hard place. How can I support you through this?"}, "H008:T013": {"id": "H008:T013", "role": "seeker", "text": "I think just talking about it helps. Sometimes I feel so alone in this, and it's reassuring to have someone listen."}, "H008:T014": {"id": "H008:T014", "role": "supporter", "text": "I'm here anytime you need to talk. You're definitely not alone, and what you're feeling is completely valid."}, "H008:T015": {"id": "H008:T015", "role": "seeker", "text": "Thanks, that really means a lot. I think I've also been emotionally drained since my breakup last month."}, "H008:T016": {"id": "H008:T016", "role": "supporter", "text": "Breakups are incredibly tough, especially on top of everything else. Have you been able to find some personal time to process everything?"}, "H008:T017": {"id": "H008:T017", "role": "seeker", "text": "I've been trying to, but between work stress and personal life, it's been challenging to find time for myself."}, "H008:T018": {"id": "H008:T018", "role": "supporter", "text": "It's important to carve out some 'you' time whenever you can. Perhaps it might help to set small boundaries, even if just for a moment of calm."}, "H008:T019": {"id": "H008:T019", "role": "seeker", "text": "That's a good idea, actually. Maybe a short walk during lunch or some time reading a book could work."}, "H008:T020": {"id": "H008:T020", "role": "supporter", "text": "That sounds perfect. Even small steps like that can make a huge difference in how you feel."}, "H008:T021": {"id": "H008:T021", "role": "seeker", "text": "I'll try to make it a habit. I need something positive to focus on."}, "H008:T022": {"id": "H008:T022", "role": "supporter", "text": "That's the spirit. Remember, I'm here whenever you need someone to talk to. You're doing the best you can, and that's more than enough."}, "H008:T023": {"id": "H008:T023", "role": "seeker", "text": "Thank you so much. Having someone to talk to really helps keep me grounded."}, "H008:T024": {"id": "H008:T024", "role": "supporter", "text": "You're very welcome. Anytime you need me, just reach out. You've got this, Amanda."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hi, I really need to talk about something that's been weighing on me recently."}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Of course, Amanda. I'm here for you. What's going on?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "I received another negative performance review from my supervisor, and it's really getting to me."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "I'm so sorry to hear that. How are you feeling about the review?"}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "It's just so frustrating. I feel like no matter how hard I work, it's never enough."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "That's really tough. It sounds like you're putting in so much effort and not getting the recognition you deserve."}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "Exactly. It's not just this review; it's been a pattern with my supervisor for a while now."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "That's understandable. It must be incredibly discouraging to face that repeatedly."}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "Yes, and it's starting to affect my motivation. I feel so undervalued."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "Feeling undervalued at work can be so draining. Do you have any support or allies in the workplace that you can talk to about this?"}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "I've mended things with a coworker recently, which has helped a bit. But it's still so lonely dealing with this."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "I'm glad to hear that you have someone you can at least partially lean on. Have you thought about addressing this with anyone higher up or in HR?"}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "I have, but I'm worried it might make things worse with my supervisor if they find out."}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "That's a valid concern. It's important to weigh the potential outcomes. How are you handling the stress outside of work?"}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "Honestly, not well. The stress is impacting my personal life too, especially after my recent breakup."}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "It sounds like you're dealing with a lot on your plate all at once. It must be hard to find peace right now."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "It is. I'm trying to stay connected with family, but I still feel quite lost."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "Reconnecting with family after the memorial service was a positive step. It’s okay to lean on them for support in times like these."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "You're right. I need to reach out more, even though it's hard."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "Taking that step can be tough, but you have the strength to do it. Remember, you don’t have to go through any of this alone."}, "H009:T020": {"id": "H009:T020", "role": "seeker", "text": "Thanks for saying that. I really appreciate your support."}, "H009:T021": {"id": "H009:T021", "role": "supporter", "text": "Anytime, Amanda. I'm here whenever you need someone to talk to. You're not alone in this."}, "H010:T000": {"id": "H010:T000", "role": "supporter", "text": "Hey Amanda, how are you holding up lately? Anything on your mind?"}, "H010:T001": {"id": "H010:T001", "role": "seeker", "text": "Hey, I just found out that Bill, my ex, is dating someone new. I didn't think it would affect me so much."}, "H010:T002": {"id": "H010:T002", "role": "supporter", "text": "Oh Amanda, I'm sorry. It must be really tough to hear that news. How are you feeling about it?"}, "H010:T003": {"id": "H010:T003", "role": "seeker", "text": "I feel a mix of emotions. On one hand, I know we broke up for good reasons, but on the other, it still hurts seeing him move on so quickly."}, "H010:T004": {"id": "H010:T004", "role": "supporter", "text": "It's completely understandable to feel that way. Breakups have a way of stirring up unexpected feelings. Would talking about it more with me help?"}, "H010:T005": {"id": "H010:T005", "role": "seeker", "text": "Maybe. I'm starting to question if I'm the one who's taking too long to move on. It's like I'm stuck in this limbo."}, "H010:T006": {"id": "H010:T006", "role": "supporter", "text": "You're not stuck, you're just processing everything at your own pace. Everyone's journey is different, and it's okay to take the time you need."}, "H010:T007": {"id": "H010:T007", "role": "seeker", "text": "I guess. But seeing him happy with someone else makes me doubt myself, like, was I not enough, or did I make the right choice?"}, "H010:T008": {"id": "H010:T008", "role": "supporter", "text": "Those are hard questions to grapple with. Remember, breaking up was about differences in life goals, not your worth or abilities. You did it for your future."}, "H010:T009": {"id": "H010:T009", "role": "seeker", "text": "True, we did have differing goals. I just wish I could turn off the emotional part and focus on that rationality."}, "H010:T010": {"id": "H010:T010", "role": "supporter", "text": "Emotions can be really stubborn like that. It's okay to feel and express them, though. They're part of being human and make us whole."}, "H010:T011": {"id": "H010:T011", "role": "seeker", "text": "Yeah, I suppose. It's just exhausting at times, especially with everything else going on... like work stress."}, "H010:T012": {"id": "H010:T012", "role": "supporter", "text": "I remember you mentioned how undervalued you feel at work. That must amplify everything. How is that going?"}, "H010:T013": {"id": "H010:T013", "role": "seeker", "text": "Not great. My supervisor is still making things difficult, and I recently got a negative performance review. It's been crushing my confidence."}, "H010:T014": {"id": "H010:T014", "role": "supporter", "text": "That sounds incredibly challenging. Dealing with work stress on top of personal issues seems overwhelming. Have you considered seeking any outside support?"}, "H010:T015": {"id": "H010:T015", "role": "seeker", "text": "I thought about it. Maybe seeing a therapist could help, but it's intimidating to take that step."}, "H010:T016": {"id": "H010:T016", "role": "supporter", "text": "It's a big step, but it can also be really empowering. Having a space to speak openly and get professional guidance might ease that burden."}, "H010:T017": {"id": "H010:T017", "role": "seeker", "text": "You're right. I need to prioritize myself more. It's been hard juggling everything alone."}, "H010:T018": {"id": "H010:T018", "role": "supporter", "text": "I'm glad you're considering it. Remember, you're not alone in this. Feel free to reach out whenever you need to talk."}, "H010:T019": {"id": "H010:T019", "role": "seeker", "text": "Thanks. It helps knowing there's someone I can lean on. I'll think more seriously about getting support."}, "H010:T020": {"id": "H010:T020", "role": "supporter", "text": "That's a great step forward, Amanda. I'm really proud of you for facing all of this and seeking the path that's best for you."}, "H011:T000": {"id": "H011:T000", "role": "supporter", "text": "Hello how are you?"}, "H011:T001": {"id": "H011:T001", "role": "seeker", "text": "I'm, okay, thanks, and you?  I'm feeling a bit down because I'm alone for the holidays."}, "H011:T002": {"id": "H011:T002", "role": "supporter", "text": "Well that's no good, does your family live far away?"}, "H011:T003": {"id": "H011:T003", "role": "seeker", "text": "Yes, my family is scattered all over the country, like Seattle, Georgia, PA.  I'm sure I'm not the only one with no plans this weekend, though."}, "H011:T004": {"id": "H011:T004", "role": "supporter", "text": "True but I can understand that, it is hard being alone at the holidays."}, "H011:T005": {"id": "H011:T005", "role": "supporter", "text": "Did you have plans this weekend?"}, "H011:T006": {"id": "H011:T006", "role": "seeker", "text": "No.  My nearby friends all went away for the holidays.  I could probably just occupy my time with things I need or want to do in order to distract myself."}, "H011:T007": {"id": "H011:T007", "role": "supporter", "text": "What kind of hobbies do you have?"}, "H011:T008": {"id": "H011:T008", "role": "seeker", "text": "I'm teaching myself the piano.  I'm also teaching myself  how to work a stenography machine for possible future employment as a stenographer.  I also like to read novels."}, "H011:T009": {"id": "H011:T009", "role": "supporter", "text": "I have never understood how those work..I find it amazing someone can type out whole words or sentences with one word"}, "H011:T010": {"id": "H011:T010", "role": "seeker", "text": "Yeah, it's pretty cool.  For example, if I hit DRAT in one stroke, then \"Did there come a time\" will appear in English on my machine's  LCD screen."}, "H011:T011": {"id": "H011:T011", "role": "supporter", "text": "Wow that is crazy, I don't understand how that works, is it preprogrammed or does it go by how the word sounds? "}, "H011:T012": {"id": "H011:T012", "role": "seeker", "text": "Each stenographer has their own \"Personal Dictionary\" which is a list of words in English along with how you in particular write out those words or phrases in steno.  This dictionary is present within the actual steno machine after you transfer it from your laptop to the machine via cable or wifi.  Thus your machine then knows how you write out words in particular and how to translate those words from steno to English - each stenographer writes a little differently."}, "H011:T013": {"id": "H011:T013", "role": "supporter", "text": "OK that makes sense, so you basically program it as the user. I take it your stenography machine becomes pretty close to you lol"}, "H011:T014": {"id": "H011:T014", "role": "supporter", "text": "Is this your first holiday alone?"}, "H011:T015": {"id": "H011:T015", "role": "seeker", "text": "Yes, exactly!  And it's very important to back up your personal dictionary to the cloud or a seperate drive so that you don't lose it in a hard-drive crash.  A lot of work goes into creating that dictionary!  No, it's happened before, being along for the holidays; but you've helped to cheer me up, so thanks!"}, "H011:T016": {"id": "H011:T016", "role": "supporter", "text": "No problem, I hope I have made your day a little better!"}, "H011:T017": {"id": "H011:T017", "role": "seeker", "text": "You have, thanks!  Did you do anything special?"}, "H011:T018": {"id": "H011:T018", "role": "supporter", "text": "Have a good rest of this year and don't forget to make your New Year's resolution!"}, "H011:T019": {"id": "H011:T019", "role": "seeker", "text": "I will do that - you too.  Thanks, again..."}, "H011:T020": {"id": "H011:T020", "role": "supporter", "text": "Not really, stayed home lol... Have a good one!"}, "H011:T021": {"id": "H011:T021", "role": "seeker", "text": "You too... bye now..."}, "H011:T022": {"id": "H011:T022", "role": "supporter", "text": "Good day!"}, "H011:T023": {"id": "H011:T023", "role": "supporter", "text": "What else can I help you with today?"}, "H012:T000": {"id": "H012:T000", "role": "seeker", "text": "Hey, can we talk? I'm just feeling a bit overwhelmed."}, "H012:T001": {"id": "H012:T001", "role": "supporter", "text": "Of course, Amanda. What's been going on?"}, "H012:T002": {"id": "H012:T002", "role": "seeker", "text": "I had a meeting with my supervisor today and it didn't go as I'd hoped."}, "H012:T003": {"id": "H012:T003", "role": "supporter", "text": "I'm sorry to hear that. What happened in the meeting?"}, "H012:T004": {"id": "H012:T004", "role": "seeker", "text": "Well, I tried to bring up how I've been feeling undervalued and how it's affecting my motivation at work."}, "H012:T005": {"id": "H012:T005", "role": "supporter", "text": "That sounds really tough. Were they at least receptive to what you said?"}, "H012:T006": {"id": "H012:T006", "role": "seeker", "text": "Not really... They seemed to dismiss my concerns again, just like last time."}, "H012:T007": {"id": "H012:T007", "role": "supporter", "text": "I'm really sorry to hear that, Amanda. It must be so frustrating to feel unheard."}, "H012:T008": {"id": "H012:T008", "role": "seeker", "text": "It is. I've been trying so hard to improve things since the negative review, but it feels like nothing I do is ever enough."}, "H012:T009": {"id": "H012:T009", "role": "supporter", "text": "You're putting in so much effort, and it's unfortunate that it's not being recognized. How are you holding up emotionally?"}, "H012:T010": {"id": "H012:T010", "role": "seeker", "text": "Honestly, it feels draining. Sometimes I wonder if I'm just not good enough for this job."}, "H012:T011": {"id": "H012:T011", "role": "supporter", "text": "That's such a difficult place to be in. But remember, your worth isn't determined by someone else's recognition or lack thereof."}, "H012:T012": {"id": "H012:T012", "role": "seeker", "text": "Thank you for saying that. It helps a little to hear. I just wish things were different at work."}, "H012:T013": {"id": "H012:T013", "role": "supporter", "text": "It's completely okay to want things to change. Would it help to focus on small steps towards feeling valued elsewhere, maybe with your coworkers?"}, "H012:T014": {"id": "H012:T014", "role": "seeker", "text": "Actually, I made amends with a coworker a few months back and our collaboration has improved a lot."}, "H012:T015": {"id": "H012:T015", "role": "supporter", "text": "That's great to hear! Having supportive colleagues can make a huge difference. Maybe that's a positive thing to build on?"}, "H012:T016": {"id": "H012:T016", "role": "seeker", "text": "Yes, it feels nice to have at least one person be supportive. But it's still hard with my supervisor actively undermining my efforts."}, "H012:T017": {"id": "H012:T017", "role": "supporter", "text": "I can imagine how exhausting that is. Have you thought about what steps you might want to take next regarding your job situation?"}, "H012:T018": {"id": "H012:T018", "role": "seeker", "text": "I have thought about looking for a new job, but I'm not sure if I have the energy to go through that process right now."}, "H012:T019": {"id": "H012:T019", "role": "supporter", "text": "Looking for a new job is a big step and it can be intimidating. Maybe focus on building your confidence first and taking it one day at a time?"}, "H012:T020": {"id": "H012:T020", "role": "seeker", "text": "You're right. I think building my confidence is something I can work on. I'll start looking at my options more lightheartedly."}, "H012:T021": {"id": "H012:T021", "role": "supporter", "text": "That's a great approach, Amanda. Remember, you're stronger than you think, and you've already overcome so much."}, "H012:T022": {"id": "H012:T022", "role": "seeker", "text": "Thank you so much for listening. It feels a little bit lighter just having someone who understands."}, "H012:T023": {"id": "H012:T023", "role": "supporter", "text": "I'm always here for you whenever you need to talk. Don't hesitate to reach out anytime, okay?"}, "H012:T024": {"id": "H012:T024", "role": "seeker", "text": "I really appreciate that. Let's chat again soon."}, "H012:T025": {"id": "H012:T025", "role": "supporter", "text": "Definitely. Take care of yourself, Amanda."}, "H013:T000": {"id": "H013:T000", "role": "seeker", "text": "Hey, are you around to chat?"}, "H013:T001": {"id": "H013:T001", "role": "supporter", "text": "Hi Amanda! I'm here. What's on your mind?"}, "H013:T002": {"id": "H013:T002", "role": "seeker", "text": "It's been a rough few days. I had a pretty intense argument with Emily."}, "H013:T003": {"id": "H013:T003", "role": "supporter", "text": "I'm sorry to hear that. Arguments with friends can be really draining. Do you want to talk about what happened?"}, "H013:T004": {"id": "H013:T004", "role": "seeker", "text": "Yeah, I suppose it started with this unresolved tension between us. I've been so stressed with work and everything... I guess I just unloaded on her."}, "H013:T005": {"id": "H013:T005", "role": "supporter", "text": "It sounds like you're carrying a lot right now. Work stress has been tough for you lately, hasn't it?"}, "H013:T006": {"id": "H013:T006", "role": "seeker", "text": "It really has. My supervisor's been making things difficult again. I thought things would get better after our last meeting, but I'm still feeling so undervalued."}, "H013:T007": {"id": "H013:T007", "role": "supporter", "text": "That must be so frustrating, especially since you took the step to speak up. It’s no wonder you’re feeling overwhelmed."}, "H013:T008": {"id": "H013:T008", "role": "seeker", "text": "Exactly. And then there’s this issue with Emily. We've been friends forever, but lately it feels like we're on different paths."}, "H013:T009": {"id": "H013:T009", "role": "supporter", "text": "I can imagine how hard it must be to navigate that. Friendships can change over time, but sometimes it helps to address those changes openly."}, "H013:T010": {"id": "H013:T010", "role": "seeker", "text": "I know. I just don’t want to lose her too. We've been friends since college."}, "H013:T011": {"id": "H013:T011", "role": "supporter", "text": "I understand. It sounds like she's really important to you. It might be worth having an honest conversation about what each of you needs right now."}, "H013:T012": {"id": "H013:T012", "role": "seeker", "text": "You're right. I guess I’m just scared she won't understand."}, "H013:T013": {"id": "H013:T013", "role": "supporter", "text": "That fear makes sense, considering everything else you’re handling. But you might be surprised at how supportive she could be. You both care about each other."}, "H013:T014": {"id": "H013:T014", "role": "seeker", "text": "I hope so. It's just all been hitting at once—Emily, work, and even seeing my ex moved on has been rough."}, "H013:T015": {"id": "H013:T015", "role": "supporter", "text": "You’re facing so many different changes and emotions. It's okay to feel overwhelmed. Have you had any time to focus on yourself in all this?"}, "H013:T016": {"id": "H013:T016", "role": "seeker", "text": "Not really. I guess I haven’t been great at taking care of myself lately."}, "H013:T017": {"id": "H013:T017", "role": "supporter", "text": "That’s understandable given everything going on. Maybe carving out a little time just for you could help. What do you think might be comforting?"}, "H013:T018": {"id": "H013:T018", "role": "seeker", "text": "Maybe a walk in the park or reading a book. I used to love doing that."}, "H013:T019": {"id": "H013:T019", "role": "supporter", "text": "Those sound like wonderful ideas. Allowing yourself some moments of peace could really help clear your mind and recharge."}, "H013:T020": {"id": "H013:T020", "role": "seeker", "text": "I’ll try to do that. Thanks for listening and helping me sort through this."}, "H013:T021": {"id": "H013:T021", "role": "supporter", "text": "Anytime, Amanda. You’re not alone in this. Reach out whenever you need to talk."}, "H013:T022": {"id": "H013:T022", "role": "seeker", "text": "I will. Thanks again for being there."}, "H013:T023": {"id": "H013:T023", "role": "supporter", "text": "You’re welcome. Take care and let me know how you’re doing, okay?"}, "H013:T024": {"id": "H013:T024", "role": "seeker", "text": "I will. Have a great day!"}, "H014:T000": {"id": "H014:T000", "role": "seeker", "text": "Hey, do you have a moment to chat?"}, "H014:T001": {"id": "H014:T001", "role": "supporter", "text": "Of course, Amanda. How have you been doing?"}, "H014:T002": {"id": "H014:T002", "role": "seeker", "text": "It's been a bit of a rollercoaster recently. Just trying to sort things out."}, "H014:T003": {"id": "H014:T003", "role": "supporter", "text": "That sounds challenging. Do you want to talk about what's been going on?"}, "H014:T004": {"id": "H014:T004", "role": "seeker", "text": "Well, Emily, my best friend, reached out to me today. We had a big argument last month, it was pretty tense."}, "H014:T005": {"id": "H014:T005", "role": "supporter", "text": "It's great that she reached out. How do you feel about her getting in touch?"}, "H014:T006": {"id": "H014:T006", "role": "seeker", "text": "Relieved, honestly. But also anxious. What if things don't go back to how they were?"}, "H014:T007": {"id": "H014:T007", "role": "supporter", "text": "That's understandable. It can be difficult to rebuild trust, but reaching out is a positive first step."}, "H014:T008": {"id": "H014:T008", "role": "seeker", "text": "Yeah, I suppose. It just feels like everything's piling up, you know? With work being stressful, and then my relationships…"}, "H014:T009": {"id": "H014:T009", "role": "supporter", "text": "It sounds like you're carrying a lot right now. The work situation with your supervisor must be adding to the stress."}, "H014:T010": {"id": "H014:T010", "role": "seeker", "text": "Definitely. Feeling undervalued at work is really dragging me down. I've talked to my boss, but not much has changed."}, "H014:T011": {"id": "H014:T011", "role": "supporter", "text": "I'm sorry to hear that. It must feel like an uphill battle with the lack of support."}, "H014:T012": {"id": "H014:T012", "role": "seeker", "text": "Exactly. I'm trying to find some peace in all of this, but it's hard."}, "H014:T013": {"id": "H014:T013", "role": "supporter", "text": "It's important to take care of yourself. Have you found anything that helps you manage the stress?"}, "H014:T014": {"id": "H014:T014", "role": "seeker", "text": "I try to go for walks and sometimes journal. But lately, it's felt a bit overwhelming."}, "H014:T015": {"id": "H014:T015", "role": "supporter", "text": "Those are great outlets. Maybe reconnecting with Emily might help create a support system again."}, "H014:T016": {"id": "H014:T016", "role": "seeker", "text": "I hope so. I really miss having her to talk to. It felt good when she reached out."}, "H014:T017": {"id": "H014:T017", "role": "supporter", "text": "Rebuilding that bond might also bring some relief to the emotional pressure you're experiencing."}, "H014:T018": {"id": "H014:T018", "role": "seeker", "text": "Yeah, I think you're right. It'll take time, but it's worth it."}, "H014:T019": {"id": "H014:T019", "role": "supporter", "text": "I'm glad to hear that. Remember, it's okay to take things one step at a time."}, "H014:T020": {"id": "H014:T020", "role": "seeker", "text": "Thanks for listening. It helps to know someone understands what I'm going through."}, "H014:T021": {"id": "H014:T021", "role": "supporter", "text": "Anytime, Amanda. Keep reaching out and prioritizing what makes you feel good."}, "H014:T022": {"id": "H014:T022", "role": "seeker", "text": "I will. Thanks again for being there for me."}, "H014:T023": {"id": "H014:T023", "role": "supporter", "text": "Of course! Take care and keep in touch whenever you need to talk."}, "H015:T000": {"id": "H015:T000", "role": "seeker", "text": "Hey, I really need to talk to someone right now."}, "H015:T001": {"id": "H015:T001", "role": "supporter", "text": "Of course, Amanda. What's on your mind?"}, "H015:T002": {"id": "H015:T002", "role": "seeker", "text": "It's Valentine's Day, and I'm feeling really unsettled. I didn't expect it to hit me so hard."}, "H015:T003": {"id": "H015:T003", "role": "supporter", "text": "Valentine's can be tough, especially with so much going on in your life. Do you want to share more about what you're feeling?"}, "H015:T004": {"id": "H015:T004", "role": "seeker", "text": "Well, I thought I was over Bill, but with today being Valentine's, old feelings are creeping back up."}, "H015:T005": {"id": "H015:T005", "role": "supporter", "text": "It's understandable to have those feelings resurface, especially on a day like today. How long has it been since you two split?"}, "H015:T006": {"id": "H015:T006", "role": "seeker", "text": "We broke up last October. It's been a few months, and I thought I was doing okay. But seeing everyone celebrating today brought back memories."}, "H015:T007": {"id": "H015:T007", "role": "supporter", "text": "That makes sense. Our minds often replay moments from the past during similar times of the year. How are you dealing with seeing those memories again?"}, "H015:T008": {"id": "H015:T008", "role": "seeker", "text": "Honestly, it's confusing. I'm bombarded with regret about the breakup, but also relief because deep down I know our goals didn't align."}, "H015:T009": {"id": "H015:T009", "role": "supporter", "text": "Feeling both regret and relief can be quite overwhelming. Have you had any thoughts about reaching out to Bill or are you just processing these feelings alone for now?"}, "H015:T010": {"id": "H015:T010", "role": "seeker", "text": "I haven’t reached out. Actually, discovering that he was dating someone else really shook me. I think it's best I keep my distance."}, "H015:T011": {"id": "H015:T011", "role": "supporter", "text": "That's a wise choice if you feel it's best for your emotional well-being. It's important to focus on what helps you move forward while honoring your feelings."}, "H015:T012": {"id": "H015:T012", "role": "seeker", "text": "I agree. I’ve been trying to focus on myself and work to distract from these emotions, but it's tough when work isn't exactly fulfilling either."}, "H015:T013": {"id": "H015:T013", "role": "supporter", "text": "It sounds like you're facing challenges on multiple fronts. How has work been since our last chat?"}, "H015:T014": {"id": "H015:T014", "role": "seeker", "text": "Still stressful. My supervisor undermines my efforts and doesn't recognize my contributions. It's discouraging."}, "H015:T015": {"id": "H015:T015", "role": "supporter", "text": "That does sound frustrating, especially when you're already dealing with personal emotions. Have you thought about seeking any support or changes at work?"}, "H015:T016": {"id": "H015:T016", "role": "seeker", "text": "I had a talk with my supervisor back in January, but not much has changed. I might explore other opportunities soon because it’s becoming too much."}, "H015:T017": {"id": "H015:T017", "role": "supporter", "text": "Exploring new opportunities sounds like a proactive step. You deserve to be in a place where you're appreciated and valued."}, "H015:T018": {"id": "H015:T018", "role": "seeker", "text": "Thank you. Hearing that helps. I'm trying to stay hopeful but it's challenging when feeling this mix of nostalgia and frustration today."}, "H015:T019": {"id": "H015:T019", "role": "supporter", "text": "You're doing great by acknowledging all these emotions. Valentine’s can magnify past feelings, but it’s also a chance to practice self-compassion."}, "H015:T020": {"id": "H015:T020", "role": "seeker", "text": "Self-compassion... I like that. Maybe I'll do something kind for myself tonight. Maybe a small self-care evening."}, "H015:T021": {"id": "H015:T021", "role": "supporter", "text": "That sounds wonderful. It's essential to nurture yourself. What are some things that bring you joy and peace?"}, "H015:T022": {"id": "H015:T022", "role": "seeker", "text": "I love a good movie marathon with snacks and some aromatherapy. I think that’s exactly what I need tonight."}, "H015:T023": {"id": "H015:T023", "role": "supporter", "text": "That sounds perfect. Treat yourself to a cozy night. You deserve it."}, "H015:T024": {"id": "H015:T024", "role": "seeker", "text": "Thanks for listening and for the support. I already feel a bit lighter sharing this."}, "H015:T025": {"id": "H015:T025", "role": "supporter", "text": "I'm really glad to hear that. You’re never alone in this; feel free to reach out anytime."}, "H015:T026": {"id": "H015:T026", "role": "seeker", "text": "I will. Thank you again. I hope you have a good night too."}, "H015:T027": {"id": "H015:T027", "role": "supporter", "text": "Thank you, Amanda. Take care, and remember to be kind to yourself."}, "H016:T000": {"id": "H016:T000", "role": "seeker", "text": "Hey, I just need someone to talk to."}, "H016:T001": {"id": "H016:T001", "role": "supporter", "text": "Hi Amanda, I'm here for you. What's on your mind?"}, "H016:T002": {"id": "H016:T002", "role": "seeker", "text": "I've been feeling really overwhelmed lately. I decided to start painting as a hobby, but it's starting to stress me out."}, "H016:T003": {"id": "H016:T003", "role": "supporter", "text": "That sounds tough. Picking up something new shou
