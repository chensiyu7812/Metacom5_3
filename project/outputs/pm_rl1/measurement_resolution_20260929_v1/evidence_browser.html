ds like a good idea. Do you attend meetups?"}, "H002:T021": {"id": "H002:T021", "role": "supporter", "text": "I have and i usually take someone i  trust with me and if it doesnt feel right I leave."}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "That's good advice. Thanks for your help."}, "H002:T023": {"id": "H002:T023", "role": "supporter", "text": "No problem glad I could help."}, "H002:T024": {"id": "H002:T024", "role": "supporter", "text": "Is there anything else I can help with?"}, "H003:T000": {"id": "H003:T000", "role": "seeker", "text": "hi"}, "H003:T001": {"id": "H003:T001", "role": "supporter", "text": "Hi! How are you today?"}, "H003:T002": {"id": "H003:T002", "role": "seeker", "text": "am good ..what about you?"}, "H003:T003": {"id": "H003:T003", "role": "supporter", "text": "I'm doing well. How can I help you today?"}, "H003:T004": {"id": "H003:T004", "role": "seeker", "text": "a break up with my partner please read up"}, "H003:T005": {"id": "H003:T005", "role": "supporter", "text": "I'm so sorry. I went through a bad break up last year. Can you tell me what happened?"}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "Are you there?"}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "yes i am ahere"}, "H003:T008": {"id": "H003:T008", "role": "seeker", "text": "i and this lady dated for 2weeks "}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "suddenly she said she doesn't love me anymore imagine that"}, "H003:T010": {"id": "H003:T010", "role": "supporter", "text": "I'm sorry, I'm sure that has made you feel rejected."}, "H003:T011": {"id": "H003:T011", "role": "seeker", "text": "very well "}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "I'm sure it is hard to express how you feel with it being a short relationship, people may not understand. But sometimes we can feel such a strong connection and have faith in people very fast. "}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "its very hard"}, "H003:T014": {"id": "H003:T014", "role": "seeker", "text": "i loved the girl with all my heart"}, "H003:T015": {"id": "H003:T015", "role": "supporter", "text": "I understand feeling connected to someone you've only known for a short amount of time. I'm sure you feel like you wont be able to let your guard down again anytime soon."}, "H003:T016": {"id": "H003:T016", "role": "seeker", "text": "yes i have faith in people very fast"}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "seriously its like your seeing my mind"}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "Maybe this could be a learning experience? I always try to see the best in people, but have learned to let people earn my trust. Not just get it for free. "}, "H003:T019": {"id": "H003:T019", "role": "seeker", "text": "yeah "}, "H004:T000": {"id": "H004:T000", "role": "seeker", "text": "I just lost my job and am worried about paying the bills."}, "H004:T001": {"id": "H004:T001", "role": "supporter", "text": "I'm sorry to hear you lost your job and have worries about paying the bills."}, "H004:T002": {"id": "H004:T002", "role": "seeker", "text": "There is just too much pressure, but I have to succeed."}, "H004:T003": {"id": "H004:T003", "role": "supporter", "text": "That is hard having so much pressure but I think you will be able to soon get employed again."}, "H004:T004": {"id": "H004:T004", "role": "seeker", "text": "I am trying.  I've started looking online for new positions but it is a process."}, "H004:T005": {"id": "H004:T005", "role": "supporter", "text": "It sounds like you are trying really hard and that is worthy of praise."}, "H004:T006": {"id": "H004:T006", "role": "seeker", "text": "I just still am continually nervous and having a hard time coping."}, "H004:T007": {"id": "H004:T007", "role": "supporter", "text": "Sometimes deep breaths help people calm down.  Have you tried that at all?"}, "H004:T008": {"id": "H004:T008", "role": "seeker", "text": "I haven't but maybe that will help me stay calmer."}, "H004:T009": {"id": "H004:T009", "role": "supporter", "text": "That can sometimes help you to regain your focus and be able to do more for yourself."}, "H004:T010": {"id": "H004:T010", "role": "seeker", "text": "That makes sense."}, "H004:T011": {"id": "H004:T011", "role": "supporter", "text": "Also, job counselors may help at employment agencies to match you with potential employers. Have you tried any?"}, "H004:T012": {"id": "H004:T012", "role": "seeker", "text": "I haven't but that may be helpful as well."}, "H004:T013": {"id": "H004:T013", "role": "supporter", "text": "I sought out help from a recruiter online who helped me to find a job as well.  Have you heard of that option or tried it?"}, "H004:T014": {"id": "H004:T014", "role": "seeker", "text": "That might help me to take the stress off myself and get someone to help in the search."}, "H004:T015": {"id": "H004:T015", "role": "supporter", "text": "Yes, I see that you seemed to be more relieved finding out these options. Would you say these suggestions have been helpful?"}, "H004:T016": {"id": "H004:T016", "role": "seeker", "text": "Yes, I'm starting to feel some of the pressure taken off me."}, "H004:T017": {"id": "H004:T017", "role": "supporter", "text": "From what I've seen, people who can use some of these strategies like deep breathing and counseling they have felt some relief and could move forward better toward their goals."}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "I feel a lot better.  Thanks for your support."}, "H004:T019": {"id": "H004:T019", "role": "supporter", "text": "You are welcome.  Can I help you with anything else?"}, "H004:T020": {"id": "H004:T020", "role": "seeker", "text": "I think that will be all.  Thanks again."}, "H005:T000": {"id": "H005:T000", "role": "supporter", "text": "Hi, I'm here to listen. What's going on?"}, "H005:T001": {"id": "H005:T001", "role": "seeker", "text": "Thank you. I've lost my job and I'm very nervous about the future"}, "H005:T002": {"id": "H005:T002", "role": "seeker", "text": "As a result I am having a hard time sleeping"}, "H005:T003": {"id": "H005:T003", "role": "supporter", "text": "Wow, that's very hard. I would be anxious too."}, "H005:T004": {"id": "H005:T004", "role": "seeker", "text": "That makes me feel a lot better. Have you ever lost your job?"}, "H005:T005": {"id": "H005:T005", "role": "supporter", "text": "I have. I was laid off. It was nerve-racking, but also really sad."}, "H005:T006": {"id": "H005:T006", "role": "seeker", "text": "What helped you get through it?"}, "H005:T007": {"id": "H005:T007", "role": "supporter", "text": "I had a bit in savings, but I looked for new jobs mostly. I was on unemployment insurance for about a month before I found a new job."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "Have you made any plans yet about how to move forward?"}, "H005:T009": {"id": "H005:T009", "role": "supporter", "text": "I can offer some suggestions if you would like. I know about a lot of resources"}, "H005:T010": {"id": "H005:T010", "role": "seeker", "text": "I am a gig worker, so I cannot apply for IU. Its very hard, but i also have some savings."}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "What kind of tools would you recommend I use to get through this"}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "Well, falling back on savings while you look for more work is good for a while. If you have any food insecurity as a result, there are often local food banks. It's really not something to be embarrased about, so many people face food insecurity through no fault of their own."}, "H005:T013": {"id": "H005:T013", "role": "supporter", "text": "You could also give a call to your local social services because they will be able to tell you what resources would be available, whether it's a vocational program or temporary assistance."}, "H005:T014": {"id": "H005:T014", "role": "seeker", "text": "Wow you're so helpful and encouraging! It's very nice to talk to you. "}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "Are there any meds you can recommend to help me sleep?"}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "Well, if it's possible, I would talk to a doctor. If you're looking for Over-the-counter sleep medication, melatonin has helped me in the past. "}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "Wow! I've never used melatonin before. Did it really help you? Are you doing much better now?"}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "It defiitely helps me fall asleep."}, "H005:T019": {"id": "H005:T019", "role": "supporter", "text": "It's a natural sleep aid."}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "If something like that doesn't work, I would talk to a doctor. I know money will be tight though. Are there any free clinics near you?"}, "H005:T021": {"id": "H005:T021", "role": "seeker", "text": "I'll look into it. There's a lot of services in the general area that might be able to help me"}, "H005:T022": {"id": "H005:T022", "role": "seeker", "text": "It's been really nice talking to you"}, "H005:T023": {"id": "H005:T023", "role": "supporter", "text": "Thank you. I hope you're feeling a bit better. Is there anything else you want to talk about?"}, "H005:T024": {"id": "H005:T024", "role": "seeker", "text": "No I'm okay. I think that's everything :)"}, "H005:T025": {"id": "H005:T025", "role": "supporter", "text": "Alright, well I hope you have a good night. Good luck, you've got this!"}, "H005:T026": {"id": "H005:T026", "role": "seeker", "text": "You too :) Thanks \u003c3"}, "H005:T027": {"id": "H005:T027", "role": "supporter", "text": "Bye!"}, "H005:T028": {"id": "H005:T028", "role": "seeker", "text": "bye"}, "H006:T000": {"id": "H006:T000", "role": "supporter", "text": "Hey Michael, how’s everything going with you today?"}, "H006:T001": {"id": "H006:T001", "role": "seeker", "text": "Hey, to be honest, I've been better. Feeling a bit stuck right now."}, "H006:T002": {"id": "H006:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been on your mind?"}, "H006:T003": {"id": "H006:T003", "role": "seeker", "text": "I got a job offer. Normally, that would be good news, but it's not as great as it sounds."}, "H006:T004": {"id": "H006:T004", "role": "supporter", "text": "Oh really? What's got you feeling hesitant about it?"}, "H006:T005": {"id": "H006:T005", "role": "seeker", "text": "Well, it’s far from where I live, in a completely different area, and the pay is pretty low."}, "H006:T006": {"id": "H006:T006", "role": "supporter", "text": "That sounds really challenging. Moving and taking a pay cut are big decisions. What are your main concerns?"}, "H006:T007": {"id": "H006:T007", "role": "seeker", "text": "Mainly, it's about leaving behind what little network I have here and starting over somewhere else for something that doesn’t seem worth it."}, "H006:T008": {"id": "H006:T008", "role": "supporter", "text": "Leaving familiar places and people can be really tough. It makes sense that you'd feel conflicted."}, "H006:T009": {"id": "H006:T009", "role": "seeker", "text": "Exactly. I keep thinking, is it worth uprooting everything just for the sake of a job that might not even cover my basic expenses?"}, "H006:T010": {"id": "H006:T010", "role": "supporter", "text": "Your concerns are completely valid. Financial stability and having support around is really important. Have you considered any alternatives?"}, "H006:T011": {"id": "H006:T011", "role": "seeker", "text": "I've been looking for more opportunities around here, but they are few and far between. It’s making me feel pretty trapped."}, "H006:T012": {"id": "H006:T012", "role": "supporter", "text": "It must be frustrating to feel like your options are limited. How do you usually handle situations like this?"}, "H006:T013": {"id": "H006:T013", "role": "seeker", "text": "I usually just try to work through it, hoping something better comes up. But it’s hard to stay positive right now."}, "H006:T014": {"id": "H006:T014", "role": "supporter", "text": "It's understandable to feel overwhelmed. Sometimes, exploring small steps towards what you want can help. Is there anything that brings you a bit of hope?"}, "H006:T015": {"id": "H006:T015", "role": "seeker", "text": "I guess the occasional freelance gig that pays better and lets me stay around here. It’s just uncertain when those come up."}, "H006:T016": {"id": "H006:T016", "role": "supporter", "text": "Stability in those gigs can be a silver lining. Maybe balancing them until something more stable appears is a way forward?"}, "H006:T017": {"id": "H006:T017", "role": "seeker", "text": "Yeah, I think I should focus on that for now. Thanks for listening and helping me clarify things a bit."}, "H006:T018": {"id": "H006:T018", "role": "supporter", "text": "Anytime, Michael. It's important to weigh all your options and take care of yourself, too. I'm here whenever you need to talk."}, "H006:T019": {"id": "H006:T019", "role": "seeker", "text": "I appreciate that a lot. I guess I just needed to get it off my chest."}, "H006:T020": {"id": "H006:T020", "role": "supporter", "text": "I'm really glad you did. Remember, you're not alone in this. We'll figure it out together."}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hi Michael, how have you been lately?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hey. It's been a bit tough. I accepted that job far from home, but now I just feel so isolated."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "I'm really sorry to hear that. Feeling isolated can be really challenging. What's been the hardest part for you?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "I think it's just being away from everything I know. I wake up, go to work, and come back to an empty place. It's like I'm moving in a loop with no way out."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "That sounds incredibly difficult, Michael. It's natural to feel this way when everything around you is new and unfamiliar. Have you considered exploring the new area a bit more?"}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "I have, but it's hard to muster the energy after work. Plus, I can't stop thinking if this was the right choice."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "Second-guessing a big decision is totally normal, especially when the stakes are high. Remember, you took this step to support yourself by taking this job despite its challenges."}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "I know, but some days I feel like I let myself down by moving here. I miss everyone back home, and the pay isn't even that great."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "It's okay to miss your home and familiar surroundings. You're already showing a lot of courage by facing this situation head-on. Have you had any contact with your friends or family since you moved?"}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "Yeah, I call them sometimes. It's good to hear their voices, but it just makes me more homesick sometimes."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "It can be bittersweet to stay connected when you're far away. Maybe finding small ways to bring parts of 'home' into your new space could help?"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "Like what? I brought a few things, but it doesn't feel the same."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "How about recreating a favorite routine or cooking some of your favorite meals? Little things like that might bring a sense of familiarity."}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "That's a good idea. I do miss my mom's cooking. Maybe I can start with her recipes."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "That sounds like a wonderful way to feel connected. Experimenting in the kitchen might even become a fun activity for you after work."}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "I'll try it this weekend. I guess I'm just worried that I won't ever feel 'at home' here."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "That's a valid concern, Michael. Feeling at home takes time and can be different for everyone. Allow yourself the space to adjust and remember that it's okay to reach out for support whenever you need it."}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "Thanks. I appreciate talking about this. I don't feel as overwhelmed knowing there's someone here to listen."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "I'm always here for you. You're doing the best you can, and that counts for a lot. You're not alone in this, remember that."}, "H008:T000": {"id": "H008:T000", "role": "seeker", "text": "Hey, I don't know if I should even be reaching out..."}, "H008:T001": {"id": "H008:T001", "role": "supporter", "text": "Hi Michael, I'm here for you. What's been going on?"}, "H008:T002": {"id": "H008:T002", "role": "seeker", "text": "Well, it's been a tough couple of weeks since I moved for this job."}, "H008:T003": {"id": "H008:T003", "role": "supporter", "text": "I remember how difficult that decision was for you. Is there something specific making it harder right now?"}, "H008:T004": {"id": "H008:T004", "role": "seeker", "text": "Yeah, I've been feeling really isolated and now I've started having this awful back pain."}, "H008:T005": {"id": "H008:T005", "role": "supporter", "text": "That sounds really tough, dealing with physical pain on top of everything else."}, "H008:T006": {"id": "H008:T006", "role": "seeker", "text": "The job itself is stressful and I think sitting for long hours isn't helping my back."}, "H008:T007": {"id": "H008:T007", "role": "supporter", "text": "I can imagine. It sounds like the physical and emotional stress are piling up."}, "H008:T008": {"id": "H008:T008", "role": "seeker", "text": "Yeah, it's like I can't catch a break. I already miss home and now this..."}, "H008:T009": {"id": "H008:T009", "role": "supporter", "text": "Homesickness can be really hard. Is there anything from home that comforts you?"}, "H008:T010": {"id": "H008:T010", "role": "seeker", "text": "I used to go hiking around my town a lot. It helped clear my mind."}, "H008:T011": {"id": "H008:T011", "role": "supporter", "text": "Hiking can be such a great release. Maybe finding a local trail could help a bit here too."}, "H008:T012": {"id": "H008:T012", "role": "seeker", "text": "I thought about that, but it's hard to find time when I'm trying to settle in and manage this job."}, "H008:T013": {"id": "H008:T013", "role": "supporter", "text": "That makes sense. It can be a lot to juggle at once."}, "H008:T014": {"id": "H008:T014", "role": "seeker", "text": "I wish I could take some time off to figure things out, but I'm worried about the rent and bills."}, "H008:T015": {"id": "H008:T015", "role": "supporter", "text": "Financial stress can add a lot of pressure. Have you talked to anyone at home about how you're feeling?"}, "H008:T016": {"id": "H008:T016", "role": "seeker", "text": "Not really. I don't want to worry them more than they already are."}, "H008:T017": {"id": "H008:T017", "role": "supporter", "text": "It's understandable to want to protect them, but sometimes sharing can help lighten the load."}, "H008:T018": {"id": "H008:T018", "role": "seeker", "text": "You're right. I think I just need to find the right moment."}, "H008:T019": {"id": "H008:T019", "role": "supporter", "text": "Whenever you're ready, talking to someone who knows you well might bring some comfort."}, "H008:T020": {"id": "H008:T020", "role": "seeker", "text": "I think it would help. I miss that connection."}, "H008:T021": {"id": "H008:T021", "role": "supporter", "text": "Connection is so important, especially when you're feeling down. Know that I'm here to talk anytime."}, "H008:T022": {"id": "H008:T022", "role": "seeker", "text": "Thanks, it means a lot. I'll try to look into making more time for myself."}, "H008:T023": {"id": "H008:T023", "role": "supporter", "text": "That's a good step. Small changes can lead to bigger improvements over time."}, "H008:T024": {"id": "H008:T024", "role": "seeker", "text": "I'll start there and see how it goes. Thanks for listening."}, "H008:T025": {"id": "H008:T025", "role": "supporter", "text": "Anytime, Michael. You're not alone in this. Take care of yourself."}, "H009:T000": {"id": "H009:T000", "role": "supporter", "text": "Hi Michael, how are you feeling these days?"}, "H009:T001": {"id": "H009:T001", "role": "seeker", "text": "Hey, I've been better. There's been a lot on my plate recently, and it's starting to get to me."}, "H009:T002": {"id": "H009:T002", "role": "supporter", "text": "I'm sorry to hear that. What's been going on?"}, "H009:T003": {"id": "H009:T003", "role": "seeker", "text": "Well, you remember that job I took a while back? It's been rough. And to add to everything, I had a falling out with a colleague I thought I could rely on."}, "H009:T004": {"id": "H009:T004", "role": "supporter", "text": "That sounds really tough. It's never easy when work stresses build, and there's tension with someone you hoped would be supportive. What happened between you two?"}, "H009:T005": {"id": "H009:T005", "role": "seeker", "text": "At first, they were really supportive. But I guess things got complicated—misunderstandings, I suppose. We stopped seeing eye to eye, and now it just feels awkward and stressful."}, "H009:T006": {"id": "H009:T006", "role": "supporter", "text": "Misunderstandings can really strain relationships, especially those at work where you might already feel pressured. How's that been affecting you?"}, "H009:T007": {"id": "H009:T007", "role": "seeker", "text": "It's been hard. I'm already far from home, and this just makes everything feel lonelier. I moved out here hoping things would get better, but it's been quite the opposite."}, "H009:T008": {"id": "H009:T008", "role": "supporter", "text": "Isolation can be incredibly tough, especially when you're in a new place. It sounds like you're dealing with a lot of significant changes. Have you been able to find any outlet or support?"}, "H009:T009": {"id": "H009:T009", "role": "seeker", "text": "Not really. I mean, I've been trying to keep in touch with old friends back home, but it's not the same as having someone here to talk to face-to-face."}, "H009:T010": {"id": "H009:T010", "role": "supporter", "text": "It makes perfect sense that you'd feel disconnected. Keeping in touch can help a bit, though. How are those conversations going?"}, "H009:T011": {"id": "H009:T011", "role": "seeker", "text": "They're okay. My friends are supportive, but they lead different lives now. I guess that adds to my feelings of being out of place."}, "H009:T012": {"id": "H009:T012", "role": "supporter", "text": "It's understandable to feel disconnected when life's circumstances set a different pace for everyone. Have you thought about seeking out any community groups or activities locally?"}, "H009:T013": {"id": "H009:T013", "role": "seeker", "text": "I've considered it, but with the strange work hours and everything, it's been difficult to commit to anything new."}, "H009:T014": {"id": "H009:T014", "role": "supporter", "text": "It's challenging to find the energy for new things when already feeling stretched thin. Sometimes even little steps can help. Is there anything that used to bring you joy that you could try to reconnect with?"}, "H009:T015": {"id": "H009:T015", "role": "seeker", "text": "I used to enjoy playing guitar, but it feels like ages since I picked it up. I'm worried I won't have time, or worse, that I won't get any joy from it."}, "H009:T016": {"id": "H009:T016", "role": "supporter", "text": "That sounds like a nice start. Even just a few moments a week can offer some relief. Revisiting a hobby might also bring a sense of familiarity amidst the change."}, "H009:T017": {"id": "H009:T017", "role": "seeker", "text": "You're right. It might be worth trying again. I guess I need to find a way to work it into my schedule and see how it goes."}, "H009:T018": {"id": "H009:T018", "role": "supporter", "text": "I think that's a great idea. Be kind to yourself as you get back into things. It's all about small steps. You've been through a lot, and it's okay to take your time."}, "H009:T019": {"id": "H009:T019", "role": "seeker", "text": "Thanks. It helps to know someone understands. I'll try to take it one day at a time and see where it leads."}, "H009:T020": {"id": "H009:T020", "role": "supporter", "text": "Absolutely. And if you ever need to talk, I’m here. Remember, you're not alone in this."}, "H009:T021": {"id": "H009:T021", "role": "seeker", "text": "I appreciate that. It means a lot having someone to reach out to. I'll keep you posted on how things go."}, "H010:T000": {"id": "H010:T000", "role": "supporter", "text": "Hey Michael, how have you been feeling lately?"}, "H010:T001": {"id": "H010:T001", "role": "seeker", "text": "Hi, to be honest, things have been rough. I’ve been feeling a lot of anxiety lately."}, "H010:T002": {"id": "H010:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you think it’s related to your new job?"}, "H010:T003": {"id": "H010:T003", "role": "seeker", "text": "Yeah, I think so. Ever since I moved, it's been hard to adjust. The distance from home is tough, and my job isn’t what I expected."}, "H010:T004": {"id": "H010:T004", "role": "supporter", "text": "That sounds really difficult. Moving somewhere new can be incredibly isolating, especially with a work environment that isn't fulfilling."}, "H010:T005": {"id": "H010:T005", "role": "seeker", "text": "Exactly. I thought I'd get used to it, but loneliness is tough. Plus, after that falling out with my colleague, work feels even more stressful."}, "H010:T006": {"id": "H010:T006", "role": "supporter", "text": "Conflict at work can make everything feel heavier. It’s understandable why you’re feeling this way. How's your physical health holding up?"}, "H010:T007": {"id": "H010:T007", "role": "seeker", "text": "Not great. I have back pain from being under stress constantly. It’s just another thing to worry about."}, "H010:T008": {"id": "H010:T008", "role": "supporter", "text": "I'm really sorry to hear that, Michael. Chronic stress can definitely take a toll on your body. Have you been able to find any ways to relieve some of the stress?"}, "H010:T009": {"id": "H010:T009", "role": "seeker", "text": "I’ve tried a few things, like going for walks, but it hasn’t helped much. I just feel kind of stuck."}, "H010:T010": {"id": "H010:T010", "role": "supporter", "text": "It’s tough to feel like there’s no way out. Maybe connecting with someone from home might help a little, even just for a chat?"}, "H010:T011": {"id": "H010:T011", "role": "seeker", "text": "I’ve thought about it. I miss the familiarity of home and having people around who really know me."}, "H010:T012": {"id": "H010:T012", "role": "supporter", "text": "Your feelings make complete sense, especially after such a big change. Is there anything about your job or new environment that you enjoy?"}, "H010:T013": {"id": "H010:T013", "role": "seeker", "text": "I guess there's a little bit of freedom with the gig work, but the pay isn’t stable. It makes planning anything feel impossible."}, "H010:T014": {"id": "H010:T014", "role": "supporter", "text": "Financial uncertainty can add a lot to your stress. It sounds like you’re juggling a lot right now. Have you thought about looking for a job closer to home?"}, "H010:T015": {"id": "H010:T015", "role": "seeker", "text": "I have, but there aren’t many opportunities in my area. I’m not sure what to do next."}, "H010:T016": {"id": "H010:T016", "role": "supporter", "text": "It's understandable to feel uncertain about the future. Maybe exploring a few options, even if they seem like long shots, can open up unexpected opportunities?"}, "H010:T017": {"id": "H010:T017", "role": "seeker", "text": "That’s a good point. I guess trying something new doesn’t hurt. I just have to find the courage to do it."}, "H010:T018": {"id": "H010:T018", "role": "supporter", "text": "That’s the spirit, Michael. Reaching out for help and acknowledging how you’re feeling is already a huge step forward. I’m here for you whenever you need to talk."}, "H010:T019": {"id": "H010:T019", "role": "seeker", "text": "Thanks. It helps knowing that I’m not alone, even if it feels that way sometimes."}, "H010:T020": {"id": "H010:T020", "role": "supporter", "text": "You’re definitely not alone. I’m really glad you reached out. Keep taking things one day at a time, okay?"}, "H010:T021": {"id": "H010:T021", "role": "seeker", "text": "I will try. Thank you for your support. It means a lot."}}, "current_date": "2025-02-02", "last_seeker": "I haven’t yet. It’s hard for me to ask for help or even trust it’ll come through."}, "99c4181727aadb11e9f11d8811c581dfe3390e273b511c497f5d6791aaa51b53": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "Hey, I talked to my siblings today, and it felt really different, but in a good way."}, "C:T001": {"id": "C:T001", "role": "supporter", "text": "That’s wonderful to hear, Taylor! How did that conversation come about?"}, "C:T002": {"id": "C:T002", "role": "seeker", "text": "I guess I was feeling overwhelmed with everything—school, writing, just life—and I needed someone to turn to. They've been really supportive lately, and I felt I could open up to them."}, "C:T003": {"id": "C:T003", "role": "supporter", "text": "It sounds like reaching out to your siblings was a brave step. What did you talk about, if you don’t mind sharing?"}, "C:T004": {"id": "C:T004", "role": "seeker", "text": "We talked about all the pressures I've been feeling with my studies and how I've been questioning my direction. I also brought up how the argument between Mom and Dad affected me."}, "H001:T000": {"id": "H001:T000", "role": "seeker", "text": "Hello. I wanted to talk about my academic pressures."}, "H001:T001": {"id": "H001:T001", "role": "supporter", "text": "Hi there. What academic pressures are troubling you today?"}, "H001:T002": {"id": "H001:T002", "role": "seeker", "text": "Just lots of classes and expectations. Especially with group projects."}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Needed someone to talk to about my stress and workload. I don't know what to do with these horrible group members."}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "I see. It sounds like being in the group project is especially stressing you out. Would you say that's pretty true?"}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "Yes. I have roughly 3 different classes all requiring a group project."}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "I totally understand. When I was in school I remember being stressed out when we had mandatory group projects as well. Having to deal with others can be a bit stressful at times."}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "I agree. I also just don't know which project to proritize"}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "I hear you, it sounds like you have a lot going on."}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "Yep. "}, "H001:T010": {"id": "H001:T010", "role": "seeker", "text": "What should I do to relax my mind?"}, "H001:T011": {"id": "H001:T011", "role": "supporter", "text": "Have you thought about seeking advice from a close friend or family member? "}, "H001:T012": {"id": "H001:T012", "role": "seeker", "text": "Not yet, I am scared to tell my family, considering that they view academic success heavily"}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "With friends, most are busy with their own struggles and I don't want to be bothering them as much"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "I see, it sounds like you are dealing with your academic pressures all on your own right now then?"}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "Totally. Feels pretty tiring and heavy"}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "Is there possibly a school councilor you could seek advice from?"}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "Maybe, but it feels scary and very awkward to seek them"}, "H001:T018": {"id": "H001:T018", "role": "supporter", "text": "I hear you, it's definitely not for everyone. "}, "H001:T019": {"id": "H001:T019", "role": "seeker", "text": "thank you for understanding and talking with me"}, "H001:T020": {"id": "H001:T020", "role": "supporter", "text": "Of course! We all need an ear to listen once in a while :)"}, "H001:T021": {"id": "H001:T021", "role": "seeker", "text": "It really helps to get this off my chest"}, "H001:T022": {"id": "H001:T022", "role": "supporter", "text": "I'm so happy to hear that, it sounds like this was something building up. It's always good to let things out in one way or another."}, "H001:T023": {"id": "H001:T023", "role": "seeker", "text": "ya it does help"}, "H001:T024": {"id": "H001:T024", "role": "supporter", "text": "Is there anything else you would like to talk about today?"}, "H001:T025": {"id": "H001:T025", "role": "seeker", "text": "Nothing really. "}, "H001:T026": {"id": "H001:T026", "role": "seeker", "text": "Thanks for the conversation!"}, "H001:T027": {"id": "H001:T027", "role": "supporter", "text": "Okay, and of course! I'm glad I could help."}, "H002:T000": {"id": "H002:T000", "role": "supporter", "text": "hi there! how are you feeling today?"}, "H002:T001": {"id": "H002:T001", "role": "seeker", "text": "i feel depressed"}, "H002:T002": {"id": "H002:T002", "role": "supporter", "text": "i'm sorry to hear that. is there a specific reason you are having these feelings?"}, "H002:T003": {"id": "H002:T003", "role": "seeker", "text": "i feel alone. i feel like i do not have anyone to talk to when it comes to my emotions."}, "H002:T004": {"id": "H002:T004", "role": "supporter", "text": "I understand. I have been feeling quite lonely too, I find myself feeling lonely at work and struggling to find someone I trust to talk to about these emotions. Do you have a friend or family member that you trust who might understand some of these feelings?"}, "H002:T005": {"id": "H002:T005", "role": "seeker", "text": "i do have a few friends that i think i can talk to about how i am feeling however the thought of them being too busy with their work is what prevents me from reaching out to them. "}, "H002:T006": {"id": "H002:T006", "role": "supporter", "text": "I understand. Correct me if i'm wrong, it sounds like you're nervous to open up to these trusted people because you think they might be distracted by their work to provide the empathy you need and fully understand how you are feeling. Does that sound right?"}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "you know i think that you are right about this. it has always been difficult for me to open to others even with those that have been there for me when i needed someone. i feel like a mix of emotions nervous but at the same time wanting to reaching out for help"}, "H002:T008": {"id": "H002:T008", "role": "supporter", "text": "I understand these feelings very well. Sometimes, my fear overshadows my want for help. I find it easier to open up to others through writing rather than face to face. Have you considered putting your feelings in writing and opening up to trusted friends and family in this way?"}, "H002:T009": {"id": "H002:T009", "role": "seeker", "text": "i have been writing for a while but due to my emotions i have stopped writing like i used to. when i did write i did notice a change in my feelings it became more positive and less depressed. now that i stopped writing its like i went back into depression "}, "H002:T010": {"id": "H002:T010", "role": "supporter", "text": "It sounds like writing your feelings down helped you greatly in the past. May I suggest going back to writing and even letting someone you trust read what you have written down to understand how you are feeling?"}, "H002:T011": {"id": "H002:T011", "role": "seeker", "text": "yes, writing has been a huge help for me. I would take your suggestion and begin writing again to feel better. and i have let others read what i wrote and they have said it has helped them get over their depression and helped them understand me more"}, "H002:T012": {"id": "H002:T012", "role": "supporter", "text": "That's great! I am glad to hear that you will begin writing again. Thank you for opening up to me about your feelings. How do you feel about the solution we have come to today?"}, "H002:T013": {"id": "H002:T013", "role": "seeker", "text": "now that i was able to talk about how i feel with you and you giving me a useful suggestion i feel less depressed and feel motivated to write again. your help has been really helpful for me "}, "H002:T014": {"id": "H002:T014", "role": "supporter", "text": "That's wonderful! I appreciate your honesty about how you are feeling. I am proud of you for seeking help. Is there anything else you would like to discuss?"}, "H002:T015": {"id": "H002:T015", "role": "seeker", "text": "thank you so much for helping me. and that is all that i would like to discuss. you have been a big help for me "}, "H002:T016": {"id": "H002:T016", "role": "supporter", "text": "I am glad I could be here for you! I am hoping you continue to feel better and your writing helps to work out these feelings.  Thank you so much for being open with me. I hope you have a fantastic rest of your day! :)"}, "H002:T017": {"id": "H002:T017", "role": "seeker", "text": "thank you. hope you enjoy your day"}, "H003:T000": {"id": "H003:T000", "role": "supporter", "text": "Hi, How are you?"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "I am the youngest of 5 siblings and I feel all most days now because of my parents"}, "H003:T002": {"id": "H003:T002", "role": "supporter", "text": "It sounds like you're having a hard time feeling like you have your parents' attention, is that right?"}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "Not their attention, but more on their expectations on me"}, "H003:T004": {"id": "H003:T004", "role": "supporter", "text": "That sounds frustrating, I'm sorry"}, "H003:T005": {"id": "H003:T005", "role": "supporter", "text": "Do they do or say anything specific that makes you feel those expectations?"}, "H003:T006": {"id": "H003:T006", "role": "seeker", "text": "Yes, its more on comparing me to the children of their friends. They always say why don't I have a better job or even plans on marrying rich. Stuff like that is very frustrating"}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "They also expect me to take care of them financially soon, I'm just starting my adult life I want to enjoy it"}, "H003:T008": {"id": "H003:T008", "role": "supporter", "text": "That sounds very frustrating. I think if I felt those kind of expectations I would be anxious."}, "H003:T009": {"id": "H003:T009", "role": "supporter", "text": "Do you feel comfortable talking to them about your feelings?"}, "H003:T010": {"id": "H003:T010", "role": "seeker", "text": "I do feel anxious every time. "}, "H003:T011": {"id": "H003:T011", "role": "seeker", "text": "I tried a couple of times, but my mom always sees it as being too sensitive"}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "Sometimes it can feel impossible to talk to parents"}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "I know, is it better if I stay away for awhile? since taking to them won't make sense?"}, "H003:T014": {"id": "H003:T014", "role": "supporter", "text": "I think that it can be very healthy to get some distance, but I think it can also feel difficult -- do you have good friends in your life that you could lean on if you needed some distance from your parents?"}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "Yes, I do. They actually helped me coped up. I always think that I wasn't blessed with my family, but I'm blessed with good friends"}, "H003:T016": {"id": "H003:T016", "role": "supporter", "text": "Good friends can be a huge comfort and it sounds like you're a good friends yourself if you have those kinds of friendships"}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "Thinking about it, they really did help a lot. So I should really distance myself for a while right?"}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "I think if making distance helps you feel better, you deserve and have a right to that space"}, "H003:T019": {"id": "H003:T019", "role": "seeker", "text": "Yes, thank you. I really need to that. "}, "H003:T020": {"id": "H003:T020", "role": "supporter", "text": "You're welcome"}, "H003:T021": {"id": "H003:T021", "role": "supporter", "text": "It sounds like you are making healthy and careful emotional decisions "}, "H003:T022": {"id": "H003:T022", "role": "supporter", "text": "Is there anything else you want to discuss about your parents?"}, "H004:T000": {"id": "H004:T000", "role": "supporter", "text": "How can I help you"}, "H004:T001": {"id": "H004:T001", "role": "seeker", "text": "hi. my friend told my ex boyfriend he was an idiot for dumping me. it made me feel uncomfortable since i was in the same room. now he is talking to me again. i think he might want me back"}, "H004:T002": {"id": "H004:T002", "role": "supporter", "text": "What are your thoughts on the relationship?"}, "H004:T003": {"id": "H004:T003", "role": "seeker", "text": "my feelings fluctuate. i resent him that he ended it. it confuses me he still wants to be in my life. he said he wanted to be friends but then asked me out again. i think he is trying to work his way back in. i know i can't keep it up unless he makes it clear he wants to be with me. i don't have time for games"}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "That does sound hard that he is giving mixed signals."}, "H004:T005": {"id": "H004:T005", "role": "seeker", "text": "yeah i don't like that. neither does my friend. why she told him he is an idiot for letting me go"}, "H004:T006": {"id": "H004:T006", "role": "supporter", "text": "Do you think he took your friend's comments seriously?"}, "H004:T007": {"id": "H004:T007", "role": "seeker", "text": "yes cuz that's when he wanted me to be around him more"}, "H004:T008": {"id": "H004:T008", "role": "supporter", "text": "It sounds like your friend got him thinking."}, "H004:T009": {"id": "H004:T009", "role": "seeker", "text": "it seemed like it did"}, "H004:T010": {"id": "H004:T010", "role": "supporter", "text": "Do you feel his change is genuine?"}, "H004:T011": {"id": "H004:T011", "role": "seeker", "text": "to a degree. i think he has ulterior motives too. "}, "H004:T012": {"id": "H004:T012", "role": "supporter", "text": "What would he have to do to prove himself?"}, "H004:T013": {"id": "H004:T013", "role": "seeker", "text": "say he wants me back or something to that effect. i'd like him to be more direct in what he wants from me"}, "H004:T014": {"id": "H004:T014", "role": "supporter", "text": "It sounds like it would help if he were direct with you and not sending mixed signals.  Is that correct?"}, "H004:T015": {"id": "H004:T015", "role": "seeker", "text": "yes that would be nice. he tends to beat around the bush then lets me know"}, "H004:T016": {"id": "H004:T016", "role": "supporter", "text": "Have you talked to anyone else besides your friend about your concerns?  Do you think your family or other friends could give some additional support to you?"}, "H004:T017": {"id": "H004:T017", "role": "seeker", "text": "yes i've talked to them about it. they've given me some insight into it. i know they want me to be careful. they don't want me to be hurt"}, "H004:T018": {"id": "H004:T018", "role": "supporter", "text": "That's understandable that they want you to be careful.  My parents and friends watched out for me too."}, "H004:T019": {"id": "H004:T019", "role": "seeker", "text": "we are lucky they look out for us. they can't all be wrong if they're guiding us a certain way"}, "H004:T020": {"id": "H004:T020", "role": "supporter", "text": "I think you hit the nail on the head that it's helpful to have that support."}, "H004:T021": {"id": "H004:T021", "role": "seeker", "text": "absolutely. i appreciate your help! nity nite"}, "H004:T022": {"id": "H004:T022", "role": "supporter", "text": "Thanks.  Can I assist you with anything else?"}, "H004:T023": {"id": "H004:T023", "role": "seeker", "text": "nope. im good"}, "H004:T024": {"id": "H004:T024", "role": "supporter", "text": "Have a good night.  "}, "H005:T000": {"id": "H005:T000", "role": "supporter", "text": "Hey Taylor, it's good to see you here. How are you holding up these days?"}, "H005:T001": {"id": "H005:T001", "role": "seeker", "text": "Hey. I'm managing, I guess. Just trying to keep up with everything."}, "H005:T002": {"id": "H005:T002", "role": "supporter", "text": "I hear you. With school and everything else on your plate, it must be a lot. Anything in particular that's been weighing on you?"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "Yeah, it's mostly about Nate, my ex. We had a big argument and things have been weird since then."}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "I'm really sorry to hear that. It sounds tough to go through a fallout with someone who used to mean a lot to you."}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "Yeah, it really sucks. I thought we were on the same page about things, but that argument just brought up a lot of unresolved issues."}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "Conflicts like that can be really revealing, but also painful. Do you feel comfortable sharing what the argument was about?"}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "Sure. It started off as a small disagreement about our future plans, but it escalated quickly."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "It's amazing how sometimes the smallest things become a big deal. Do you think it was more about the future or something else underlying it?"}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "I think it was a bit of both. We've had different ideas about our futures for a while, and maybe we were ignoring it until now."}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "That makes sense. It's hard to navigate differences when you're emotionally invested. How does that make you feel now?"}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "Honestly, it's exhausting. I keep playing the argument over and over in my head, trying to make sense of it."}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "I can imagine how tiring that must be. Sometimes our minds just want to find an answer, even when one isn't clear-cut."}, "H005:T013": {"id": "H005:T013", "role": "seeker", "text": "Exactly. It's like I'm looking for signs of who was right or wrong, but I end up just feeling more tangled."}, "H005:T014": {"id": "H005:T014", "role": "supporter", "text": "Maybe it's not about right or wrong but about understanding where each of you is coming from. What do you hope to achieve by unraveling these feelings?"}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "I'd just like to find some peace with it, I guess. Maybe closure or even a chance to talk about it calmly."}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "Closure sounds like a healthy goal. Giving yourself time to process everything is important, though. Do you feel like there's space to have that calm conversation with Nate?"}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "Part of me hopes so, but I'm not sure if either of us is ready yet. There's still a lot of raw emotions."}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "Emotions can take time to settle. It's okay to wait until it feels right. Meanwhile, how are you taking care of yourself?"}, "H005:T019": {"id": "H005:T019", "role": "seeker", "text": "I've been writing a lot, which helps. It's been a good outlet, even if it's just jotting down how I feel."}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "Writing can be really therapeutic, I agree. You have a wonderful gift for expressing your emotions through words."}, "H005:T021": {"id": "H005:T021", "role": "seeker", "text": "Thank you for saying that. It makes me feel less alone in all of this."}, "H005:T022": {"id": "H005:T022", "role": "supporter", "text": "You're definitely not alone, Taylor. I'm always here to listen whenever you need."}, "H005:T023": {"id": "H005:T023", "role": "seeker", "text": "I appreciate it. It means a lot to have someone to talk to who gets it."}, "H005:T024": {"id": "H005:T024", "role": "supporter", "text": "Anytime. Take your time with everything and remember to be kind to yourself."}, "H005:T025": {"id": "H005:T025", "role": "seeker", "text": "I'll try to keep that in mind. Thank you for being here for me."}, "H006:T000": {"id": "H006:T000", "role": "seeker", "text": "Hey, are you there?"}, "H006:T001": {"id": "H006:T001", "role": "supporter", "text": "Hi Taylor! Yes, I'm here. What's on your mind?"}, "H006:T002": {"id": "H006:T002", "role": "seeker", "text": "I'm really struggling. I just can't seem to get anything right lately."}, "H006:T003": {"id": "H006:T003", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been going on?"}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "Well, I failed my mid-term exam. It was really important for my grade, and now I'm just feeling overwhelmed."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "That sounds tough. It's okay to feel overwhelmed. You've been balancing a lot lately."}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "Yeah, on top of that, the argument with my ex is still weighing on me. Everything feels out of control."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "It seems like there's a lot happening at once. It makes sense to feel this way when you're dealing with both academics and personal challenges."}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "Exactly! It feels like I'm failing in every aspect of my life."}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "You're not failing, Taylor. You're going through a very challenging time, and it's okay to not have everything together."}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "It's just hard. I used to be so confident about my writing and studies, and now I doubt everything."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "Remember, self-doubt is normal, especially when you're exhausted. But your talent and dedication are still there, even if it feels buried right now."}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "I hope so. I miss feeling assured about my choices."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "You'll find that assurance again. It's sometimes about taking a step back to breathe and remind yourself of your strengths."}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "Yeah, maybe I do need to take some time for myself, away from the stress."}, "H006:T015": {"id": "H006:T015", "role": "supporter", "text": "That's a great idea. How about planning a small break or doing something that you enjoy, just for a bit?"}, "H006:T016": {"id": "H006:T016", "role": "seeker", "text": "I might do that. Maybe write something just for myself, not for a grade."}, "H006:T017": {"id": "H006:T017", "role": "supporter", "text": "That sounds like a wonderful plan. Writing for pleasure might help you reconnect with your passion."}, "H006:T018": {"id": "H006:T018", "role": "seeker", "text": "Thank you for listening. It's nice to have someone to talk to."}, "H006:T019": {"id": "H006:T019", "role": "supporter", "text": "You're welcome, anytime. Remember, you're not alone in this."}, "H006:T020": {"id": "H006:T020", "role": "seeker", "text": "I'll keep that in mind. Thanks again."}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Taylor, how are you holding up this week?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hi. It's been a rough one honestly. I feel kind of isolated and anxious."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "I'm sorry to hear that. Exam weeks can be really tough, especially with everything else going on."}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "Yeah, that's putting it lightly. I can't shake this feeling of being overwhelmed. It's like everything's happening at once."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "That sounds incredibly stressful. Do you want to talk about what's been weighing you down the most?"}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "I guess it's a mix of things. I've been feeling distracted ever since the thing with my ex and then failing the mid-term."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "Those are both really big things. It makes sense that they'd still be affecting you."}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "I know, but I feel like I should be able to handle it better. I mean, other people seem to."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "Everyone deals with pressure differently, and it's okay to feel like you're struggling. You're handling a lot."}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "Thank you for saying that. I just keep overthinking everything, like doubting my abilities in writing and studies."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "Your feelings are valid. You're really talented, but sometimes anxiety can make you doubt what you're capable of."}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "It's just hard to remember that when I feel so stuck. And isolation during exam week hasn't helped."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "Being isolated can definitely amplify those feelings. Do you have anyone you could reach out to for support?"}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "I guess I could talk to some classmates. We've been good study buddies in the past."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "That sounds like a great idea. Having a support system can make a huge difference."}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "I'll try reaching out. I just hope I can keep it together for the rest of the exams."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "Taking one day at a time might help. I'm here whenever you need to talk though, okay?"}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "I appreciate that, a lot. I didn't realize how much I needed to vent until now."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "I'm glad you reached out. You're doing your best, and that's something to be proud of."}, "H007:T019": {"id": "H007:T019", "role": "seeker", "text": "Thanks for listening. It means more than you know."}, "H007:T020": {"id": "H007:T020", "role": "supporter", "text": "Anytime, Taylor. Let's catch up soon and see how you're feeling after exams, okay?"}, "H007:T021": {"id": "H007:T021", "role": "seeker", "text": "Sounds good. I'll talk to you then."}, "H008:T000": {"id": "H008:T000", "role": "supporter", "text": "Hey Taylor, I just wanted to check in and see how you're doing today?"}, "H008:T001": {"id": "H008:T001", "role": "seeker", "text": "Hey, thanks for reaching out. I'm not too great, honestly."}, "H008:T002": {"id": "H008:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been going on?"}, "H008:T003": {"id": "H008:T003", "role": "seeker", "text": "Yeah, I think it might help. I had a fallout with a close classmate over a group project. It’s just really weighing heavily on me."}, "H008:T004": {"id": "H008:T004", "role": "supporter", "text": "That sounds tough. Conflicts like that can be really upsetting. Do you want to tell me more about what happened?"}, "H008:T005": {"id": "H008:T005", "role": "seeker", "text": "We were working on this project, and I felt like I was doing most of the work. When I brought it up, it turned into a big argument."}, "H008:T006": {"id": "H008:T006", "role": "supporter", "text": "I can see why that would be frustrating. It sounds like you were trying to voice your feelings and it didn’t go as you hoped."}, "H008:T007": {"id": "H008:T007", "role": "seeker", "text": "Exactly. It felt like all the past stress from other classes just boiled over. And now, I worry about the impact on my grades and our friendship."}, "H008:T008": {"id": "H008:T008", "role": "supporter", "text": "Grades and relationships are both really important. It’s understandable to feel overwhelmed. Have you talked to each other since then?"}, "H008:T009": {"id": "H008:T009", "role": "seeker", "text": "Not yet. I guess I’m scared about making things worse, you know? But I also don't like leaving things unresolved."}, "H008:T010": {"id": "H008:T010", "role": "supporter", "text": "Leaving things unresolved can definitely add to stress. It’s tough, but maybe taking some time to plan what you want to say might help?"}, "H008:T011": {"id": "H008:T011", "role": "seeker", "text": "Yeah, maybe you’re right. I don’t want to jump in without thinking, but I also want to clear the air."}, "H008:T012": {"id": "H008:T012", "role": "supporter", "text": "That makes sense. It could be helpful to think about what outcome you want from the conversation. How are you feeling about approaching it?"}, "H008:T013": {"id": "H008:T013", "role": "seeker", "text": "Nervous, but I think it’s necessary. I’ve been feeling so isolated after everything that’s happened recently, and it’s exhausting."}, "H008:T014": {"id": "H008:T014", "role": "supporter", "text": "Isolation can definitely make everything feel a lot harder. You’re showing a lot of strength by wanting to address things and reconnect."}, "H008:T015": {"id": "H008:T015", "role": "seeker", "text": "Thank you. I just need to get through this rough patch. Handling school and personal issues is just a lot."}, "H008:T016": {"id": "H008:T016", "role": "supporter", "text": "It really is. Balancing everything isn’t easy, but I believe in your ability to get through it. I'm here to listen anytime you need."}, "H008:T017": {"id": "H008:T017", "role": "seeker", "text": "That means a lot. I’ll try to focus on one thing at a time and hopefully it'll get better. Thanks for being here."}, "H008:T018": {"id": "H008:T018", "role": "supporter", "text": "You’re doing great, even if it doesn’t feel like it right now. Keep taking it one day at a time, and reach out whenever you need support."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hey, I just need to talk to someone. Is that okay?"}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Of course, Taylor. I'm here for you. What's on your mind?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "I've been trying to get back into writing, but it just feels impossible right now."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "Writer's block can be really tough. It sounds like you're feeling stuck. Do you want to tell me more about it?"}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "Yeah, it's frustrating. Every time I sit down to write, nothing comes out. It's like my mind is totally blank."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "I can imagine how disheartening that must be, given how much you care about your writing. What do you think might be contributing to these blocks?"}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "Well, there's been a lot going on lately. I had a big argument with my ex, and my grades haven't been great either."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "I'm sorry to hear that. It sounds like you're carrying a lot of emotional weight. It’s natural for that to affect your creative process."}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "Yeah, and during exam week, I felt so isolated and anxious. It's been hard to shake off that feeling."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "That sounds really overwhelming. Being in a challenging environment and feeling isolated can certainly impact your mental space."}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "I just feel like I'm losing touch with the one thing that used to make me happy."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "It's understandable to feel that way when you're passionate about something. Have you thought about any small steps that might help you reconnect with your writing?"}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "I tried to just sit and let myself write without pressure, but the words still didn't come."}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "Giving yourself some grace during this time is important. Maybe journaling or even reading could help spark some inspiration?"}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "That's a good idea. I've been meaning to read a book that inspired me a lot last year."}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "That sounds like a wonderful way to reignite that creative spark. It's okay to take it one day at a time and find joy in small victories."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "Thanks, I appreciate it. Just talking about it makes it feel a bit more manageable."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "I'm glad to hear that. Remember, it's okay to reach out whenever you need to, and you’re not alone in this."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "I will, and thanks again for being there. I'll keep trying."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "Anytime, Taylor. You’ve got this, and I'm here whenever you need to talk."}, "H010:T000": {"id": "H010:T000", "role": "seeker", "text": "Hey, I just wanted to talk about something that's been on my mind."}, "H010:T001": {"id": "H010:T001", "role": "supporter", "text": "Of course, Taylor. What's been going on?"}, "H010:T002": {"id": "H010:T002", "role": "seeker", "text": "I've been feeling really stuck and stressed lately. You remember the writer's block I mentioned before? It's still there."}, "H010:T003": {"id": "H010:T003", "role": "supporter", "text": "I'm sorry to hear that. It can be so frustrating when creativity feels blocked, especially with everything else you've got going on."}, "H010:T004": {"id": "H010:T004", "role": "seeker", "text": "Yeah, it's like I want to write, but every time I try, nothing comes out. Plus, everything that's happened recently hasn't helped."}, "H010:T005": {"id": "H010:T005", "role": "supporter", "text": "It sounds like you've been through a lot. That can definitely make it harder to find motivation and focus."}, "H010:T006": {"id": "H010:T006", "role": "seeker", "text": "Exactly. Between the argument with my ex, failing that mid-term, and falling out with my classmate... I just feel overwhelmed."}, "H010:T007": {"id": "H010:T007", "role": "supporter", "text": "That's a lot to deal with in a short amount of time. It makes sense that you're feeling pressured and overwhelmed."}, "H010:T008": {"id": "H010:T008", "role": "seeker", "text": "The only positive thing recently is that I found this online community of writers. They've been really encouraging."}, "H010:T009": {"id": "H010:T009", "role": "supporter", "text": "That's wonderful to hear! Having a supportive community can make a huge difference. How have they been helping you?"}, "H010:T010": {"id": "H010:T010", "role": "seeker", "text": "They've just been really good about listening and offering advice. They're all going through similar struggles, so it's comforting to not feel alone."}, "H010:T011": {"id": "H010:T011", "role": "supporter", "text": "It sounds like you've found a group of people who understand what you're going through. That's so important."}, "H010:T012": {"id": "H010:T012", "role": "seeker", "text": "Yeah, it's been nice to share my writing struggles and get feedback without judgement."}, "H010:T013": {"id": "H010:T013", "role": "supporter", "text": "Feedback without judgment can be incredibly liberating. Do you find it's helping with your writer's block?"}, "H010:T014": {"id": "H010:T014", "role": "seeker", "text": "A little bit. It's like I can see a light at the end of the tunnel. But I'm still battling with just getting started."}, "H010:T015": {"id": "H010:T015", "role": "supporter", "text": "Progress, even small steps, is still progress. It might take time, but it sounds like you're starting to find the tools to break through that block."}, "H010:T016": {"id": "H010:T016", "role": "seeker", "text": "Thanks, that means a lot. I guess I just needed to feel like I was moving in the right direction, even if it's slow."}, "H010:T017": {"id": "H010:T017", "role": "supporter", "text": "Absolutely. Slow progress is still progress, and you're not alone in this. Lean on your community and take it one day at a time."}, "H010:T018": {"id": "H010:T018", "role": "seeker", "text": "I will. It helps to know I have support from both them and you. Thank you so much."}, "H010:T019": {"id": "H010:T019", "role": "supporter", "text": "Anytime, Taylor. Remember, you're doing great just by reaching out and seeking support. You've got this."}, "H011:T000": {"id": "H011:T000", "role": "seeker", "text": "Hey! I really needed someone to talk to today."}, "H011:T001": {"id": "H011:T001", "role": "supporter", "text": "Of course, Taylor. I'm here for you. What's been on your mind?"}, "H011:T002": {"id": "H011:T002", "role": "seeker", "text": "I've been feeling pretty overwhelmed lately. I just signed up for a creative writing workshop to try and break through this writer's block."}, "H011:T003": {"id": "H011:T003", "role": "supporter", "text": "That sounds like a productive step forward. How do you feel about enrolling in the workshop?"}, "H011:T004": {"id": "H011:T004", "role": "seeker", "text": "A little nervous, honestly. I feel like I should be more excited, but it’s hard with all that’s been going on."}, "H011:T005": {"id": "H011:T005", "role": "supporter", "text": "It's understandable to feel nervous given everything you've been dealing with. It's a lot to manage. How have things been since the argument with your ex?"}, "H011:T006": {"id": "H011:T006", "role": "seeker", "text": "It's still a bit raw. It feels like every argument takes a bit more out of me, and it's been impacting my focus on studies too."}, "H011:T007": {"id": "H011:T007", "role": "supporter", "text": "That sounds exhausting. I'm really sorry you're going through this. Does being in the workshop help shift your focus a bit?"}, "H011:T008": {"id": "H011:T008", "role": "seeker", "text": "Yes, a little. Once I'm in the zone, writing can be an escape. But starting is so daunting, especially with thoughts of the failed mid-term lingering."}, "H011:T009": {"id": "H011:T009", "role": "supporter", "text": "It's okay to have those feelings, Taylor. Past challenges can stick with us, but each step towards engaging with what you enjoy can help in small ways. How are you finding the support in the writing community?"}, "H011:T010": {"id": "H011:T010", "role": "seeker", "text": "They're really supportive, I admit. It's comforting to talk with others who get the whole creativity struggle."}, "H011:T011": {"id": "H011:T011", "role": "supporter", "text": "That's wonderful to hear. It's important to have that sense of understanding, especially when classes and personal matters get tough. Do you feel any different after joining the workshop this week?"}, "H011:T012": {"id": "H011:T012", "role": "seeker", "text": "It's given me a bit of hope. Listening to others share their work makes me want to contribute too, even if the pressure mounts sometimes."}, "H011:T013": {"id": "H011:T013", "role": "supporter", "text": "It's great that you're inspired by your peers. Inspiration can ease the burden slowly. Perhaps even write a few lines just to get the momentum going without pressure?"}, "H011:T014": {"id": "H011:T014", "role": "seeker", "text": "That's a good idea. I think starting small could lessen the intimidation. I’ll try writing a page or two this weekend."}, "H011:T015": {"id": "H011:T015", "role": "supporter", "text": "That sounds perfect. Remember, small steps add up. With everything you're juggling, make sure to celebrate these wins, no matter how small."}, "H011:T016": {"id": "H011:T016", "role": "seeker", "text": "Thank you, really. It's nice to share this with someone who understands without judgment."}, "H011:T017": {"id": "H011:T017", "role": "supporter", "text": "Of course, Taylor. I'm glad you reached out. You're handling a lot, and taking steps toward creative pursuits is something to be proud of."}, "H011:T018": {"id": "H011:T018", "role": "seeker", "text": "Thanks, I needed that reminder. I’ll keep pushing forward, one small step at a time."}, "H011:T019": {"id": "H011:T019", "role": "supporter", "text": "I'm here whenever you need to talk. You've got this, Taylor. I'll be cheering you on."}, "H012:T000": {"id": "H012:T000", "role": "supporter", "text": "Hey Taylor! How have you been?"}, "H012:T001": {"id": "H012:T001", "role": "seeker", "text": "Hey. I've been feeling a bit overwhelmed lately."}, "H012:T002": {"id": "H012:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about it?"}, "H012:T003": {"id": "H012:T003", "role": "seeker", "text": "Yeah... I've been struggling with imposter syndrome. It's been on my mind a lot."}, "H012:T004": {"id": "H012:T004", "role": "supporter", "text": "That sounds tough. What triggered these feelings for you?"}, "H012:T005": {"id": "H012:T005", "role": "seeker", "text": "I think it started after seeing some of my peers celebrating their achievements recently. Like getting top marks or landing amazing internships."}, "H012:T006": {"id": "H012:T006", "role": "supporter", "text": "Seeing others succeed can definitely stir up those feelings. It's natural, but it doesn't mean you're any less capable."}, "H012:T007": {"id": "H012:T007", "role": "seeker", "text": "I know, but it feels like I'm going in circles. Last month was okay with finding that online community and all, but now I'm back to feeling stuck."}, "H012:T008": {"id": "H012:T008", "role": "supporter", "text": "I'm glad you found support in the online writing community before. Maybe leaning on them could help again? They understand the creative struggles."}, "H012:T009": {"id": "H012:T009", "role": "seeker", "text": "Yeah, they've been really great. It's just hard not to feel like I'm falling behind everyone else."}, "H012:T010": {"id": "H012:T010", "role": "supporter", "text": "It's understandable to feel that way, but remember, progress isn't always visible. You're juggling a lot, and it's okay to have setbacks."}, "H012:T011": {"id": "H012:T011", "role": "seeker", "text": "I guess so. Sometimes it feels like I'm not making any real progress in my writing or classes."}, "H012:T012": {"id": "H012:T012", "role": "supporter", "text": "Progress can be small and still meaningful. You've taken steps before, like joining that creative writing workshop. That shows dedication."}, "H012:T013": {"id": "H012:T013", "role": "seeker", "text": "True. The workshop was a good decision, and it helped get past my writer's block."}, "H012:T014": {"id": "H012:T014", "role": "supporter", "text": "Exactly, and you can overcome this too. Have you considered reaching out to someone in the workshop for support?"}, "H012:T015": {"id": "H012:T015", "role": "seeker", "text": "Not really, but maybe I should. It might be good to connect with someone who's going through similar things."}, "H012:T016": {"id": "H012:T016", "role": "supporter", "text": "That sounds like a great idea! Having someone to share experiences with can really help with those feelings of imposter syndrome."}, "H012:T017": {"id": "H012:T017", "role": "seeker", "text": "Thanks. I think I'll do that. I appreciate you listening and helping me see other perspectives."}, "H012:T018": {"id": "H012:T018", "role": "supporter", "text": "Anytime, Taylor. I'm always here to listen and support you. Remember, you're not alone in this."}, "H013:T000": {"id": "H013:T000", "role": "supporter", "text": "Hey Taylor, how have you been lately?"}, "H013:T001": {"id": "H013:T001", "role": "seeker", "text": "Hey. It's been a tough time, honestly. I recently saw something that's really been bothering me."}, "H013:T002": {"id": "H013:T002", "role": "supporter", "text": "I'm sorry to hear that. Would you like to talk about what happened?"}, "H013:T003": {"id": "H013:T003", "role": "seeker", "text": "Yeah, I guess I should. I saw my parents having a really intense argument. It's stuck with me."}, "H013:T004": {"id": "H013:T004", "role": "supporter", "text": "That sounds really hard to go through. Arguments like that can be really distressing to witness."}, "H013:T005": {"id": "H013:T005", "role": "seeker", "text": "Exactly, it's like it just hangs over me. I keep replaying it in my mind."}, "H013:T006": {"id": "H013:T006", "role": "supporter", "text": "It's understandable that you'd feel that way. Have you been able to talk to anyone about it?"}, "H013:T007": {"id": "H013:T007", "role": "seeker", "text": "Not really. It's kind of hard to bring up. I don't want to make things worse between them."}, "H013:T008": {"id": "H013:T008", "role": "supporter", "text": "I can see why you'd feel that way. Sometimes it's hard to find the right moment or words."}, "H013:T009": {"id": "H013:T009", "role": "seeker", "text": "Yeah. It's like I don't know what's my place in it. They're my parents, but I feel like a child again."}, "H013:T010": {"id": "H013:T010", "role": "supporter", "text": "That makes a lot of sense. Being caught in the middle can really bring up those feelings."}, "H013:T011": {"id": "H013:T011", "role": "seeker", "text": "And it's just been adding to everything else. Like the stress from school and my writing. It feels overwhelming."}, "H013:T012": {"id": "H013:T012", "role": "supporter", "text": "With everything you've been handling, it's no wonder things are feeling overwhelming. It's okay to feel that way."}, "H013:T013": {"id": "H013:T013", "role": "seeker", "text": "Thanks. Sometimes I feel like I'm the only one who struggles with balancing all of this."}, "H013:T014": {"id": "H013:T014", "role": "supporter", "text": "You're definitely not alone. Many people find themselves in similar situations and your feelings are completely valid."}, "H013:T015": {"id": "H013:T015", "role": "seeker", "text": "I really appreciate hearing that. I think I just need to remember that it's okay to ask for help."}, "H013:T016": {"id": "H013:T016", "role": "supporter", "text": "Absolutely, reaching out is a sign of strength. I'm glad you decided to talk to me about it."}, "H013:T017": {"id": "H013:T017", "role": "seeker", "text": "I am too. It helps knowing there's support out here. Maybe I'll eventually talk to my parents about how I feel."}, "H013:T018": {"id": "H013:T018", "role": "supporter", "text": "Take your time with that. Whenever you're ready, you deserve to share how you feel."}, "H013:T019": {"id": "H013:T019", "role": "seeker", "text": "Thanks. For now, I'll focus on the things I can control, like my writing and studies."}, "H013:T020": {"id": "H013:T020", "role": "supporter", "text": "That's a great approach. Those are areas where you can certainly see progress and feel accomplished."}, "H013:T021": {"id": "H013:T021", "role": "seeker", "text": "Yeah, and I'm starting to feel like I can work through my writer's block. That's something positive."}, "H013:T022": {"id": "H013:T022", "role": "supporter", "text": "That's wonderful to hear! Remember, you're doing the best you can and that's more than enough."}, "H013:T023": {"id": "H013:T023", "role": "seeker", "text": "Thanks, really, for listening and helping me through this."}, "H013:T024": {"id": "H013:T024", "role": "supporter", "text": "Anytime, Taylor. You're doing great, and I'm here for whatever you need."}, "H014:T000": {"id": "H014:T000", "role": "supporter", "text": "Hi Taylor! How have you been lately?"}, "H014:T001": {"id": "H014:T001", "role": "seeker", "text": "Hey, I've been feeling a lot of things lately. It's been a bit overwhelming."}, "H014:T002": {"id": "H014:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been going on?"}, "H014:T003": {"id": "H014:T003", "role": "seeker", "text": "Yeah, I had a session with my therapist recently. We talked a lot about my self-worth."}, "H014:T004": {"id": "H014:T004", "role": "supporter", "text": "That sounds like an important conversation. What came up for you during the session?"}, "H014:T005": {"id": "H014:T005", "role": "seeker", "text": "We talked about how I've been weighing my worth based on my academic and creative successes. It was eye-opening."}, "H014:T006": {"id": "H014:T006", "role": "supporter", "text": "It's tough when our value feels tied to achievements. How did you feel after the session?"}, "H014:T007": {"id": "H014:T007", "role": "seeker", "text": "Honestly, I felt both relieved and a bit anxious. Relieved to recognize it but anxious about how to change it."}, "H014:T008": {"id": "H014:T008", "role": "supporter", "text": "Change can be challenging, but recognizing the issue is a great first step. How have things been at university?"}, "H014:T009": {"id": "H014:T009", "role": "seeker", "text": "University's been okay. The workload is a lot, and I still struggle with feeling like I'm not doing enough."}, "H014:T010": {"id": "H014:T010", "role": "supporter", "text": "That makes sense, especially with everything you have on your plate. How's your creative writing going?"}, "H014:T011": {"id": "H014:T011", "role": "seeker", "text": "It's been up and down. I joined a writing workshop that helped, but the imposter syndrome creeps in."}, "H014:T012": {"id": "H014:T012", "role": "supporter", "text": "I'm glad the workshop helped. The feeling of not being enough can be so persistent. You're not alone in that."}, "H014:T013": {"id": "H014:T013", "role": "seeker", "text": "Thanks. It helps to know I'm not alone. The online community has been supportive too."}, "H014:T014": {"id": "H014:T014", "role": "supporter", "text": "That's great to hear! Sometimes finding a supportive community can make a big difference."}, "H014:T015": {"id": "H014:T015", "role": "seeker", "text": "Definitely! They remind me that it's okay to struggle and that growth takes time."}, "H014:T016": {"id": "H014:T016", "role": "supporter", "text": "Absolutely! You're on a journey, and it's perfectly okay to have ups and downs along the way."}, "H014:T017": {"id": "H014:T017"
