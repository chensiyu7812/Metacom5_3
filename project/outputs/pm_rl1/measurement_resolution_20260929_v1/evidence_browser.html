aking some space can be helpful to gather thoughts. Do you think you’ll be ready to talk soon?"}, "H005:T010": {"id": "H005:T010", "role": "seeker", "text": "I hope so. I don't want to keep ignoring it, but I'm also scared it'll turn into another argument."}, "H005:T011": {"id": "H005:T011", "role": "supporter", "text": "That's understandable. Talking during a calm moment might help. Maybe planning a time to chat could prevent it from escalating?"}, "H005:T012": {"id": "H005:T012", "role": "seeker", "text": "That's a good idea. Maybe after dinner tonight. I just wish he would understand how stressed I am too."}, "H005:T013": {"id": "H005:T013", "role": "supporter", "text": "Your feelings are very valid, Emily. It's important for both of you to feel heard. Do you feel like you can express how you’re both feeling?"}, "H005:T014": {"id": "H005:T014", "role": "seeker", "text": "I want to, but sometimes I don’t know how to start without sounding like I’m blaming him."}, "H005:T015": {"id": "H005:T015", "role": "supporter", "text": "Starting with 'I feel' statements can help focus on your emotions rather than assigning blame. It's okay to express vulnerability."}, "H005:T016": {"id": "H005:T016", "role": "seeker", "text": "That's true. I'll try that. Thanks for reminding me. I just want us to be okay."}, "H005:T017": {"id": "H005:T017", "role": "supporter", "text": "You’re doing your best, and that is important. Figuring it out together might bring you closer. How are you taking care of yourself today?"}, "H005:T018": {"id": "H005:T018", "role": "seeker", "text": "I haven’t really done much for myself yet. Maybe I should go for a walk or listen to some music."}, "H005:T019": {"id": "H005:T019", "role": "supporter", "text": "That sounds like a wonderful idea. Taking a little time for self-care can help clear your mind and give you strength."}, "H005:T020": {"id": "H005:T020", "role": "seeker", "text": "Thanks for listening. It really helps just having someone to talk to about all this."}, "H005:T021": {"id": "H005:T021", "role": "supporter", "text": "I'm always here for you, Emily. Take it one step at a time, and keep me updated if you need anything."}, "H005:T022": {"id": "H005:T022", "role": "seeker", "text": "I will. Thanks again."}, "H006:T000": {"id": "H006:T000", "role": "seeker", "text": "Hey, I needed someone to talk to about everything that's been going on."}, "H006:T001": {"id": "H006:T001", "role": "supporter", "text": "Of course, Emily. I'm here for you. How have things been since you started therapy?"}, "H006:T002": {"id": "H006:T002", "role": "seeker", "text": "It's been a bit overwhelming, to be honest. I'm glad I took the step, but it's a lot to unpack."}, "H006:T003": {"id": "H006:T003", "role": "supporter", "text": "It sounds like you're processing a lot. It's completely normal to feel overwhelmed. What's been on your mind?"}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "Mainly my relationship with Bob and the financial strain. It's hard not to feel angry and resentful sometimes."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "That's understandable. Financial pressures can really strain relationships. How are you both handling it right now?"}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "We're trying to talk more without arguing, but it's a struggle. I can't help but feel frustrated thinking about how he left his job."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "I can hear the frustration and it's valid. It must be tough carrying the burden alone. How is the therapy helping you with these feelings?"}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "Therapy helps, slowly. It's nice to have a space to express myself, but it doesn't change things immediately at home."}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "Having an outlet is important. Therapy can sometimes take time, but it's great you're making progress. Are there things you're learning that help?"}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "I learned about setting boundaries and communicating my needs. It’s something I’m working on with Bob."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "That sounds like a positive step. How is Bob responding to the changes you're trying to make?"}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "I think he's trying, but it's hard to change old habits, especially when both of us are stressed."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "Change is challenging, especially during tough times. Acknowledging the effort on both sides is a good step. What about your job? How's that affecting things?"}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "Work is another stress. They doubled my workload after an acquisition, but no raise came with it."}, "H006:T015": {"id": "H006:T015", "role": "supporter", "text": "That sounds incredibly unfair and stressful. No wonder you feel overwhelmed with everything piling up."}, "H006:T016": {"id": "H006:T016", "role": "seeker", "text": "It is. I'm trying to manage my mental health, but sometimes it feels like too much."}, "H006:T017": {"id": "H006:T017", "role": "supporter", "text": "It's okay to feel that way. It seems like you're doing your best despite everything. Are you able to find any small ways to de-stress?"}, "H006:T018": {"id": "H006:T018", "role": "seeker", "text": "I try to take walks and focus on mindfulness exercises. They help me feel a little more grounded."}, "H006:T019": {"id": "H006:T019", "role": "supporter", "text": "That's great to hear. It's important to celebrate these small wins. I'll be here to support you as you navigate through this."}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Emily, it's been a little while. How are you doing?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hi, it's been... a tough week."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been going on?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "Yeah, actually. My son Jerry got in trouble at school. They caught him using his phone inappropriately."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "That sounds really stressful. How did you find out about it?"}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "We had a meeting with the school's principal. It was embarrassing, especially after telling him so many times to focus on his studies."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "I can imagine how difficult that must have been for you. How did the meeting go?"}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "It was tense. The principal was understanding but firm. I just felt so disappointed and a bit like I've failed him."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "It's understandable to feel that way, but you haven't failed him. You're a caring mother who's trying her best."}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "Thank you. I've been trying to figure out how to handle this. The financial strain with Bob, and now Jerry acting out... it's just a lot."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "That does sound overwhelming. How have you been managing everything?"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "Therapy helps, but outside of that, I just try to keep my head above water."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "I'm glad you've found some support in therapy. What strategies have been helping you there?"}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "The therapist has been teaching me breathing techniques and we've been working on expressing my feelings more constructively."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "That sounds really valuable. Do you think any of those techniques could help with how you're feeling about Jerry?"}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "Perhaps. I think I need to communicate better with him and find out what's really going on beneath the surface."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "It sounds like you have a great approach. Being able to talk openly with him might really help both of you."}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "I hope so. I just want to make sure he understands that I care about him, even when I’m upset."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "He’s fortunate to have you watching out for him. If you ever need to talk more about any of this, I’m here for you."}, "H007:T019": {"id": "H007:T019", "role": "seeker", "text": "Thank you. It means a lot to have someone to lean on right now."}}, "current_date": "2024-11-05", "last_seeker": "Hey, I really needed someone to talk to today."}, "4563088b51d8dcc8528d48646dfa101d51e8173df8f2ecfd06911515bf0bbee0": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "Hey, I hope you don't mind me reaching out again. I just have a lot on my mind lately."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "HI there, how are you doing?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Hi, I'm ok"}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "Do you want to talk about whats going on right now?"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Sure. I took a nude photo of myself to share with someone I'm dating, and accidentally sent it to several friends in a group chat"}, "H001:T004": {"id": "H001:T004", "role": "seeker", "text": "I'm really embarrassed about it and I have some anxiety about meeting or talking to my friends"}, "H001:T005": {"id": "H001:T005", "role": "supporter", "text": "Ive done some things like that before. I know this might sound weird but what helped me through it was to actually own it. Take control of it before they can."}, "H001:T006": {"id": "H001:T006", "role": "seeker", "text": "Do you think it would be helpful to use humor? I don't want them to tease me about it but I don't know how else to approach it"}, "H001:T007": {"id": "H001:T007", "role": "supporter", "text": "Yea that is definitely one way to control it"}, "H001:T008": {"id": "H001:T008", "role": "seeker", "text": "Lol maybe some of my friends will share with the group too"}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "that would definitely make me feel better about it"}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "Ha, well that could get interesting"}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "yes, for sure"}, "H001:T012": {"id": "H001:T012", "role": "seeker", "text": "anyway, thanks for the chat. this was helpful"}, "H002:T000": {"id": "H002:T000", "role": "supporter", "text": "Hi! How are you tonight?"}, "H002:T001": {"id": "H002:T001", "role": "seeker", "text": "I've been better. I just buried my dog yesterday"}, "H002:T002": {"id": "H002:T002", "role": "seeker", "text": "She was going to turn 15 next month"}, "H002:T003": {"id": "H002:T003", "role": "supporter", "text": "Ouch! I'm so sorry to hear that. I never lost a dog, but I've lost cats. "}, "H002:T004": {"id": "H002:T004", "role": "supporter", "text": "Is 14 a good age for a dog?"}, "H002:T005": {"id": "H002:T005", "role": "supporter", "text": "I have my first dog so I don't know much, he is 9 years old and came with our house. "}, "H002:T006": {"id": "H002:T006", "role": "seeker", "text": "Actually, yes. She was old and had dementia."}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "The oldest dog I evet had was 15"}, "H002:T008": {"id": "H002:T008", "role": "supporter", "text": "I'm so sorry, losing a pet is very hard on us. "}, "H002:T009": {"id": "H002:T009", "role": "seeker", "text": "How did your dog come with the house?"}, "H002:T010": {"id": "H002:T010", "role": "supporter", "text": "Was that your only pet? Or do you have others? We moved from FL to KY and the little dog just hung out here, he really belonged to the neighbor's son who didn't want him, so he just ran around wild and wouldn't leave. I never had a dog, but it got cold, so i took him in. They never asked about him and after a week, I asked them if I could have the dog, so they said yes. I don't think they cared."}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "I wish I could give you a hug, really, there are no words to make this better as you already know the grief of losing a pet, it does get better, but it stings terribly at first."}, "H002:T012": {"id": "H002:T012", "role": "seeker", "text": "I have 2 other dogs that are mine and my boyfriend has 2"}, "H002:T013": {"id": "H002:T013", "role": "seeker", "text": "Thank you. that means a lot"}, "H002:T014": {"id": "H002:T014", "role": "seeker", "text": "We both had dogs when we met."}, "H002:T015": {"id": "H002:T015", "role": "supporter", "text": "So you definitely are a dog lover! I was in my 50s before I ever had a dog, now I wish I had more, they are really loving. Not like cats who don't care much about much except FOOD! lol"}, "H002:T016": {"id": "H002:T016", "role": "supporter", "text": "I know when tragedy happens, I can't get stuck in depression, I sort of have to force myself to put one foot in front of the other. It's hard to have a healthy balance between grieving and continuing to live. Cry, then dry my eyes, pick up, go for a walk, don't get caught in grief, but yet don't deny it! "}, "H002:T017": {"id": "H002:T017", "role": "seeker", "text": "They get to be so close and you can really pick up on their emotions and stuff. That's what happens to me. I get stuck sometimes"}, "H002:T018": {"id": "H002:T018", "role": "supporter", "text": "I get stuck too. But you are doing the right things, here you reached out to someone and I do care, so you are moving forward."}, "H002:T019": {"id": "H002:T019", "role": "supporter", "text": "I always find it helpful just so have someone share my pain with me. Just to know I'm  not alone."}, "H002:T020": {"id": "H002:T020", "role": "seeker", "text": "Thanks. Another person who has pets helps"}, "H002:T021": {"id": "H002:T021", "role": "seeker", "text": "They understand"}, "H002:T022": {"id": "H002:T022", "role": "supporter", "text": "I do understand. My mom died in 2010, right after she died, 1 of my cats died, my husband went into the hospital and almost died, so we went on vacation so I would not be consumed with grief, and do you know, we brought our pets and our cat died when we arrived here on vacation?  I will never forget that. You know what. I knew I could either get consumed in grief, or push through. Man, that was hard. I prayed a lot and God got me through that and I had a good vacation, all things considered."}, "H002:T023": {"id": "H002:T023", "role": "supporter", "text": "I will definitely pray for you too that God will comfort your heart and that you will be comforted by your other dogs and your boyfriend's dogs and that you will feel joy at times at the happy memories you had with your dog. "}, "H002:T024": {"id": "H002:T024", "role": "seeker", "text": "Oh wow, that sounds horrible. Pushing through though I guess is all one can do then. Thank you so much. I believe in prayer."}, "H002:T025": {"id": "H002:T025", "role": "supporter", "text": "Prayer is what gets me through every day!  :D  It was rough, but I believe these hard times strengthen us in some way. Because life throws hard balls, and we have to move forward or be consumed. "}, "H002:T026": {"id": "H002:T026", "role": "seeker", "text": "That's true. I'm glad I did this project. You really helped me."}, "H002:T027": {"id": "H002:T027", "role": "supporter", "text": "I'm so glad I did too. It was a pleasure to meet you. And once again, (hug). :D"}, "H002:T028": {"id": "H002:T028", "role": "seeker", "text": "You too. Thanks so much. bye"}, "H002:T029": {"id": "H002:T029", "role": "supporter", "text": "I have one more thing to say - wise words from this 92 year old lady at church named Sue. She told me this after my brother died. When you get older, everyone you know is practically dead.  She said \"Life is for the living, if you get caught up to much in all the death, you won't life.\"  True words. God bless, have a good night.  "}, "H003:T000": {"id": "H003:T000", "role": "supporter", "text": "Hi Linda, how have you been feeling lately?"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "Hey. Honestly, it's been a tough week. Losing Max still feels so raw."}, "H003:T002": {"id": "H003:T002", "role": "supporter", "text": "I'm really sorry to hear that. It sounds like Max meant a lot to you."}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "He really did. Max was more than just a pet; he was part of the family."}, "H003:T004": {"id": "H003:T004", "role": "supporter", "text": "I can imagine it's like a part of your daily life is missing now. How are you coping?"}, "H003:T005": {"id": "H003:T005", "role": "seeker", "text": "It helps that David moved in. It's comforting not to be alone in the apartment."}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "That's good to hear. Having David around must provide some relief. How is the adjustment going?"}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "It's good, but I feel guilty sometimes. Like I'm burdening him with my grief."}, "H003:T008": {"id": "H003:T008", "role": "supporter", "text": "It's understandable to feel that way, but remember, it's okay to lean on someone you trust."}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "Yeah, he keeps saying he wants to be there for me, but I'm still struggling to accept help."}, "H003:T010": {"id": "H003:T010", "role": "supporter", "text": "That can definitely be challenging. What do you think is making it hard to accept his support?"}, "H003:T011": {"id": "H003:T011", "role": "seeker", "text": "I guess I've always been independent. Relying on someone else feels foreign to me."}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "That makes sense. Sometimes accepting support is part of growing together. It can be a way to strengthen your bond."}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "You're right, and I do appreciate him being here. It's a learning process for both of us."}, "H003:T014": {"id": "H003:T014", "role": "supporter", "text": "Absolutely. It's important to give yourself grace during this time."}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "I appreciate that. Talking about Max and his wagging tail makes me smile, even if it's bittersweet."}, "H003:T016": {"id": "H003:T016", "role": "supporter", "text": "Those memories can be quite comforting. Maybe you and David can create a little tribute to Max?"}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "That's a beautiful idea. I think it might help me honor his memory positively."}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "I'm glad you think so. Remember, it's okay to grieve and to find comforting ways to remember Max."}, "H003:T019": {"id": "H003:T019", "role": "seeker", "text": "Thank you for your support. This conversation has really helped me see things from a different perspective."}, "H003:T020": {"id": "H003:T020", "role": "supporter", "text": "You're welcome, Linda. I'm here for you anytime you need to talk."}, "H003:T021": {"id": "H003:T021", "role": "seeker", "text": "I appreciate that a lot. I'll talk to David about your suggestion tonight."}, "H003:T022": {"id": "H003:T022", "role": "supporter", "text": "Great. I'm sure it'll be a meaningful and healing experience for both of you."}, "H004:T000": {"id": "H004:T000", "role": "supporter", "text": "Hi Linda, how are you holding up today?"}, "H004:T001": {"id": "H004:T001", "role": "seeker", "text": "Hey, I'm not doing too great. I had a big argument with Lily about family stuff."}, "H004:T002": {"id": "H004:T002", "role": "supporter", "text": "I'm sorry to hear that. It must be hard having a fight with someone close to you. What happened, if you feel like sharing?"}, "H004:T003": {"id": "H004:T003", "role": "seeker", "text": "We've always had different views on family responsibilities, but this time it got really heated. She thinks I'm not doing enough."}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "That sounds really stressful. It must be tough feeling like your efforts aren't recognized."}, "H004:T005": {"id": "H004:T005", "role": "seeker", "text": "Yeah, exactly. I'm trying to help as much as I can, especially with work being so demanding."}, "H004:T006": {"id": "H004:T006", "role": "supporter", "text": "Balancing work and family can be really challenging. You're doing your best, and it sounds like you're being stretched thin."}, "H004:T007": {"id": "H004:T007", "role": "seeker", "text": "I just feel overwhelmed sometimes. I want to be there for my family but also need to take care of myself."}, "H004:T008": {"id": "H004:T008", "role": "supporter", "text": "It's completely understandable to feel that way. It's important to find a balance that works for you, too."}, "H004:T009": {"id": "H004:T009", "role": "seeker", "text": "Then there’s the guilt. I keep thinking about how maybe I should be doing more."}, "H004:T010": {"id": "H004:T010", "role": "supporter", "text": "Guilt can be so tough to deal with. But remember, you're only human. You're allowed to set boundaries and take care of yourself."}, "H004:T011": {"id": "H004:T011", "role": "seeker", "text": "I know, but it's hard to shake off. I want things to be okay between Lily and me."}, "H004:T012": {"id": "H004:T012", "role": "supporter", "text": "I understand. It shows how much you care about your relationship with her. Have you thought about how you might approach things with Lily moving forward?"}, "H004:T013": {"id": "H004:T013", "role": "seeker", "text": "I've been thinking of reaching out and talking it over calmly. I don't want this to become a bigger issue."}, "H004:T014": {"id": "H004:T014", "role": "supporter", "text": "That sounds like a really thoughtful approach. Clear communication might help both of you understand each other better."}, "H004:T015": {"id": "H004:T015", "role": "seeker", "text": "I hope so. I just hate being in this kind of conflict. It feels exhausting."}, "H004:T016": {"id": "H004:T016", "role": "supporter", "text": "Conflicts can be really draining, but resolving them can also lead to stronger bonds. You're strong for facing it head-on."}, "H004:T017": {"id": "H004:T017", "role": "seeker", "text": "Thanks for saying that. I guess I'll try to focus on the good side of it."}, "H004:T018": {"id": "H004:T018", "role": "supporter", "text": "Absolutely. Lean on David too; he's there to support you. How are things going with him?"}, "H004:T019": {"id": "H004:T019", "role": "seeker", "text": "He's been great, actually. Moving in together has been a big help for me emotionally, especially after losing my dog."}, "H004:T020": {"id": "H004:T020", "role": "supporter", "text": "It's wonderful to hear you have that support. David seems like a solid rock for you during tough times."}, "H004:T021": {"id": "H004:T021", "role": "seeker", "text": "Yeah, he's been amazing. I think I'll talk to him more about how I'm feeling too."}, "H004:T022": {"id": "H004:T022", "role": "supporter", "text": "That's a good idea. Keeping him in the loop can only strengthen your relationship."}, "H004:T023": {"id": "H004:T023", "role": "seeker", "text": "I'll definitely do that. Thanks for listening to me today, it really helps to talk things out."}, "H004:T024": {"id": "H004:T024", "role": "supporter", "text": "Anytime, Linda. I'm here whenever you need to chat. You're doing great, just take it one step at a time."}, "H005:T000": {"id": "H005:T000", "role": "seeker", "text": "Hey, I could really use someone to talk to right now. Mind lending an ear?"}, "H005:T001": {"id": "H005:T001", "role": "supporter", "text": "Of course, Linda. I'm here for you. What's on your mind?"}, "H005:T002": {"id": "H005:T002", "role": "seeker", "text": "I just adopted a new puppy, and while I thought it would help, I’m feeling all sorts of things I didn’t expect."}, "H005:T003": {"id": "H005:T003", "role": "supporter", "text": "Adopting a new puppy sounds like a big step. What feelings are coming up for you?"}, "H005:T004": {"id": "H005:T004", "role": "seeker", "text": "I thought it would ease the pain of losing Max. But sometimes, it feels like I'm trying to replace him."}, "H005:T005": {"id": "H005:T005", "role": "supporter", "text": "Losing Max was really tough on you. It's understandable to have mixed emotions. It's okay to miss him while also making room for new love."}, "H005:T006": {"id": "H005:T006", "role": "seeker", "text": "Thank you for saying that. I just feel guilty, like I'm betraying Max's memory by loving another dog."}, "H005:T007": {"id": "H005:T007", "role": "supporter", "text": "Guilt is a common feeling, but remember, Max would want you to be happy and give love to another dog. You're not replacing him; you're honoring the love you shared by opening your heart again."}, "H005:T008": {"id": "H005:T008", "role": "seeker", "text": "I know, logically, you’re right. I guess it's just my heart struggling to catch up."}, "H005:T009": {"id": "H005:T009", "role": "supporter", "text": "That's completely normal, Linda. Healing takes time, and you're doing your best. How is the new puppy helping, if at all?"}, "H005:T010": {"id": "H005:T010", "role": "seeker", "text": "Well, he’s full of energy and brings some chaos into my routine, which is a nice distraction. But sometimes, I feel overwhelmed trying to train him."}, "H005:T011": {"id": "H005:T011", "role": "supporter", "text": "It sounds like he's bringing some lively energy into your life, but it's okay to feel overwhelmed. It's a big adjustment for both of you."}, "H005:T012": {"id": "H005:T012", "role": "seeker", "text": "Exactly. And with David moving in, I worry about how all these changes are affecting us."}, "H005:T013": {"id": "H005:T013", "role": "supporter", "text": "That's a lot to juggle. How's your relationship with David? Is he supportive with all these changes?"}, "H005:T014": {"id": "H005:T014", "role": "seeker", "text": "David's been wonderful. Having him here helps, but I fear I'm relying on him too much."}, "H005:T015": {"id": "H005:T015", "role": "supporter", "text": "It's great that David is there for support. It's okay to lean on him during tough times, as long as you communicate and find balance together."}, "H005:T016": {"id": "H005:T016", "role": "seeker", "text": "I'll keep that in mind. I just need to find my own footing amidst everything that's happening."}, "H005:T017": {"id": "H005:T017", "role": "supporter", "text": "You will. You're taking steps by adopting a new puppy and being honest about your feelings. It shows strength and courage."}, "H005:T018": {"id": "H005:T018", "role": "seeker", "text": "Thanks for saying that. It's just been a whirlwind lately, and I appreciate having someone to talk it through with."}, "H005:T019": {"id": "H005:T019", "role": "supporter", "text": "Anytime, Linda. Remember, it's okay to feel however you feel right now. You're doing an amazing job taking care of yourself and embracing change."}, "H006:T000": {"id": "H006:T000", "role": "supporter", "text": "Hi Linda, how are you feeling today?"}, "H006:T001": {"id": "H006:T001", "role": "seeker", "text": "Hey, I'm feeling pretty overwhelmed at the moment."}, "H006:T002": {"id": "H006:T002", "role": "supporter", "text": "I'm sorry to hear that. Would you like to share what's been going on?"}, "H006:T003": {"id": "H006:T003", "role": "seeker", "text": "It's been a lot at work. The pressure has really been getting to me lately, and I actually had a panic attack a few days ago."}, "H006:T004": {"id": "H006:T004", "role": "supporter", "text": "That sounds really tough. Panic attacks can be so frightening. Have you been able to talk to anyone about it?"}, "H006:T005": {"id": "H006:T005", "role": "seeker", "text": "I mentioned it to David. He's been there for me, but sometimes I feel like it's unfair to burden him with my issues."}, "H006:T006": {"id": "H006:T006", "role": "supporter", "text": "It's great that David is supportive, but remember, your feelings and experiences are valid, and it's okay to lean on him during tough times."}, "H006:T007": {"id": "H006:T007", "role": "seeker", "text": "Thank you. I just wish I could manage my stress better. I thought adopting Buddy would help, but I still find myself feeling anxious."}, "H006:T008": {"id": "H006:T008", "role": "supporter", "text": "Pets can be comforting, but it's understandable to still feel anxious, especially with work pressures piling up. Have you had a chance to take any breaks or do something relaxing lately?"}, "H006:T009": {"id": "H006:T009", "role": "seeker", "text": "Not really. The deadlines are so tight, and I'm constantly worried about falling behind."}, "H006:T010": {"id": "H006:T010", "role": "supporter", "text": "I can imagine that makes it hard to decompress. Perhaps finding small moments in the day for yourself could help, even if it's just a few minutes."}, "H006:T011": {"id": "H006:T011", "role": "seeker", "text": "That might be worth trying. Maybe a short walk with Buddy could help clear my head."}, "H006:T012": {"id": "H006:T012", "role": "supporter", "text": "That sounds like a wonderful idea. Buddy would probably love that too!"}, "H006:T013": {"id": "H006:T013", "role": "seeker", "text": "Yeah, he probably would. I also think I need to re-evaluate how I'm handling work stress. This panic attack was a wake-up call."}, "H006:T014": {"id": "H006:T014", "role": "supporter", "text": "It's impressive that you're reflecting on this and considering changes. Recognizing the need for balance is such a big step."}, "H006:T015": {"id": "H006:T015", "role": "seeker", "text": "Thank you. I really appreciate the encouragement. I also need to find a way to mend things with Lily. Our argument has been weighing on me too."}, "H006:T016": {"id": "H006:T016", "role": "supporter", "text": "Family dynamics can be challenging, especially after a disagreement. It's understandable you're feeling down about it."}, "H006:T017": {"id": "H006:T017", "role": "seeker", "text": "Yeah, I hope I can find a way to apologize and move forward. I've been hesitant to reach out."}, "H006:T018": {"id": "H006:T018", "role": "supporter", "text": "Taking the first step can be daunting, but it could lead to healing for both of you. Maybe just starting with a message to say you miss her could open the door."}, "H006:T019": {"id": "H006:T019", "role": "seeker", "text": "That's a good idea. I'll try to write her something sincere. I really hope we can patch things up."}, "H006:T020": {"id": "H006:T020", "role": "supporter", "text": "Your willingness to reconcile shows just how much you value your relationship with her. I'm hopeful for you both."}, "H006:T021": {"id": "H006:T021", "role": "seeker", "text": "Thanks. It means a lot to have someone to talk to about all this. I'm feeling a bit more hopeful now."}, "H006:T022": {"id": "H006:T022", "role": "supporter", "text": "I'm glad to hear that, Linda. Remember, I'm here whenever you need to talk. You've got this!"}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Linda! How have you been holding up since deciding to take some time off work?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hi. It's been a mix of emotions honestly. It feels strange not to be in the office, but I know I need this break."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "It's completely understandable to feel that way. Taking a pause can sometimes feel unsettling, but it's important to prioritize your wellbeing. How are you coping with everything so far?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "I've had some good days and some not-so-good days. I've been trying to make the most of my time, but it's hard not to worry about falling behind at work."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "It’s only natural to feel anxious about work. Remember, you've made this decision for a reason. It's okay to focus on your health right now."}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "You're right. I just hope I won't let my team down. I had a panic attack last month, and it really shook me."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "I'm so sorry to hear that, Linda. Panic attacks can be incredibly overwhelming. Have you had any more incidents since then?"}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "Thankfully, no more since then. But it’s been hard to shake the fear off. David’s been really supportive though, and Buddy has been a great distraction."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "It's wonderful to hear that David and Buddy have been comforting. Having supportive loved ones around can make such a difference. Have they been helping you with any specific strategies or just being there when you need them?"}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "David's been encouraging me to talk things out and we've been going for walks with Buddy, which helps me clear my mind. I guess it's the little things, you know?"}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "Absolutely, those little moments can be quite powerful. Is there anything else you've found helpful during this time to manage your stress?"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "I've started journaling a bit. I think putting my thoughts on paper helps me process them better. Plus, it helps distract me from worrying about work."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "That sounds like a great way to process emotions. Writing can be so cathartic. Have you been able to reach any new insights about your situation through journaling?"}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "I guess I've realized that I need to set clearer boundaries. I tend to take on too much, and it eventually gets overwhelming."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "That’s a very important realization, Linda. Setting boundaries can be challenging, but it’s crucial for your mental health. Have you thought about any specific steps you can take to start creating those boundaries when you return to work?"}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "I’m considering having a talk with my manager about my workload. Mike has been understanding in the past, and I'm hopeful he'll support a more manageable schedule."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "It sounds like a rational plan and I’m glad you’re thinking of discussing this with Mike. Remember, advocating for yourself is key. How have things been with Lily lately? Any better since your last conversation?"}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "We’ve had a couple of talks since the argument. It’s still a bit tense, but I think we’re starting to understand each other more. It’ll take time, but I’m hopeful."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "That’s a good start, and it’s great that you’re both taking steps towards reconciliation. It’s important to be patient with each other. Anything else on your mind that you'd like to share?"}, "H007:T019": {"id": "H007:T019", "role": "seeker", "text": "Not at the moment. Just trying to take things one day at a time. Thanks for listening, it really helps to talk about these things."}, "H007:T020": {"id": "H007:T020", "role": "supporter", "text": "Anytime, Linda. Remember that you have support and are doing your best. Feel free to reach out whenever you need someone to talk to. Take care of yourself!"}}, "current_date": "2025-01-15", "last_seeker": "Hey, I hope you don't mind me reaching out again. I just have a lot on my mind lately."}, "96d35b455b8e8fc6b14e61860c517813f30f15171f7748a45b35b66d01e2b594": {"turns": {"C:T000": {"id": "C:T000", "role": "supporter", "text": "Hey Jimmy, how have you been doing lately?"}, "C:T001": {"id": "C:T001", "role": "seeker", "text": "Hey, I'm okay, I guess. I've started journaling daily. Thought it might help me make sense of everything."}, "C:T002": {"id": "C:T002", "role": "supporter", "text": "That's a great step. Writing things down can help untangle what's going on inside. How's it been for you so far?"}, "C:T003": {"id": "C:T003", "role": "seeker", "text": "It's been... enlightening, but also a bit heavy. I didn't realize how many emotions I've been bottling up."}, "C:T004": {"id": "C:T004", "role": "supporter", "text": "I can imagine. Opening that bottle can be tough. Have you discovered anything about yourself through journaling?"}, "C:T005": {"id": "C:T005", "role": "seeker", "text": "Yeah, I've noticed a pattern of avoiding conversations that make me uncomfortable. I guess I've been doing that a lot."}, "C:T006": {"id": "C:T006", "role": "supporter", "text": "Recognizing those patterns is a big first step. It shows you're gaining clarity. Have any specific situations come to mind?"}, "C:T007": {"id": "C:T007", "role": "seeker", "text": "Well, my recent move to Sydney was partly because I felt trapped by my past here in Canberra. Wanted a fresh start, but I miss some things too."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "How may I help you?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Hi I am feeling quite sad today."}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "Ohh, sorry to hear that. Any partucular reason?"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Yes I feel like my friends just don't care about me much at all."}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "You saying that your friend does not care about you any more. Is that correct?"}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "Yes, when we get together all they want to do is talk about themselves. When I raise something that is bothering me they just ignore what I say and go back to what they want to talk about."}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "That's not good. You must be feeling left out. "}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "Yes I feel left out and unsupported by them."}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "Any particular reason they are doing such thing?"}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "Well I think they don't care about me and are just selfish about their needs."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "In that case, should you consider them as your friends?"}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "Well they are the only friends I have and I have known them a long time. Do you think I should stop being friends with them ?"}, "H001:T012": {"id": "H001:T012", "role": "supporter", "text": "If someone is not friendly they are not real friend. You need to find someone who will stand by you no matter what.."}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "Oh well that makes me feel sad too.  I will be saying goodbye to some long friendships. Do you think that is the only answer ?"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "Ok.. how about hosting them in your place for a gettogether.. "}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "Ok how do you think that would help me ?"}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "They might open up if you are hosting .. people are generally nice to the host.. "}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "Yes that is true, it's a good idea.  I could also take the opportunity to tell them how I am feeling."}, "H001:T018": {"id": "H001:T018", "role": "supporter", "text": "Good.. let's try that.. Anythign else I could help you with?"}, "H001:T019": {"id": "H001:T019", "role": "seeker", "text": "No you have been very helpful and I feel much better now I have a plan of action to address my problem. Thanks."}, "H001:T020": {"id": "H001:T020", "role": "supporter", "text": "Thank you .. have a good day."}, "H002:T000": {"id": "H002:T000", "role": "seeker", "text": "Yo"}, "H002:T001": {"id": "H002:T001", "role": "supporter", "text": "Hi, how are you doing?"}, "H002:T002": {"id": "H002:T002", "role": "seeker", "text": "I am decent. I am here because my friend talks way too much on the phone, and it frustrates me."}, "H002:T003": {"id": "H002:T003", "role": "seeker", "text": "They never want to hang up, and the talk can literally go on for hours."}, "H002:T004": {"id": "H002:T004", "role": "supporter", "text": "It sounds like it would be quite frustrating for your friend to talk way too much on the phone. "}, "H002:T005": {"id": "H002:T005", "role": "seeker", "text": "No, he loves it! I'm the one who hates it."}, "H002:T006": {"id": "H002:T006", "role": "supporter", "text": "My goodness! How do they respond when you ask to end the conversation?"}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "I tell him, but he just doesn't get it. Or, he says he understands, but then just goes back to talking!"}, "H002:T008": {"id": "H002:T008", "role": "seeker", "text": "Or, he may finally end the talk, but the next time we talk, he will just do it all over again!"}, "H002:T009": {"id": "H002:T009", "role": "supporter", "text": "I wonder what it would be like for him if you hung up the phone even after he said he still wanted to talk."}, "H002:T010": {"id": "H002:T010", "role": "supporter", "text": "Wow--that does sound annoying that he will repeat the same pattern the next time."}, "H002:T011": {"id": "H002:T011", "role": "seeker", "text": "He will literally talk up to 10 minutes without letting you have a word in. As far as that advice, I have hung up, but he gets extremely offended easily."}, "H002:T012": {"id": "H002:T012", "role": "supporter", "text": "That sounds really difficult if he gets offended so easily. I find it hard to talk to some of those kinds of friends."}, "H002:T013": {"id": "H002:T013", "role": "seeker", "text": "I'm at my wits end. I tell him all the time. \"You talk too much. You gotta stop talking at me. You gotta give the other person a turn. You gotta respect other's time.\""}, "H002:T014": {"id": "H002:T014", "role": "supporter", "text": "What do you get out of the friendship with this other person?"}, "H002:T015": {"id": "H002:T015", "role": "seeker", "text": "Well, I've been friends with him for a long time. He's funny and can have interesting perspectives on things. Also, we have done a lot together in the past."}, "H002:T016": {"id": "H002:T016", "role": "supporter", "text": "That sounds like a lot that the two of you have been through. Were there other times that your friends was more equally responsive or attuned to you in conversations?"}, "H002:T017": {"id": "H002:T017", "role": "seeker", "text": "Oh, yes, I have other friends in conversations who can take turns and understand the concept of time just fine."}, "H002:T018": {"id": "H002:T018", "role": "seeker", "text": "I just don't know what to do about this guy in particular. I still want to be his friend, but he just doesn't change."}, "H002:T019": {"id": "H002:T019", "role": "supporter", "text": "I wonder if there is anything nice you could do for yourself when you are talking to him that would make it easier to talk to him."}, "H002:T020": {"id": "H002:T020", "role": "seeker", "text": "Do you think I should just have a timer that goes off at 1 minute and let it beep in his face if he goes on for too long to train him like a monkey?"}, "H002:T021": {"id": "H002:T021", "role": "supporter", "text": "I can see that you are feeling upset and angry when he talks so much and that is totally understandable. "}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "I just need a method. Talking to him is just not working."}, "H002:T023": {"id": "H002:T023", "role": "seeker", "text": "He is hard to condition."}, "H002:T024": {"id": "H002:T024", "role": "supporter", "text": "Would it hurt his feelings to use a timer like that? It may for some other people. "}, "H002:T025": {"id": "H002:T025", "role": "seeker", "text": "Yea, but I might be able to slip some humour in there to take the edge off because it is so silly."}, "H002:T026": {"id": "H002:T026", "role": "supporter", "text": "Humor is really helpful for a lot of people. "}, "H002:T027": {"id": "H002:T027", "role": "seeker", "text": "Any other ideas?"}, "H002:T028": {"id": "H002:T028", "role": "supporter", "text": "Sometimes, people draw or do something else distracting with their hands when talking to someone who dominates the conversation."}, "H002:T029": {"id": "H002:T029", "role": "seeker", "text": "So your option is to start just doing something else when he is talking? He might get the message in a subtle way?"}, "H002:T030": {"id": "H002:T030", "role": "supporter", "text": "Sometimes that is a less offensive way to retrain someone who is being obnoxious or dominant and yet who is easily offended. And, it can help preserve your sense of being grounded."}, "H002:T031": {"id": "H002:T031", "role": "supporter", "text": "The strategy works well for me with some of my family members who seem like they will never change. But, with distraction, I enjoy them all the more."}, "H002:T032": {"id": "H002:T032", "role": "seeker", "text": "This is true, and it isn't bade advice. Haha! That is funny. Yes, maybe I should find something to carry around with me that I can enjoy."}, "H002:T033": {"id": "H002:T033", "role": "seeker", "text": "I don't really like to draw..."}, "H002:T034": {"id": "H002:T034", "role": "supporter", "text": "Is there anything else that you like to do that would be distracting while also letting you somewhat participate in the conversation?"}, "H002:T035": {"id": "H002:T035", "role": "seeker", "text": "Yes, perhaps I should just use the internet when he starts talking too much. "}, "H002:T036": {"id": "H002:T036", "role": "seeker", "text": "I have a phone."}, "H002:T037": {"id": "H002:T037", "role": "supporter", "text": "That sounds really helpful. Sometimes people also play phone games or with a fidget spinner. I like your idea of looking on the internet."}, "H002:T038": {"id": "H002:T038", "role": "seeker", "text": "This solves the problem in person, but it doesn't solve the talks over the phone, but it has been 15 minutes now and this has been helpful enough. Thank you for your solutions. You have been very supportive and kind to me"}, "H002:T039": {"id": "H002:T039", "role": "seeker", "text": "I don't want to take up any more of your time. It has been a good conversation. "}, "H002:T040": {"id": "H002:T040", "role": "supporter", "text": "You are very welcome. I wish you all the best!"}, "H002:T041": {"id": "H002:T041", "role": "seeker", "text": "Goodbye. You as well."}, "H002:T042": {"id": "H002:T042", "role": "supporter", "text": "Bye!"}, "H003:T000": {"id": "H003:T000", "role": "supporter", "text": "Hey Jimmy, it's good to hear from you. How's everything on your end?"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "Hey, not too great to be honest. I tried opening up to my friends at the gathering I hosted, but it didn't go as I hoped."}, "H003:T002": {"id": "H003:T002", "role": "supporter", "text": "I'm sorry to hear that, Jimmy. It sounds frustrating. Do you want to talk more about what happened?"}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "Yeah, I felt like I was finally ready to share some personal stuff, and it seemed like nobody wanted to listen or take it seriously."}, "H003:T004": {"id": "H003:T004", "role": "supporter", "text": "That must have been really tough, especially when you were putting yourself out there. How did you end up feeling after that?"}, "H003:T005": {"id": "H003:T005", "role": "seeker", "text": "I felt pretty down. It was like my feelings didn't matter to them, and it made me question if they really care about me."}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "It's completely understandable to feel that way. It sounds like you were looking for some support from your friends."}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "Exactly. I just wanted someone to hear me out and maybe offer some advice or comfort."}, "H003:T008": {"id": "H003:T008", "role": "supporter", "text": "Feeling dismissed by friends could be really disheartening. Have you experienced anything like this before with them?"}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "Not really. That's why it was kind of a shock. I just didn't expect it from them."}, "H003:T010": {"id": "H003:T010", "role": "supporter", "text": "That makes it even harder when it's unexpected. Was there anyone at the gathering who you felt did listen or understand?"}, "H003:T011": {"id": "H003:T011", "role": "seeker", "text": "I think one of my friends was trying, but got caught up in someone else’s conversation. It wasn’t like they ignored me on purpose."}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "It sounds like they had a lot going on at the time. But still, it's important that they realize how that affected you."}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "Yeah, I hope I can talk to them about how I felt. I'm just not sure how to bring it up without making it awkward."}, "H003:T014": {"id": "H003:T014", "role": "supporter", "text": "It's definitely a delicate subject, but expressing how you feel is also important. Maybe you could start by mentioning how much their support means to you?"}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "That's a good idea. I guess I could tell them that it would really mean a lot to me if they could be there for me when I need it."}, "H003:T016": {"id": "H003:T016", "role": "supporter", "text": "That sounds like a thoughtful way to start the conversation. Remember, real friends will want to support you when they know something's up."}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "Thanks, I really appreciate that. It helps to talk it through and feel a bit more prepared."}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "Anytime, Jimmy. I'm here for you if you need to chat more. You're doing great by taking the steps to communicate how you feel."}, "H003:T019": {"id": "H003:T019", "role": "seeker", "text": "Thanks, it means a lot. I'll let you know how it goes."}, "H004:T000": {"id": "H004:T000", "role": "supporter", "text": "Hello"}, "H004:T001": {"id": "H004:T001", "role": "seeker", "text": "Hi there I was hoping you can help me."}, "H004:T002": {"id": "H004:T002", "role": "supporter", "text": "Sure. What can I help you with?"}, "H004:T003": {"id": "H004:T003", "role": "seeker", "text": "Well you see I am heartbroken and I can't seem to move on from a previous relationship, and its been over two years. Do you have any advice?"}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "I’m understand how hard ending a relationship can be. "}, "H004:T005": {"id": "H004:T005", "role": "supporter", "text": "What do you find is the hardest thing for you each day. That is, where do you find it hardest to move on?"}, "H004:T006": {"id": "H004:T006", "role": "seeker", "text": "Well I would say mentally because I frequently think about her and constantly have memories throughout the day. Also when i hear a certain song or see a restaurant it makes me think of her."}, "H004:T007": {"id": "H004:T007", "role": "supporter", "text": "Memories are a blessing and a curse. Are the memories and thought you are  having positive or negative? "}, "H004:T008": {"id": "H004:T008", "role": "seeker", "text": "They are a mix of both because at one point they were positive and now when I think about it, it brings me down in a negative way."}, "H004:T009": {"id": "H004:T009", "role": "seeker", "text": "What have you done in the past to help you move on from a break up?"}, "H004:T010": {"id": "H004:T010", "role": "supporter", "text": "It’s hard when we have various emotions. These memories being more negative are hard to cope with. In my experience, if I rethink memories regarding relationships which tend to bring me down in way that is a learning experience, I feel more empowered. "}, "H004:T011": {"id": "H004:T011", "role": "seeker", "text": "Yeah I agree that's what I have been doing too, and it's nice to know that you do the same."}, "H004:T012": {"id": "H004:T012", "role": "supporter", "text": "In my past I have been able to try and look at each  relationship as a chance to grow. To figure out what worked with that person and what didn’t. I have them used this as a tool for the future. "}, "H004:T013": {"id": "H004:T013", "role": "seeker", "text": "That's a good way to look at it."}, "H004:T014": {"id": "H004:T014", "role": "supporter", "text": "You are making good steps to rethink the situations. Is there anything else contributing to the heat rack you still feel?"}, "H004:T015": {"id": "H004:T015", "role": "supporter", "text": "Heartbreak "}, "H004:T016": {"id": "H004:T016", "role": "seeker", "text": "Well I have also not met anyone since and fear that I will not fall in love again."}, "H004:T017": {"id": "H004:T017", "role": "supporter", "text": "That is difficult. I understand how it feels to be lonely. Something I’ve done when I’ve felt that way was to learn to fall in love with myself. I like to do self care and make time for things I might not have time for if I were in a relationship. "}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "hmm interesting I have never thought about falling in love with myself..maybe I will give it a try. Thanks."}, "H004:T019": {"id": "H004:T019", "role": "supporter", "text": "It’s so important to love yourself. Self love breeds confidence and confidence is not only attractive, but powerful in so many ways  "}, "H004:T020": {"id": "H004:T020", "role": "seeker", "text": "I appreciate the feedback and support, you have helped me take the next step to move on with my life."}, "H004:T021": {"id": "H004:T021", "role": "supporter", "text": "I’m glad I could help. You will overcome this. "}, "H004:T022": {"id": "H004:T022", "role": "seeker", "text": "Thank you and hope to talk to you again. Have a good night."}, "H004:T023": {"id": "H004:T023", "role": "supporter", "text": "You too. "}, "H005:T000": {"id": "H005:T000", "role": "seeker", "text": "Hey George, it's really good to catch up with you. How have you been?"}, "H005:T001": {"id": "H005:T001", "role": "supporter", "text": "Hey Jimmy! It's great to hear from you. I've been doing alright, just busy with work. How about you? What's been going on?"}, "H005:T002": {"id": "H005:T002", "role": "seeker", "text": "Well, things haven't been the easiest lately. I feel like I'm kind of stuck in a bit of a rut."}, "H005:T003": {"id": "H005:T003", "role": "supporter", "text": "I'm sorry to hear that. Want to talk more about what's been going on? I'm here to listen."}, "H005:T004": {"id": "H005:T004", "role": "seeker", "text": "Thanks, I really appreciate it. You know, it's been tough feeling like my friends don't take me seriously when I try to open up."}, "H005:T005": {"id": "H005:T005", "role": "supporter", "text": "That sounds frustrating and isolating. It's important to feel heard and supported. What happened?"}, "H005:T006": {"id": "H005:T006", "role": "seeker", "text": "A few weeks back, I hosted a gathering and tried talking about some things that have been on my mind, but it seemed like no one was really listening."}, "H005:T007": {"id": "H005:T007", "role": "supporter", "text": "It must have felt pretty hurtful to be ignored, especially when you needed support."}, "H005:T008": {"id": "H005:T008", "role": "seeker", "text": "Yeah, it really was. It's made me hesitant to bring up how I'm feeling again, even though I know I need to talk about it."}, "H005:T009": {"id": "H005:T009", "role": "supporter", "text": "It's understandable to feel that way after being dismissed. Have you thought about what you'd most like to share?"}, "H005:T010": {"id": "H005:T010", "role": "seeker", "text": "I guess there's a lot, but lately, I'm really worried about my job. I've been having trouble managing things because of... well, an alcohol problem."}, "H005:T011": {"id": "H005:T011", "role": "supporter", "text": "That's a big thing to carry alone. Admitting you have a problem is a significant first step. You're really brave for acknowledging it."}, "H005:T012": {"id": "H005:T012", "role": "seeker", "text": "Thanks. It took me a while to come to terms with it. I'm worried if I don't get a handle on it, I might lose my job."}, "H005:T013": {"id": "H005:T013", "role": "supporter", "text": "That concern is definitely valid. Are there specific steps you're thinking of taking to manage it?"}, "H005:T014": {"id": "H005:T014", "role": "seeker", "text": "I've actually started seeking professional help. It's scary, but I feel a bit more hopeful having someone to guide me."}, "H005:T015": {"id": "H005:T015", "role": "supporter", "text": "That’s really proactive, Jimmy. Having professional support can make a huge difference. How are you finding it so far?"}, "H005:T016": {"id": "H005:T016", "role": "seeker", "text": "It's early days, but I feel like I'm starting to understand more about why I drink the way I do. It's hard work, though."}, "H005:T017": {"id": "H005:T017", "role": "supporter", "text": "Facing these things can be intense, but it sounds like you're gaining some valuable insights. That's progress."}, "H005:T018": {"id": "H005:T018", "role": "seeker", "text": "Yeah, I guess so. It's nice to hear that from someone else, though. It reinforces that I'm doing the right thing."}, "H005:T019": {"id": "H005:T019", "role": "supporter", "text": "Absolutely, you're on the right path. Remember, it's okay to lean on friends for support too. I'm here whenever you need to talk."}, "H005:T020": {"id": "H005:T020", "role": "seeker", "text": "Thanks, George. It means a lot to have you in my corner. I'll definitely reach out more often."}, "H005:T021": {"id": "H005:T021", "role": "supporter", "text": "Anytime, Jimmy. We'll get through this together. Just take it one step at a time, and keep focusing on the positive changes you're making."}, "H006:T000": {"id": "H006:T000", "role": "supporter", "text": "Hi there, how are you doing?"}, "H006:T001": {"id": "H006:T001", "role": "seeker", "text": "IM HANGING IN THERE HOW ARE YOU?"}, "H006:T002": {"id": "H006:T002", "role": "supporter", "text": "I am okay. What would you like to talk to me about?"}, "H006:T003": {"id": "H006:T003", "role": "seeker", "text": "Well, i have a problem with drinking alcoholI am so scared my job will find out"}, "H006:T004": {"id": "H006:T004", "role": "supporter", "text": "Do you drink when you are at work?"}, "H006:T005": {"id": "H006:T005", "role": "seeker", "text": "I have started calling in atleast twice as week."}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "I have started drinking at work close to the end of my shift in the bathroom"}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "That does sound like it might be a big problem. How are  your employers reacting? "}, "H006:T008": {"id": "H006:T008", "role": "supporter", "text": "It sounds like you have a big problem that needs professional help, would you agree? "}, "H006:T009": {"id": "H006:T009", "role": "seeker", "text": "They have not mentioned anything to me yet. "}, "H006:T010": {"id": "H006:T010", "role": "supporter", "text": "I think it is likely to have been noticed though, at least. "}, "H006:T011": {"id": "H006:T011", "role": "seeker", "text": "Yes I agree it sounds like a really big problem, but what should i do?"}, "H006:T012": {"id": "H006:T012", "role": "supporter", "text": "I think the best thing would be to be really honest with your employers and ask if you can have time off for professional help. "}, "H006:T013": {"id": "H006:T013", "role": "seeker", "text": "That is a good idea"}, "H006:T014": {"id": "H006:T014", "role": "supporter", "text": "Are you employers likely to be sympathetic?"}, "H006:T015": {"id": "H006:T015", "role": "seeker", "text": "my main concern, that makes me fearful is being fired, and being the talk of the workplace"}, "H006:T016": {"id": "H006:T016", "role": "supporter", "text": "Ah people do love to idly gossip don't they? I've been through that myself. I know it's hard to ignore them but it's best to try. "}, "H006:T017": {"id": "H006:T017", "role": "seeker", "text": "My employer is an well known organization that employees over 3,000 people."}, "H006:T018": {"id": "H006:T018", "role": "supporter", "text": "I do not know if they can fire you if you have a legitimate medical problem though."}, "H006:T019": {"id": "H006:T019", "role": "supporter", "text": "Well you could always shame them if they unfairly fired you. "}, "H006:T020": {"id": "H006:T020", "role": "seeker", "text": "Very good to know that I will look into it. It did not start overnight and I don't expect it to end overnight"}, "H006:T021": {"id": "H006:T021", "role": "seeker", "text": "lol, yes that is true."}, "H006:T022": {"id": "H006:T022", "role": "seeker", "text": "Thank you so much for your time. "}, "H006:T023": {"id": "H006:T023", "role": "supporter", "text": "Large corporations are always over concerned about their images. (we have to talk for fifteen minutes :))"}, "H006:T024": {"id": "H006:T024", "role": "seeker", "text": "oh ok I thought it was just for 10 lines, lol"}, "H006:T025": {"id": "H006:T025", "role": "seeker", "text": "but none the less, there are people really going through that scenario I just portrayex"}, "H006:T026": {"id": "H006:T026", "role": "supporter", "text": "naw there's a time thing too :). Anyway, what sort of therapy do you think would be appropriate for you? "}, "H006:T027": {"id": "H006:T027", "role": "supporter", "text": "To be honest, and I mean this sincerely, I've been through it :( "}, "H006:T028": {"id": "H006:T028", "role": "seeker", "text": "I believe rehabilitative therapy would be best"}, "H006:T029": {"id": "H006:T029", "role": "supporter", "text": "It can be very expensive though. In my country you can get it for free but there's a long waiting list. "}, "H006:T030": {"id": "H006:T030", "role": "seeker", "text": "I have hads  a few drinks often but never abused it. thankfully. "}, "H006:T031": {"id": "H006:T031", "role": "seeker", "text": "Well here you might can get help for free, but it does have to be paid back"}, "H006:T032": {"id": "H006:T032", "role": "supporter", "text": "Heh be grateful :) "}, "H006:T033": {"id": "H006:T033", "role": "supporter", "text": "Are you in the US? Our healthcare system is a little less rigid here I think (UK)"}, "H006:T034": {"id": "H006:T034", "role": "seeker", "text": "Yes Im in the United States (Alabama) "}, "H006:T035": {"id": "H006:T035", "role": "seeker", "text": "I heard of the UK so many times but truthfully I know nothing about it"}, "H006:T036": {"id": "H006:T036", "role": "supporter", "text": "Ah you are a long way away from me. I hope that you do manage to sort out your problems though and definitely do talk to your employers"}, "H006:T037": {"id": "H006:T037", "role": "supporter", "text": "Ah it's quite nice here. We pay for healthcare out of our taxes so it's free at source. "}, "H006:T038": {"id": "H006:T038", "role": "seeker", "text": "I will eventually get the courage to, I know how people talk around here, especially in the South"}, "H006:T039": {"id": "H006:T039", "role": "supporter", "text": "Gossipy people are the worst. Just remind yourself that they all have skeletons in their closets too "}, "H006:T040": {"id": "H006:T040", "role": "seeker", "text": "great advice"}, "H006:T041": {"id": "H006:T041", "role": "supporter", "text": "Well anyway, I hope I have been able to offer your  some useful advice. I wish you all of the very best in the future."}, "H006:T042": {"id": "H006:T042", "role": "seeker", "text": "I think also the best thing to do is to talk to great people like you"}, "H006:T043": {"id": "H006:T043", "role": "supporter", "text": "(can you press quit first and do the survey as I am not able to do it from my side)"}, "H006:T044": {"id": "H006:T044", "role": "supporter", "text": "Well thanks :) "}, "H007:T000": {"id": "H007:T000", "role": "seeker", "text": "im depressed and angry"}, "H007:T001": {"id": "H007:T001", "role": "supporter", "text": "why would you say that?"}, "H007:T002": {"id": "H007:T002", "role": "seeker", "text": "i really want a drink"}, "H007:T003": {"id": "H007:T003", "role": "supporter", "text": "is there anything I can help you with?"}, "H007:T004": {"id": "H007:T004", "role": "seeker", "text": "i'm an alcoholic"}, "H007:T005": {"id": "H007:T005", "role": "supporter", "text": "do you think a drink will help you?"}, "H007:T006": {"id": "H007:T006", "role": "seeker", "text": "Just had a stressful day. depressed because if i go get a beer i wont stop"}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "no i guess it wouldnt. "}, "H007:T008": {"id": "H007:T008", "role": "seeker", "text": "it still sucks. i want to be normal lol"}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "i get that thought in my head and its like i become obsessed"}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "why not try to put attention in some other things instead of a beer"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "hmmm like what?"}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "its only in your mind "}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "i hate my mind"}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "like working out? it will give you a lot of benefits especially with your health"}, "H007:T015": {"id": "H007:T015", "role": "supporter", "text": "you can do it!"}, "H007:T016": {"id": "H007:T016", "role": "seeker", "text": "i actually was thinking of starting again. i did about 15 min this morning"}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "i used to workout like 2 hours a day lol"}, "H007:T018": {"id": "H007:T018", "role": "seeker", "text": "thank you"}, "H007:T019": {"id": "H007:T019", "role": "supporter", "text": "oh that's nice"}, "H007:T020": {"id": "H007:T020", "role": "supporter", "text": "youre welcome!"}, "H007:T021": {"id": "H007:T021", "role": "seeker", "text": "i actually just switched from beachbody to les mills"}, "H007:T022": {"id": "H007:T022", "role": "seeker", "text": "i got bored with beachb body workouts lol"}, "H007:T023": {"id": "H007:T023", "role": "seeker", "text": "having something different is nice"}, "H007:T024": {"id": "H007:T024", "role": "supporter", "text": "of course you can try different things"}, "H007:T025": {"id": "H007:T025", "role": "seeker", "text": "i got on a sweet tooth. which i'm mad at myself for lol"}, "H007:T026": {"id": "H007:T026", "role": "seeker", "text": "i sued to never eat candy and junk food. the past few weeks...ugh"}, "H007:T027": {"id": "H007:T027", "role": "supporter", "text": "just do it with moderation, don't be mad at youself"}, "H007:T028": {"id": "H007:T028", "role": "seeker", "text": "ive always been really hard on myself, i dont know why"}, "H007:T029": {"id": "H007:T029", "role": "supporter", "text": "we all want to eat sweets "}, "H007:T030": {"id": "H007:T030", "role": "seeker", "text": "lol"}, "H007:T031": {"id": "H007:T031", "role": "supporter", "text": "no, don't be like that you know you have to love youself"}, "H007:T032": {"id": "H007:T032", "role": "seeker", "text": "maybe i should make some tea tonight"}, "H007:T033": {"id": "H007:T033", "role": "seeker", "text": "i knowi have to love myself. i just cant figure out how lol"}, "H007:T034": {"id": "H007:T034", "role": "supporter", "text": "hope I help you somehow"}, "H007:T035": {"id": "H007:T035", "role": "seeker", "text": "honestly it was good getting stuff off my chest. i appreciate you listening"}, "H007:T036": {"id": "H007:T036", "role": "supporter", "text": "of course, just be confident of yourself and most of all appreciate yourself, I think it will help"}, "H007:T037": {"id": "H007:T037", "role": "seeker", "text": "Thank you. That is good advice. I appreciate it, and I hope you haave a good evening or night, wherever you are :)"}, "H008:T000": {"id": "H008:T000", "role": "supporter", "text": "Hey Jimmy, good to hear from you. How have you been doing lately?"}, "H008:T001": {"id": "H008:T001", "role": "seeker", "text": "Hi George. I've been okay, I guess. It's been a bit of a rollercoaster recently."}, "H008:T002": {"id": "H008:T002", "role": "supporter", "text": "I get that. You've had a lot on your plate. What's been going on?"}, "H008:T003": {"id": "H008:T003", "role": "seeker", "text": "Well, I went to an Alcoholics Anonymous meeting for the first time yesterday."}, "H008:T004": {"id": "H008:T004", "role": "supporter", "text": "That's a huge step, Jimmy. I'm really proud of you for taking it. How did it feel?"}, "H008:T005": {"id": "H008:T005", "role": "seeker", "text": "Intimidating, honestly. Walking in there, not knowing anyone, feeling vulnerable... it wasn't easy."}, "H008:T006": {"id": "H008:T006", "role": "supporter", "text": "I can only imagine how tough that must have been. But you did it, and that says a lot about your courage."}, "H008:T007": {"id": "H008:T007", "role": "seeker", "text": "Thanks, George. I kept thinking about that day at the gathering when I tried to talk to everyone but felt ignored."}, "H008:T008": {"id": "H008:T008", "role": "supporter", "text": "I remember you mentioning that. It must've been so frustrating to feel unheard by people you consider friends."}, "H008:T009": {"id": "H008:T009", "role": "seeker", "text": "Yeah, it was. I guess that's part of why I pushed myself to try something different, like the AA meeting."}, "H008:T010": {"id": "H008:T010", "role": "supporter", "text": "That makes sense. It sounds like you’re finding new ways to address things that were weighing you down."}, "H008:T011": {"id": "H008:T011", "role": "seeker", "text": "Yeah, I hope so. I just worry about the process, you know? What if I can't handle it?"}, "H008:T012": {"id": "H008:T012", "role": "supporter", "text": "It's normal to feel that way, Jimmy. Recovery is a journey, not a sprint. It's okay to have doubts."}, "H008:T013": {"id": "H008:T013", "role": "seeker", "text": "I appreciate that. I do want to keep going, but the fear of failing is there."}, "H008:T014": {"id": "H008:T014", "role": "supporter", "text": "Fear is natural, but remember you've already taken the first step. You have the support to go through this."}, "H008:T015": {"id": "H008:T015", "role": "seeker", "text": "Thanks, that helps. The people at the meeting were welcoming, which made a difference."}, "H008:T016": {"id": "H008:T016", "role": "supporter", "text": "That's really good to hear. It's important to feel supported and understood in a group like that."}, "H008:T017": {"id": "H008:T017", "role": "seeker", "text": "Yeah, it felt different from trying to talk with my current friends. I think I need this new beginning."}, "H008:T018": {"id": "H008:T018", "role": "supporter", "text": "It sounds like you're on the right path, Jimmy. I'm here for you, whatever you need."}, "H008:T019": {"id": "H008:T019", "role": "seeker", "text": "That really means a lot to me, George. Thanks for being there."}, "H009:T000": {"id": "H009:T000", "role": "supporter", "text": "Hey Jimmy, it's good to hear from you. How have the AA meetings been going?"}, "H009:T001": {"id": "H009:T001", "role": "seeker", "text": "Hey there. Well, surprisingly, they've been quite helpful. I met someone there, Bob, who's kind of going through the same issues."}, "H009:T002": {"id": "H009:T002", "role": "supporter", "text": "That's great to hear. It must feel nice to have someone who truly understands what you're going through."}, "H009:T003": {"id": "H009:T003", "role": "seeker", "text": "Yeah, definitely. It feels different from when I talked to my other friends. They just didn't get it, you know?"}, "H009:T004": {"id": "H009:T004", "role": "supporter", "text": "I remember you mentioned feeling dismissed by them before. It sounds like finding someone who empathizes really makes a difference."}, "H009:T005": {"id": "H009:T005", "role": "seeker", "text": "Exactly. With Bob, I don't feel judged. We can share our stories, and it's like this unspoken bond."}, "H009:T006": {"id": "H009:T006", "role": "supporter", "text": "That unspoken understanding can be so powerful. Have you been able to open up more because of it?"}, "H009:T007": {"id": "H009:T007", "role": "seeker", "text": "A bit. It's scary, but I’ve been sharing more of my feelings, and it feels freeing somehow. The fear of being judged or not being taken seriously is starting to fade."}, "H009:T008": {"id": "H009:T008", "role": "supporter", "text": "That sounds like real progress, Jimmy. Have you felt any changes in your day-to-day life since attending these meetings?"}, "H009:T009": {"id": "H009:T009", "role": "seeker", "text": "Yeah, definitely. I've started to recognize some patterns in my behavior and why I turned to alcohol. It's frightening to see, but it’s the first step, I guess."}, "H009:T010": {"id": "H009:T010", "role": "supporter", "text": "Acknowledging those patterns is a huge step. It's brave of you to face those issues head-on."}, "H009:T011": {"id": "H009:T011", "role": "seeker", "text": "Thanks. I just sometimes worry if I’m too late, you know? That I might lose everything."}, "H009:T012": {"id": "H009:T012", "role": "supporter", "text": "It's normal to feel that way, but you’re taking action now, and that’s important. It's never too late to make a change."}, "H009:T013": {"id": "H009:T013", "role": "seeker", "text": "Yeah, you're right. I guess I just have to keep reminding myself of that."}, "H009:T014": {"id": "H009:T014", "role": "supporter", "text": "Absolutely. And remember, you're not alone in this. Bob and others at AA are there for you, and so am I."}, "H009:T015": {"id": "H009:T015", "role": "seeker", "text": "I appreciate that. It's comforting to have a supportive net. I need to hold onto that."}, "H009:T016": {"id": "H009:T016", "role": "supporter", "text": "You're building a strong foundation, Jimmy. Just keep taking it one day at a time."}, "H009:T017": {"id": "H009:T017", "role": "seeker", "text": "Thanks. It helps to break it down like that. I’ll try to focus on each day and not get overwhelmed."}, "H009:T018": {"id": "H009:T018", "role": "supporter", "text": "That sounds like a solid plan. You've got this, Jimmy. Remember, progress is progress, no matter how small."}, "H009:T019": {"id": "H009:T019", "role": "seeker", "text": "Thanks a lot. Your words mean a lot to me right now. I’ll keep them in mind."}, "H009:T020": {"id": "H009:T020", "role": "supporter", "text": "Anytime. I'm here whenever you need to talk. Keep me posted on how things go, okay?"}, "H009:T021": {"id": "H009:T021", "role": "seeker", "text": "I will. Thanks again, really. I'll talk to you soon."}, "H010:T000": {"id": "H010:T000", "role": "supporter", "text": "Hey Jimmy, how are you doing today?"}, "H010:T001": {"id": "H010:T001", "role": "seeker", "text": "Hey. It's been a rough day, to be honest."}, "H010:T002": {"id": "H010:T002", "role": "supporter", "text": "I'm here for you. Do you want to talk about it?"}, "H010:T003": {"id": "H010:T003", "role": "seeker", "text": "Thanks. Yeah, I had a disagreement with my manager at work today."}, "H010:T004": {"id": "H010:T004", "role": "supporter", "text": "That sounds frustrating. What happened?"}, "H010:T005": {"id": "H010:T005", "role": "seeker", "text": "We didn't see eye to eye on what should be prioritized. It just made me anxious."}, "H010:T006": {"id": "H010:T006", "role": "supporter", "text": "Conflict like that can be really stressful. Did you get a chance to express your perspective?"}, "H010:T007": {"id": "H010:T007", "role": "seeker", "text": "I tried, but it felt like he wasn't really listening. It reminded me of when I felt ignored by friends before."}, "H010:T008": {"id": "H010:T008", "role": "supporter", "text": "I remember you sharing that experience at the gathering you hosted. It's tough feeling sidelined."}, "H010:T009": {"id": "H010:T009", "role": "seeker", "text": "Exactly. It feels like no matter where I turn, I'm not being heard."}, "H010:T010": {"id": "H010:T010", "role": "supporter", "text": "It's disheartening when communication doesn't feel effective. Have you been able to talk to anyone else about this?"}, "H010:T011": {"id": "H010:T011", "role": "seeker", "text": "I did mention it to my new friend from the AA meetings. It helps having someone who gets the struggle."}, "H010:T012": {"id": "H010:T012", "role": "supporter", "text": "It's great that you have that connection. How are things going with AA?"}, "H010:T013": {"id": "H010:T013", "role": "seeker", "text": "It's been eye-opening and comforting, but the work stress isn't helping."}, "H010:T014": {"id": "H010:T014", "role": "supporter", "text": "Balancing everything can be challenging. Would you consider discussing this with your manager again with maybe different strategies in mind?"}, "H010:T015": {"id": "H010:T015", "role": "seeker", "text": "I've thought about it. Maybe writing down my points beforehand could help."}, "H010:T016": {"id": "H010:T016", "role": "supporter", "text": "That sounds like a solid plan. It might help make sure you’re heard."}, "H010:T017": {"id": "H010:T017", "role": "seeker", "text": "Thanks. I just need to find the courage to approach him again."}, "H010:T018": {"id": "H010:T018", "role": "supporter", "text": "You have that courage, Jimmy. Remember how you stepped up to attend those AA meetings?"}, "H010:T019": {"id": "H010:T019", "role": "seeker", "text": "Yeah, you're right. If I did that, I can do this too."}, "H010:T020": {"id": "H010:T020", "role": "supporter", "text": "Absolutely. You're stronger than you realize. I'm here to back you."}, "H010:T021": {"id": "H010:T021", "role": "seeker", "text": "Thanks for saying that. It means a lot."}, "H010:T022": {"id": "H010:T022", "role": "supporter", "text": "Anytime. Let me know how it goes, okay?"}, "H010:T023": {"id": "H010:T023", "role": "seeker", "text": "I will. Thanks again for listening."}, "H010:T024": {"id": "H010:T024", "role": "supporter", "text": "Always here for you, Jimmy. Take care."}, "H011:T000": {"id": "H011:T000", "role": "supporter", "text": "Hey Jimmy, how are you holding up today?"}, "H011:T001": {"id": "H011:T001", "role": "seeker", "text": "Honestly, not too good. Just got hit with a job performance warning, and it's stressing me out."}, "H011:T002": {"id": "H011:T002", "role": "supporter", "text": "I'm really sorry to hear that. That sounds incredibly tough. Do you want to talk more about what led to it?"}, "H011:T003": {"id": "H011:T003", "role": "seeker", "text": "Yeah...it's mostly my attendance. You know how work has been, with the disagreements and stress?"}, "H011:T004": {"id": "H011:T004", "role": "supporter", "text": "I remember you mentioning some tens
