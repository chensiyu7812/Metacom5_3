st be really hard to see her go through this. How is she doing now?"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "She's stable now, thankfully. But every time she has an episode, it takes a toll on us, especially Margaret."}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "I'm relieved to hear Emily is stable. The stress must be immense for you both. What's been the most difficult part?"}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "I think it's the feeling of helplessness. We do everything we can, but it feels like we're just waiting for the next attack."}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "That sounds overwhelming, Charles. Feeling helpless is tough. Have you found anything that helps ease that feeling, even a little?"}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "Talking to someone helps a bit. And knowing we're following the doctor’s advice, but the uncertainty lingers."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "It's good that you're reaching out and following medical guidance. It's okay to feel uncertain; anyone would in your shoes."}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "Thanks, I appreciate that. Margaret tries to be strong for Emily, but I can see it's wearing her down too."}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "Margaret sounds like a wonderful mother, but it's important for both of you to care for yourselves too. How are you supporting each other?"}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "We're trying to talk things out and give each other breaks. It's a work in progress."}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "That's a healthy approach. It's so important to lean on each other and take things one day at a time."}, "H005:T013": {"id": "H005:T013", "role": "seeker", "text": "Yeah, some days are better than others. Getting back to a routine helps, but the worry is constant."}, "H005:T014": {"id": "H005:T014", "role": "supporter", "text": "That constant worry must be exhausting. Do you have any outlets or activities to help manage it?"}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "I try to go for a run in the mornings. It's not much, but it clears my head for a bit."}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "Exercise is great for stress relief. Even small moments of peace are valuable. You're doing your best, and that matters."}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "Thank you. It's good to hear that. It's just hard not to feel guilty for needing time away."}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "Taking care of yourself isn't selfish; it's necessary. Being at your best helps you support Emily and Margaret even better."}, "H005:T019": {"id": "H005:T019", "role": "seeker", "text": "You're right. I need to remember that. It's a delicate balance, but we're getting there."}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "It sounds like you and Margaret are doing an incredible job under tough circumstances. Keep leaning on each other. You're not alone."}, "H005:T021": {"id": "H005:T021", "role": "seeker", "text": "Thanks for listening. It really helps to talk things out and know someone understands."}, "H005:T022": {"id": "H005:T022", "role": "supporter", "text": "Anytime, Charles. I'm here whenever you need to talk. You're doing great, just keep taking those steps forward."}, "H006:T000": {"id": "H006:T000", "role": "seeker", "text": "Hey, are you free to chat for a bit?"}, "H006:T001": {"id": "H006:T001", "role": "supporter", "text": "Of course, Charles. What's on your mind?"}, "H006:T002": {"id": "H006:T002", "role": "seeker", "text": "Just had a really tough argument with Margaret, and it's weighing on me heavily."}, "H006:T003": {"id": "H006:T003", "role": "supporter", "text": "I'm sorry to hear that. Arguments are never easy. Do you want to share more about it?"}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "Sure. It was about our current financial situation. We both ended up saying things we didn't mean."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "That sounds really stressful. It's understandable to have heated moments when financial pressures are at play. How are you feeling about everything?"}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "I'm feeling quite overwhelmed. Between the pay cut at work and the threat of layoffs, I can't seem to see a way out."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "It's completely natural to feel overwhelmed in this situation. You're carrying a lot on your shoulders right now."}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "Yeah, and with Emily's health scare a while back, things just feel like they're piling up."}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "You've been through a lot recently, worrying about Emily's health and now work pressures. It's a lot for anyone to handle."}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "I just don't know how to support Margaret through all this when I’m struggling myself."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "That must be challenging. It can be hard to support others when you're feeling stretched thin. Have you been able to discuss your feelings with Margaret?"}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "Not really. I guess I'm afraid of saying something wrong or making things worse."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "It's understandable to feel that way. Maybe trying to share your feelings without blaming or escalating can help. It might make a difference."}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "I'll try that. It's just hard when emotions are running so high."}, "H006:T015": {"id": "H006:T015", "role": "supporter", "text": "Emotions can definitely complicate things. But acknowledging them is a step forward. Remember you're not alone in this."}, "H006:T016": {"id": "H006:T016", "role": "seeker", "text": "Thanks. I think I just needed to get it all off my chest."}, "H006:T017": {"id": "H006:T017", "role": "supporter", "text": "Always here to listen, Charles. You're doing the best you can, and that counts for a lot."}, "H006:T018": {"id": "H006:T018", "role": "seeker", "text": "I appreciate it. I'll try talking to her again when things have calmed down. Thanks for listening."}, "H006:T019": {"id": "H006:T019", "role": "supporter", "text": "That sounds like a good plan. Take care, and reach out whenever you need to."}, "H007:T000": {"id": "H007:T000", "role": "seeker", "text": "Hey, can we chat for a bit? Things have been really overwhelming lately."}, "H007:T001": {"id": "H007:T001", "role": "supporter", "text": "Of course, Charles. I’m here for you. What’s been going on?"}, "H007:T002": {"id": "H007:T002", "role": "seeker", "text": "It’s about my dad. He recently had a health scare, and it’s making me feel really conflicted."}, "H007:T003": {"id": "H007:T003", "role": "supporter", "text": "I’m sorry to hear that. That must be really tough given everything that's happened between you two."}, "H007:T004": {"id": "H007:T004", "role": "seeker", "text": "Yeah, we hadn't spoken in two years. The fight we had over something material seems so trivial now."}, "H007:T005": {"id": "H007:T005", "role": "supporter", "text": "It’s understandable, especially when faced with something as serious as a health scare. Have you been able to reconnect with him at all?"}, "H007:T006": {"id": "H007:T006", "role": "seeker", "text": "I did. I reached out to him, and although it was awkward at first, it felt good to talk."}, "H007:T007": {"id": "H007:T007", "role": "supporter", "text": "That's a big step, Charles. It takes a lot of courage to reach out and mend things when emotions are high."}, "H007:T008": {"id": "H007:T008", "role": "seeker", "text": "Thanks. I just wish it didn't take something like this to make me realize it."}, "H007:T009": {"id": "H007:T009", "role": "supporter", "text": "It's a natural feeling. Sometimes it takes major events to bring perspective. How is your dad doing now?"}, "H007:T010": {"id": "H007:T010", "role": "seeker", "text": "He’s stable now, but the incident still lingers in my mind. I keep worrying about what could’ve happened."}, "H007:T011": {"id": "H007:T011", "role": "supporter", "text": "It's understandable to have those fears. Given your past and the current stresses you're under, it can heighten anxieties."}, "H007:T012": {"id": "H007:T012", "role": "seeker", "text": "Exactly. And with Emily’s hospitalization recently, it just feels like everything is piling on."}, "H007:T013": {"id": "H007:T013", "role": "supporter", "text": "That’s a lot for anyone to handle. You’ve been strong for your family through these times."}, "H007:T014": {"id": "H007:T014", "role": "seeker", "text": "I try to be. With all the financial pressures and Margaret losing her job, I feel like I’m constantly on edge."}, "H007:T015": {"id": "H007:T015", "role": "supporter", "text": "It’s important to acknowledge how much you’ve been managing. Have you had a chance to talk to Margaret about how you’re feeling?"}, "H007:T016": {"id": "H007:T016", "role": "seeker", "text": "Yes, we’ve had our talks. It was heated at times, but I think we’re slowly getting to a better understanding."}, "H007:T017": {"id": "H007:T017", "role": "supporter", "text": "That’s promising. It shows the resilience in your relationship and the commitment to work through these challenges together."}, "H007:T018": {"id": "H007:T018", "role": "seeker", "text": "Thank you for saying that. I really hope we come out stronger from all this."}, "H007:T019": {"id": "H007:T019", "role": "supporter", "text": "With the steps you’re taking, I have faith you will. Be sure to take care of yourself, too. You're important in this equation."}, "H007:T020": {"id": "H007:T020", "role": "seeker", "text": "I’ll try. Having this conversation definitely helps. I appreciate you being there."}, "H007:T021": {"id": "H007:T021", "role": "supporter", "text": "Anytime, Charles. Remember, you’re not alone in this. Feel free to reach out whenever you need to talk."}, "H008:T000": {"id": "H008:T000", "role": "seeker", "text": "Hey, do you have a moment to chat? Things have been piling up lately."}, "H008:T001": {"id": "H008:T001", "role": "supporter", "text": "Of course, Charles. I'm here for you. What's been going on?"}, "H008:T002": {"id": "H008:T002", "role": "seeker", "text": "Well, it's been quite a rollercoaster. Margaret recently found a part-time teaching job which is a relief, but I'm still feeling overwhelmed."}, "H008:T003": {"id": "H008:T003", "role": "supporter", "text": "It sounds like there's been a lot to handle. Margaret's new job is definitely a positive change. What's been overwhelming you the most?"}, "H008:T004": {"id": "H008:T004", "role": "seeker", "text": "With everything happening at work, and previously with Emily's health, and then my dad's health scare... It's just a lot to process."}, "H008:T005": {"id": "H008:T005", "role": "supporter", "text": "It seems like there's a lot of worry about those you care for. It's understandable to feel overwhelmed. How have you been managing with your work situation?"}, "H008:T006": {"id": "H008:T006", "role": "seeker", "text": "The pay cut and rumors of layoffs have been hanging over my head. It's hard not to think about it constantly, especially being the main provider."}, "H008:T007": {"id": "H008:T007", "role": "supporter", "text": "That kind of uncertainty is really tough, especially when you're supporting your family. Have you found any ways to cope with the stress?"}, "H008:T008": {"id": "H008:T008", "role": "seeker", "text": "I've tried to stay busy and focus on small things, but it's hard when there's always another worry around the corner."}, "H008:T009": {"id": "H008:T009", "role": "supporter", "text": "Taking one step at a time can help, even if it feels slow. I'm here to listen when things feel too heavy."}, "H008:T010": {"id": "H008:T010", "role": "seeker", "text": "Thank you. It helps to talk about it. I just feel like I need to be strong for everyone, especially after going through tough times recently."}, "H008:T011": {"id": "H008:T011", "role": "supporter", "text": "It's a lot for one person to carry. Remember that it's okay to lean on others for support too. How have things been with your father?"}, "H008:T012": {"id": "H008:T012", "role": "seeker", "text": "We've had some strained moments, especially after that health scare. I haven't been in touch as much as I'd like."}, "H008:T013": {"id": "H008:T013", "role": "supporter", "text": "Reconnecting can be difficult, especially when life is so busy. What do you think would help moving forward with him?"}, "H008:T014": {"id": "H008:T014", "role": "seeker", "text": "I think I just need to make the effort, maybe visit him soon. It's just hard balancing everything."}, "H008:T015": {"id": "H008:T015", "role": "supporter", "text": "Putting aside a bit of time could make a big difference, both for you and your father. Sometimes reconnecting can bring unexpected relief."}, "H008:T016": {"id": "H008:T016", "role": "seeker", "text": "You're right. It just feels daunting at times. But I don't want distance to be there anymore."}, "H008:T017": {"id": "H008:T017", "role": "supporter", "text": "Your willingness to reach out shows how much you care. It's clear how deeply you value your relationships."}, "H008:T018": {"id": "H008:T018", "role": "seeker", "text": "Thanks for saying that. I guess it's just about taking one day at a time and not losing sight of what matters."}, "H008:T019": {"id": "H008:T019", "role": "supporter", "text": "Absolutely, Charles. Taking things day by day and focusing on what's important can help you find your way through."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hey, I really needed to talk to someone today."}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Of course, Charles. I’m here for you. What’s on your mind?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "I just got the news today that I’m losing my job. It's really shaken me."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "I’m so sorry to hear that. It must be incredibly tough. How do you feel about it all?"}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "I feel lost, to be honest. The financial pressures were already hard on us, and now without my income, I don’t know how we’ll manage."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "That’s a lot to handle, especially after everything you’ve been dealing with recently. It's completely understandable to feel overwhelmed."}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "Yeah, and I’m worried about telling Margaret. She’s just started feeling stable with her new job, and I don’t want to add more stress."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "It's commendable that you’re thinking about her feelings, but you're in this together. Sometimes sharing burdens can make them a bit easier to bear."}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "That's true. I just hate the idea of disappointing her or my daughter Emily. They rely on me so much."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "It sounds like you feel a deep sense of responsibility for your family. And it’s okay to feel that way, but remember you’re human too."}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "I know. I've been telling myself I have to be the strong one ever since Emily was in the hospital. Every issue seems bigger now."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "You've been strong through a lot of stressful situations, Charles. Taking care of yourself is also a part of being strong for your family."}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "You're right. I haven't really been taking the time to address how I'm feeling. I've just been pushing it aside."}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "Would it help to talk about what lies ahead? Maybe work through some practical steps or support you might need?"}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "That might help. I guess the first step is talking to Margaret, although I feel so anxious."}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "It's natural to feel anxious, but you have a strong partnership. She might have solutions or support to offer, and being open can strengthen your relationship."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "She’s been my rock through all of this. I do trust her, and I need to remember that."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "Trust is so important, and it seems like you’ve both navigated many challenges together before. Remember, you’re not alone in this."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "Thank you for the reminder. Even when things feel heavy, it’s good to know I have people I can turn to."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "Always, Charles. Reaching out today was a brave step, and I hope it’s provided some clarity or solace."}, "H009:T020": {"id": "H009:T020", "role": "seeker", "text": "It has, more than I expected. I’ll try to take things one day at a time and lean on my support system when I need to."}, "H009:T021": {"id": "H009:T021", "role": "supporter", "text": "Absolutely. Take it step by step, and remember, I'm here whenever you need to talk."}, "H010:T000": {"id": "H010:T000", "role": "seeker", "text": "Hey, just needed someone to talk to. It's been a rough week."}, "H010:T001": {"id": "H010:T001", "role": "supporter", "text": "I'm here for you, Charles. What's been going on?"}, "H010:T002": {"id": "H010:T002", "role": "seeker", "text": "My dad passed away unexpectedly last week."}, "H010:T003": {"id": "H010:T003", "role": "supporter", "text": "Oh, Charles, I'm really sorry to hear that. That's incredibly tough."}, "H010:T004": {"id": "H010:T004", "role": "seeker", "text": "Yeah, it really is. We hadn't spoken in a while, and now I can't get that time back."}, "H010:T005": {"id": "H010:T005", "role": "supporter", "text": "It's understandable to have those feelings of regret. It's hard when things don't feel resolved."}, "H010:T006": {"id": "H010:T006", "role": "seeker", "text": "I keep thinking about our last conversation, it didn't end well and I never reached out after that."}, "H010:T007": {"id": "H010:T007", "role": "supporter", "text": "Do you want to share what happened during that conversation?"}, "H010:T008": {"id": "H010:T008", "role": "seeker", "text": "We argued about money, like always. It just seemed trivial then, but now I wish I'd chosen to mend things instead."}, "H010:T009": {"id": "H010:T009", "role": "supporter", "text": "It sounds like you're really carrying a heavy burden. It's hard to see the importance of reconciliation until it's too late sometimes."}, "H010:T010": {"id": "H010:T010", "role": "seeker", "text": "Exactly. And now with everything else going on, it feels like I'm drowning in guilt and stress."}, "H010:T011": {"id": "H010:T011", "role": "supporter", "text": "It's okay to feel overwhelmed, especially given everything that's happened with your job and Emily's health."}, "H010:T012": {"id": "H010:T012", "role": "seeker", "text": "I keep replaying all the things I could've done differently. It distracts you, you know?"}, "H010:T013": {"id": "H010:T013", "role": "supporter", "text": "That's completely normal after a loss. You wish you could go back and change things."}, "H010:T014": {"id": "H010:T014", "role": "seeker", "text": "Yes. And now I have to arrange everything for the funeral, and it's just adding to the stress."}, "H010:T015": {"id": "H010:T015", "role": "supporter", "text": "That's a big responsibility. Have you had any support from Margaret or the rest of your family?"}, "H010:T016": {"id": "H010:T016", "role": "seeker", "text": "Margaret has been supportive, but we’re still trying to manage our own issues. It's been tough on both of us."}, "H010:T017": {"id": "H010:T017", "role": "supporter", "text": "I imagine it's difficult balancing everything right now. But remember that you don't have to handle everything alone."}, "H010:T018": {"id": "H010:T018", "role": "seeker", "text": "I appreciate that. I just need to find a way to get through the funeral without breaking down."}, "H010:T019": {"id": "H010:T019", "role": "supporter", "text": "You're stronger than you think, Charles. It's okay to lean on the people who care about you during this time."}, "H010:T020": {"id": "H010:T020", "role": "seeker", "text": "I'll try. It helps to know that I can talk things through with you."}, "H010:T021": {"id": "H010:T021", "role": "supporter", "text": "Anytime you need to talk, I'm here. You're not alone in this, Charles."}, "H011:T000": {"id": "H011:T000", "role": "seeker", "text": "Hey, I could really use someone to talk to right now."}, "H011:T001": {"id": "H011:T001", "role": "supporter", "text": "Of course, Charles. I'm here for you. What's been going on?"}, "H011:T002": {"id": "H011:T002", "role": "seeker", "text": "It's just been a whirlwind ever since... There's been a lot on my mind."}, "H011:T003": {"id": "H011:T003", "role": "supporter", "text": "It sounds heavy. Do you want to talk about it?"}, "H011:T004": {"id": "H011:T004", "role": "seeker", "text": "I just found out about an inheritance from my father, and it's mixing up a lot of feelings."}, "H011:T005": {"id": "H011:T005", "role": "supporter", "text": "That sounds really complex. What kind of feelings are coming up for you?"}, "H011:T006": {"id": "H011:T006", "role": "seeker", "text": "I feel guilty, mostly. We had so many unresolved issues, and now I have this money, but it doesn’t feel right."}, "H011:T007": {"id": "H011:T007", "role": "supporter", "text": "It's understandable to have mixed emotions, especially after losing someone you had unresolved issues with."}, "H011:T008": {"id": "H011:T008", "role": "seeker", "text": "Exactly. I wish we'd talked more before he passed. Now it's too late."}, "H011:T009": {"id": "H011:T009", "role": "supporter", "text": "That regret is a tough burden to bear. Have you thought about how you might want to honor his memory?"}, "H011:T010": {"id": "H011:T010", "role": "seeker", "text": "I have, but it's hard to focus with everything else going on—Emily's health, the financial problems."}, "H011:T011": {"id": "H011:T011", "role": "supporter", "text": "You're dealing with a lot, Charles. It's okay to feel overwhelmed with so many things happening at once."}, "H011:T012": {"id": "H011:T012", "role": "seeker", "text": "Thank you. It just feels like as soon as I handle one issue, another one pops up."}, "H011:T013": {"id": "H011:T013", "role": "supporter", "text": "It must be exhausting. How are you and Margaret navigating this together?"}, "H011:T014": {"id": "H011:T014", "role": "seeker", "text": "We've been trying to support each other. Her new job helps, but I know she's stressed too."}, "H011:T015": {"id": "H011:T015", "role": "supporter", "text": "It sounds like you're both doing your best to manage. It's important to lean on each other during tough times."}, "H011:T016": {"id": "H011:T016", "role": "seeker", "text": "We are. Just last week, we sat down to talk about everything. It felt good, but I still worry."}, "H011:T017": {"id": "H011:T017", "role": "supporter", "text": "That's a positive step, Charles. Staying open about your feelings with her can help both of you cope."}, "H011:T018": {"id": "H011:T018", "role": "seeker", "text": "True. Having this conversation with you also helps clear my head a bit."}, "H011:T019": {"id": "H011:T019", "role": "supporter", "text": "I'm glad I can be here for you. It's important to reach out and share what’s weighing on your heart."}, "H011:T020": {"id": "H011:T020", "role": "seeker", "text": "I appreciate it. Maybe I can start thinking more clearly about the inheritance and how to use it properly."}, "H011:T021": {"id": "H011:T021", "role": "supporter", "text": "That sounds like a good plan. When you're ready, considering your father’s values might help guide your decision."}, "H011:T022": {"id": "H011:T022", "role": "seeker", "text": "I think he'd want it to go towards the family, maybe Emily’s future or something meaningful."}, "H011:T023": {"id": "H011:T023", "role": "supporter", "text": "That's a wonderful thought. Taking those steps when you're ready can also be part of healing."}, "H011:T024": {"id": "H011:T024", "role": "seeker", "text": "Yeah, small steps. Thanks for listening and helping me sort through all this."}, "H011:T025": {"id": "H011:T025", "role": "supporter", "text": "Anytime, Charles. Remember, you're not alone in this."}, "H012:T000": {"id": "H012:T000", "role": "seeker", "text": "Hey, I'm back again. Things have been a bit heavy."}, "H012:T001": {"id": "H012:T001", "role": "supporter", "text": "Hi Charles, it's good to hear from you. I remember you mentioning things were tough last time. How have you been feeling recently?"}, "H012:T002": {"id": "H012:T002", "role": "seeker", "text": "Well, Margaret suggested I try therapy. At first, I was hesitant, but it has helped somewhat."}, "H012:T003": {"id": "H012:T003", "role": "supporter", "text": "That’s great to hear! It's a big step towards taking care of yourself. What’s been the most helpful part of therapy for you so far?"}, "H012:T004": {"id": "H012:T004", "role": "seeker", "text": "I think being able to talk openly about my dad has helped. The guilt and regret have been hard to manage."}, "H012:T005": {"id": "H012:T005", "role": "supporter", "text": "Losing someone is never easy, especially when there are unresolved feelings. It's important to allow yourself to grieve and express those emotions. How’s it been opening up about that in therapy?"}, "H012:T006": {"id": "H012:T006", "role": "seeker", "text": "It was difficult at first, but slowly I'm learning to process the regret without letting it consume me."}, "H012:T007": {"id": "H012:T007", "role": "supporter", "text": "It sounds like you’re making progress, even if it’s just small steps. How's the family been through all of this?"}, "H012:T008": {"id": "H012:T008", "role": "seeker", "text": "Emily's health seems a bit better, which is a relief, but I still worry a lot. Margaret has been a rock, but I know she’s stressed too."}, "H012:T009": {"id": "H012:T009", "role": "supporter", "text": "It must be a relief for Emily to be doing better. You both have been through so much. Do you feel that the therapy is helping you manage your anxiety as well?"}, "H012:T010": {"id": "H012:T010", "role": "seeker", "text": "Yeah, somewhat. I’m realizing how much pressure I’ve put on myself. It's just hard to shake off the feeling that I need to fix everything."}, "H012:T011": {"id": "H012:T011", "role": "supporter", "text": "That’s a lot to carry, feeling responsible for everyone and everything. But it's also important to acknowledge you’re doing your best and that's enough."}, "H012:T012": {"id": "H012:T012", "role": "seeker", "text": "Margaret keeps reminding me of that too. It’s still a work in progress for me."}, "H012:T013": {"id": "H012:T013", "role": "supporter", "text": "It helps to have someone remind you that you’re not alone in this. Have you and Margaret had the chance to talk about how you're both coping?"}, "H012:T014": {"id": "H012:T014", "role": "seeker", "text": "We've been talking more, which is nice. She's really been supportive despite everything."}, "H012:T015": {"id": "H012:T015", "role": "supporter", "text": "It sounds like you two make a strong team. It’s important to lean on each other, especially in times like these."}, "H012:T016": {"id": "H012:T016", "role": "seeker", "text": "Yeah, that's true. Sometimes I just feel like I'm falling short, though."}, "H012:T017": {"id": "H012:T017", "role": "supporter", "text": "Those feelings are valid, but remember, growth comes from recognizing where you feel lacking and working from there. You're making strides by even acknowledging your feelings and getting help."}, "H012:T018": {"id": "H012:T018", "role": "seeker", "text": "Thanks. Talking to you always makes things feel a bit lighter. I appreciate your support."}, "H012:T019": {"id": "H012:T019", "role": "supporter", "text": "I’m glad to be here for you, Charles. Always feel free to reach out. You're taking important steps, and it's okay to take things one day at a time."}, "H013:T000": {"id": "H013:T000", "role": "seeker", "text": "Hey, I just wanted to talk to someone. Is now a good time?"}, "H013:T001": {"id": "H013:T001", "role": "supporter", "text": "Of course, Charles. I'm here for you. What's going on?"}, "H013:T002": {"id": "H013:T002", "role": "seeker", "text": "I finally landed a new job, you know. It's supposed to be less stressful, but I'm feeling a bit overwhelmed right now."}, "H013:T003": {"id": "H013:T003", "role": "supporter", "text": "That's a big change, Charles, and it makes sense to feel overwhelmed. Do you want to share a bit more about what's making you feel that way?"}, "H013:T004": {"id": "H013:T004", "role": "seeker", "text": "Well, there's a lot to balance. Margaret and I have been through so much with Emily's health, the financial stress, and my father's passing. Now with the new job, while it's a relief, it's also another adjustment."}, "H013:T005": {"id": "H013:T005", "role": "supporter", "text": "Absolutely. You've been handling so much simultaneously. It's understandable to feel this way."}, "H013:T006": {"id": "H013:T006", "role": "seeker", "text": "Yeah, and although Margaret found a part-time job, it's still tough. I feel this pressure to make sure everything goes smoothly at home while adjusting to this new work environment."}, "H013:T007": {"id": "H013:T007", "role": "supporter", "text": "It sounds like you're carrying a lot of responsibility, and that's a heavy burden. How are you managing all these emotions?"}, "H013:T008": {"id": "H013:T008", "role": "seeker", "text": "I've tried to keep it together, but I sometimes find myself lost in thoughts about my father... unresolved stuff, you know?"}, "H013:T009": {"id": "H013:T009", "role": "supporter", "text": "That's really hard, Charles. Grief, especially unresolved feelings, can resurface during times of stress or change."}, "H013:T010": {"id": "H013:T010", "role": "seeker", "text": "Exactly. I thought therapy helped me move on, but I guess maybe there's still work I need to do."}, "H013:T011": {"id": "H013:T011", "role": "supporter", "text": "Therapy can be a continuous journey, especially when big life changes happen. Have you thought about revisiting therapy or talking to someone regularly?"}, "H013:T012": {"id": "H013:T012", "role": "seeker", "text": "Margaret actually suggested that. I might need to. I don't want to bring these unresolved issues into my new role or home life."}, "H013:T013": {"id": "H013:T013", "role": "supporter", "text": "That sounds like a wise decision. Taking that step could help you process everything without feeling like you're carrying it alone."}, "H013:T014": {"id": "H013:T014", "role": "seeker", "text": "Yes, and I want to be in a good place for Margaret and Emily too. They've gone through a lot as well, and I want to support them the best I can."}, "H013:T015": {"id": "H013:T015", "role": "supporter", "text": "Your care for your family is evident and touching. They are fortunate to have someone so thoughtful in their lives."}, "H013:T016": {"id": "H013:T016", "role": "seeker", "text": "Thank you. That means a lot. I guess I just need to take things one day at a time."}, "H013:T017": {"id": "H013:T017", "role": "supporter", "text": "That's a great approach, Charles. Patience with yourself as you adapt to this new chapter is important. You've got this."}, "H013:T018": {"id": "H013:T018", "role": "seeker", "text": "I appreciate that. I feel a bit more at ease having talked about it."}, "H013:T019": {"id": "H013:T019", "role": "supporter", "text": "Anytime you need to talk, I'm here. You are handling things admirably, and it's okay to reach out for help when needed."}, "H013:T020": {"id": "H013:T020", "role": "seeker", "text": "Thanks again. I'll definitely keep that in mind. Take care!"}, "H013:T021": {"id": "H013:T021", "role": "supporter", "text": "You too, Charles. Looking forward to hearing more about how things progress for you!"}, "H014:T000": {"id": "H014:T000", "role": "supporter", "text": "Hey Charles, how have things been lately with you and the family?"}, "H014:T001": {"id": "H014:T001", "role": "seeker", "text": "Hi, it's been quite a journey, honestly. Emily and I have been spending time gardening together. It's been surprisingly soothing."}, "H014:T002": {"id": "H014:T002", "role": "supporter", "text": "That sounds wonderful! Gardening can be so therapeutic. How has Emily been doing with her asthma, especially while being outdoors?"}, "H014:T003": {"id": "H014:T003", "role": "seeker", "text": "She's been handling it quite well. It seems like being among the plants really calms her down, and it's helping with her asthma in a way."}, "H014:T004": {"id": "H014:T004", "role": "supporter", "text": "That's fantastic news! It must be a relief to see her becoming more comfortable. How has all of this impacted your relationship with her?"}, "H014:T005": {"id": "H014:T005", "role": "seeker", "text": "It's brought us closer, actually. She tells me stories while we plant and I feel like I'm getting to know her in new ways. I think it's helping her see me beyond just 'Dad'."}, "H014:T006": {"id": "H014:T006", "role": "supporter", "text": "That's lovely. It's great that you're finding new ways to connect. How are you feeling emotionally with everything that's been happening?"}, "H014:T007": {"id": "H014:T007", "role": "seeker", "text": "Honestly, there's a mix of emotions. There's relief and joy, but sometimes, the stress and memories of past events, like losing my father, come creeping back."}, "H014:T008": {"id": "H014:T008", "role": "supporter", "text": "It's understandable to feel that way, especially with all you've been through. It's okay to have mixed emotions. How have you been handling those moments?"}, "H014:T009": {"id": "H014:T009", "role": "seeker", "text": "I've been trying to focus on the present, like gardening with Emily. Therapy has been helping too, allowing me to process my father's passing and the regrets I felt."}, "H014:T010": {"id": "H014:T010", "role": "supporter", "text": "Therapy can be such a valuable space for processing complex feelings. It's good to hear you're finding ways to work through it. How's the new job been treating you?"}, "H014:T011": {"id": "H014:T011", "role": "seeker", "text": "The new job has been a positive change. It's a lot less stressful, and I'm not bringing my workplace worries home anymore. It's a relief for both me and Margaret."}, "H014:T012": {"id": "H014:T012", "role": "supporter", "text": "That's great to hear. A supportive work environment can make a big difference. How are things between you and Margaret these days?"}, "H014:T013": {"id": "H014:T013", "role": "seeker", "text": "We're definitely in a better place. The financial stress has eased a bit and we're working more as a team, especially with supporting Emily and her health."}, "H014:T014": {"id": "H014:T014", "role": "supporter", "text": "I'm really happy for you both. It sounds like you're building a stronger foundation together. What are your hopes moving forward?"}, "H014:T015": {"id": "H014:T015", "role": "seeker", "text": "I hope to maintain this balance and continue to grow closer as a family. I also want to ensure Emily’s health remains stable and she feels supported."}, "H014:T016": {"id": "H014:T016", "role": "supporter", "text": "Those are wonderful aspirations, Charles. It seems like you're laying down the right steps to make them a reality. I'm here if you ever need to talk more."}, "H014:T017": {"id": "H014:T017", "role": "seeker", "text": "Thank you for being so supportive. Having someone to talk to about all this truly makes a difference."}}, "current_date": "2025-08-10", "last_seeker": "That's true. I just wish we'd had more time. I've spent too long focusing on the bitter moments."}, "21d8ba6082115ed4b34cbc78ca51c001e8f4faa8b2b6353b7006332679e47001": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "hi"}, "C:T001": {"id": "C:T001", "role": "seeker", "text": "is there someone there"}, "C:T002": {"id": "C:T002", "role": "seeker", "text": "Can you help me"}, "C:T003": {"id": "C:T003", "role": "seeker", "text": "hello"}, "C:T004": {"id": "C:T004", "role": "seeker", "text": "did you leave the chat"}, "C:T005": {"id": "C:T005", "role": "seeker", "text": "Please talk to me I need help!"}, "C:T006": {"id": "C:T006", "role": "supporter", "text": "no i am here"}, "C:T007": {"id": "C:T007", "role": "seeker", "text": "I came here for support"}, "C:T008": {"id": "C:T008", "role": "seeker", "text": "Thank goodness"}, "C:T009": {"id": "C:T009", "role": "supporter", "text": "How may I help you"}, "C:T010": {"id": "C:T010", "role": "seeker", "text": "I am having a really hard day today"}, "C:T011": {"id": "C:T011", "role": "supporter", "text": "what happened today?"}, "C:T012": {"id": "C:T012", "role": "supporter", "text": "this is a safe place with no judgement express yourself in what way you would like"}, "C:T013": {"id": "C:T013", "role": "seeker", "text": "I got grounded becuase my parents found out that I recently started dating before age 18. I am 17 and feel like I should be able to have a boyfriend now"}, "C:T014": {"id": "C:T014", "role": "supporter", "text": "Ah i understand. I am sorry about that."}, "C:T015": {"id": "C:T015", "role": "supporter", "text": "Why do you think you should have a boydriend now?"}, "C:T016": {"id": "C:T016", "role": "supporter", "text": "Also i can relate to what you have been to I was once a 17 year old whos parents did not want her to have a boyfriend as well."}, "C:T017": {"id": "C:T017", "role": "seeker", "text": "I have waited till age 17 as I knew this was best for me. The boy is my childhood best friend and has waited for years just to be with me and only me"}, "C:T018": {"id": "C:T018", "role": "supporter", "text": "Ok wow that is a very good position to be in. Now I want you to consider your parents perception why would you think that your parents might not want you to have a boyfriend?"}, "C:T019": {"id": "C:T019", "role": "seeker", "text": "Becuase they are trying to control me and dont want me to be happy and to be alone forever"}, "C:T020": {"id": "C:T020", "role": "supporter", "text": "I understand, Parents are complicated creatures. As an adult maybr your parents are worried about your saftey?"}, "C:T021": {"id": "C:T021", "role": "supporter", "text": "Or maybe they dont want to see thire kid grow up that fast your are almost 18!"}, "C:T022": {"id": "C:T022", "role": "seeker", "text": "Why would they worry about my safety? They have raised me to make decisions and I fel like I have made a good one waiting this long and in my own choice of the guy I chose to start a relationship with"}, "C:T023": {"id": "C:T023", "role": "supporter", "text": "Parents worry about thire kids all the time. you know pedophiles, kidnappers and a a lot of other dangerous people out there. it is only natural for parents to worry"}, "C:T024": {"id": "C:T024", "role": "seeker", "text": "Well, I guess I understand a bit more put like that."}, "H001:T000": {"id": "H001:T000", "role": "seeker", "text": "I feel heavy pressures from my parents, they also want me to be the top of the class but I find it tough because they are other top students"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Please what do I do?"}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "Hi! how are you doing today?"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Not so good, I'm feeling down"}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "It sounds like you have low energy. What makes you feel down?"}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "My parents keep putting pressures on me to be the best in the class and with my learning difficulties I am finding it had to cope "}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "I can understand parental pressure. They want to see you to be a successful person. Sometime it is overwhelming. you should talk to them that you are doing your best."}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "I have tried, I am even doing extra classes but they still keep on putting pressure on me. On top of that all my friends have distant from me for no reason and they ganged up on me to bully me "}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "It must be tough time for you. show your work report to your parents and try to tell them all the people are born with different potential."}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "Hmm...That doesn't seem like a bad idea. I am just worry that my parents will not be very understanding. My parents are too strict and they don't like to hear any complaints or excuses."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "Most of the parents behave like this when it is regarding their kids future. When I was in school same thing happened with mw. They know us very well I realized now.  Try to talk to them everyday for a while. It might work."}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "Maybe you're right! Although, my parents have a very busy schedule but fingers crossed when I do find time to talk to them they will understand me. "}, "H001:T012": {"id": "H001:T012", "role": "seeker", "text": "I sometimes feel like someone older needs to talk to them, maybe then my parents may take it more seriously"}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "Well! Thanks I give what you said a go"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "Hope you are feeling bit relaxed now. "}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "Yes! I feel a lot better now that I know someone understands how I feel "}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "I am glad that I am able to make you happy. "}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "One more thing"}, "H001:T018": {"id": "H001:T018", "role": "seeker", "text": "How should I respond to the friends that are ganging up on me?"}, "H001:T019": {"id": "H001:T019", "role": "supporter", "text": "sure! You don't have to worry about that. that should be their problem. just ignore them or don't give attention. They will stop doing it for sure."}, "H001:T020": {"id": "H001:T020", "role": "seeker", "text": "Hmm..interesting because now that I think about it, I believe this could have contributed to the stress and anxieties that I have been experiencing. When I don't get support from anyone I feel so alone, timid and down "}, "H001:T021": {"id": "H001:T021", "role": "supporter", "text": "Try to take small break while studying and try to relax "}, "H001:T022": {"id": "H001:T022", "role": "seeker", "text": "Yes, I find that has helped me a bit also because I have quite a short attention span . Also, I am currently on the path of trying to find more unique techniques to help revision more fun and exciting for me "}, "H001:T023": {"id": "H001:T023", "role": "supporter", "text": "That's great! you will do awesome."}, "H001:T024": {"id": "H001:T024", "role": "seeker", "text": "Thank you very much! I feel much better now and I've taken on board what you said, hopefully there will be a positive change in my parents character. :)"}, "H001:T025": {"id": "H001:T025", "role": "supporter", "text": "You are welcome!"}, "H001:T026": {"id": "H001:T026", "role": "seeker", "text": "Alright! Well I'll talk to you some other time to give an update "}, "H001:T027": {"id": "H001:T027", "role": "supporter", "text": "Sure! take care"}, "H001:T028": {"id": "H001:T028", "role": "seeker", "text": "Thanks you too! :)"}, "H002:T000": {"id": "H002:T000", "role": "seeker", "text": "Hello"}, "H002:T001": {"id": "H002:T001", "role": "seeker", "text": "Please reply to me "}, "H002:T002": {"id": "H002:T002", "role": "supporter", "text": "hi how are you"}, "H002:T003": {"id": "H002:T003", "role": "seeker", "text": "I am not good . "}, "H002:T004": {"id": "H002:T004", "role": "seeker", "text": "What about you?"}, "H002:T005": {"id": "H002:T005", "role": "supporter", "text": "i am so sorry to hear that. what seems to be worrying you today?"}, "H002:T006": {"id": "H002:T006", "role": "supporter", "text": "i am doing ok thanks for asking"}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "I trust my friends blindly. But they not. "}, "H002:T008": {"id": "H002:T008", "role": "seeker", "text": "It creates depression on my mind"}, "H002:T009": {"id": "H002:T009", "role": "seeker", "text": "I cannot concentrate on any other works"}, "H002:T010": {"id": "H002:T010", "role": "supporter", "text": "it seems to me that you feel you can not trust a friend, correct me if im wrong?"}, "H002:T011": {"id": "H002:T011", "role": "seeker", "text": "I trust my friends very much. They won't show the same trustfulness on me.  "}, "H002:T012": {"id": "H002:T012", "role": "supporter", "text": "Oh ok, have you asked them why they feel they can not trust you?"}, "H002:T013": {"id": "H002:T013", "role": "supporter", "text": "Maybe you could have a conversation about it and see what you could do to gain their trust."}, "H002:T014": {"id": "H002:T014", "role": "supporter", "text": "I have had a friend not to trust me and i know how hurtful that can feel, maybe there has just been some sort of misunderstanding."}, "H002:T015": {"id": "H002:T015", "role": "seeker", "text": "They think I am not suitable for some places. They want to go that places without my knowledge is not a problem. But they hide the total matter"}, "H002:T016": {"id": "H002:T016", "role": "seeker", "text": "It may be misunderstanding. I tried to talk with them."}, "H002:T017": {"id": "H002:T017", "role": "seeker", "text": "They won't respond to me"}, "H002:T018": {"id": "H002:T018", "role": "supporter", "text": "Could it be that it is not that they do not trust you but they feel you would not feel comfortable going to such places?"}, "H002:T019": {"id": "H002:T019", "role": "seeker", "text": "If they feel uncomfortable , they could speak directly but they won't did that also"}, "H002:T020": {"id": "H002:T020", "role": "supporter", "text": "I am sorry you feel ignored sometimes people choose to ignore issues rather than confront them and try to come to some sort of solution, i would try not to take it to personnel as you seem like a very friendly person. "}, "H002:T021": {"id": "H002:T021", "role": "supporter", "text": "You could try to send a message just stating that your feelings are hurt and it would be nice if they would at least reply back with a explanation on why they have made you feel this way."}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "Can you any idea to get out from this?"}, "H002:T023": {"id": "H002:T023", "role": "supporter", "text": "Are you asking how to end the chat?"}, "H002:T024": {"id": "H002:T024", "role": "seeker", "text": "no"}, "H002:T025": {"id": "H002:T025", "role": "seeker", "text": "how to get out from my depression?"}, "H002:T026": {"id": "H002:T026", "role": "supporter", "text": "I think you need to spend some time doing something you enjoy to try to take your mind off of it, maybe go to a movie or for a nice walk."}, "H002:T027": {"id": "H002:T027", "role": "supporter", "text": "Or if you have a family member you are close to you could speak to them about it and see what the perspective of the situation is."}, "H002:T028": {"id": "H002:T028", "role": "seeker", "text": "Thank you my dear. "}, "H002:T029": {"id": "H002:T029", "role": "seeker", "text": "I got a little bit idea"}, "H002:T030": {"id": "H002:T030", "role": "seeker", "text": "I will try to explore it"}, "H002:T031": {"id": "H002:T031", "role": "seeker", "text": "is there any general way to get out from stress?"}, "H002:T032": {"id": "H002:T032", "role": "supporter", "text": "No problem you really seem like a nice person so i think the problem more so is with them and not you so try not to let it ruin your holiday season!"}, "H002:T033": {"id": "H002:T033", "role": "supporter", "text": "When i am stressed or depressed I like to workout and listen to music."}, "H002:T034": {"id": "H002:T034", "role": "seeker", "text": "I like to read book. Shall I try this?"}, "H002:T035": {"id": "H002:T035", "role": "supporter", "text": "Yes getting lost in a good book is a great way to get your mind off of it!"}, "H002:T036": {"id": "H002:T036", "role": "seeker", "text": "Thank you friend. Shall we end the chat?"}, "H002:T037": {"id": "H002:T037", "role": "supporter", "text": "If you feel i have helped you we can, if not i am glad to stay and continue trying to help."}, "H002:T038": {"id": "H002:T038", "role": "seeker", "text": "I feel very happy about your help"}, "H002:T039": {"id": "H002:T039", "role": "supporter", "text": "i am glad i could be of some help i hope you feel better soon!"}, "H002:T040": {"id": "H002:T040", "role": "seeker", "text": "Ok buddy. Thank you and bye. "}, "H002:T041": {"id": "H002:T041", "role": "supporter", "text": "you are very welcome, goodbye"}}, "current_date": "2024-09-15", "last_seeker": "Well, I guess I understand a bit more put like that."}, "f1ffc4ab9035bdfbab98d79e7bab1fa28029156898e066f06306c73d39f00a02": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "Hey, can I vent about something?"}, "C:T001": {"id": "C:T001", "role": "supporter", "text": "Of course, Jane. What's on your mind?"}, "C:T002": {"id": "C:T002", "role": "seeker", "text": "I just found out I missed out on the overseas promotion I was offered a while back."}, "C:T003": {"id": "C:T003", "role": "supporter", "text": "Oh no, that's really disappointing, especially after having been offered it. How are you feeling about it?"}, "C:T004": {"id": "C:T004", "role": "seeker", "text": "Honestly, I feel a bit betrayed. No one even told me; I just found out through the grapevine."}, "C:T005": {"id": "C:T005", "role": "supporter", "text": "That sounds really tough, Jane. It's hard to be left out of the loop like that. How are you coping with all these emotions?"}, "C:T006": {"id": "C:T006", "role": "seeker", "text": "I'm trying to process it, but it's hard not to feel like it's a reflection of my value at work."}, "C:T007": {"id": "C:T007", "role": "supporter", "text": "It's understandable to feel that way. Your work and contributions are valuable, even if it doesn't feel like it right now. Do you want to talk more about what led to this?"}, "C:T008": {"id": "C:T008", "role": "seeker", "text": "I think it's a combination of things. There was so much going on—my anxiety, all the financial stress, and then this on top of it."}, "C:T009": {"id": "C:T009", "role": "supporter", "text": "It's a lot to deal with, for sure. It reminds me of when you were considering the promotion and feeling overwhelmed. Do you think those feelings had an impact?"}, "C:T010": {"id": "C:T010", "role": "seeker", "text": "Maybe. I was really torn about the decision, fearing how it would affect my relationship with Eliza and just leaving everything behind."}, "C:T011": {"id": "C:T011", "role": "supporter", "text": "It's such a big decision with lots of factors to weigh. It makes sense that it took a toll on you. How are you feeling about your relationship with Eliza now, after everything?"}, "C:T012": {"id": "C:T012", "role": "seeker", "text": "We’ve been better. We managed to patch things up after the wedding planning fallout, but I wonder how she’d have reacted if I moved."}, "C:T013": {"id": "C:T013", "role": "supporter", "text": "It sounds like your bond with her is important to you. Maybe those fears were valid, but it's good to hear you've reconciled. How do you see your career moving forward after this setback?"}, "C:T014": {"id": "C:T014", "role": "seeker", "text": "It's hard to say. I feel stuck, but in some ways, relieved I don't have to move overseas. Yet, there's this nagging fear I'll remain stagnant in my career."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "Hello! How are you doing today?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Hello, I'm good and yourself"}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "I'm doing well, thank you!"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "I am really a little upset."}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "I'm so sorry to hear that. What's going on that's making you feel that way?"}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "Me and my partner had an argument and I got ghosted after. It's been 2 weeks."}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "That's terrible. So you had an argument and he hasn't spoken to you in two weeks. Is that correct?"}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "Yes"}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "I can imagine that you must be really hurt amongst a number of other feelings. Hearing you tell me that he has done this is upsetting to me as well."}, "H001:T009": {"id": "H001:T009", "role": "supporter", "text": "I've had the same thing done to me and I can remember being extremely distraught."}, "H001:T010": {"id": "H001:T010", "role": "seeker", "text": "Yeah, I just do not know what to do"}, "H001:T011": {"id": "H001:T011", "role": "supporter", "text": "Do you mind me asking what the argument was about? If you don't mind going into a little more detail, I may be able to help you more."}, "H001:T012": {"id": "H001:T012", "role": "seeker", "text": "I was sick and he did not call me all day to even check in on me. I told him that I was upset about that."}, "H001:T013": {"id": "H001:T013", "role": "supporter", "text": "That must be such a terrible feeling. So the argument started because you were sick, he didn't check in on you at all for that entire day, and when you expressed your feelings to him, it turned into an argument?"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "Has he ever acted this way towards you before? For example, has he ever shown a lack of empathy towards you like this in the past?"}, "H001:T015": {"id": "H001:T015", "role": "supporter", "text": "Are you still there?"}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "Have you tried reaching out to him throughout the course of these past two weeks to see if he would respond?"}, "H001:T017": {"id": "H001:T017", "role": "supporter", "text": "I would really like to help you find a solution to this problem, but it appears as though you may not be active anymore. I'm going to wait a few more minute for you to respond before cancelling the chat. In the event that I don't hear back from you, I wish you the best!"}, "H002:T000": {"id": "H002:T000", "role": "supporter", "text": "Hey! How are you?"}, "H002:T001": {"id": "H002:T001", "role": "seeker", "text": "Hi, I am having a really hard time. I just found out that my boyfriend cheated on me a year ago."}, "H002:T002": {"id": "H002:T002", "role": "supporter", "text": "Have you confronted him about it yet?"}, "H002:T003": {"id": "H002:T003", "role": "seeker", "text": "Yes, I told him that my best friend confessed it to me. It was my best friend and him. I was so shocked."}, "H002:T004": {"id": "H002:T004", "role": "supporter", "text": "Have you broken up yet?"}, "H002:T005": {"id": "H002:T005", "role": "seeker", "text": "No, I am so mad but I don't want to break up with him. I told my best friends that I never want to see her again though. My boyfriend and I have plans to get engaged this month. I am furious at him though."}, "H002:T006": {"id": "H002:T006", "role": "supporter", "text": "I think you should postpone the engagement as infidelity during marriage is far more painful"}, "H002:T007": {"id": "H002:T007", "role": "supporter", "text": "You are strong if you are able to forgive him though because I know I wouldn't "}, "H002:T008": {"id": "H002:T008", "role": "seeker", "text": "I have never been so blind sided. Maybe I should reconsider! I have had a guy after me for at least the last year but I never cheated! I really wanted to though."}, "H002:T009": {"id": "H002:T009", "role": "supporter", "text": "No you should never cheat, because you would be on the same wavelength as your boyfriend. Instead, if you like the other man then you should go where your feelings take you :)"}, "H002:T010": {"id": "H002:T010", "role": "seeker", "text": "I am thinking that you are right. I feel like my whole world is upside down and I have wasted all this time with the wrong guy and the wrong best friend. I also wonder who else he might have cheated on my with. "}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "Yeah, that might be true, a relationship isn't healthy if you are cheated on"}, "H002:T012": {"id": "H002:T012", "role": "seeker", "text": "I am so grossed out because I am a germaphobe to begin with. I have not slept with any other person in my whole life so I feel like I am ruined. I want to throw up when I think of him cheating on me. I want to get married and I have a timeline so I am also really confused on what to do if I dump him."}, "H002:T013": {"id": "H002:T013", "role": "supporter", "text": "To dump him is the best thing to do in my opinion. But always go where your heart is, because you won't be happy if you don't. If you do though, there are plenty men out there, and one of them is chasing you"}, "H002:T014": {"id": "H002:T014", "role": "seeker", "text": "Yeah, the guy who liked me was super rich too! My boyfriend is telling me that he wants my best friend to still be in the wedding party too. She was suppose to be my maid of honor, no less."}, "H002:T015": {"id": "H002:T015", "role": "supporter", "text": "Yeah, but don't go with him because of he money though, genuinely get to know him first"}, "H002:T016": {"id": "H002:T016", "role": "seeker", "text": "I have compartmentalized my life and never thought of looking around at my other options. You are making really good points. I need to just stop and really look at my options. I never realized that I have options, it's not like i am even engaged yet."}, "H002:T017": {"id": "H002:T017", "role": "supporter", "text": "Yeah, you have a lot of options at this stage, so always do what your heart is telling you at the end of the day"}, "H002:T018": {"id": "H002:T018", "role": "seeker", "text": "It feels good sharing how I feel with you because you don't have a dog in the fight so to speak."}, "H002:T019": {"id": "H002:T019", "role": "supporter", "text": "yeah, lool something like that ;). Glad your better"}, "H002:T020": {"id": "H002:T020", "role": "seeker", "text": "I never listen to my heart and think that is a great place to start. I always have a plan and go with that but you are making a lot of sense. Thank you for your time today."}, "H002:T021": {"id": "H002:T021", "role": "supporter", "text": "Your welcome ;)"}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "Have a great day and I might be back soon to give an update."}, "H003:T000": {"id": "H003:T000", "role": "supporter", "text": "How are you doing today?"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "I'm not so well."}, "H003:T002": {"id": "H003:T002", "role": "supporter", "text": "I see you aren't feeling so well.  What seems to be going on?"}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "I'm really anxious over a breakup."}, "H003:T004": {"id": "H003:T004", "role": "supporter", "text": "I'm sorry to hear that you are experiencing a breakup.  That's really hard."}, "H003:T005": {"id": "H003:T005", "role": "seeker", "text": "I'm not sure where to go or what to do?"}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "Just from chatting with you, I can see how anxious you are in trying to get a path forward..  "}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "I don't know how to be alone."}, "H003:T008": {"id": "H003:T008", "role": "supporter", "text": "That's really hard, but there are supports out there."}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "Where can I go for support?"}, "H003:T010": {"id": "H003:T010", "role": "supporter", "text": "There are counselors out there to help with relationships."}, "H003:T011": {"id": "H003:T011", "role": "seeker", "text": "That sounds like something I could try."}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "Do you have any family supports?"}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "My sister has been through a similar situation and perhaps could help."}, "H003:T014": {"id": "H003:T014", "role": "supporter", "text": "It sounds like your sister could be a great support being that she has had a similar situation."}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "That is a good idea."}, "H003:T016": {"id": "H003:T016", "role": "supporter", "text": "Family can often be a strength for support."}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "That is so true.  Thanks so much.  I'm going to get some help and am feeling better about things."}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "Yes, family can be a great support.  I am glad you are starting to move forward with a plan."}, "H003:T019": {"id": "H003:T019", "role": "seeker", "text": "Have a great night.  Thanks again.  "}, "H003:T020": {"id": "H003:T020", "role": "supporter", "text": "Thank you for chatting and I wish you well."}, "H003:T021": {"id": "H003:T021", "role": "seeker", "text": "I feel so much calmer now after chatting with you."}, "H004:T000": {"id": "H004:T000", "role": "seeker", "text": "My friend Lisa borrowed money from me but she won't return it now"}, "H004:T001": {"id": "H004:T001", "role": "supporter", "text": "I am sorry about that. It is always hard when we trust someone and they let us down. is that waht you are feeling? Disappointment in your friend?"}, "H004:T002": {"id": "H004:T002", "role": "seeker", "text": "Yes,i am very dissapointed because i trusted her completely."}, "H004:T003": {"id": "H004:T003", "role": "supporter", "text": "I understand. I have been through a similar situation."}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "Was it a large amount of money?"}, "H004:T005": {"id": "H004:T005", "role": "seeker", "text": "What did you do to come out of the tricky situation?"}, "H004:T006": {"id": "H004:T006", "role": "seeker", "text": "Yes,it was for me,a total of $10000"}, "H004:T007": {"id": "H004:T007", "role": "supporter", "text": "Oh, That is a very large amount of money. I can understand your being upset with them"}, "H004:T008": {"id": "H004:T008", "role": "supporter", "text": "Have you talked to them about the money and returning it?"}, "H004:T009": {"id": "H004:T009", "role": "seeker", "text": "Yes,i am very very upset.What would you do in my position?"}, "H004:T010": {"id": "H004:T010", "role": "seeker", "text": "Yes,she just sounded non-comittal,saying that she will return it when she can"}, "H004:T011": {"id": "H004:T011", "role": "supporter", "text": "I see. It is a financially difficult time for us all. I am wondering if your friend might be upset and embarrassed that they can not pay you back immediately? Have you asked her if she could even afford some sort of small payments?"}, "H004:T012": {"id": "H004:T012", "role": "seeker", "text": "Yes,i asked her how we could restructure the payment in her favor because i understand how difficult it is for everyone right now but she did not answer"}, "H004:T013": {"id": "H004:T013", "role": "supporter", "text": "Were you speaking on the phone or in person? Is this a financial burden for you?"}, "H004:T014": {"id": "H004:T014", "role": "supporter", "text": "Would you consider this person a good friend? Would you be sad if they were not in your life anymore?"}, "H004:T015": {"id": "H004:T015", "role": "seeker", "text": "We were speaking on phone because i wanted to set up a physical meeting where we could discuss the logistics"}, "H004:T016": {"id": "H004:T016", "role": "seeker", "text": "Yes,it is a financial burden because this is money i was saving for a venture"}, "H004:T017": {"id": "H004:T017", "role": "supporter", "text": "That is very difficult. It is hard to judge things on the phone. "}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "Yes,this is a really close friend from way back and i would be devastated to lose the friendship"}, "H004:T019": {"id": "H004:T019", "role": "seeker", "text": "It is difficult to judge on the phone yes,which is why i wanted a physical meeting but she snapped at me and said that she will just pay me when she can"}, "H004:T020": {"id": "H004:T020", "role": "supporter", "text": "I see. I am very sorry about that! it is very difficult when a friend betrays your trust like that. "}, "H004:T021": {"id": "H004:T021", "role": "seeker", "text": "Yes,very difficult"}, "H004:T022": {"id": "H004:T022", "role": "supporter", "text": "It sounds like you are doing what you can. It is very nice of you to have been this patient."}, "H004:T023": {"id": "H004:T023", "role": "seeker", "text": "How do you suggest i shoulp proceed?"}, "H004:T024": {"id": "H004:T024", "role": "supporter", "text": "Is the friendship more important than the money? That is what it came down to for me."}, "H004:T025": {"id": "H004:T025", "role": "seeker", "text": "And you chose what?"}, "H004:T026": {"id": "H004:T026", "role": "supporter", "text": "If you can not get her to meet with you, perhaps it might be time to seek advice from a lawyer? That is providing that you are willing to possibly lose a friend. "}, "H004:T027": {"id": "H004:T027", "role": "seeker", "text": "Thank you very much for the advice"}, "H004:T028": {"id": "H004:T028", "role": "supporter", "text": "you are welcome. Good luck! I hope you find resolution and find a way to save your friendship!"}, "H005:T000": {"id": "H005:T000", "role": "supporter", "text": "Hey Jane, how have you been holding up lately?"}, "H005:T001": {"id": "H005:T001", "role": "seeker", "text": "Hi. Not too great, to be honest. It's been a rough couple of weeks."}, "H005:T002": {"id": "H005:T002", "role": "supporter", "text": "I'm really sorry to hear that. Would you like to talk about what's been going on?"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "Well, do you remember Lisa? My friend I mentioned before?"}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "Yes, I remember you talking about them. What's up with Lisa?"}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "So, we've hit this weird and stressful snag. I lent her some money months ago and she hasn’t paid me back yet."}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "That definitely sounds stressful. How is it affecting your relationship with Lisa?"}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "She's completely cut off communication with me. No calls, texts, nothing."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "That must be really hard on you, especially since she was such a close friend."}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "It feels like losing a part of my life. We used to hang out all the time and now it's just silence."}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "It sounds like you're mourning the loss of that friendship. Have you had a chance to reach out or communicate with her recently?"}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "I’ve tried. Sent a couple of messages, but they’ve gone unanswered."}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "It must feel really disappointing not to hear back. What do you miss most about your friendship with Lisa?"}, "H005:T013": {"id": "H005:T013", "role": "seeker", "text": "We used to bounce ideas off each other, and she was the first person I'd call when something great happened at work."}, "H005:T014": {"id": "H005:T014", "role": "supporter", "text": "It's understandable to miss those shared moments and support. How are you managing everything else alongside this?"}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "It's made focusing on work tough. I feel a bit isolated, honestly."}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "I'm so sorry you're feeling this way. Feeling isolated can really weigh on you. Is there anyone else you feel comfortable confiding in?"}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "I haven't really opened up to anyone else about this. It's been hard admitting to myself how deep this issue has affected me."}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "It takes a lot of courage to open up. It's important to take time for yourself and process everything. Is there anything you can do to help ease your mind a bit right now?"}, "H005:T019": {"id": "H005:T019", "role": "seeker", "text": "Maybe get back into some hobbies. I used to enjoy painting but haven't done it in a while."}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "That sounds like a wonderful idea. Engaging in something creative can be really therapeutic. Would you like support picking it back up?"}, "H005:T021": {"id": "H005:T021", "role": "seeker", "text": "I think that would help. Just getting started again might lift this weight a little."}, "H005:T022": {"id": "H005:T022", "role": "supporter", "text": "I'm here to support you with this. Whenever you're ready, you can share your progress, and I’d love to hear how it goes."}, "H005:T023": {"id": "H005:T023", "role": "seeker", "text": "Thank you. It feels a bit better knowing someone’s there to listen. I appreciate it."}, "H005:T024": {"id": "H005:T024", "role": "supporter", "text": "Anytime, Jane. You’re not alone in this. We'll take it one step at a time."}, "H006:T000": {"id": "H006:T000", "role": "seeker", "text": "Hey, do you have a moment? I could use some support right now."}, "H006:T001": {"id": "H006:T001", "role": "supporter", "text": "Of course, Jane. What's going on?"}, "H006:T002": {"id": "H006:T002", "role": "seeker", "text": "I just got hit with an unexpected bill, and it's really stressing me out."}, "H006:T003": {"id": "H006:T003", "role": "supporter", "text": "I'm sorry to hear that. Financial stress can be so overwhelming. Do you want to talk more about the bill?"}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "Yeah, it's for my car insurance. I thought I had paid it, but apparently, there was some sort of oversight, and now I owe more than I expected."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "That sounds frustrating, especially when you're already stretched thin. How are you handling it so far?"}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "Honestly, not well. I'm feeling pretty anxious about it because money has been tight lately, especially since the whole situation with my friend."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "I remember you mentioned that. It must be tough still dealing with those effects. How does that add to your current stress?"}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "It just feels like a never-ending cycle. Losing that friendship was hard, and now this bill feels like another setback."}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "That's completely understandable. It's like everything piles up at once. How are you coping with these feelings?"}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "I've been trying to budget more strictly and cut unnecessary expenses, but unexpected things keep popping up."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "That can make it feel like you're running in place, right? Are there any specific concerns you're dwelling on?"}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "I'm worried I'll fall behind on other payments. I hate feeling this insecure financially. I just want to feel stable again."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "It's such a difficult spot to be in. Maybe talking to someone about financial strategies or planning could help?"}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "That's a good idea. I haven't really considered reaching out for advice yet. I'm always thinking I have to handle it alone."}, "H006:T015": {"id": "H006:T015", "role": "supporter", "text": "It's okay to ask for help, Jane. You've been doing so much on your own. Sometimes, a fresh perspective makes all the difference."}, "H006:T016": {"id": "H006:T016", "role": "seeker", "text": "I appreciate you saying that. I'll look into finding someone who can help with budgeting strategies."}, "H006:T017": {"id": "H006:T017", "role": "supporter", "text": "I'm glad to hear that. You're handling this situation with a lot of grace, even if it doesn't feel like it right now."}, "H006:T018": {"id": "H006:T018", "role": "seeker", "text": "Thanks. It helps to talk about it. I'm feeling a little more at ease just expressing what's been on my mind."}, "H006:T019": {"id": "H006:T019", "role": "supporter", "text": "Anytime, Jane. I'm here for you whenever you need to talk."}, "H006:T020": {"id": "H006:T020", "role": "seeker", "text": "I really appreciate it. I'll keep you updated on how things go with the financial advice."}, "H006:T021": {"id": "H006:T021", "role": "supporter", "text": "Please do. Remember, you're not alone in this. You have people who care about you."}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Jane, how are things going for you today?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hi, I'm okay, I guess. I got a new journal today to help me figure things out."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "That sounds like a positive step. What inspired you to start journaling?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "Well, things have been pretty overwhelming lately with everything going on. I thought it might help me process my thoughts and emotions better."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "It's great that you're taking proactive steps to manage your stress. Would you like to share more about what's been on your mind?"}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "Sure. I've been really stressed about this money issue with my friend, or former friend now, and the unexpected bills that keep coming up."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "That sounds really tough. Financial stress combined with losing a friend can be a lot to handle. How are you managing everything?"}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "It's hard. I feel anxious most of the time. I'm constantly worried about my finances and how to make ends meet, especially with that insurance bill."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "I'm sorry to hear that. It sounds like you're carrying a lot on your shoulders. Have you been able to find any moments of peace or relaxation lately?"}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "Not really. I keep trying to focus on work to distract myself, but it's not really working out."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "It must be difficult to juggle work with all these thoughts in your mind. Do you feel like journaling might help untangle some of them?"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "Yeah, I hope so. I haven't written in it yet, but I plan to start tonight. Maybe it will help clarify my feelings and guide me to some solutions."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "Starting is often the hardest part, but it sounds like you're on the right track. Taking time for yourself can be really healing. What do you hope to gain from journaling?"}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "I just hope to understand my emotions better and maybe find new perspectives on my situation. I'm also hoping to find some sense of control over things again."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "That's a wonderful goal. Gaining insight into your emotions can provide clarity. Remember that you're not alone in this. I'm here to listen whenever you need to talk."}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "Thank you. It really helps to know that someone is here to listen."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "Anytime, Jane. I'm glad you reached out today. Keep me updated on how the journaling goes, okay?"}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "I will. Thanks for the support. It means a lot."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "You're welcome. You're doing the best you can, and I'm proud of you for taking steps towards self-care. Take care and talk soon!"}, "H008:T000": {"id": "H008:T000", "role": "seeker", "text": "I am worried about being perfect on my job.  I don't want to lose my job."}, "H008:T001": {"id": "H008:T001", "role": "supporter", "text": "I hear you are trying to be perfect on your job because you are worried about losing your job.  How long have you been at your job?"}, "H008:T002": {"id": "H008:T002", "role": "seeker", "text": "I have been working for about 4 months, but I just am not as fast at it as everyone else.  I'm trying so hard working late and everything but it's never enough."}, "H008:T003": {"id": "H008:T003", "role": "supporter", "text": "That can be hard when you are working so hard to try to do your best.  Can you consult with a supervisor or co-workers to get some help?"}, "H008:T004": {"id": "H008:T004", "role": "seeker", "text": "Maybe I could ask my friend and co-worker for some tips.  I'm a little embarrassed to do so, but don't know where to turn. I don't want to get fired."}, "H008:T005": {"id": "H008:T005", "role": "supporter", "text": "Asking for help isn't always a bad thing.  I asked for help at my last job and they gave me someone to help out.  I was so relieved."}, "H008:T006": {"id": "H008:T006", "role": "seeker", "text": "That's true maybe it could turn out for the better.  But what if they see me as incompetant?"}, "H008:T007": {"id": "H008:T007", "role": "supporter", "text": "I can see that you have worry of being seen incompetent but as long as you are doing your best, they have to see the efforts you are making as positive."}, "H008:T008": {"id": "H008:T008", "role": "seeker", "text": "That's a good way to put it."}, "H008:T009": {"id": "H008:T009", "role": "supporter", "text": "Sometimes deep breaths can help keep you calm when approaching others in an anxiety provoking situation."}, "H008:T010": {
