ld be relaxing. What's stressing you about it?"}, "H016:T004": {"id": "H016:T004", "role": "seeker", "text": "I guess I put a lot of pressure on myself to be good at it right away. It's supposed to be fun, but I just feel like I'm failing."}, "H016:T005": {"id": "H016:T005", "role": "supporter", "text": "It's understandable to want to excel, Amanda. Remember, it's okay not to be perfect. It's about the process, right?"}, "H016:T006": {"id": "H016:T006", "role": "seeker", "text": "Yeah, I know. It's just hard not to get competitive with myself. And with everything else going on, it feels like I need to be good at something."}, "H016:T007": {"id": "H016:T007", "role": "supporter", "text": "I get that. You've been dealing with a lot, especially with work and your relationships. How has painting been helping you otherwise?"}, "H016:T008": {"id": "H016:T008", "role": "seeker", "text": "Well, for a while, it did help shift my mind away from work and personal stress. I kind of get lost in the colors and strokes. But then I start criticizing myself."}, "H016:T009": {"id": "H016:T009", "role": "supporter", "text": "Criticism can be so draining. Sometimes our own expectations create more stress. Have you tried just painting without any goals in mind?"}, "H016:T010": {"id": "H016:T010", "role": "seeker", "text": "I haven't really. I always set a goal, maybe from habit because of work. But I think I'll try just playing around with it."}, "H016:T011": {"id": "H016:T011", "role": "supporter", "text": "That sounds like a great idea. Letting go of expectations could bring back some joy and relaxation to it."}, "H016:T012": {"id": "H016:T012", "role": "seeker", "text": "Yeah, I'll give it a shot. I could use some light-heartedness right now."}, "H016:T013": {"id": "H016:T013", "role": "supporter", "text": "That's the spirit! Remember, it's okay to just enjoy the moment without judgment."}, "H016:T014": {"id": "H016:T014", "role": "seeker", "text": "Thanks. It's just been a rough patch with everything, work, and Bill... And then my ex..."}, "H016:T015": {"id": "H016:T015", "role": "supporter", "text": "It sounds like you have a full plate. Dealing with all those emotions about Bill and your ex can be really challenging."}, "H016:T016": {"id": "H016:T016", "role": "seeker", "text": "It is. Sometimes I just miss Bill, and seeing my ex with someone else hit me harder than I expected. I'm trying not to let it affect me, but sometimes it just hurts."}, "H016:T017": {"id": "H016:T017", "role": "supporter", "text": "Heart matters can be so complex. It's important to give yourself time and space to feel those emotions. Healing isn't linear."}, "H016:T018": {"id": "H016:T018", "role": "seeker", "text": "You're right. I think painting was supposed to be a distraction, but maybe I need to let myself feel without distraction sometimes."}, "H016:T019": {"id": "H016:T019", "role": "supporter", "text": "Yes, allowing yourself to feel is part of the healing process. Balance between distraction and reflection can be helpful."}, "H016:T020": {"id": "H016:T020", "role": "seeker", "text": "I'm going to try to be kinder to myself and let go of the pressure. Maybe then painting will just be painting."}, "H016:T021": {"id": "H016:T021", "role": "supporter", "text": "That sounds like a positive step forward, Amanda. You're doing your best, and that matters."}, "H016:T022": {"id": "H016:T022", "role": "seeker", "text": "Thanks for listening. I didn't realize how much I needed to talk about all this. I feel a bit lighter now."}, "H016:T023": {"id": "H016:T023", "role": "supporter", "text": "I'm really glad to hear that. Anytime you need to talk, I'm here for you. Take care, Amanda."}, "H016:T024": {"id": "H016:T024", "role": "seeker", "text": "Thank you, I appreciate it. I will. Take care!"}, "H017:T000": {"id": "H017:T000", "role": "seeker", "text": "Hey, just wanted to talk to someone about a lot that's been on my mind lately."}, "H017:T001": {"id": "H017:T001", "role": "supporter", "text": "Of course, Amanda! I'm here to listen. What's been going on?"}, "H017:T002": {"id": "H017:T002", "role": "seeker", "text": "Well, I received a really sweet note from a coworker yesterday. It made me smile, which was nice for a change."}, "H017:T003": {"id": "H017:T003", "role": "supporter", "text": "That sounds lovely! It's amazing how a small gesture can uplift your spirits. What did the note say?"}, "H017:T004": {"id": "H017:T004", "role": "seeker", "text": "It was just a little thank you for helping them with a project. It reminded me that my efforts at work don’t go unnoticed by everyone."}, "H017:T005": {"id": "H017:T005", "role": "supporter", "text": "It's great that your contributions are appreciated by your coworkers. How did that make you feel, especially given your situation with your supervisor?"}, "H017:T006": {"id": "H017:T006", "role": "seeker", "text": "Honestly, it felt really nice, especially after the stress I've been dealing with from my supervisor's negative review."}, "H017:T007": {"id": "H017:T007", "role": "supporter", "text": "I remember you mentioning feeling undervalued at work before. It's got to be challenging to balance the negative feedback with the positive support from coworkers."}, "H017:T008": {"id": "H017:T008", "role": "seeker", "text": "Exactly, it’s a mixed bag. The note was a small reminder that not everyone sees me the same way my supervisor does."}, "H017:T009": {"id": "H017:T009", "role": "supporter", "text": "It's good to hold onto that perspective. You do valuable work. Sometimes it’s just hard to remember that amid criticism."}, "H017:T010": {"id": "H017:T010", "role": "seeker", "text": "True. I've been trying to focus on my painting to destress but even that has become a bit overwhelming."}, "H017:T011": {"id": "H017:T011", "role": "supporter", "text": "Taking up painting sounds like a great creative outlet. What’s making it overwhelming?"}, "H017:T012": {"id": "H017:T012", "role": "seeker", "text": "I think I put too much pressure on myself to excel at it, instead of just enjoying the process."}, "H017:T013": {"id": "H017:T013", "role": "supporter", "text": "It's understandable to want to do well in something new. Maybe allowing yourself to just enjoy the activity would make it more relaxing."}, "H017:T014": {"id": "H017:T014", "role": "seeker", "text": "I guess I just need to remind myself to let go of perfectionism. It's tough sometimes."}, "H017:T015": {"id": "H017:T015", "role": "supporter", "text": "It really is. It might help to remember that hobbies are meant to bring joy and relaxation, not stress."}, "H017:T016": {"id": "H017:T016", "role": "seeker", "text": "That’s true. I’ll try to keep that in mind the next time I pick up the brush."}, "H017:T017": {"id": "H017:T017", "role": "supporter", "text": "That sounds like a good plan. It’s important to be kind to yourself during this journey."}, "H017:T018": {"id": "H017:T018", "role": "seeker", "text": "Thanks for reminding me of that. I needed to hear it."}, "H017:T019": {"id": "H017:T019", "role": "supporter", "text": "Anytime, Amanda. You're doing your best, and that's enough."}, "H018:T000": {"id": "H018:T000", "role": "seeker", "text": "Hey, are you available to talk for a bit?"}, "H018:T001": {"id": "H018:T001", "role": "supporter", "text": "Of course, Amanda. What's on your mind?"}, "H018:T002": {"id": "H018:T002", "role": "seeker", "text": "Well, I got some unexpected news at work today."}, "H018:T003": {"id": "H018:T003", "role": "supporter", "text": "Oh? What happened?"}, "H018:T004": {"id": "H018:T004", "role": "seeker", "text": "My supervisor offered me a promotion."}, "H018:T005": {"id": "H018:T005", "role": "supporter", "text": "Wow, that's big news! How are you feeling about it?"}, "H018:T006": {"id": "H018:T006", "role": "seeker", "text": "Honestly, I'm feeling pretty anxious about it."}, "H018:T007": {"id": "H018:T007", "role": "supporter", "text": "I can imagine. A promotion brings a lot of changes. What part is making you the most anxious?"}, "H018:T008": {"id": "H018:T008", "role": "seeker", "text": "I think it's the increased responsibilities. I'm already feeling stretched at work with everything that's been going on."}, "H018:T009": {"id": "H018:T009", "role": "supporter", "text": "With your supervisor constantly undermining you, I can see why this would add stress. Have they addressed your past concerns?"}, "H018:T010": {"id": "H018:T010", "role": "seeker", "text": "Not really. The negative performance review still hangs over me. The promotion feels like they're trying to make up for that."}, "H018:T011": {"id": "H018:T011", "role": "supporter", "text": "That must be quite confusing for you. Do you feel like this promotion is genuine recognition of your work?"}, "H018:T012": {"id": "H018:T012", "role": "seeker", "text": "I'm not sure. Part of me wonders if it's just to keep me from looking elsewhere. With everything with Bill and John Doe, I've just been on edge."}, "H018:T013": {"id": "H018:T013", "role": "supporter", "text": "It sounds like a lot to juggle. Do you have anyone at work you trust to discuss this with, like Sarah who sent you that note?"}, "H018:T014": {"id": "H018:T014", "role": "seeker", "text": "Sarah's been supportive, but I don't want to burden her. I'm also worried about being too vulnerable at work."}, "H018:T015": {"id": "H018:T015", "role": "supporter", "text": "It's understandable to feel wary. What helps you ground yourself when things feel unstable?"}, "H018:T016": {"id": "H018:T016", "role": "seeker", "text": "I've been painting, but recently it's added to my stress. I keep pushing myself to be perfect in it too."}, "H018:T017": {"id": "H018:T017", "role": "supporter", "text": "Perfectionism can be tough. How about leaning into the joy of painting instead of the pressure to excel?"}, "H018:T018": {"id": "H018:T018", "role": "seeker", "text": "I should try that. I sometimes forget it doesn't have to be another thing I master right away."}, "H018:T019": {"id": "H018:T019", "role": "supporter", "text": "Exactly. It's okay to allow yourself some space to enjoy without expectations. What do you think about the promotion now?"}, "H018:T020": {"id": "H018:T020", "role": "seeker", "text": "I'm still scared, but I think I need to have an open talk with my supervisor about what support looks like moving forward."}, "H018:T021": {"id": "H018:T021", "role": "supporter", "text": "That sounds like a great step. Being clear about your needs can help manage this transition."}, "H018:T022": {"id": "H018:T022", "role": "seeker", "text": "Thank you for listening. I needed to get this off my chest before making a decision."}, "H018:T023": {"id": "H018:T023", "role": "supporter", "text": "Anytime, Amanda. You're navigating a lot, and you're doing it with so much grace."}, "H018:T024": {"id": "H018:T024", "role": "seeker", "text": "Thanks for saying that. I'll let you know how it goes."}, "H018:T025": {"id": "H018:T025", "role": "supporter", "text": "I'm here anytime. Take care, Amanda."}, "H019:T000": {"id": "H019:T000", "role": "seeker", "text": "Hey, are you there? I could use someone to talk to."}, "H019:T001": {"id": "H019:T001", "role": "supporter", "text": "I'm here, Amanda. What's on your mind?"}, "H019:T002": {"id": "H019:T002", "role": "seeker", "text": "I just found out a family member is really sick, and it's been weighing on me heavily."}, "H019:T003": {"id": "H019:T003", "role": "supporter", "text": "I'm so sorry to hear that. Do you want to talk about what happened, or how you're feeling about it?"}, "H019:T004": {"id": "H019:T004", "role": "seeker", "text": "It's just... I feel like everything is piling up lately. Work stress, personal life... now this."}, "H019:T005": {"id": "H019:T005", "role": "supporter", "text": "It sounds incredibly overwhelming. It makes sense to feel burdened by all of this."}, "H019:T006": {"id": "H019:T006", "role": "seeker", "text": "Exactly. I thought I'd finally caught a break when things started looking up with my coworker and getting a promotion offer."}, "H019:T007": {"id": "H019:T007", "role": "supporter", "text": "And now, with that added pressure, having a sick family member must make it even harder to balance everything."}, "H019:T008": {"id": "H019:T008", "role": "seeker", "text": "Yes, and I haven't really processed any of it. I'm just constantly on edge. My ex-boyfriend stuff doesn't help either."}, "H019:T009": {"id": "H019:T009", "role": "supporter", "text": "Oh, I remember you mentioning unresolved feelings with your ex. How have those been affecting you lately?"}, "H019:T010": {"id": "H019:T010", "role": "seeker", "text": "Valentine's Day opened that can of worms again. Everything seemed to come at once and continues to be a mess."}, "H019:T011": {"id": "H019:T011", "role": "supporter", "text": "That sounds tough, Amanda. Managing your feelings about your ex on top of work stress and family concerns can be draining."}, "H019:T012": {"id": "H019:T012", "role": "seeker", "text": "Exactly, and when I argue with my best friend, it feels like I have nowhere to turn."}, "H019:T013": {"id": "H019:T013", "role": "supporter", "text": "It must be lonely and frustrating feeling like your support system is compromised."}, "H019:T014": {"id": "H019:T014", "role": "seeker", "text": "It is. I'm trying to keep it together, stay strong for everyone, but I feel like I'm the one falling apart."}, "H019:T015": {"id": "H019:T015", "role": "supporter", "text": "Remember, it's okay to take moments for yourself. You're carrying a lot, and it's okay to not be okay."}, "H019:T016": {"id": "H019:T016", "role": "seeker", "text": "Thanks for saying that. I don't know, I just wish things were simpler."}, "H019:T017": {"id": "H019:T017", "role": "supporter", "text": "It's normal to wish for simpler times. Small steps, like focusing on one task at a time, might help lessen the load."}, "H019:T018": {"id": "H019:T018", "role": "seeker", "text": "Yeah, maybe I need to start with that. Taking things one day at a time."}, "H019:T019": {"id": "H019:T019", "role": "supporter", "text": "That's a good starting point. And remember, leaning on others, like you're doing now, is a strength, not a weakness."}, "H019:T020": {"id": "H019:T020", "role": "seeker", "text": "Thank you. I really appreciate you being here and listening."}, "H019:T021": {"id": "H019:T021", "role": "supporter", "text": "Anytime, Amanda. Don't hesitate to reach out whenever you need to talk, okay?"}, "H019:T022": {"id": "H019:T022", "role": "seeker", "text": "I will. Thanks for being such a great friend."}, "H019:T023": {"id": "H019:T023", "role": "supporter", "text": "You're welcome. Take care of yourself, and remember, you're not alone in this."}, "H020:T000": {"id": "H020:T000", "role": "seeker", "text": "Hey, do you have a moment to chat?"}, "H020:T001": {"id": "H020:T001", "role": "supporter", "text": "Absolutely, Amanda! What's on your mind?"}, "H020:T002": {"id": "H020:T002", "role": "seeker", "text": "It's about Bill. He reached out to me recently, and it's bringing up a lot of old feelings."}, "H020:T003": {"id": "H020:T003", "role": "supporter", "text": "I can imagine how complex that must feel, especially after everything you've gone through. How has that been affecting you?"}, "H020:T004": {"id": "H020:T004", "role": "seeker", "text": "Honestly, it's confusing. Part of me is curious and maybe even hopeful, but another part of me is scared and unsure."}, "H020:T005": {"id": "H020:T005", "role": "supporter", "text": "That makes a lot of sense. It's normal to have mixed emotions in situations like these. Have you thought about what you really want out of this interaction with him?"}, "H020:T006": {"id": "H020:T006", "role": "seeker", "text": "That's the hard part. I don't know if I'm ready to open that chapter again, especially after the breakup. It took a lot to get through that."}, "H020:T007": {"id": "H020:T007", "role": "supporter", "text": "Breaking up was a significant step, given your past disagreements on future plans. How did you handle it back then, and could those insights help you now?"}, "H020:T008": {"id": "H020:T008", "role": "seeker", "text": "I had to focus on myself and my career. I spent time understanding what I need from a partner, and that really helped me. But hearing from Bill now is just... it's like everything's in the air again."}, "H020:T009": {"id": "H020:T009", "role": "supporter", "text": "It's clear you've done a lot of personal work since then. How have your priorities or needs shifted over the past months, especially with your promotion and current stresses?"}, "H020:T010": {"id": "H020:T010", "role": "seeker", "text": "I guess I've been more focused on my career and managing my stress. The promotion is exciting yet overwhelming. I think I need stability more than anything else right now."}, "H020:T011": {"id": "H020:T011", "role": "supporter", "text": "Stability is crucial, especially when you're dealing with so much change. Do you think rekindling things with Bill aligns with that need for stability?"}, "H020:T012": {"id": "H020:T012", "role": "seeker", "text": "That's where I'm stuck. If it’s anything like before, it might not help. But I can't deny there's a part of me that misses him and wonders if things could be different."}, "H020:T013": {"id": "H020:T013", "role": "supporter", "text": "It's understandable to miss someone you shared so much history with. What do you think would be different if you two were to try again?"}, "H020:T014": {"id": "H020:T014", "role": "seeker", "text": "If anything's different, it has to be our communication. We need to be on the same page about our goals, and that's what makes me hesitant. I'm afraid I'll get hurt again."}, "H020:T015": {"id": "H020:T015", "role": "supporter", "text": "It sounds like you value clear communication and aligned goals, which are definitely important. Do you feel comfortable discussing these concerns with him openly?"}, "H020:T016": {"id": "H020:T016", "role": "seeker", "text": "I think I could, but I'm also afraid of what I might hear. What if he hasn't changed? But maybe I'm also looking for closure or clarity."}, "H020:T017": {"id": "H020:T017", "role": "supporter", "text": "Closure or clarity sounds like a wise pursuit. Approaching this with honesty about your feelings could help, whether it's rekindling or moving on."}, "H020:T018": {"id": "H020:T018", "role": "seeker", "text": "You're right. I need to face this rather than let it linger. I’ll try talking to him openly and see where it leads, focusing on what's best for me."}, "H020:T019": {"id": "H020:T019", "role": "supporter", "text": "That sounds like a healthy step forward. Remember, whatever you decide, it should align with your needs and well-being. I'm here for you, whatever happens."}, "H020:T020": {"id": "H020:T020", "role": "seeker", "text": "Thanks, I really appreciate your support. It's good to know I'm not facing this alone."}, "H020:T021": {"id": "H020:T021", "role": "supporter", "text": "I'm always here. Take it one day at a time, and trust in your ability to navigate these feelings. You've got this, Amanda."}, "H020:T022": {"id": "H020:T022", "role": "seeker", "text": "Thank you, truly. I feel a bit more grounded talking to you, and that's what I needed right now."}}, "current_date": "2025-06-05", "last_seeker": "I’ve been thinking of discussing some workload adjustments with my supervisor, but I'm not sure how they’ll react."}, "7986a9bf4114d6d7b710e03478966164765560abb01ccfecb5bb319250728100": {"turns": {"C:T000": {"id": "C:T000", "role": "supporter", "text": "Hey Andrew, how have you been feeling lately?"}, "C:T001": {"id": "C:T001", "role": "seeker", "text": "Hey, honestly, I've been a bit overwhelmed. I'm considering changing my research focus, and it's been weighing on me."}, "C:T002": {"id": "C:T002", "role": "supporter", "text": "I can imagine that must be a tough decision. What’s making you think about changing your focus?"}, "C:T003": {"id": "C:T003", "role": "seeker", "text": "I haven't made much progress lately, and I'm just not interested in my current topic anymore. Plus, the feedback from my advisor was disheartening."}, "C:T004": {"id": "C:T004", "role": "supporter", "text": "That sounds really frustrating. Feedback like that can really bring you down, especially when you're already feeling uncertain. How did you feel after hearing it?"}, "C:T005": {"id": "C:T005", "role": "seeker", "text": "I felt a bit lost, to be honest. Like I’m just not cut out for this. It's hard because it makes me question my decisions."}, "C:T006": {"id": "C:T006", "role": "supporter", "text": "It's completely normal to question yourself when you're going through such challenges. Remember, you’ve made it this far for a reason. What do you think would rekindle your interest in research?"}, "C:T007": {"id": "C:T007", "role": "seeker", "text": "I've been considering exploring alternative energy sources, like renewables. It's something that aligns with my values and seems rewarding."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "Hello there! How can I encourage you today?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Hi, I have been going through a lot of stress with school and am also sad and lonely as of late and not sure how to make myself feel better"}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "So you have had a lot of stress with school lately and are struggling to keep yourself cheerful?"}, "H001:T003": {"id": "H001:T003", "role": "supporter", "text": "Is there something in particular at school that is stressing you out? Exams? Relationships?"}, "H001:T004": {"id": "H001:T004", "role": "seeker", "text": "Yes! Its very hard to keep positive with all the work I have and I feel I am not doing well."}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "Yes, I have a lot of exams right now and that on top of not hanging out with friends a lot lately has made life tough."}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "I can understand being stressed if you think you are not doing well in school and have a lot of work. How are your grades now?"}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "I still have decent grades but I feel like I am not prepared for big exams currently and they are worth a lot"}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "Yes, that can be tough. When I had a lot of tests coming up and a lot to study for, I wrote down goals to study -- like I broke down the classes and made certain goals to study a bit in each class. And then if I did that, I could go out with friends or some reward like that. "}, "H001:T009": {"id": "H001:T009", "role": "supporter", "text": "For example, if you have 7 classes, you can make a chart for when you will study for each of those classes and then check them off as you accomplish it, maybe not all in one day, maybe break it up in reasonable bits. Then study according to your goal, if that makes sense."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "I remember after each class, I would take 15 minutes to review all my notes from class, that seems short, but really, it adds up and helped so much."}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "Yes, I think you have excellent advice about organization. I feel like I lose track of what I have and when to do it. I also bounce between classes, feeling stressed because there is so much. Do you think doing one class at a time is best?"}, "H001:T012": {"id": "H001:T012", "role": "seeker", "text": "I also tend to save stuff sometimes so I have a lot of work build up with tests on the same days. I am not sure how to stop procrastinating."}, "H001:T013": {"id": "H001:T013", "role": "supporter", "text": "Yes, stick to one subject at a time. For example, if you think 1/2 hour is good enough to study, then stick to that. When done, your done until the next time it is on your schedule."}, "H001:T014": {"id": "H001:T014", "role": "seeker", "text": "Ok. Thank you so much for the ideas. It seems like you have had similar experiences with stress from school."}, "H001:T015": {"id": "H001:T015", "role": "supporter", "text": "Procrastination never makes us feel good. If I keep putting something off, I then feel guilty. If I make a goal, and I reach it, I can put a reward. For example, if you study 3 subjects 1/2 hour each, you can go out for yogurt with a friend. So you reward yourself for sticking to that goal."}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "Yes, I did. lol I'm really old now. This technique I use in all my life. Even house chores, I break it down into a schedule, put it in writing, then check off what I do. Then I feel good about my accomplishments."}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "Yes, that was my other question to you. It sounds great to just do a little time for each class but I often get overwhelmed and need a break"}, "H001:T018": {"id": "H001:T018", "role": "seeker", "text": "I have never used check lists or planners. I think it is part of how I get overwhelmed maybe."}, "H001:T019": {"id": "H001:T019", "role": "supporter", "text": "Definitely you need a break, so schedule them as rewards. You can even do 15 minutes in say 4 subjects, then take a walk, take a cup of tea, or call a friend, then back to the books. "}, "H001:T020": {"id": "H001:T020", "role": "supporter", "text": "Keep it as SIMPLE as possible, don't get bogged down. I used to think planning was TERRIBLE\u003c but actually, it sets one FREE. You feel so much better and accomplished when you see how much you have done. It really is amazing. "}, "H001:T021": {"id": "H001:T021", "role": "supporter", "text": "HOw man classes do you have?"}, "H001:T022": {"id": "H001:T022", "role": "supporter", "text": "many *"}, "H001:T023": {"id": "H001:T023", "role": "seeker", "text": "I have 6 classes"}, "H001:T024": {"id": "H001:T024", "role": "supporter", "text": "That's a lot but it is totally doable. Here is a good example, If you plant seeds in a garden today, you have to weed it a bit tomorrow, the next day, the next day, you have to wait for rain, then weed some more, the harvest comes and YAY! You are happy. But if you lie on your bed, never planting, never weeding, you procrastinate, you get nothing."}, "H001:T025": {"id": "H001:T025", "role": "supporter", "text": "If you write your classes down and then write a reasonable time to study each one. Maybe 3 today, 3 tomorrow, then add rewards if you do that, maybe make a list of rewards, so you can pick and choose, then you check off when you do the subject.  Like a chore chart. "}, "H001:T026": {"id": "H001:T026", "role": "seeker", "text": "Yes haha. That is a good comparison. You have been super helpful. I will for sure try to use your advice. Thank you!"}, "H001:T027": {"id": "H001:T027", "role": "seeker", "text": "Have a great day and thanks again"}, "H001:T028": {"id": "H001:T028", "role": "supporter", "text": "You are quite welcome! God bless have a great day!"}, "H002:T000": {"id": "H002:T000", "role": "supporter", "text": "Hello"}, "H002:T001": {"id": "H002:T001", "role": "supporter", "text": "How are you doing today?"}, "H002:T002": {"id": "H002:T002", "role": "seeker", "text": "hello"}, "H002:T003": {"id": "H002:T003", "role": "supporter", "text": "How can I help you?"}, "H002:T004": {"id": "H002:T004", "role": "seeker", "text": "I need ways alleviate stress while studying "}, "H002:T005": {"id": "H002:T005", "role": "supporter", "text": "It sounds like you are having some difficulty at school, I have definitely been there."}, "H002:T006": {"id": "H002:T006", "role": "seeker", "text": "yeah, it can be tough sometimes and feel like you're in a dead end situation"}, "H002:T007": {"id": "H002:T007", "role": "supporter", "text": "Yes I worked a dead end job for ages when I was younger and sometimes you just feel stuck"}, "H002:T008": {"id": "H002:T008", "role": "seeker", "text": "How did you push past that job?"}, "H002:T009": {"id": "H002:T009", "role": "supporter", "text": "I am going to be honest a little luck was involved I managed to impress a customer that came in and ended up applying at their work."}, "H002:T010": {"id": "H002:T010", "role": "seeker", "text": "Are you still with that job now, enough to consider it a career?"}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "I would say so I am an insurance broker, it has only been a year or so but there seems to be room to move up. You can find something too"}, "H002:T012": {"id": "H002:T012", "role": "seeker", "text": "Is there any advice for getting out of my situation?"}, "H002:T013": {"id": "H002:T013", "role": "seeker", "text": "aside from luck that is"}, "H002:T014": {"id": "H002:T014", "role": "supporter", "text": "Can you give me some more details?"}, "H002:T015": {"id": "H002:T015", "role": "seeker", "text": "I just find the work mundane and way too remedial "}, "H002:T016": {"id": "H002:T016", "role": "supporter", "text": "That is completely understandable"}, "H002:T017": {"id": "H002:T017", "role": "seeker", "text": "did you look at any websites or other job searching tools before you found your new job?"}, "H002:T018": {"id": "H002:T018", "role": "supporter", "text": "I have you a few, there are also many ways to gain skills online that buff up your resume a bit"}, "H002:T019": {"id": "H002:T019", "role": "seeker", "text": "what types of skill can I gain online?"}, "H002:T020": {"id": "H002:T020", "role": "supporter", "text": "Indeed is one of the better ones to look for jobs, honestly I would suggest looking at jobs that you normally wouldn't and see what kind of qualifications they need and see if you can get that done online."}, "H002:T021": {"id": "H002:T021", "role": "seeker", "text": "so filter based on my absolute needs and go for online skills that I can complete?"}, "H002:T022": {"id": "H002:T022", "role": "supporter", "text": "yes I think that is a great idea, look for jobs that meet your needs and figure out what you can do to look attractive to employers"}, "H002:T023": {"id": "H002:T023", "role": "seeker", "text": "I have tried glassdoor before, have you had any luck there?"}, "H002:T024": {"id": "H002:T024", "role": "supporter", "text": "I used it a bit, I mainly used indeed."}, "H002:T025": {"id": "H002:T025", "role": "seeker", "text": "and have you showcased your skills using LinkedIn before? I have had that one recommended to me before, they said its a great way to neatly organize accomplishments and personal background"}, "H002:T026": {"id": "H002:T026", "role": "supporter", "text": "Yes especially if you are applying for anything in a professional setting that is very important."}, "H002:T027": {"id": "H002:T027", "role": "seeker", "text": "do you have any examples of online skills you completed?"}, "H002:T028": {"id": "H002:T028", "role": "supporter", "text": "coursera has a lot of great courses, it really depends on what you are looking for."}, "H002:T029": {"id": "H002:T029", "role": "seeker", "text": "if I was looking to enter the engineering field, any recommendations?"}, "H002:T030": {"id": "H002:T030", "role": "supporter", "text": "Is that what you are going to school for?"}, "H002:T031": {"id": "H002:T031", "role": "seeker", "text": "yes but I may change my mind"}, "H002:T032": {"id": "H002:T032", "role": "supporter", "text": "What year are you in? most engineering programs have a practicum and that is a great opportunity to make contacts and potentially get offered a job"}, "H002:T033": {"id": "H002:T033", "role": "seeker", "text": "yes I have been networking as I go"}, "H002:T034": {"id": "H002:T034", "role": "supporter", "text": "Honestly you seem like you are pretty on top of this I don't think you will have any issues finding a job."}, "H002:T035": {"id": "H002:T035", "role": "seeker", "text": "yeah I mean the topic was about final exam stress but we got on a tangent"}, "H002:T036": {"id": "H002:T036", "role": "supporter", "text": "Yes that is fair enough, how much time do you have until your exam?"}, "H002:T037": {"id": "H002:T037", "role": "seeker", "text": "15 minutes"}, "H002:T038": {"id": "H002:T038", "role": "supporter", "text": "While that is plenty of time to get some studying done:)"}, "H002:T039": {"id": "H002:T039", "role": "seeker", "text": "yes I probably should, thank you for your insight!"}, "H002:T040": {"id": "H002:T040", "role": "supporter", "text": "Honestly I find that if you are going for the test right away I always like to just breath and relax a bit."}, "H002:T041": {"id": "H002:T041", "role": "seeker", "text": "yeah no use in cramming for more info when I could just chill out"}, "H002:T042": {"id": "H002:T042", "role": "supporter", "text": "You seem like you know what you are doing, I think you will do just fine"}, "H002:T043": {"id": "H002:T043", "role": "seeker", "text": "yup thanks"}, "H003:T000": {"id": "H003:T000", "role": "seeker", "text": "Hi"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "I am really very angry with my friends for not inviting me "}, "H003:T002": {"id": "H003:T002", "role": "supporter", "text": "Why is that?"}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "I didn't did any anything wrong to my friends but they are simply saying they forget me"}, "H003:T004": {"id": "H003:T004", "role": "seeker", "text": "So they no need on me , "}, "H003:T005": {"id": "H003:T005", "role": "seeker", "text": "I am not important person to them"}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "I have been angry with friends as well, but time loves a hero, as they say."}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "In my all events i am inviting them all but how they "}, "H003:T008": {"id": "H003:T008", "role": "seeker", "text": "Why what happen..?"}, "H003:T009": {"id": "H003:T009", "role": "supporter", "text": "How long have your friends been neglecting you??"}, "H003:T010": {"id": "H003:T010", "role": "seeker", "text": "In last 2 events only , what about you"}, "H003:T011": {"id": "H003:T011", "role": "supporter", "text": "Any other questions for me?"}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "I know it is hard at times, but be strong."}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "You are correct "}, "H003:T014": {"id": "H003:T014", "role": "seeker", "text": "sometime it will happen , but we should forget and move on"}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "How many best friends do you have ?"}, "H004:T000": {"id": "H004:T000", "role": "supporter", "text": "How can I help you today?"}, "H004:T001": {"id": "H004:T001", "role": "seeker", "text": "I'm disgusted with my professors that they don't see me as a human with real emotions and feelings."}, "H004:T002": {"id": "H004:T002", "role": "supporter", "text": "I understand that you are feeling like your professors don't see you as a person with feelings. What happened to make you feel this way?"}, "H004:T003": {"id": "H004:T003", "role": "seeker", "text": "I have testing all the time and study non-stop, but the professors don't seem to encourage or support me.  They just see me as a number I feel."}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "That's hard to feel like they are treating you like a number when you are working so hard.  Have you talked to them about it?"}, "H004:T005": {"id": "H004:T005", "role": "seeker", "text": "It's hard to trust them when I'm seen as 1 of 100 people.  If I am struggling they don't flinch or ask me how they can assist.  I just am expected to "}, "H004:T006": {"id": "H004:T006", "role": "seeker", "text": "tough it out."}, "H004:T007": {"id": "H004:T007", "role": "supporter", "text": "I had a similar experience in my college days. It was very difficult to have so much pressure to succeed and feel so alone.  You can do though because you are working hard and want to succeed."}, "H004:T008": {"id": "H004:T008", "role": "seeker", "text": "Thanks for the encouragement.  Where do I start to help myself feel better?"}, "H004:T009": {"id": "H004:T009", "role": "supporter", "text": "I see you are anxious about this when talking to you, but have you thought about getting some support from other students in your position?"}, "H004:T010": {"id": "H004:T010", "role": "seeker", "text": "That sounds like a good idea.  Maybe they are feeling this way too."}, "H004:T011": {"id": "H004:T011", "role": "supporter", "text": "Also sometimes just stepping back and taking some deep breaths can help to alleviate some anxieties. Have you tried that ever?"}, "H004:T012": {"id": "H004:T012", "role": "seeker", "text": "I will have to give that a try.  I've done that in the past and had forgotten just how much that helped me before.  "}, "H004:T013": {"id": "H004:T013", "role": "supporter", "text": "That is reassuring that it worked before for you and  can work again."}, "H004:T014": {"id": "H004:T014", "role": "seeker", "text": "I'm so worried about failing because I just don't feel the support from my professors to care either way for my successes.  It's so different from high school and home when my parents encouraged me and supported me full-heartedly.  "}, "H004:T015": {"id": "H004:T015", "role": "supporter", "text": "College can be quite a change from the protective atmosphere of home.  Have you tried any support groups or religious groups for encouragement?"}, "H004:T016": {"id": "H004:T016", "role": "seeker", "text": "I am religious so perhaps I could seek a group out and they could help with encouraging me.  "}, "H004:T017": {"id": "H004:T017", "role": "supporter", "text": "I was a  part of a religious group in college and they were very supportive even praying for me on exam days.  I felt they helped me with my success by planting seeds of positive feedback to me."}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "I used to be part of one during high school years, and that sounds like it would help."}, "H004:T019": {"id": "H004:T019", "role": "supporter", "text": "Are you starting to feel better about the situation?"}, "H004:T020": {"id": "H004:T020", "role": "seeker", "text": "Yes, I do thinking about other people filling in the gaps and supporting me when others won't or can't. Thanks for chatting.  This was helpful."}, "H004:T021": {"id": "H004:T021", "role": "supporter", "text": "You are welcome.  I wish you well."}, "H004:T022": {"id": "H004:T022", "role": "seeker", "text": "I think I have a few tools now to make things better."}, "H005:T000": {"id": "H005:T000", "role": "supporter", "text": "Hey Andrew, how have you been doing lately?"}, "H005:T001": {"id": "H005:T001", "role": "seeker", "text": "Not too great, to be honest. Things have been a little rough with my friends."}, "H005:T002": {"id": "H005:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about it?"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "Yeah, I confronted them about how they haven’t been inviting me to things, and it didn’t go as I hoped."}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "That must have been really hard for you. What happened when you talked to them?"}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "Well, some of them seemed surprised and apologetic, but others kind of brushed it off or got defensive."}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "It's understandable that you're feeling upset about that. How did their reactions make you feel?"}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "I feel really hurt by the ones who brushed it off. I thought we were closer than that."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "It's painful when people we care about don't respond the way we expect. It’s okay to feel hurt."}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "Yeah, and now I’m questioning whether I should even put in the effort to maintain those relationships."}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "That sounds frustrating. Have you had a chance to reconsider your friendships after this?"}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "I've been thinking about it a lot. I don’t want to lose friends, but I’m not sure I want to keep feeling left out either."}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "Your feelings are completely valid. It’s important that your needs are respected in your friendships."}, "H005:T013": {"id": "H005:T013", "role": "seeker", "text": "Thanks. It’s just hard to find a balance between speaking up for myself and risking losing people."}, "H005:T014": {"id": "H005:T014", "role": "supporter", "text": "I understand. It's a tough situation, but remember it's okay to prioritize your own well-being."}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "I guess I’ll need to think more about what I truly want from these friendships."}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "Taking the time to reflect is a good step. You deserve friends who make you feel valued and included."}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "Thanks for listening and helping me sort my thoughts. It really means a lot to me."}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "Anytime, Andrew. I'm here for you whenever you need to talk."}, "H006:T000": {"id": "H006:T000", "role": "supporter", "text": "Hello!"}, "H006:T001": {"id": "H006:T001", "role": "seeker", "text": "Hi"}, "H006:T002": {"id": "H006:T002", "role": "supporter", "text": "How are you doing today? Are there any particular issues you would like to discuss?"}, "H006:T003": {"id": "H006:T003", "role": "seeker", "text": "I think you are able to read about my situation, but if not, I've basically lost my best high school friends while in college."}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "It's pretty rough since I've known these people since I was in elementary school."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "I'm sorry to hear that. Did that make college difficult for you?"}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "It did - I had to figure out what was important in life after that but the loss of my high school friends drove me into a mild depression."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "Of course. Do you still experience feelings of sadness when thinking of that time in your life?"}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "Occasionally when I think about that time in my life.  "}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "Does that loss still affect your day-to-day life or do you feel like you were able to handle those feelings in a healthy way?"}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "I am still feeling the effects of it today.  I don't know exactly how to cope properly."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "It sounds like you're still struggling with that loss. That is entirely normal.  "}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "That's great that it's normal....but I'm not sure how that's helping me."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "It sounds like you're looking for a way to handle these feelings in a healthy way. Am i right in that? "}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "I guess so.  I'm not sure where to start or even if I need do."}, "H006:T015": {"id": "H006:T015", "role": "seeker", "text": "to"}, "H006:T016": {"id": "H006:T016", "role": "supporter", "text": "That makes sense. Some feelings of sadness around a loss are normal but they can be a problem if they start interfering with functioning. Do you have a support network or someone you can turn to when you feel like this?"}, "H006:T017": {"id": "H006:T017", "role": "seeker", "text": "I have a spouse but they weren't around when this series of unfortunate events occurred."}, "H006:T018": {"id": "H006:T018", "role": "supporter", "text": "Do you feel like you talk to your spouse about these issues?"}, "H006:T019": {"id": "H006:T019", "role": "seeker", "text": "No, it's something I keep inside.  I'm a super private person."}, "H006:T020": {"id": "H006:T020", "role": "supporter", "text": "From what I have seen, if people try to keep their emotions inside, it can be more damaging in the long run. This isn't something you have handle all by yourself."}, "H006:T021": {"id": "H006:T021", "role": "seeker", "text": "Agreed, I guess.  Maybe it's time to share more with my spouse.  I don't think it's that big an issue.  I just don't like talking about it."}, "H006:T022": {"id": "H006:T022", "role": "supporter", "text": "That's completely fair. It can be a difficult thing to talk about. When those feelings do come up, can you think of ways to discuss it with your spouse?"}, "H006:T023": {"id": "H006:T023", "role": "seeker", "text": "I think so.   I'm thinking we can do it over dinner one night while it's quiet in the house so we can talk"}, "H006:T024": {"id": "H006:T024", "role": "supporter", "text": "I think that's a wonderful idea. From what I've seen, it can be really difficult to talk about, but afterwards it does get easier. You deserve the chance to remember the good memories of your friendship and not carry your difficult feelings by yourself."}, "H006:T025": {"id": "H006:T025", "role": "seeker", "text": "I guess thats true - thanks for chatting with me about this."}, "H006:T026": {"id": "H006:T026", "role": "supporter", "text": "Absolutely, I wish you all the best."}, "H007:T000": {"id": "H007:T000", "role": "seeker", "text": "Hey, just need someone to talk to. Things have been rough lately."}, "H007:T001": {"id": "H007:T001", "role": "supporter", "text": "I'm here for you, Andrew. What's been going on?"}, "H007:T002": {"id": "H007:T002", "role": "seeker", "text": "Jenny and I had this huge fight about our careers. It feels like everything is falling apart."}, "H007:T003": {"id": "H007:T003", "role": "supporter", "text": "I'm sorry to hear that. Conflicts like that can be really tough. Do you want to share more about what happened?"}, "H007:T004": {"id": "H007:T004", "role": "seeker", "text": "We both have different goals right now. She's focused on her career and I am trying to balance my studies and future plans, but we're not aligned."}, "H007:T005": {"id": "H007:T005", "role": "supporter", "text": "That must be really stressful, trying to juggle everything. It's understandable that you'd want to have shared goals. How does that make you feel?"}, "H007:T006": {"id": "H007:T006", "role": "seeker", "text": "Frustrated and a bit scared, honestly. I love Jenny a lot, but I don't know how to bridge this gap between us."}, "H007:T007": {"id": "H007:T007", "role": "supporter", "text": "It sounds like you're feeling really torn. Having a partner is about being on the same page, and when that doesn't happen, it's really hard. Have you two had a chance to sit down and talk more calmly about your priorities?"}, "H007:T008": {"id": "H007:T008", "role": "seeker", "text": "We tried, but every conversation seems to circle back to the same issues. It's like we're speaking different languages."}, "H007:T009": {"id": "H007:T009", "role": "supporter", "text": "Communication can be so tricky, especially when emotions run high. Have you considered maybe seeking some outside help, like a counselor or someone who might help you both communicate more effectively?"}, "H007:T010": {"id": "H007:T010", "role": "seeker", "text": "I've thought about it. Just not sure how she'll react to the suggestion. I'm scared it might make things worse between us."}, "H007:T011": {"id": "H007:T011", "role": "supporter", "text": "I can understand your hesitation. Sometimes it might feel risky, but often it can open new avenues you haven't considered. You know, the fact that you care this much shows how much you're willing to make things work."}, "H007:T012": {"id": "H007:T012", "role": "seeker", "text": "Yeah, I guess you're right. I do really want this to work out. I can't imagine not being with her."}, "H007:T013": {"id": "H007:T013", "role": "supporter", "text": "It’s clear you deeply value your relationship. Maybe in time, you both can find a compromise. Meanwhile, it's important to not lose sight of taking care of yourself too."}, "H007:T014": {"id": "H007:T014", "role": "seeker", "text": "True, I haven't really been paying much attention to myself. I’ve been swamped with studies and stress over all this."}, "H007:T015": {"id": "H007:T015", "role": "supporter", "text": "It's really easy to forget self-care when you're dealing with so much. Maybe taking some time to regroup could help you clear your mind and see things more clearly."}, "H007:T016": {"id": "H007:T016", "role": "seeker", "text": "You're right. I should probably take a step back, even just a little bit. Maybe it will help me see things from a different perspective."}, "H007:T017": {"id": "H007:T017", "role": "supporter", "text": "I think that's a great start, Andrew. It doesn’t mean you're giving up; it means you're taking the time to recharge so you can come back stronger."}, "H007:T018": {"id": "H007:T018", "role": "seeker", "text": "Thanks, I think I'll try to find some space for myself. And maybe talk to Jenny about counseling, test the waters at least."}, "H007:T019": {"id": "H007:T019", "role": "supporter", "text": "Sounds like a solid plan. Remember, I'm just a message away if you need more support."}, "H007:T020": {"id": "H007:T020", "role": "seeker", "text": "Thanks for listening and for the advice. It’s really helped just to talk things out."}, "H007:T021": {"id": "H007:T021", "role": "supporter", "text": "Anytime, Andrew. You're going through a lot, but I'm confident you'll figure things out. Take care of yourself, okay?"}, "H007:T022": {"id": "H007:T022", "role": "seeker", "text": "I will. Thanks again."}, "H008:T000": {"id": "H008:T000", "role": "supporter", "text": "Hey Andrew, how are you feeling today?"}, "H008:T001": {"id": "H008:T001", "role": "seeker", "text": "Hey. Not great, to be honest. Just got some feedback on my thesis that's really got me down."}, "H008:T002": {"id": "H008:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what they said?"}, "H008:T003": {"id": "H008:T003", "role": "seeker", "text": "Yeah, sure. My advisor thought it lacked depth and wasn't very clear in parts. It feels like so much work just went down the drain."}, "H008:T004": {"id": "H008:T004", "role": "supporter", "text": "That sounds really frustrating. You've put so much effort into this. It makes sense that you'd feel discouraged."}, "H008:T005": {"id": "H008:T005", "role": "seeker", "text": "Yeah, and it's just on top of everything else. Things with Jenny aren't great either. We argued about my career priorities last week."}, "H008:T006": {"id": "H008:T006", "role": "supporter", "text": "It seems like there's a lot going on for you right now. The argument with Jenny must be weighing heavily on your mind too."}, "H008:T007": {"id": "H008:T007", "role": "seeker", "text": "It is. I'm just feeling like I'm not making anyone happy, including myself."}, "H008:T008": {"id": "H008:T008", "role": "supporter", "text": "It makes sense you'd feel that way. Sometimes when things stack up, it feels overwhelming. What do you think might help right now?"}, "H008:T009": {"id": "H008:T009", "role": "seeker", "text": "Honestly, I don't even know. Maybe just talking it through with someone helps a bit, like this conversation."}, "H008:T010": {"id": "H008:T010", "role": "supporter", "text": "That's good to hear. I'm here to listen. You're not alone in this, even if it feels like it sometimes."}, "H008:T011": {"id": "H008:T011", "role": "seeker", "text": "Thanks. I guess with everything happening, I just forgot how to take care of myself for a bit."}, "H008:T012": {"id": "H008:T012", "role": "supporter", "text": "It's understandable. Self-care is often the first thing we overlook when life's pressures pile up. Is there anything small you can do for yourself today?"}, "H008:T013": {"id": "H008:T013", "role": "seeker", "text": "Maybe I'll take a walk. It usually clears my head, even if just a bit."}, "H008:T014": {"id": "H008:T014", "role": "supporter", "text": "That sounds like a great idea. Fresh air and a change of scenery can work wonders."}, "H008:T015": {"id": "H008:T015", "role": "seeker", "text": "Yeah, I should do that more. I generally get lost in my work these days."}, "H008:T016": {"id": "H008:T016", "role": "supporter", "text": "It can be easy to get caught up, especially when there's pressure to perform. Do you feel like you're getting enough support from those around you?"}, "H008:T017": {"id": "H008:T017", "role": "seeker", "text": "Not really. My friends didn't react well when I confronted them about feeling left out, and things with Jenny are tense."}, "H008:T018": {"id": "H008:T018", "role": "supporter", "text": "I'm sorry to hear that. Friendships can be complicated, especially when you feel left out. Do you think any of them might be open to another conversation?"}, "H008:T019": {"id": "H008:T019", "role": "seeker", "text": "Maybe. I'll have to see. I just wish things would settle down."}, "H008:T020": {"id": "H008:T020", "role": "supporter", "text": "It's understandable to feel that way. It's clear you're dealing with a lot right now. Having someone to talk to each step of the way can make it just a bit easier."}, "H008:T021": {"id": "H008:T021", "role": "seeker", "text": "Yeah. I'm glad I reached out today. It helps to get some perspective."}, "H008:T022": {"id": "H008:T022", "role": "supporter", "text": "Anytime, Andrew. You're doing your best, and that's all anyone can ask right now."}, "H008:T023": {"id": "H008:T023", "role": "seeker", "text": "Thanks for listening. I needed it."}, "H008:T024": {"id": "H008:T024", "role": "supporter", "text": "You're welcome. Take care of yourself and remember to reach out whenever you need to."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hey, could really use someone to talk to right now. Things have been tough."}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Hi Andrew, I'm here for you. What's been going on?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "Jenny and I had another intense talk about our future, and it left me feeling pretty conflicted."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "I'm sorry to hear that. It sounds rough. Do you want to share what the conversation was about?"}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "We talked about family plans and our careers. It's like we're on different pages, and it's been hard to find common ground."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "That must be incredibly stressful. It's tough when future visions don't align perfectly. How are you feeling about it now?"}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "I'm worried and confused. I love her, but this constant tension is exhausting. I don't know how much more I can take."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "Your feelings are completely valid. It's a lot to handle, especially when you care so much about her."}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "Thanks. I'm trying to be patient and understanding, but sometimes it's hard to see a way forward."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "It makes sense to feel that way. Have you both considered seeking couples counseling? It might help facilitate communication."}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "We've talked about it briefly, but never seriously. I think we both feel like we can handle it ourselves, but maybe it's time to reconsider."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "It could be worth exploring. Sometimes an outside perspective can help clear the air and clarify your feelings."}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "True. I guess what worries me is, what if even that doesn't help? What if we're just too different?"}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "That's a valid concern, Andrew. But it seems like you're both committed to trying to make it work, and that's a strong foundation."}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "I hope so. It scares me to think about making the wrong choice for both our futures."}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "The fact that you’re thinking about her shows how much you care. Taking the time to explore your options could bring some clarity."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "You're right. I think I owe it to both of us to at least try counseling. It might help us understand each other better."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "That sounds like a positive step. I'm here to support you through it, whatever you decide."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "Thanks so much. I feel a bit better knowing there's a path forward, even if it's a challenging one."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "It might be challenging, but I'm confident you'll find your way. You're doing great by looking into solutions."}, "H010:T000": {"id": "H010:T000", "role": "supporter", "text": "Hey Andrew! How have you been doing lately?"}, "H010:T001": {"id": "H010:T001", "role": "seeker", "text": "Hi. It's been a bit rough, to be honest."}, "H010:T002": {"id": "H010:T002", "role": "supporter", "text": "I'm sorry to hear that. Would you like to talk about what's been going on?"}, "H010:T003": {"id": "H010:T003", "role": "seeker", "text": "Yeah, well, I've been feeling pretty isolated. Even tried connecting with folks online through gaming, but it's not the same."}, "H010:T004": {"id": "H010:T004", "role": "supporter", "text": "I can understand how online interactions might not fully replace face-to-face connections. What has made you feel isolated?"}, "H010:T005": {"id": "H010:T005", "role": "seeker", "text": "A few things, I guess. There was the disagreement with Jenny a few weeks ago, then some discouragement from my thesis advisor."}, "H010:T006": {"id": "H010:T006", "role": "supporter", "text": "That sounds like a lot to handle. Have you been able to talk to Jenny more about the disagreement?"}, "H010:T007": {"id": "H010:T007", "role": "seeker", "text": "Not really. After our conversation about family plans, things have been a bit tense."}, "H010:T008": {"id": "H010:T008", "role": "supporter", "text": "I see. It's important to address what's going on between you two. How are you feeling about your career and future plans?"}, "H010:T009": {"id": "H010:T009", "role": "seeker", "text": "Conflicted. My career is important to me, but I don't want to lose sight of personal life either."}, "H010:T010": {"id": "H010:T010", "role": "supporter", "text": "Balancing those priorities can be tough. Have you thought about what makes you happiest or what you visualize for your future?"}, "H010:T011": {"id": "H010:T011", "role": "seeker", "text": "I want to succeed in my field, but also have a fulfilling personal life. It's just... sometimes I feel like I can't have both."}, "H010:T012": {"id": "H010:T012", "role": "supporter", "text": "It's understandable to feel that way. Maybe both aspects of your life can complement each other in some ways."}, "H010:T013": {"id": "H010:T013", "role": "seeker", "text": "I hope so. I've also been reflecting on my social circle, especially since that confrontation."}, "H010:T014": {"id": "H010:T014", "role": "supporter", "text": "Right, that sounded intense. Has anything changed with your friends since then?"}, "H010:T015": {"id": "H010:T015", "role": "seeker", "text": "Not much. Some reached out, others didn't. Makes me question who really values my friendship."}, "H010:T016": {"id": "H010:T016", "role": "supporter", "text": "It must be hard to navigate those feelings. What have you learned about your needs from these interactions?"}, "H010:T017": {"id": "H010:T017", "role": "seeker", "text": "I think I need authenticity and people who really want me around. Just craving meaningful connections."}, "H010:T018": {"id": "H010:T018", "role": "supporter", "text": "That makes a lot of sense. Remembering what you value can help guide you in deepening new and existing relationships."}, "H010:T019": {"id": "H010:T019", "role": "seeker", "text": "Yeah, I think I need to reach out more and find communities that align with what I'm looking for."}, "H010:T020": {"id": "H010:T020", "role": "supporter", "text": "That's a great approach. I'm here to support you if you need any help finding those connections."}, "H010:T021": {"id": "H010:T021", "role": "seeker", "text": "Thanks, that means a lot. It's been tough, but I'm hopeful light will come out of it all."}, "H010:T022": {"id": "H010:T022", "role": "supporter", "text": "I'm sure it will. You've shown a lot of strength already. Let's keep working through it together."}}, "current_date": "2025-01-01", "last_seeker": "I've been considering exploring alternative energy sources, like renewables. It's something that aligns with my values and seems rewarding."}, "21e58797bade46a2c0124f77b1615a23ebdc7b8cf825a61d44b8e052da2a1af8": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "Hey, I really needed someone to talk to today."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "Hello"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Hello, I hope you can help me."}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "Sure I can"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "I work hard at my job in an office.  We acquired another company and my job is now twice the work."}, "H001:T004": {"id": "H001:T004", "role": "seeker", "text": "Two of my coworkers have gotten a raise and I have not gotten anything!"}, "H001:T005": {"id": "H001:T005", "role": "supporter", "text": "Have you talked to your boss about it?"}, "H001:T006": {"id": "H001:T006", "role": "seeker", "text": "I have hinted around that my job is sooo busy and he knows it, I haven't come out and said anything yet."}, "H001:T007": {"id": "H001:T007", "role": "supporter", "text": "I can understand how you feeling you work extremely hard and get no raise when you deserve it"}, "H001:T008": {"id": "H001:T008", "role": "seeker", "text": "Yes, I have been at the job for 15 years and make a decent salary but this amount of work is insane.  Do you think I should bring it up to him\u003e"}, "H001:T009": {"id": "H001:T009", "role": "supporter", "text": "oh wow 15 years? I really believe you need a raise and doing more work now."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "I honestly think you should bring it up to your boss"}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "Yes, I think so too.  I like my boss but he is funny about things sometimes.  Any ideas on how I could bring it up to him.  I hate feeling this way, my attitude is really turning sour."}, "H001:T012": {"id": "H001:T012", "role": "supporter", "text": "I can't believe he has not given you a raise by now "}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "I know!"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "Just tell him that you need to have a serious talk with him and tell him straight up what is on your mind don't hold it back"}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "So, I guess I'll have to be honest and brave at the same time.  "}, "H001:T016": {"id": "H001:T016", "role": "seeker", "text": "Do you think I should bring in proof....paperwork, etc.  I have been working extra as well."}, "H001:T017": {"id": "H001:T017", "role": "supporter", "text": "Yes I know you can do it but that is the only way to solve the situation is by communicating with him"}, "H001:T018": {"id": "H001:T018", "role": "supporter", "text": "Yes that would help more by bringing in proof to him "}, "H001:T019": {"id": "H001:T019", "role": "seeker", "text": "Ok, I am just so angry over the whole thing, I'm going to have to keep my cool and let him know without getting an attitude, do you think that will work?"}, "H001:T020": {"id": "H001:T020", "role": "supporter", "text": "Yes just remain calm with him "}, "H001:T021": {"id": "H001:T021", "role": "seeker", "text": "I will try, I hope I don't start crying!  I tend to get frustrated and cry."}, "H001:T022": {"id": "H001:T022", "role": "supporter", "text": "getting a attitude with him will not help at all "}, "H001:T023": {"id": "H001:T023", "role": "seeker", "text": "Yes, you are right, it will make it a bad situation."}, "H001:T024": {"id": "H001:T024", "role": "supporter", "text": "Don't let this situation get to you so much "}, "H001:T025": {"id": "H001:T025", "role": "seeker", "text": "O"}, "H001:T026": {"id": "H001:T026", "role": "seeker", "text": "oops"}, "H001:T027": {"id": "H001:T027", "role": "seeker", "text": "I'll try not to, I have to be calm, like you said"}, "H001:T028": {"id": "H001:T028", "role": "supporter", "text": "Everything will be ok"}, "H001:T029": {"id": "H001:T029", "role": "seeker", "text": "Thank you so much for your positive support!"}, "H001:T030": {"id": "H001:T030", "role": "seeker", "text": "I'll let him know I need to talk and I'll remain calm"}, "H001:T031": {"id": "H001:T031", "role": "supporter", "text": "Your welcome i am sure he will give you a raise once you talk to him"}, "H001:T032": {"id": "H001:T032", "role": "seeker", "text": "Fingers crossed!  I really have gone above and beyond and feel I really deserve it."}, "H001:T033": {"id": "H001:T033", "role": "supporter", "text": "I will be praying that you get the raise because you deserve it"}, "H001:T034": {"id": "H001:T034", "role": "seeker", "text": "Thank you so much, you've been very helpful!"}, "H001:T035": {"id": "H001:T035", "role": "supporter", "text": "Your most welcome"}, "H001:T036": {"id": "H001:T036", "role": "seeker", "text": "Merry Christmas!"}, "H001:T037": {"id": "H001:T037", "role": "supporter", "text": "Merry Christmas to you to!"}, "H002:T000": {"id": "H002:T000", "role": "supporter", "text": "Hello"}, "H002:T001": {"id": "H002:T001", "role": "seeker", "text": "Hello, I am looking for help in managing some depression."}, "H002:T002": {"id": "H002:T002", "role": "supporter", "text": "You've come to a good place to start."}, "H002:T003": {"id": "H002:T003", "role": "supporter", "text": "Is there something in particular that is leaving you feeling depressed?"}, "H002:T004": {"id": "H002:T004", "role": "seeker", "text": "I am feeling resentful towards my husband for quitting his job, and my son for being the reason that he quit his job."}, "H002:T005": {"id": "H002:T005", "role": "seeker", "text": "My son's behavior is causing a lot of conflict in our house and my husband not working is putting a lot of financial stress on us"}, "H002:T006": {"id": "H002:T006", "role": "supporter", "text": "I'm sorry to hear that. Feeling resentment for both your husband's loss of work and your son's loss of his job is entirely understandable. "}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "I have a hard time not dwelling on the negative things going on.  It's hard to see anything positive or feel hopeful for the future."}, "H002:T008": {"id": "H002:T008", "role": "supporter", "text": "I have an adult son who also lost his job recently, and I understand the added stress that can cause in your household. "}, "H002:T009": {"id": "H002:T009", "role": "supporter", "text": "That is a really difficult position to be in. "}, "H002:T010": {"id": "H002:T010", "role": "seeker", "text": "My son is very defiant and argues with us about everything we try and get him to do, but he expects us to give him money for fun things that he wants to do when he isn't willing to work or even help out around the house"}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "Regardless of what your husband's actions are and your son's, could you possibly make the time to do things to support yourself, that even momentarily would provide you with some positive feelings? "}, "H002:T012": {"id": "H002:T012", "role": "seeker", "text": "I try to go for a run every night, that does help.  "}, "H002:T013": {"id": "H002:T013", "role": "supporter", "text": "That is very hard emotionally, so I am sorry you have to deal with your son's behavior."}, "H002:T014": {"id": "H002:T014", "role": "seeker", "text": "It is hard to keep my emotions separate from what is going on with him"}, "H002:T015": {"id": "H002:T015", "role": "supporter", "text": "That is very understandable! Setting boundaries for yourself may help. Even when it's difficult, being clear with your son that you will not be giving him money could help. "}, "H002:T016": {"id": "H002:T016", "role": "supporter", "text": "Sometimes being clear with your own expectations can help him to see what won't be accepted from him as long as he is living in your home."}, "H002:T017": {"id": "H002:T017", "role": "seeker", "text": "Yes, I could do better at that.  I want him to have fun and do things with friends, but I want him to be willing to work for what he wants, too.  "}, "H002:T018": {"id": "H002:T018", "role": "seeker", "text": "I do struggle with expectations.  I want him to be someone that he is not willing to be, I need to let go of that and just let him be himself and not base my emotions on his choices."}, "H002:T019": {"id": "H002:T019", "role": "supporter", "text": "I completely understand that. Especially when it comes to people we are close to, it can be hard to separate our expectations from theirs. "}, "H002:T020": {"id": "H002:T020", "role": "seeker", "text": "I feel guilty sometimes taking time to do things that I like and that are away from my family.  I can see that I need to do that more, though."}, "H002:T021": {"id": "H002:T021", "role": "supporter", "text": "I've had to learn this lesson many times with my own children. It's difficult, but ultimately will give you some relief from your resentment. "}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "Thank you, it is helpful to know that other people have felt the same way."}, "H002:T023": {"id": "H002:T023", "role": "supporter", "text": "Absolutely! Being a parent is difficult. Remembering to support yourself helps. Making the time to do things to support your wellbeing doesn't make you selfish at all"}, "H002:T024": {"id": "H002:T024", "role": "seeker", "text": "Thank you!"}, "H002:T025": {"id": "H002:T025", "role": "supporter", "text": "You are certainly not alone."}, "H002:T026": {"id": "H002:T026", "role": "supporter", "text": "Has any of this been helpful? Is there more I can do for you?"}, "H003:T000": {"id": "H003:T000", "role": "seeker", "text": "hi,I'm in depression because my kids not listen to me."}, "H003:T001": {"id": "H003:T001", "role": "supporter", "text": "just stay calm"}, "H003:T002": {"id": "H003:T002", "role": "seeker", "text": "yes but they not listen to me"}, "H003:T003": {"id": "H003:T003", "role": "supporter", "text": "told him to do politely"}, "H003:T004": {"id": "H003:T004", "role": "seeker", "text": "yes but I'm angary on them because they not study"}, "H003:T005": {"id": "H003:T005", "role": "supporter", "text": "you should teach them that what they want to study"}, "H003:T006": {"id": "H003:T006", "role": "seeker", "text": "yes but they are busy on their phones all the time"}, "H003:T007": {"id": "H003:T007", "role": "supporter", "text": "just borrow their mobile phones from them"}, "H003:T008": {"id": "H003:T008", "role": "seeker", "text": "They say we can do studies if you let us to play game"}, "H003:T009": {"id": "H003:T009", "role": "supporter", "text": "just strictly told them to do study 1st and got a good mark then only you will give them their phones."}, "H003:T010": {"id": "H003:T010", "role": "seeker", "text": "yes i will try this thanks to giving me support "}, "H003:T011": {"id": "H003:T011", "role": "supporter", "text": "yeah sure.thanks too"}, "H003:T012": {"id": "H003:T012", "role": "seeker", "text": "They are saying to me that study is boring and playing games is fun"}, "H003:T013": {"id": "H003:T013", "role": "supporter", "text": "then told them to study or else you will broke that mobile."}, "H003:T014": {"id": "H003:T014", "role": "seeker", "text": "yes but those are very expensive "}, "H003:T015": {"id": "H003:T015", "role": "supporter", "text": "isn't that expensive when compared to your child goodness"}, "H003:T016": {"id": "H003:T016", "role": "seeker", "text": "yes you are right my kids study is more important then this"}, "H003:T017": {"id": "H003:T017", "role": "supporter", "text": "yeah then do this automatically your kids will start to study."}, "H003:T018": {"id": "H003:T018", "role": "seeker", "text": "Thinks for giving me support "}, "H003:T019": {"id": "H003:T019", "role": "supporter", "text": "sure i am always ready you to give my support"}, "H003:T020": {"id": "H003:T020", "role": "seeker", "text": "Thanks, buy"}, "H003:T021": {"id": "H003:T021", "role": "supporter", "text": "bye"}, "H004:T000": {"id": "H004:T000", "role": "seeker", "text": "Hi I am seeking support to assist me with better sleep patterns."}, "H004:T001": {"id": "H004:T001", "role": "supporter", "text": "Hi there, let me get a deeper understanding of your existing sleep pattern. Do you suffer from insomnia or another type of sleep disorder? "}, "H004:T002": {"id": "H004:T002", "role": "seeker", "text": "No, it is not insomnia.  "}, "H004:T003": {"id": "H004:T003", "role": "supporter", "text": "Okay, are you drinking enough water and eating a healthy diet? "}, "H004:T004": {"id": "H004:T004", "role": "seeker", "text": "I could improve my water intake and eat more vegatables."}, "H004:T005": {"id": "H004:T005", "role": "supporter", "text": "I like to analyze my own habits every now and then, it helps me stay in check. You can definitely benefit from meditating and self reflecting. "}, "H004:T006": {"id": "H004:T006", "role": "seeker", "text": "Thanks!  What other ideas do you have?"}, "H004:T007": {"id": "H004:T007", "role": "supporter", "text": "Of course! I always knock right out after a workout. But if you aren't able to, just simple things like turning all the lights off at the same time every night and laying in bed will help. It will align your circadian rhythm! "}, "H004:T008": {"id": "H004:T008", "role": "seeker", "text": "Great, but I wake up frequently thinking about the recent events surrounding police and how they treat black people."}, "H004:T009": {"id": "H004:T009", "role": "supporter", "text": "It definitely is a valid reason to be kept awake. The only good part about something so horrible, is that you have the power to make sure you will continue to be a good person. If everyone was as empathetic as you, the world would be a better place. Thank you for caring so deeply about such a brutal matter. "}, "H004:T010": {"id": "H004:T010", "role": "seeker", "text": "I wish there were more caring people in the world. "}, "H004:T011": {"id": "H004:T011", "role": "supporter", "text": "Kindness is contagious, and you definitely have a kind heart. As long as you remain soft in a hard world, people will recognize that and follow suit. The world is becoming more aware, and we have the power to raise future generations with more knowledge and love for one another. Caring doesn't come naturally to many unfortunately, but the ways of inspiring the people that don't care, are endless. We as a society can definitely think of more ways to care for one another. "}, "H004:T012": {"id": "H004:T012", "role": "seeker", "text": "Correct, but having a kind heart does not keep me from waking up \u0026 worrying about my son and other black men in my family. "}, "H004:T013": {"id": "H004:T013", "role": "supporter", "text": "I worry about my sons and husband and father all the time... I shift my focus on loving them and cherishing every moment we have together. Police or not, the time we have is not promised.. "}, "H004:T014": {"id": "H004:T014", "role": "seeker", "text": "That's good advice."}, "H004:T015": {"id": "H004:T015", "role": "seeker", "text": "Are you still there?"}, "H004:T016": {"id": "H004:T016", "role": "supporter", "text": "A hot cup of tea never hurt too! But in all seriousness, I can completely understand your sleep troubles. It is much deeper than just that. Perspective is the key to life. You are a strong and empathetic soul. "}, "H004:T017": {"id": "H004:T017", "role": "seeker", "text": "okay"}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "Love conquers all"}, "H004:T019": {"id": "H004:T019", "role": "supporter", "text": "That is so beautifully true "}, "H004:T020": {"id": "H004:T020", "role": "seeker", "text": "I'm looking forward to a fulls night rest. "}, "H004:T021": {"id": "H004:T021", "role": "supporter", "text": "That is good, lavender baths or showers will also ease and relax the troubled mind. "}, "H004:T022": {"id": "H004:T022", "role": "seeker", "text": "Relaxing is good therapy. "}, "H004:T023": {"id": "H004:T023", "role": "supporter", "text": "I like to relax with a book and a blanket sometimes too. "}, "H004:T024": {"id": "H004:T024", "role": "seeker", "text": "Self care is needed."}, "H004:T025": {"id": "H004:T025", "role": "supporter", "text": "Self care is definitely something we can overlook accidentally. Being self aware is a daily practice."}, "H004:T026": {"id": "H004:T026", "role": "seeker", "text": "I agree.  Loving ourselves \u0026 the ones we care about too.  "}, "H004:T027": {"id": "H004:T027", "role": "supporter", "text": "It is good that we spoke today, I am going to hug my sons a little harder when I see them tonight. "}, "H005:T000": {"id": "H005:T000", "role": "seeker", "text": "Hey, are you around? I could really use someone to talk to."}, "H005:T001": {"id": "H005:T001", "role": "supporter", "text": "Of course, Emily. I'm here for you. What's going on?"}, "H005:T002": {"id": "H005:T002", "role": "seeker", "text": "Bob and I had a big argument last night. I haven't been able to stop thinking about it."}, "H005:T003": {"id": "H005:T003", "role": "supporter", "text": "I'm sorry to hear that. Arguments can be really tough. Do you want to share what happened?"}, "H005:T004": {"id": "H005:T004", "role": "seeker", "text": "Yeah, it just spiraled out of control. We started talking about our finances, and it just got heated."}, "H005:T005": {"id": "H005:T005", "role": "supporter", "text": "Financial pressures can put so much strain on relationships. It's completely understandable to feel overwhelmed. How are you feeling now?"}, "H005:T006": {"id": "H005:T006", "role": "seeker", "text": "Exhausted, honestly. It's like we're stuck in this cycle of stress, and I don't see a way out."}, "H005:T007": {"id": "H005:T007", "role": "supporter", "text": "It sounds really challenging, Emily. It's okay to feel this way. Have you two been able to talk it out since it happened?"}, "H005:T008": {"id": "H005:T008", "role": "seeker", "text": "Not yet. We both needed some space. Bob went for a drive, and I've just been trying to calm down."}, "H005:T009": {"id": "H005:T009", "role": "supporter", "text": "T
