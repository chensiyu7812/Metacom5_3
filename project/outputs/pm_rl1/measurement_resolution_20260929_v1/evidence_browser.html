"id": "H008:T010", "role": "seeker", "text": "I will have to try that.  That might help."}, "H008:T011": {"id": "H008:T011", "role": "supporter", "text": "Have you thought of doing additional work related trainings?  Sometimes they can give suggestions to improve work abilities."}, "H008:T012": {"id": "H008:T012", "role": "seeker", "text": "That sounds great.  Do you think my work would be supportive?"}, "H008:T013": {"id": "H008:T013", "role": "supporter", "text": "Work can often pay for trainings or offer suggestions what may improve work strategies."}, "H008:T014": {"id": "H008:T014", "role": "seeker", "text": "Wow, I hope I can take advantage of that.  I will have to check into that.  Who should I approach at work?"}, "H008:T015": {"id": "H008:T015", "role": "supporter", "text": "You could ask your immediate supervisor or sometimes Human resources for support."}, "H008:T016": {"id": "H008:T016", "role": "seeker", "text": "I can do that.  I think I'll reach out tomorrow to Human Resources for some help."}, "H008:T017": {"id": "H008:T017", "role": "supporter", "text": "That sounds like a good plan to reach out for support.  Is there anything else I can help with?"}, "H008:T018": {"id": "H008:T018", "role": "seeker", "text": "No that should be all.  I am feeling more confident in strategies to use to help me.  Thanks"}, "H008:T019": {"id": "H008:T019", "role": "supporter", "text": "You are very welcome."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hi, just needed someone to talk to."}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Hi Jane! Of course, I'm here for you. What's on your mind?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "I had my performance review at work today... and it wasn't great."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "I'm sorry to hear that. It sounds like it must be really tough to hear. How are you feeling about it?"}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "I'm feeling anxious and a bit of self-doubt creeping in. I thought I was handling everything okay."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "It's completely understandable to feel that way. It seems like there's been a lot on your plate recently. Would you like to talk more about it?"}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "I guess everything's just been snowballing since the thing with Lisa. I still can't believe how it all fell apart."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "Losing a friend, especially over something like money, can feel really isolating. How has it been affecting you lately?"}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "It's made focusing on work harder. And getting hit with that unexpected bill last month didn't help. Everything feels out of control."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "It sounds like you're dealing with a lot of financial and emotional stress right now. It's a lot for anyone to handle. How have you been coping with it all?"}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "I started writing in a journal. It helps sometimes, but the stress keeps piling up. I thought it would get better by now."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "Journaling can be a great outlet. It's important to give yourself grace with everything happening. You're doing your best in a really challenging time."}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "Thank you. I keep telling myself that, but it's hard to believe it sometimes. I just wish things would turn around."}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "It makes sense to want things to improve quickly. Progress can be slow, but you're taking steps in the right direction by reaching out and processing everything going on."}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "Yeah, it helps to talk about it. I suppose I need to take it one day at a time."}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "Absolutely. It's like building a path through all these challenges— day by day, step by step. You have the strength to navigate this, even if it doesn't feel like it sometimes."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "I really appreciate your support. It makes things feel a bit less overwhelming."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "I'm glad to be here for you. Remember, you're not alone in this. We can keep talking anytime you need."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "Thanks a lot. I might take you up on that."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "Anytime, Jane. Take care of yourself, and reach out whenever you need to."}, "H009:T020": {"id": "H009:T020", "role": "seeker", "text": "Will do. Take care, too."}, "H010:T000": {"id": "H010:T000", "role": "supporter", "text": "Hi Jane, how have you been feeling lately?"}, "H010:T001": {"id": "H010:T001", "role": "seeker", "text": "Hey, it's been tough, honestly. I've been dealing with a lot of stress and barely sleeping."}, "H010:T002": {"id": "H010:T002", "role": "supporter", "text": "I'm so sorry to hear that. Stress and insomnia can really take a toll. What's been weighing on you the most?"}, "H010:T003": {"id": "H010:T003", "role": "seeker", "text": "It's a mix of things... Financial issues, work, and I guess, the whole fallout with Lisa."}, "H010:T004": {"id": "H010:T004", "role": "supporter", "text": "Losing a friend over money is really difficult. Do you want to talk more about what's been going on with work as well?"}, "H010:T005": {"id": "H010:T005", "role": "seeker", "text": "Yeah, I had a poor performance review last week, and it shook my confidence. It's hard to focus when my mind is elsewhere."}, "H010:T006": {"id": "H010:T006", "role": "supporter", "text": "That sounds really challenging, especially when you're already feeling anxious. Have you noticed any patterns or triggers for the stress?"}, "H010:T007": {"id": "H010:T007", "role": "seeker", "text": "I think it's the feeling of everything piling up at once. Every little thing just feels like too much now."}, "H010:T008": {"id": "H010:T008", "role": "supporter", "text": "When it all becomes overwhelming, it's so important to prioritize taking care of yourself. Have you been able to use your journal to help manage the stress?"}, "H010:T009": {"id": "H010:T009", "role": "seeker", "text": "Yes, I try to write in it every night. It does help to put my thoughts on paper, but sometimes the anxiety is just too strong."}, "H010:T010": {"id": "H010:T010", "role": "supporter", "text": "It's good that you're using your journal as a tool. It's natural to still feel overwhelmed, especially given everything you're handling right now."}, "H010:T011": {"id": "H010:T011", "role": "seeker", "text": "Thanks. I know you’re right, but sometimes I just feel so alone in this."}, "H010:T012": {"id": "H010:T012", "role": "supporter", "text": "You’re definitely not alone, Jane. I'm here for you, and it’s okay to reach out whenever you need someone to listen."}, "H010:T013": {"id": "H010:T013", "role": "seeker", "text": "I really appreciate that. It’s comforting to have someone to talk to."}, "H010:T014": {"id": "H010:T014", "role": "supporter", "text": "Do you have any plans to tackle the financial stress, or is there someone who could help you navigate that?"}, "H010:T015": {"id": "H010:T015", "role": "seeker", "text": "I’ve been looking into budgeting more strictly, but it’s tough. I think I just feel angry and sad about how things ended with Lisa."}, "H010:T016": {"id": "H010:T016", "role": "supporter", "text": "It's understandable to feel that guilt, but you're doing your best under challenging circumstances. It's important to be gentle with yourself."}, "H010:T017": {"id": "H010:T017", "role": "seeker", "text": "Yeah, I know logically I did what I could, but emotionally it’s hard to let go."}, "H010:T018": {"id": "H010:T018", "role": "supporter", "text": "Emotions can be tough to navigate, but it’s a process. Small steps are still progress. Have you been able to find moments of peace or relaxation?"}, "H010:T019": {"id": "H010:T019", "role": "seeker", "text": "I try to meditate a bit or take a walk when I can. It helps, even if just a little."}, "H010:T020": {"id": "H010:T020", "role": "supporter", "text": "That's great! Even small moments of peace can accumulate and make a difference over time. You're doing really well to manage through this."}, "H010:T021": {"id": "H010:T021", "role": "seeker", "text": "Thank you. It means a lot to hear that, especially when I feel like I'm drowning."}, "H010:T022": {"id": "H010:T022", "role": "supporter", "text": "Always happy to remind you. You’re stronger than you realize, and it takes courage to face these challenges."}, "H010:T023": {"id": "H010:T023", "role": "seeker", "text": "I hope things will start to turn around soon. I'm trying to keep faith."}, "H010:T024": {"id": "H010:T024", "role": "supporter", "text": "Holding onto hope is incredibly powerful. And remember, you’re not alone - I’m here cheering you on every step of the way."}, "H011:T000": {"id": "H011:T000", "role": "supporter", "text": "Hi Jane, it's great to hear from you again. How have you been holding up?"}, "H011:T001": {"id": "H011:T001", "role": "seeker", "text": "Hi, it's been a bit rough lately. My car broke down and the repair costs are just... more than I can handle right now."}, "H011:T002": {"id": "H011:T002", "role": "supporter", "text": "Oh no, I'm so sorry to hear that, Jane. That must be incredibly stressful, especially with everything else you've had to deal with recently."}, "H011:T003": {"id": "H011:T003", "role": "seeker", "text": "It really is. I've been trying to manage, but the financial stress keeps piling up. I still haven't resolved the money issue with my friend, and now this... It's overwhelming."}, "H011:T004": {"id": "H011:T004", "role": "supporter", "text": "I can only imagine how difficult that must be. You've been doing your best under such challenging circumstances. It's okay to feel overwhelmed."}, "H011:T005": {"id": "H011:T005", "role": "seeker", "text": "Thank you. Sometimes it feels like I'm just not able to catch a break. I've been trying to keep track of everything with my journal, but it feels like every day brings something new."}, "H011:T006": {"id": "H011:T006", "role": "supporter", "text": "Journaling is a great tool, and it's a good step that you're using it to process your thoughts and feelings. It shows how you're trying to find ways to cope."}, "H011:T007": {"id": "H011:T007", "role": "seeker", "text": "Yeah, I thought it might help calm my anxieties. But with my job performance not being where it's supposed to be, and money problems, I just feel stuck."}, "H011:T008": {"id": "H011:T008", "role": "supporter", "text": "Feeling stuck is definitely tough. It's important to remember that it's not a reflection of your abilities or worth. You're dealing with a lot, and your efforts are meaningful."}, "H011:T009": {"id": "H011:T009", "role": "seeker", "text": "Thanks. Sometimes I just worry that I'm not living up to expectations, especially at work. The fear of being seen as incompetent is always there."}, "H011:T010": {"id": "H011:T010", "role": "supporter", "text": "I understand. Work pressure can be intense, and when combined with personal challenges, it's a lot to balance. Have you been able to talk to anyone at work about how you're feeling?"}, "H011:T011": {"id": "H011:T011", "role": "seeker", "text": "Not yet. I'm hesitant because I don't want it to seem like I'm making excuses. I really want to prove myself and get back on track."}, "H011:T012": {"id": "H011:T012", "role": "supporter", "text": "That makes sense. It might help to reach out for support when you're ready, even just to get some feedback. Sometimes, opening up can bring understanding and solutions you couldn't see before."}, "H011:T013": {"id": "H011:T013", "role": "seeker", "text": "You're right. I'll think about that. Maybe just having a conversation could help put things into perspective."}, "H011:T014": {"id": "H011:T014", "role": "supporter", "text": "Absolutely, even small steps can lead to positive changes. Remember, you're doing the best you can, and it's okay to seek help when you need it."}, "H011:T015": {"id": "H011:T015", "role": "seeker", "text": "I will try to remember that. It's helpful to talk about it and just get it off my chest a bit."}, "H011:T016": {"id": "H011:T016", "role": "supporter", "text": "I'm glad you reached out, Jane. It's important to have a space where you feel heard. If you ever need to talk or get things off your mind, I'm here."}, "H011:T017": {"id": "H011:T017", "role": "seeker", "text": "Thank you so much. It really means a lot to have someone who listens and understands."}, "H011:T018": {"id": "H011:T018", "role": "supporter", "text": "You're welcome. Remember, one step at a time, and be gentle with yourself. You're not alone in this, and there are brighter days ahead."}, "H011:T019": {"id": "H011:T019", "role": "seeker", "text": "I'll keep that in mind. Thanks again for your support."}, "H012:T000": {"id": "H012:T000", "role": "seeker", "text": "Hey there, can we chat for a bit?"}, "H012:T001": {"id": "H012:T001", "role": "supporter", "text": "Of course, Jane. What's on your mind?"}, "H012:T002": {"id": "H012:T002", "role": "seeker", "text": "I've been feeling really overwhelmed lately. I'm actually considering switching jobs."}, "H012:T003": {"id": "H012:T003", "role": "supporter", "text": "That sounds like a big decision. What's been making you feel this way?"}, "H012:T004": {"id": "H012:T004", "role": "seeker", "text": "It’s just a combination of things. The pressure at work never seems to end, and after the performance review last November, I’ve been second-guessing myself a lot."}, "H012:T005": {"id": "H012:T005", "role": "supporter", "text": "I remember you mentioned being anxious about your job performance a few months ago. It sounds like everything's been piling up."}, "H012:T006": {"id": "H012:T006", "role": "seeker", "text": "Exactly. I try to keep up, but it feels like I’m always falling short. The stress is just too much sometimes."}, "H012:T007": {"id": "H012:T007", "role": "supporter", "text": "That sounds exhausting. It’s understandable that your mind would begin to look for other options."}, "H012:T008": {"id": "H012:T008", "role": "seeker", "text": "I've also been dealing with financial pressures ever since my car broke down. There always seems to be another expense around the corner."}, "H012:T009": {"id": "H012:T009", "role": "supporter", "text": "I can imagine how stressful that must be for you. Those financial strains can really add a lot of pressure."}, "H012:T010": {"id": "H012:T010", "role": "seeker", "text": "Yeah, and the thing with my friend cutting me off because of the money didn’t help either. It all feels connected somehow."}, "H012:T011": {"id": "H012:T011", "role": "supporter", "text": "It must have been tough losing a friend on top of everything else. You’re really going through so much at once."}, "H012:T012": {"id": "H012:T012", "role": "seeker", "text": "I just keep thinking about switching to something less stressful, maybe something that allows me more flexibility."}, "H012:T013": {"id": "H012:T013", "role": "supporter", "text": "That makes a lot of sense. Flexibility can certainly alleviate some stress, offering you both space and time for yourself."}, "H012:T014": {"id": "H012:T014", "role": "seeker", "text": "I've been trying to track my thoughts in that new journal I got. It's been helpful sometimes, but the change feels daunting."}, "H012:T015": {"id": "H012:T015", "role": "supporter", "text": "Journaling is a great way to process thoughts and emotions. Taking things one step at a time with any big decision can help it feel less overwhelming."}, "H012:T016": {"id": "H012:T016", "role": "seeker", "text": "I’ll try to keep that in mind. Just voicing it all out helps me see things a bit clearer."}, "H012:T017": {"id": "H012:T017", "role": "supporter", "text": "I’m glad to hear that, Jane. You’re not alone in this, and I’m here to support you in any way I can."}, "H012:T018": {"id": "H012:T018", "role": "seeker", "text": "Thank you so much. Having someone listen without judgment really makes a difference."}, "H012:T019": {"id": "H012:T019", "role": "supporter", "text": "Anytime, Jane. You’re handling this with strength, and I’m here whenever you need to talk."}, "H013:T000": {"id": "H013:T000", "role": "seeker", "text": "Hey, I'm feeling a bit overwhelmed today."}, "H013:T001": {"id": "H013:T001", "role": "supporter", "text": "Hi Jane, I'm here for you. What's on your mind?"}, "H013:T002": {"id": "H013:T002", "role": "seeker", "text": "My sister Eliza just announced her engagement."}, "H013:T003": {"id": "H013:T003", "role": "supporter", "text": "Oh wow, that must be a big piece of news for the family. How are you processing it?"}, "H013:T004": {"id": "H013:T004", "role": "seeker", "text": "I'm happy for her, truly, but it also makes me reflect on where I am in my life."}, "H013:T005": {"id": "H013:T005", "role": "supporter", "text": "It's completely natural to have mixed feelings. Have you been able to talk to Eliza about how you're feeling?"}, "H013:T006": {"id": "H013:T006", "role": "seeker", "text": "Not yet. I don’t want to dampen her excitement with my own worries."}, "H013:T007": {"id": "H013:T007", "role": "supporter", "text": "That's considerate of you. How has this news been affecting you emotionally?"}, "H013:T008": {"id": "H013:T008", "role": "seeker", "text": "I feel lonely, to be honest. Recently, things haven't been great for me...work stress, financial issues...it's cumulative."}, "H013:T009": {"id": "H013:T009", "role": "supporter", "text": "That sounds really challenging. You've been through a lot lately. Remember, it's okay to feel this way."}, "H013:T010": {"id": "H013:T010", "role": "seeker", "text": "There’s also the lingering anxiety from my last breakup, and then seeing Eliza so happy makes me question my own happiness."}, "H013:T011": {"id": "H013:T011", "role": "supporter", "text": "Breakups can be incredibly tough, and comparing situations is a natural response. But your journey is unique and just as important."}, "H013:T012": {"id": "H013:T012", "role": "seeker", "text": "Thanks for saying that. I guess I need to focus on myself more, but it's hard with all the stress."}, "H013:T013": {"id": "H013:T013", "role": "supporter", "text": "It seems like a lot is demanding your attention. Maybe you could lean into that journaling habit you started?"}, "H013:T014": {"id": "H013:T014", "role": "seeker", "text": "That's a good idea. I haven’t been consistent, but I think it helps when I do it."}, "H013:T015": {"id": "H013:T015", "role": "supporter", "text": "Starting small is perfectly fine. You're doing your best and that's what matters. Have you considered talking to a professional about everything you've been facing?"}, "H013:T016": {"id": "H013:T016", "role": "seeker", "text": "I've thought about it. It might be time to reach out for more help. Just to sort through everything."}, "H013:T017": {"id": "H013:T017", "role": "supporter", "text": "I think that could be really beneficial. You're taking important steps by recognizing where you are. You're not alone in this."}, "H013:T018": {"id": "H013:T018", "role": "seeker", "text": "Thanks, I appreciate that. Just expressing these feelings openly has been a relief."}, "H013:T019": {"id": "H013:T019", "role": "supporter", "text": "I'm glad to hear that. I'm always here to listen. Take care of yourself, Jane."}, "H014:T000": {"id": "H014:T000", "role": "supporter", "text": "Hi Jane, how are you holding up lately?"}, "H014:T001": {"id": "H014:T001", "role": "seeker", "text": "Hey, not the best to be honest. Things aren't getting any better."}, "H014:T002": {"id": "H014:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been going on?"}, "H014:T003": {"id": "H014:T003", "role": "seeker", "text": "It's mostly about my sister, Eliza. We had a huge argument while planning her wedding."}, "H014:T004": {"id": "H014:T004", "role": "supporter", "text": "I'm really sorry to hear that. It can be tough when someone close to you is involved. What happened?"}, "H014:T005": {"id": "H014:T005", "role": "seeker", "text": "She just doesn't appreciate my suggestions. I was only trying to help, but she took it the wrong way."}, "H014:T006": {"id": "H014:T006", "role": "supporter", "text": "That sounds frustrating, especially when you're just trying to be helpful. How did she react?"}, "H014:T007": {"id": "H014:T007", "role": "seeker", "text": "She accused me of trying to control everything and said I wasn't being supportive."}, "H014:T008": {"id": "H014:T008", "role": "supporter", "text": "It must be really hurtful to feel misunderstood like that. How are you feeling about it now?"}, "H014:T009": {"id": "H014:T009", "role": "seeker", "text": "I feel terrible. I love her and want to be there for her, but now it seems I've done the opposite."}, "H014:T010": {"id": "H014:T010", "role": "supporter", "text": "Remember, it's not always easy to navigate these situations. Has this tension changed how you feel about attending the wedding?"}, "H014:T011": {"id": "H014:T011", "role": "seeker", "text": "A bit, yeah. I was looking forward to being part of it, but now it feels awkward."}, "H014:T012": {"id": "H014:T012", "role": "supporter", "text": "It's understandable to feel conflicted. Being part of her big day is important, but so is your peace of mind."}, "H014:T013": {"id": "H014:T013", "role": "seeker", "text": "Exactly. I just worry that our relationship might not be the same after this."}, "H014:T014": {"id": "H014:T014", "role": "supporter", "text": "Are there moments from the past where you've overcome conflicts together?"}, "H014:T015": {"id": "H014:T015", "role": "seeker", "text": "Yes, there were times we've disagreed but always managed to mend things eventually."}, "H014:T016": {"id": "H014:T016", "role": "supporter", "text": "That's promising. Perhaps this can be mended over time too. Do you think talking to her calmly might help?"}, "H014:T017": {"id": "H014:T017", "role": "seeker", "text": "Maybe. I guess I need to find the right time and words to explain my intentions."}, "H014:T018": {"id": "H014:T018", "role": "supporter", "text": "That sounds like a thoughtful approach. Taking time to sort out your feelings first could also be beneficial."}, "H014:T019": {"id": "H014:T019", "role": "seeker", "text": "Yes, I think writing about it in my journal could help me process everything."}, "H014:T020": {"id": "H014:T020", "role": "supporter", "text": "That's a great idea, Jane. The journal seems like a good outlet for you."}, "H014:T021": {"id": "H014:T021", "role": "seeker", "text": "Thanks. It always helps me get things off my chest and see things more clearly."}, "H014:T022": {"id": "H014:T022", "role": "supporter", "text": "You have a lot on your plate right now, but I'm confident you'll find a way to navigate through it."}, "H014:T023": {"id": "H014:T023", "role": "seeker", "text": "I hope so. Thanks for listening. It makes a difference knowing someone understands."}, "H014:T024": {"id": "H014:T024", "role": "supporter", "text": "I'm always here for you, Jane. Whenever you need someone to talk to, just reach out."}, "H014:T025": {"id": "H014:T025", "role": "seeker", "text": "I really appreciate that. Talk to you soon."}, "H014:T026": {"id": "H014:T026", "role": "supporter", "text": "Take care. Remember to be gentle with yourself."}, "H014:T027": {"id": "H014:T027", "role": "seeker", "text": "I will. Thank you!"}, "H015:T000": {"id": "H015:T000", "role": "seeker", "text": "Hey, feeling a bit all over the place today. Mind if I share?"}, "H015:T001": {"id": "H015:T001", "role": "supporter", "text": "Of course, Jane. I'm here to listen. What's been going on?"}, "H015:T002": {"id": "H015:T002", "role": "seeker", "text": "Well, you know how Eliza and I had that big fight about her wedding?"}, "H015:T003": {"id": "H015:T003", "role": "supporter", "text": "Yes, you’ve mentioned feeling misunderstood during that time. How are things between you two now?"}, "H015:T004": {"id": "H015:T004", "role": "seeker", "text": "We actually had a really deep conversation a few days ago. Lots of tears but good ones, I think."}, "H015:T005": {"id": "H015:T005", "role": "supporter", "text": "That sounds intense but potentially healing. How did that feel for you?"}, "H015:T006": {"id": "H015:T006", "role": "seeker", "text": "It was a mix of relief and lingering sadness. I’m happy we cleared the air, but all those pent-up emotions were exhausting."}, "H015:T007": {"id": "H015:T007", "role": "supporter", "text": "It makes sense to feel drained after such a heart-to-heart. It's brave of you both to confront those emotions together."}, "H015:T008": {"id": "H015:T008", "role": "seeker", "text": "Thanks. I just wish it didn't have to get so messy before getting better."}, "H015:T009": {"id": "H015:T009", "role": "supporter", "text": "Relationships can be messy, but the reconciling part is important. How’s your perspective on everything now?"}, "H015:T010": {"id": "H015:T010", "role": "seeker", "text": "I feel closer to her actually. We both admitted how much the wedding planning has stressed us out."}, "H015:T011": {"id": "H015:T011", "role": "supporter", "text": "That’s insightful. Acknowledging shared stress can bring people together. How’s the wedding planning going now?"}, "H015:T012": {"id": "H015:T012", "role": "seeker", "text": "Better. We’ve agreed to communicate openly about decisions. It feels more like a partnership now, rather than me just helping her."}, "H015:T013": {"id": "H015:T013", "role": "supporter", "text": "That’s great to hear, Jane. Open communication is key in any relationship."}, "H015:T014": {"id": "H015:T014", "role": "seeker", "text": "Yeah, I've also started journaling again. It helps sort through these complicated feelings."}, "H015:T015": {"id": "H015:T015", "role": "supporter", "text": "Journaling is a great tool. How does writing about your thoughts and emotions help you?"}, "H015:T016": {"id": "H015:T016", "role": "seeker", "text": "It gives me clarity. Putting pen to paper makes everything feel less overwhelming and more manageable."}, "H015:T017": {"id": "H015:T017", "role": "supporter", "text": "I’m glad it’s helping you. Have you noticed any other changes since you reconciled with Eliza?"}, "H015:T018": {"id": "H015:T018", "role": "seeker", "text": "I feel a bit lighter emotionally. Mending the rift with her feels like a burden lifted."}, "H015:T019": {"id": "H015:T019", "role": "supporter", "text": "That’s a beautiful way to put it. Rebuilding that connection must feel rewarding."}, "H015:T020": {"id": "H015:T020", "role": "seeker", "text": "It does. I’m also trying to be more proactive about addressing my financial stress instead of letting it control me."}, "H015:T021": {"id": "H015:T021", "role": "supporter", "text": "That’s a positive step forward. You've been through a lot, and it’s important to take care of yourself too."}, "H015:T022": {"id": "H015:T022", "role": "seeker", "text": "Trying my best. It’s a work in progress, you know? Balancing everything is tough."}, "H015:T023": {"id": "H015:T023", "role": "supporter", "text": "Absolutely. You’re making great progress, even if it doesn’t always feel that way. I’m here whenever you need to talk."}, "H015:T024": {"id": "H015:T024", "role": "seeker", "text": "Thank you, that means a lot. I’ll keep leaning on you if that's okay."}, "H015:T025": {"id": "H015:T025", "role": "supporter", "text": "Always, Jane. Your journey is important, and I’m here to support you along the way."}, "H016:T000": {"id": "H016:T000", "role": "seeker", "text": "Hey there, do you have a moment to chat?"}, "H016:T001": {"id": "H016:T001", "role": "supporter", "text": "Of course, Jane. What's on your mind?"}, "H016:T002": {"id": "H016:T002", "role": "seeker", "text": "I attended a social event recently, and it unearthed some emotions I thought I had tucked away."}, "H016:T003": {"id": "H016:T003", "role": "supporter", "text": "It sounds like it was quite an experience. What happened that brought these feelings to the surface?"}, "H016:T004": {"id": "H016:T004", "role": "seeker", "text": "I met someone there who reminded me of my past relationships, particularly the one that ended in a mess due to infidelity."}, "H016:T005": {"id": "H016:T005", "role": "supporter", "text": "That must have been tough to be reminded of. How did it feel encountering someone who brought those memories back?"}, "H016:T006": {"id": "H016:T006", "role": "seeker", "text": "It was like reliving a bit of that heartache. I was both fascinated and apprehensive."}, "H016:T007": {"id": "H016:T007", "role": "supporter", "text": "That's understandable. Did this interaction lead you to reflect on your past relationship?"}, "H016:T008": {"id": "H016:T008", "role": "seeker", "text": "Yes. I wondered if I've truly moved on or just buried the feelings. And with everything else, the stress seems unending."}, "H016:T009": {"id": "H016:T009", "role": "supporter", "text": "Between work, financial pressures, and this emotional trigger, it sounds like you're carrying a heavy load."}, "H016:T010": {"id": "H016:T010", "role": "seeker", "text": "Exactly. I've been thinking about switching jobs, but the fear of instability holds me back."}, "H016:T011": {"id": "H016:T011", "role": "supporter", "text": "It's a significant decision. Finding a balance between what you want and need is crucial."}, "H016:T012": {"id": "H016:T012", "role": "seeker", "text": "And my sister's engagement has been on my mind too. I'm genuinely happy for her, but I can't help feeling a little left behind."}, "H016:T013": {"id": "H016:T013", "role": "supporter", "text": "It's okay to feel those mixed emotions. How are you and Eliza doing since you mended things?"}, "H016:T014": {"id": "H016:T014", "role": "seeker", "text": "We're in a good place now. She really understood where I was coming from after we talked things out."}, "H016:T015": {"id": "H016:T015", "role": "supporter", "text": "That's wonderful to hear. Having her support must mean a lot."}, "H016:T016": {"id": "H016:T016", "role": "seeker", "text": "It definitely does. I just wish I felt more settled with everything else. All these thoughts keep me up at night."}, "H016:T017": {"id": "H016:T017", "role": "supporter", "text": "Insomnia can really take a toll. How have you been coping with the stress?"}, "H016:T018": {"id": "H016:T018", "role": "seeker", "text": "I've been journaling to process my thoughts, but it's been a rollercoaster."}, "H016:T019": {"id": "H016:T019", "role": "supporter", "text": "Writing can be therapeutic, but it sounds like there's more weighing on you."}, "H016:T020": {"id": "H016:T020", "role": "seeker", "text": "Yeah, all of it combined just overwhelms me sometimes."}, "H016:T021": {"id": "H016:T021", "role": "supporter", "text": "Jane, remember it's okay to seek help. Talking to someone professionally might help make things more manageable."}, "H016:T022": {"id": "H016:T022", "role": "seeker", "text": "You might be right. It feels reassuring to know there are options out there."}, "H016:T023": {"id": "H016:T023", "role": "supporter", "text": "Absolutely. You're not alone in this, and taking steps to care for yourself is important."}, "H016:T024": {"id": "H016:T024", "role": "seeker", "text": "Thanks. I appreciate knowing there's someone who understands."}, "H016:T025": {"id": "H016:T025", "role": "supporter", "text": "Anytime, Jane. You're doing the best you can, and that's enough."}, "H017:T000": {"id": "H017:T000", "role": "seeker", "text": "Hi, I really need to talk."}, "H017:T001": {"id": "H017:T001", "role": "supporter", "text": "Of course, Jane. I'm here for you. What's on your mind?"}, "H017:T002": {"id": "H017:T002", "role": "seeker", "text": "It's about Jack. He tried reaching out to me again, and it really threw me off."}, "H017:T003": {"id": "H017:T003", "role": "supporter", "text": "I'm sorry to hear that, Jane. How did you feel when he contacted you?"}, "H017:T004": {"id": "H017:T004", "role": "seeker", "text": "Honestly, I felt a wave of anxiety and a bit of anger. I thought I was moving on, you know?"}, "H017:T005": {"id": "H017:T005", "role": "supporter", "text": "That sounds really tough. It's understandable to have those feelings, especially when someone from your past re-emerges unexpectedly."}, "H017:T006": {"id": "H017:T006", "role": "seeker", "text": "Yeah, it's like all those feelings I had during our breakup came rushing back."}, "H017:T007": {"id": "H017:T007", "role": "supporter", "text": "Breakups can leave a lasting impact, especially if things ended with unresolved issues. What worries you the most about Jack reaching out?"}, "H017:T008": {"id": "H017:T008", "role": "seeker", "text": "I guess I'm afraid of falling back into habits that were bad for me, like constantly questioning myself. We had a pretty toxic dynamic at times."}, "H017:T009": {"id": "H017:T009", "role": "supporter", "text": "It's important that you're aware of the impact he had on you. It sounds like you're protecting yourself, which is a good step."}, "H017:T010": {"id": "H017:T010", "role": "seeker", "text": "I'm trying. But it's hard when I think of all the other stressors in my life, like work and money. Everything feels so overwhelming."}, "H017:T011": {"id": "H017:T011", "role": "supporter", "text": "It must be really challenging juggling all these pressures at once. Have you found anything that helps you manage when things get overwhelming?"}, "H017:T012": {"id": "H017:T012", "role": "seeker", "text": "Writing in my journal sometimes helps, but lately, I find it hard to focus or even sleep well."}, "H017:T013": {"id": "H017:T013", "role": "supporter", "text": "Journaling is a great tool, and it's understandable that sleep and focus might be affected by anxiety. Do you have any relaxation techniques that help at night?"}, "H017:T014": {"id": "H017:T014", "role": "seeker", "text": "I try breathing exercises, but my mind races a lot. Maybe I need to establish a better nighttime routine."}, "H017:T015": {"id": "H017:T015", "role": "supporter", "text": "That sounds like a good idea. A consistent routine can sometimes make a difference. Have you considered reaching out for professional help to guide you through this?"}, "H017:T016": {"id": "H017:T016", "role": "seeker", "text": "I have thought about therapy, but I'm worried about the cost, especially with my financial situation."}, "H017:T017": {"id": "H017:T017", "role": "supporter", "text": "That's a valid concern. Some therapists offer sliding scales or there may be community resources available. It might be worth exploring if it can help you find balance."}, "H017:T018": {"id": "H017:T018", "role": "seeker", "text": "I'll look into it. Just talking to you has helped a bit already."}, "H017:T019": {"id": "H017:T019", "role": "supporter", "text": "I'm really glad to hear that. I'm always here whenever you need to talk. Take it one step at a time, Jane."}, "H017:T020": {"id": "H017:T020", "role": "seeker", "text": "Thank you. It feels good to know I'm not alone in this."}, "H018:T000": {"id": "H018:T000", "role": "seeker", "text": "Hey, are you available to chat?"}, "H018:T001": {"id": "H018:T001", "role": "supporter", "text": "Hi Jane! I'm here. What's going on?"}, "H018:T002": {"id": "H018:T002", "role": "seeker", "text": "I don't know, it's just been a lot lately. I got a promotion offer, but there's a catch."}, "H018:T003": {"id": "H018:T003", "role": "supporter", "text": "Congratulations on the promotion offer! But what’s the catch?"}, "H018:T004": {"id": "H018:T004", "role": "seeker", "text": "Thanks. It means relocating overseas. I’m feeling pretty overwhelmed."}, "H018:T005": {"id": "H018:T005", "role": "supporter", "text": "That's a big decision. It sounds like there's a lot to consider. How are you feeling about moving overseas?"}, "H018:T006": {"id": "H018:T006", "role": "seeker", "text": "Honestly, I have mixed feelings. It's a great opportunity, but I’m scared of leaving everything behind. What if I fail?"}, "H018:T007": {"id": "H018:T007", "role": "supporter", "text": "It’s completely natural to feel that way. You've been through a lot of stressful situations before, remember when you had the falling out with your friend over the money issue, and you managed to handle it?"}, "H018:T008": {"id": "H018:T008", "role": "seeker", "text": "True, I did handle that. But this feels different, like if I accept, everything changes."}, "H018:T009": {"id": "H018:T009", "role": "supporter", "text": "Change can be daunting, but it also can be exciting. Deep down, what does your gut tell you?"}, "H018:T010": {"id": "H018:T010", "role": "seeker", "text": "A part of me wants to embrace this challenge. But I worry about my family, especially Eliza after we just started getting along again."}, "H018:T011": {"id": "H018:T011", "role": "supporter", "text": "It's understandable to worry about your relationship with Eliza. Have you talked to her about this yet?"}, "H018:T012": {"id": "H018:T012", "role": "seeker", "text": "Not yet. I'm afraid she’ll feel like I'm abandoning her right when things are starting to get better between us."}, "H018:T013": {"id": "H018:T013", "role": "supporter", "text": "Maybe having an open conversation with Eliza would help. She might surprise you with her support, especially after you both mended fences."}, "H018:T014": {"id": "H018:T014", "role": "seeker", "text": "You’re right. I should probably talk to her. I just don't want to ruin anything."}, "H018:T015": {"id": "H018:T015", "role": "supporter", "text": "It sounds like your relationship is stronger than you think. Keeping communication open could help strengthen it further."}, "H018:T016": {"id": "H018:T016", "role": "seeker", "text": "I hope so. Moving would also mean leaving behind memories, and part of me is afraid of the unknown."}, "H018:T017": {"id": "H018:T017", "role": "supporter", "text": "The unknown can be intimidating, but it also holds a lot of potential. It sounds like you’re searching for a balance between embracing new opportunities and holding onto what you value."}, "H018:T018": {"id": "H018:T018", "role": "seeker", "text": "That's exactly it. I want to grow and advance my career, but I don't want to lose myself in the process."}, "H018:T019": {"id": "H018:T019", "role": "supporter", "text": "You’re approaching this thoughtfully. Trust yourself to find that balance. Sometimes writing down your thoughts, like in your journal, might help clarify things."}, "H018:T020": {"id": "H018:T020", "role": "seeker", "text": "That’s a good idea. Journaling helped last time. Maybe it will help me weigh the pros and cons more clearly this time too."}, "H018:T021": {"id": "H018:T021", "role": "supporter", "text": "Absolutely. You’ve navigated tough situations before, and you've come out stronger each time. No matter what you decide, you’re capable of handling it."}, "H018:T022": {"id": "H018:T022", "role": "seeker", "text": "Thank you. That means a lot. I guess I just needed to talk it out."}, "H018:T023": {"id": "H018:T023", "role": "supporter", "text": "Anytime, Jane. Just remember, you’re not alone in this. I’m here for you, and so is your support network."}, "H018:T024": {"id": "H018:T024", "role": "seeker", "text": "Thanks, I’ll reach out if I need more advice. Take care."}, "H018:T025": {"id": "H018:T025", "role": "supporter", "text": "You too, Jane. Keep me posted on what you decide."}, "H019:T000": {"id": "H019:T000", "role": "seeker", "text": "Hey, do you have a moment to chat?"}, "H019:T001": {"id": "H019:T001", "role": "supporter", "text": "Of course, Jane. What's on your mind?"}, "H019:T002": {"id": "H019:T002", "role": "seeker", "text": "I got a message out of the blue from someone I used to be really close with. It's brought up so many mixed feelings."}, "H019:T003": {"id": "H019:T003", "role": "supporter", "text": "That sounds complicated. Who was it, if you don't mind sharing?"}, "H019:T004": {"id": "H019:T004", "role": "seeker", "text": "It was from my old friend, who I haven't spoken to since the whole money situation last year."}, "H019:T005": {"id": "H019:T005", "role": "supporter", "text": "Ah, I remember you mentioned them before. It's understandable that you'd feel a bit caught off guard."}, "H019:T006": {"id": "H019:T006", "role": "seeker", "text": "Yeah, exactly. Part of me is nostalgic, but another part of me is wary. I don't want to go through that emotional turmoil again."}, "H019:T007": {"id": "H019:T007", "role": "supporter", "text": "It's natural to have those feelings when someone from the past reaches out, especially given what transpired."}, "H019:T008": {"id": "H019:T008", "role": "seeker", "text": "I just can't shake off the memory of how it ended. Losing a friend like that was tough."}, "H019:T009": {"id": "H019:T009", "role": "supporter", "text": "It must've been really hard. Do you feel like you're ready to respond, or do you need more time to process?"}, "H019:T010": {"id": "H019:T010", "role": "seeker", "text": "I'm really unsure. A part of me misses the friendship, but I'm scared of being hurt again."}, "H019:T011": {"id": "H019:T011", "role": "supporter", "text": "Both of those feelings make a lot of sense. It's important to protect your heart while also honoring what used to be."}, "H019:T012": {"id": "H019:T012", "role": "seeker", "text": "Right. I also think back to how stressful things were—like with my job performance review and financial stress. It was too much."}, "H019:T013": {"id": "H019:T013", "role": "supporter", "text": "Those were tough times for you. It shows how much strength it took for you to get through them."}, "H019:T014": {"id": "H019:T014", "role": "seeker", "text": "Thanks. I guess I'm just worried that engaging in any more complicated relationships could bring back old stressors."}, "H019:T015": {"id": "H019:T015", "role": "supporter", "text": "I completely understand your apprehension. Do you think setting boundaries might help if you decide to reconnect?"}, "H019:T016": {"id": "H019:T016", "role": "seeker", "text": "That might be a good idea. It could prevent past issues from repeating."}, "H019:T017": {"id": "H019:T017", "role": "supporter", "text": "And if you ever feel overwhelmed, remember you can always pause and take the time you need."}, "H019:T018": {"id": "H019:T018", "role": "seeker", "text": "You're right. I'll think about what I want and maybe draft a response if that time comes."}, "H019:T019": {"id": "H019:T019", "role": "supporter", "text": "That sounds like a solid plan. It's all about doing what's best for you."}, "H019:T020": {"id": "H019:T020", "role": "seeker", "text": "Thanks for listening. I just needed to get that off my chest."}, "H019:T021": {"id": "H019:T021", "role": "supporter", "text": "Anytime, Jane. I'm here if you need to talk more."}, "H020:T000": {"id": "H020:T000", "role": "seeker", "text": "Hey, could really use someone to talk to right now."}, "H020:T001": {"id": "H020:T001", "role": "supporter", "text": "Of course, Jane. What's on your mind?"}, "H020:T002": {"id": "H020:T002", "role": "seeker", "text": "You know about that overseas promotion I was kind of stressing about?"}, "H020:T003": {"id": "H020:T003", "role": "supporter", "text": "Yes, you mentioned how you were torn about the relocation and how it might affect things with Eliza. What's happened?"}, "H020:T004": {"id": "H020:T004", "role": "seeker", "text": "Well, they filled it with someone else without even informing me."}, "H020:T005": {"id": "H020:T005", "role": "supporter", "text": "Wow, I'm really sorry to hear that. That must be so frustrating. How are you feeling about it?"}, "H020:T006": {"id": "H020:T006", "role": "seeker", "text": "I don't know... It's like a mix of relief and disappointment? I was anxious about moving, but also excited for the chance, you know?"}, "H020:T007": {"id": "H020:T007", "role": "supporter", "text": "It's completely understandable to feel that way. It's a significant life change that was suddenly altered. Have you had a chance to talk to your manager about it yet?"}, "H020:T008": {"id": "H020:T008", "role": "seeker", "text": "Not yet, I just found out through a colleague. Not exactly the news I was expecting today."}, "H020:T009": {"id": "H020:T009", "role": "supporter", "text": "That sounds tough, especially finding out like that. It's important to voice how this has affected you. Are you planning to address it soon?"}, "H020:T010": {"id": "H020:T010", "role": "seeker", "text": "I will. I guess I'm nervous about how it might impact my growth here. I feel kind of stuck."}, "H020:T011": {"id": "H020:T011", "role": "supporter", "text": "It's okay to feel uncertain about the future. But remember, you're resilient and have navigated through challenges before. Just like when you processed things with Eliza or dealt with the unexpected bill."}, "H020:T012": {"id": "H020:T012", "role": "seeker", "text": "Yeah, that's true. I guess I've been through a lot already. I just keep wondering if it's worth staying at this job."}, "H020:T013": {"id": "H020:T013", "role": "supporter", "text": "Thinking about your options is a smart move. Maybe reflecting on what you truly want in your career could help clarify things. Sometimes, journaling can help sort out these thoughts—still finding it useful?"}, "H020:T014": {"id": "H020:T014", "role": "seeker", "text": "Yes, the journal's been great. It helps me track my feelings and worries. It's like my own little therapist."}, "H020:T015": {"id": "H020:T015", "role": "supporter", "text": "I'm glad to hear that. Remember, your happiness and fulfillment at work are crucial. And you're capable of figuring out the best path forward."}, "H020:T016": {"id": "H020:T016", "role": "seeker", "text": "Thank you. It feels good just talking this out. It's like unloading a bit of the burden."}, "H020:T017": {"id": "H020:T017", "role": "supporter", "text": "I'm always here to listen. You're never alone in this. Have you thought about what might come next, or do you need some time to digest everything?"}, "H020:T018": {"id": "H020:T018", "role": "seeker", "text": "I think I need a bit more time to let it all sink in. Maybe see how things unfold with work and talk it through with Eliza, too."}, "H020:T019": {"id": "H020:T019", "role": "supporter", "text": "Taking your time sounds wise. And involving Eliza is a great idea, especially since you've grown closer recently. You always have people in your corner."}, "H020:T020": {"id": "H020:T020", "role": "seeker", "text": "Yeah, I'll try open up to her more. Thank you again—it's helped more than you know."}, "H020:T021": {"id": "H020:T021", "role": "supporter", "text": "Anytime, Jane. You're making progress, and I'm here whenever you need to talk."}, "H020:T022": {"id": "H020:T022", "role": "seeker", "text": "That means a lot. I'll keep you posted on what happens. Thanks again!"}}, "current_date": "2025-08-20", "last_seeker": "It's hard to say. I feel stuck, but in some ways, relieved I don't have to move overseas. Yet, there's this nagging fear I'll remain stagnant in my career."}, "8f54ff6433e8c56bbc57769febd66042a9a986847bdcedcc25cb56d1f4efd644": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "Hey, are you there? I could really use someone to talk to right now."}, "C:T001": {"id": "C:T001", "role": "supporter", "text": "Hi Charlotte, I'm here. What's been going on?"}, "C:T002": {"id": "C:T002", "role": "seeker", "text": "It's Alex. He reached out to me last night."}, "C:T003": {"id": "C:T003", "role": "supporter", "text": "Oh, wow. That must have brought up a lot of feelings. How are you holding up?"}, "C:T004": {"id": "C:T004", "role": "seeker", "text": "I'm just... I don't even know. It's been so long since we spoke. I thought I was over it, but I guess not."}, "C:T005": {"id": "C:T005", "role": "supporter", "text": "It's completely understandable to feel that way, especially since it was such a significant relationship for you. What did he say?"}, "C:T006": {"id": "C:T006", "role": "seeker", "text": "He apologized for the way things ended. Said he wanted to offer some closure."}, "C:T007": {"id": "C:T007", "role": "supporter", "text": "That sounds really intense. Apologies and closure can stir up a lot of emotions. What kind of thoughts are running through your mind right now?"}, "C:T008": {"id": "C:T008", "role": "seeker", "text": "I'm just confused. Part of me is relieved to hear it, but another part feels angry about how much it hurt back then."}, "C:T009": {"id": "C:T009", "role": "supporter", "text": "Both relief and anger make sense in this context. It's okay to feel conflicted. What did you say to him?"}, "C:T010": {"id": "C:T010", "role": "seeker", "text": "I thanked him for reaching out but told him I'm not sure if I can handle reopening old wounds."}, "C:T011": {"id": "C:T011", "role": "supporter", "text": "That sounds like a really honest and brave response. It's important to protect your own well-being. How did he react to that?"}, "C:T012": {"id": "C:T012", "role": "seeker", "text": "He said he understood and respected my decision. But now I'm doubting if I should have asked him more questions."}, "C:T013": {"id": "C:T013", "role": "supporter", "text": "It's natural to have second thoughts about these big conversations. It sounds like you're processing this really thoughtfully. What do you think it is that you wish you had asked or said?"}, "C:T014": {"id": "C:T014", "role": "seeker", "text": "Just more about why things ended the way they did. I still don't fully understand. Maybe that would help me move on."}, "C:T015": {"id": "C:T015", "role": "supporter", "text": "Seeking clarity is definitely important, but it's also okay to take time to figure out how and when you want to approach that. How do you want to move forward from here?"}, "C:T016": {"id": "C:T016", "role": "seeker", "text": "I think I need to talk about this in therapy. My sessions have been helping a lot with stress and career stuff. Maybe it'll help here too."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "Hello, what can I help you?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "I really sad as my partner walked out on me. Any thoughts what could  cheer me up?"}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "Was there anything that leads to this?"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Not really. I thought everything was ok between us. That is why it kind of struck me."}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "That's terrible and unacceptable behavior."}, "H001:T005": {"id": "H001:T005", "role": "supporter", "text": "How long have you been together?"}, "H001:T006": {"id": "H001:T006", "role": "seeker", "text": "I have to agree with you-it is unacceptable, considering that he didn't give me any reasons as to why he did it. We have been together for 5 years. "}, "H001:T007": {"id": "H001:T007", "role": "supporter", "text": "That sucks. I wouldn't be able to accept either. "}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "Have you talked to your friends about this?"}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "It is still rather raw,I have mentioned to it to a few of my friends and they deeply symphatise with me but I feel there is nothing much they can do to help me.They are as shocked as me to be honest."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "It is understandable to have that reaction. I agree with you, only us can hep ourselves."}, "H001:T011": {"id": "H001:T011", "role": "supporter", "text": "Have you tried doing activities that help distract you from having negative thoughts?"}, "H001:T012": {"id": "H001:T012", "role": "seeker", "text": "Kind of, most of it involves eating loads of ice cream LOL. "}, "H001:T013": {"id": "H001:T013", "role": "supporter", "text": "Haha I feel you, I tend to eat a lot when depressed too. Look, it's treat yourself method. You deserve the best"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "If you can go to the mountain or big lake, I would say try spending a few hours there. Maybe have a mini picnic by yourself and enjoy the nature."}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "That is a brilliant idea,I do love walking and being outdoors. :) "}, "H001:T016": {"id": "H001:T016", "role": "seeker", "text": "It surely would help me to clear my mind"}, "H001:T017": {"id": "H001:T017", "role": "supporter", "text": "Is there anything you have wanted to do but don't have the time? I always want to learn guitar and baking. This is the best time to start that"}, "H001:T018": {"id": "H001:T018", "role": "seeker", "text": "oh yeah, I suppose I have more time now to focus on things I have always wanted to do but never kind of had time for it. I bought a high end photo camera ages ago but never really had a chance to use it properly-I guess it is time to pursue my interest in photography, and spending more time outdoors would be ideal for that!"}, "H001:T019": {"id": "H001:T019", "role": "seeker", "text": "And reading! The list of books I want to read is arm long!"}, "H001:T020": {"id": "H001:T020", "role": "supporter", "text": "That's the spirit! I know being treated like that feels horrible. However, I bet you have mourned enough, at the end of the day, a person treats you like that has no respect and you shouldn't waste time on them."}, "H001:T021": {"id": "H001:T021", "role": "supporter", "text": "It's time to invest in yourself, once you become your better version, a better partner will come to you"}, "H001:T022": {"id": "H001:T022", "role": "seeker", "text": "I really agree with you- I am worth more than that. It is time to move on, even when it is difficult. The sad side of it is that I probably will never know what I did wrong for things to end like that. Maybe I didn't do anything wrong. That is the question what will always stay with me and that actually is the hardest bit of it all. But... I am not going to delve into it."}, "H001:T023": {"id": "H001:T023", "role": "seeker", "text": "I feel like hitting a jackpot actually hahahaha. I will be walking off those calories I get from ice cream I have been scoffing lately.So I am having the best of both worlds "}, "H001:T024": {"id": "H001:T024", "role": "seeker", "text": "Who said you cannot have the cake and eat it all LOL"}, "H001:T025": {"id": "H001:T025", "role": "supporter", "text": "Yes!Actually don't think you did wrong. Reflecting after a relationship is good but don't put all the blame on yourself."}, "H001:T026": {"id": "H001:T026", "role": "supporter", "text": "You have learned from this relationship too i believe, use that for your next one"}, "H001:T027": {"id": "H001:T027", "role": "seeker", "text": "I do not intend to. I am usually the kind of person who does blame oneself but I have found it is not right."}, "H002:T000": {"id": "H002:T000", "role": "seeker", "text": "hello"}, "H002:T001": {"id": "H002:T001", "role": "supporter", "text": "hello"}, "H002:T002": {"id": "H002:T002", "role": "seeker", "text": "i need som help, i feel so sad."}, "H002:T003": {"id": "H002:T003", "role": "supporter", "text": "I am sorry to hear that. Is there anything I can do for you? Please tell me what's wrong?"}, "H002:T004": {"id": "H002:T004", "role": "seeker", "text": "I think you can talk to me, maybe I will feel a bit better."}, "H002:T005": {"id": "H002:T005", "role": "seeker", "text": "I had a breakup with my boyfriend. "}, "H002:T006": {"id": "H002:T006", "role": "seeker", "text": "Feeling depressed, can you give me any advice?"}, "H002:T007": {"id": "H002:T007", "role": "supporter", "text": "For sure, I am happy to talk to you. I am sorry for your breakup. "}, "H002:T008": {"id": "H002:T008", "role": "seeker", "text": "Thank you, but  I do not feel motivated to do anything. What should i do with my feelings?"}, "H002:T009": {"id": "H002:T009", "role": "supporter", "text": "Is there anything you want to do right now that helps maybe. For example, to eat something, to listen good music or take small walk in fresh air etc"}, "H002:T010": {"id": "H002:T010", "role": "supporter", "text": "I can feel you, it must be so hard to you. take your time do not think about a lot"}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "when I have bad times, I just want to take a nap. It maybe help you feel better"}, "H002:T012": {"id": "H002:T012", "role": "seeker", "text": "I think you are right, maybe i just need to take a pause in my life for now, yeah I like to sleep. Thanks for supporting me. "}, "H002:T013": {"id": "H002:T013", "role": "seeker", "text": "I think I will try what you said today"}, "H002:T014": {"id": "H002:T014", "role": "seeker", "text": "Maybe I will watch some movies and then take a nap"}, "H002:T015": {"id": "H002:T015", "role": "supporter", "text": "I am happy to hear that. I hope you will feel better soon. "}, "H002:T016": {"id": "H002:T016", "role": "seeker", "text": "Thank you for your support, I really appreciate it"}, "H002:T017": {"id": "H002:T017", "role": "supporter", "text": "You are welcome, I am here for you. "}, "H003:T000": {"id": "H003:T000", "role": "supporter", "text": "Hello! What seems to be the problem?"}, "H003:T001": {"id": "H003:T001", "role": "seeker", "text": "am having sleep disorder problem"}, "H003:T002": {"id": "H003:T002", "role": "seeker", "text": "will you able to help?"}, "H003:T003": {"id": "H003:T003", "role": "seeker", "text": "Daily am not able to sleep on time"}, "H003:T004": {"id": "H003:T004", "role": "supporter", "text": "I will try my best. I specialise in yoga and meditation."}, "H003:T005": {"id": "H003:T005", "role": "seeker", "text": "Great"}, "H003:T006": {"id": "H003:T006", "role": "supporter", "text": "How long has this been happening for?"}, "H003:T007": {"id": "H003:T007", "role": "seeker", "text": "past 2 weeks"}, "H003:T008": {"id": "H003:T008", "role": "seeker", "text": "will you able to help with some video links"}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "which I can see and follow"}, "H003:T010": {"id": "H003:T010", "role": "supporter", "text": "This may be an obvious question, but can you think of something that has changed in the last two weeks?"}, "H003:T011": {"id": "H003:T011", "role": "supporter", "text": "Think about work related, personal life, changes in behaviour?"}, "H003:T012": {"id": "H003:T012", "role": "seeker", "text": "yeah. may be work related"}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "I am spending more time on work"}, "H003:T014": {"id": "H003:T014", "role": "seeker", "text": "I need to switch some activities other than work"}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "will you suggest to take off for few more days from work?"}, "H003:T016": {"id": "H003:T016", "role": "seeker", "text": "will that work"}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "or any other better solution"}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "It might solve as a temporary solution, however, if whatever happened at work to cause this continues when you return from holidays, you will just have the same problem again."}, "H003:T019": {"id": "H003:T019", "role": "supporter", "text": "What exactly do you think is causing it? Additional work/responsibilities? New manager?"}, "H003:T020": {"id": "H003:T020", "role": "seeker", "text": "additional work being assigned to me"}, "H003:T021": {"id": "H003:T021", "role": "seeker", "text": "that causes more work stress"}, "H003:T022": {"id": "H003:T022", "role": "seeker", "text": "most of them are new to me, so am spending more time to learn "}, "H003:T023": {"id": "H003:T023", "role": "supporter", "text": "Have you tried to speak to your manager about these additional responsibilities? Do you know if it is a short term problem or you will always have extra work being assigned?"}, "H003:T024": {"id": "H003:T024", "role": "seeker", "text": "I am trying to speak. but she is not listening much"}, "H003:T025": {"id": "H003:T025", "role": "seeker", "text": "let me try to tell my situation and get some better solution"}, "H003:T026": {"id": "H003:T026", "role": "seeker", "text": "will you able to share some yoga \u0026 mediation links?"}, "H003:T027": {"id": "H003:T027", "role": "seeker", "text": "to divert me from the extra additional work"}, "H003:T028": {"id": "H003:T028", "role": "supporter", "text": "I don't think I can share links over here, however the activities you perform directly before you go to sleep have a direct impact on your sleeping."}, "H003:T029": {"id": "H003:T029", "role": "supporter", "text": "I would recommend trying to practice 30m-1h of yoga (you can find lodes of exercise videos on the internet to follow), followed by a mediation sound track for you to listen to in bed while you try to sleep."}, "H003:T030": {"id": "H003:T030", "role": "supporter", "text": "Keep your body and mind clear before you go to sleep has proven to allow for a better sleep."}, "H003:T031": {"id": "H003:T031", "role": "supporter", "text": "I used to have sleeping issues, and I started doing this 2 years ago, and I completely changed. I am an investment banker and still am, it is a very stressful environment however this has allowed me to work at the very top and remain in control of my body and mind."}, "H003:T032": {"id": "H003:T032", "role": "supporter", "text": "Please try this for 1 week, I know you can do it and I know it will help you long term."}, "H003:T033": {"id": "H003:T033", "role": "seeker", "text": "Sure. I can try whatever you suggested"}, "H003:T034": {"id": "H003:T034", "role": "seeker", "text": "I am sure definitely I will get some changes"}, "H003:T035": {"id": "H003:T035", "role": "seeker", "text": "I felt good after chatting with you"}, "H003:T036": {"id": "H003:T036", "role": "supporter", "text": "Thanks so good, I have really enjoyed talking to you too."}, "H003:T037": {"id": "H003:T037", "role": "seeker", "text": "Thank you so much for your advice and have a good day."}, "H003:T038": {"id": "H003:T038", "role": "supporter", "text": "My pleasure, you too."}, "H003:T039": {"id": "H003:T039", "role": "seeker", "text": "Bye. closing this chat"}, "H003:T040": {"id": "H003:T040", "role": "supporter", "text": "Bye."}, "H004:T000": {"id": "H004:T000", "role": "seeker", "text": "hello"}, "H004:T001": {"id": "H004:T001", "role": "supporter", "text": "Hello, how are you today?"}, "H004:T002": {"id": "H004:T002", "role": "seeker", "text": "I'm good, I feel anxious whenever I think of my career"}, "H004:T003": {"id": "H004:T003", "role": "supporter", "text": "I understand. I often feel the same when my day starts. "}, "H004:T004": {"id": "H004:T004", "role": "seeker", "text": "people around me seems to achieve great things and get promoted but I am still at my current position"}, "H004:T005": {"id": "H004:T005", "role": "supporter", "text": "Do you know of some triggers that might cause this anxiety?"}, "H004:T006": {"id": "H004:T006", "role": "seeker", "text": "I fell like I am late on my plan"}, "H004:T007": {"id": "H004:T007", "role": "supporter", "text": "That sounds like something that could cause anxiety. We all strive to be recognized for our hard work. Have you conversed with your boss?"}, "H004:T008": {"id": "H004:T008", "role": "seeker", "text": "No i have not, I don't feel comfortable sharing this with my boss or coworkers"}, "H004:T009": {"id": "H004:T009", "role": "supporter", "text": "It can totally be intimidating to speak to a boss about this topic. It's not always easy to be comfortable in this kinds of conversations."}, "H004:T010": {"id": "H004:T010", "role": "supporter", "text": "Do you think your boss might have a negative reaction if you were to have this conversation?"}, "H004:T011": {"id": "H004:T011", "role": "seeker", "text": "It might, I am not sure but I don't think my boss will like the idea"}, "H004:T012": {"id": "H004:T012", "role": "supporter", "text": "Sometimes it's important to remember that part of your bosses job is having this kinds of conversations, even though he might not like the idea. "}, "H004:T013": {"id": "H004:T013", "role": "supporter", "text": "It might be a good idea to have this conversation with your boss. Hold them accountable for this part of their job."}, "H004:T014": {"id": "H004:T014", "role": "supporter", "text": "Do you think this could be a good idea?"}, "H004:T015": {"id": "H004:T015", "role": "seeker", "text": "You are right, I should let them know what I want too"}, "H004:T016": {"id": "H004:T016", "role": "supporter", "text": "It sounds like this might be a little intimidating for you."}, "H004:T017": {"id": "H004:T017", "role": "seeker", "text": "I'm not a very direct person so I don't really like confronting"}, "H004:T018": {"id": "H004:T018", "role": "seeker", "text": "but I think i should have this talk with my boss"}, "H004:T019": {"id": "H004:T019", "role": "supporter", "text": "It might feel that way. But if this is something that might benefit your future, it doesn't mean it's a confrontation."}, "H004:T020": {"id": "H004:T020", "role": "supporter", "text": "But rather, an affirmation of your skillsets."}, "H004:T021": {"id": "H004:T021", "role": "seeker", "text": "You're right, you make me feel better about the decision"}, "H004:T022": {"id": "H004:T022", "role": "supporter", "text": "I am happy to know you will try this. I know you can do it!"}, "H004:T023": {"id": "H004:T023", "role": "seeker", "text": "Thank you for your support"}, "H004:T024": {"id": "H004:T024", "role": "supporter", "text": "It's been my pleasure. I wish you good luck!"}, "H004:T025": {"id": "H004:T025", "role": "seeker", "text": "Can you give me an idea how to start the conversation?"}, "H004:T026": {"id": "H004:T026", "role": "supporter", "text": "Of course! It's always good to make a list before the meeting. List out your skillsets and how each of those skills provide value to the company. If you can demonstrate to your boss how you provide value to the company, it can give you confidence when taking the next step; asking for a promotion"}, "H004:T027": {"id": "H004:T027", "role": "seeker", "text": "What I'm worried is if they reject my suggestion, it will come back and bite me as they will think negatively about me"}, "H004:T028": {"id": "H004:T028", "role": "supporter", "text": "It's normal to feel that way. As humans we fear rejection. It's not a pleasant feeling!"}, "H004:T029": {"id": "H004:T029", "role": "seeker", "text": "thank you so much, I will start planning out what I need to talk about"}, "H005:T000": {"id": "H005:T000", "role": "supporter", "text": "hello"}, "H005:T001": {"id": "H005:T001", "role": "seeker", "text": "hi"}, "H005:T002": {"id": "H005:T002", "role": "supporter", "text": "can you talk about your feelings at this time"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "Currently I am worried to show up to work. We had a staff appreciation Thursday and we all got super drunk in front of our boss, and I am honestly scared he will judge me or fire me."}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "that's really hard, have you spoken to any of your coworkers"}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "Yes, we are all laughing at the matter, but you can tell our boss is looking at us different. We all showed up to work Friday hungover, and he just made lots of comments and jokes to play the part, but you can tell he is looking at me and everyone different. I do not know how to redeem myself."}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "I would recommend speaking with him privately about the issue one on one"}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "That sounds a lot easier said than done. I was the one who was the most drunk. But I do now know if he knows how drunk we all got since he left after one of us got hit in the face with a golf club and had to take her to the ER. So what if I say too much and apologize for what he does not know."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "have you tried reaching out a company hotline or maybe an hr department in your company to speak about this issue anonymously this could help with the tension between you and your boss "}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "He is the doctor of the office and the 2 office managers were pretty drunk too. It was a hot mess if I have to be honest and being an office full of girls I feel like we went too far. I for one feel embarrassed, and feel like just not saying anything and it will fade away. But I know the next few weeks will be a little hard, for all of us. This one is for the books, and something I have never encountered in my 10 years of working. "}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "I see how you feel do you think letting it fade is the best option in the long run?"}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "I think so. Somethings are sometimes better left unsaid. I just feel like avoiding it, but I do not know if anyone else would do the same. What would you do?"}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "I would apologize for my behavior to the manager if it was me. Just to seem professional and get in my bosses good grace. "}, "H005:T013": {"id": "H005:T013", "role": "seeker", "text": "You have guts. I think I will work on that and build the guts to talk to my boss if I ever have to. Thank you for that. "}, "H005:T014": {"id": "H005:T014", "role": "supporter", "text": "You are doing your best and I think you will make the right decision that works for you"}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "You are right. In the end I will do the right thing, even if it takes me some time to get there. "}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "Is anything else bother you?"}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "Just that. I think you helped me with the only issue I currently have."}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "I am happy to help!"}, "H005:T019": {"id": "H005:T019", "role": "seeker", "text": "Thank you!"}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "you're welcome"}, "H006:T000": {"id": "H006:T000", "role": "supporter", "text": "Hey Charlotte, how have you been doing lately?"}, "H006:T001": {"id": "H006:T001", "role": "seeker", "text": "Hi there. Honestly, it's been a bit overwhelming. I had a rough week at work."}, "H006:T002": {"id": "H006:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to share what happened?"}, "H006:T003": {"id": "H006:T003", "role": "seeker", "text": "Yeah, it's been building up for a while now. My workload has been increasing, and I had a panic attack at the office this week."}, "H006:T004": {"id": "H006:T004", "role": "supporter", "text": "That sounds really intense and scary. How are you feeling about the panic attack?"}, "H006:T005": {"id": "H006:T005", "role": "seeker", "text": "Pretty shaken, to be honest. It was like everything was closing in on me. I felt so out of control."}, "H006:T006": {"id": "H006:T006", "role": "supporter", "text": "It must have been a frightening experience. It's important to acknowledge those feelings. Have you had panic attacks before?"}, "H006:T007": {"id": "H006:T007", "role": "seeker", "text": "Not like this. I've felt stressed, but this was different. My heart was racing, and I couldn't breathe properly."}, "H006:T008": {"id": "H006:T008", "role": "supporter", "text": "Experiencing that for the first time can be very unsettling. How have you been managing at work since then?"}, "H006:T009": {"id": "H006:T009", "role": "seeker", "text": "I've been trying to keep up, but I'm worried it might happen again. It's hard to focus sometimes."}, "H006:T010": {"id": "H006:T010", "role": "supporter", "text": "I understand. The worry of it happening again can add to your stress. Have you considered talking to someone at work about your workload?"}, "H006:T011": {"id": "H006:T011", "role": "seeker", "text": "I've thought about it, but I'm unsure how to approach it. I don't want to seem incapable."}, "H006:T012": {"id": "H006:T012", "role": "supporter", "text": "It's perfectly okay to seek support or ask for help. Everyone has limits. Perhaps there's a way to address the workload without compromising your position."}, "H006:T013": {"id": "H006:T013", "role": "seeker", "text": "Maybe I should try setting some boundaries. It's just hard to navigate sometimes."}, "H006:T014": {"id": "H006:T014", "role": "supporter", "text": "That's a good idea. Setting boundaries can help manage stress. Have you considered any strategies for handling stress outside of work?"}, "H006:T015": {"id": "H006:T015", "role": "seeker", "text": "Not really. I think I need to find a way to relax more and maybe pick up a hobby."}, "H006:T016": {"id": "H006:T016", "role": "supporter", "text": "Finding something you enjoy could really help. Sometimes stepping away and doing something we love can reset our mind."}, "H006:T017": {"id": "H006:T017", "role": "seeker", "text": "You're right. I think I'll start looking for something new to do in my free time. Thanks for listening."}, "H006:T018": {"id": "H006:T018", "role": "supporter", "text": "I'm glad to hear that. Remember, I'm here if you need to talk more or if you just need someone to listen. You're doing great, Charlotte."}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Charlotte, how have things been going lately?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hi...it's been a rough couple of days. I had a pretty stressful event at work."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "I'm really sorry to hear that. Do you want to talk about what happened?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "Well, I found some errors in the project report I submitted, and my boss called me out in front of everyone. It was humiliating."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "That sounds incredibly stressful, especially since you've been dealing with a lot of pressure at work already."}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "Yes, exactly. It's like everything is piling on top of me, and I can't seem to catch a break."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "It makes sense that you'd feel overwhelmed. Are there any parts of the project or your workload that are more manageable for you?"}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "I guess there are some smaller tasks I can focus on, but even those feel daunting right now."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "I understand. It might help to break them down into even smaller steps, to make them feel a bit more doable."}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "I've thought about that, but it's hard to start when I'm just so exhausted all the time."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "I remember you mentioned issues with sleep in the past and how that's been affecting your energy levels."}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "Yeah. It’s been a persistent problem, and the stress from work only makes it harder to manage."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "That sounds really tough, especially since it’s a cycle that feeds into itself. Are there any strategies you’ve tried that have helped even a little?"}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "I tried meditation and some breathing exercises which were somewhat helpful before. But I haven't been consistent with them."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "It might be worth giving those another shot when you have a moment to yourself. Even small doses of relief can add up."}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "You're right. I should try to make it a routine instead of just something I turn to when things get really bad."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "That sounds like a great start. Making a little time every day for yourself could help ease some of that pressure."}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "Thanks for listening. It means a lot to have someone to talk to who understands what I'm going through."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "Anytime, Charlotte. You're doing your best under really tough circumstances, and I'm here whenever you need to talk."}, "H007:T019": {"id": "H007:T019", "role": "seeker", "text": "Thank you. I think I'll try setting up a time every day to meditate and maybe even talk to someone at work about easing my workload."}, "H007:T020": {"id": "H007:T020", "role": "supporter", "text": "That sounds like a solid plan. Taking those steps could make a big difference. And remember, it's okay to seek help; you're not alone."}, "H007:T021": {"id": "H007:T021", "role": "seeker", "text": "I will. Thanks again for being there and for your support."}, "H007:T022": {"id": "H007:T022", "role": "supporter", "text": "Of course, Charlotte. I'm always here to listen and support you."}, "H008:T000": {"id": "H008:T000", "role": "seeker", "text": "Hi! I really need to talk to someone about something that's been weighing on me."}, "H008:T001": {"id": "H008:T001", "role": "supporter", "text": "Of course, Charlotte. I'm here to listen. What's going on?"}, "H008:T002": {"id": "H008:T002", "role": "seeker", "text": "Work has been really tough lately, and my hours have increased without any official notice. It's adding so much stress."}, "H008:T003": {"id": "H008:T003", "role": "supporter", "text": "That sounds incredibly frustrating and exhausting. It must be hard to handle those kinds of expectations without any formal agreement."}, "H008:T004": {"id": "H008:T004", "role": "seeker", "text": "It really is. I feel like there's just no end in sight, especially after everything that happened last month."}, "H008:T005": {"id": "H008:T005", "role": "supporter", "text": "I remember you mentioning how stressed you were after that public criticism from your boss. It seems like things haven't let up for you since then."}, "H008:T006": {"id": "H008:T006", "role": "seeker", "text": "Exactly. I thought things might get better, but it feels like I'm just being given more and more to handle."}, "H008:T007": {"id": "H008:T007", "role": "supporter", "text": "It's incredibly tough to manage when the workload keeps increasing. Have you had a chance to bring this up with your manager yet?"}, "H008:T008": {"id": "H008:T008", "role": "seeker", "text": "I've been thinking about it, but I'm afraid it'll make things worse or that I'll be seen as incapable."}, "H008:T009": {"id": "H008:T009", "role": "supporter", "text": "That's a valid concern, but remember, asking for what you need doesn't make you weak. It's important to advocate for yourself
