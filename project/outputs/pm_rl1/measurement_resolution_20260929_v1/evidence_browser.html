, "role": "seeker", "text": "I truly appreciate you listening and being here for me. It means a lot."}, "H014:T018": {"id": "H014:T018", "role": "supporter", "text": "Anytime, Taylor. You're doing amazing things, and I'm here whenever you need to talk."}, "H014:T019": {"id": "H014:T019", "role": "seeker", "text": "Thank you. I'll try to take things one step at a time. Catch up soon?"}, "H014:T020": {"id": "H014:T020", "role": "supporter", "text": "Definitely! Take care and reach out whenever you feel like it."}, "H015:T000": {"id": "H015:T000", "role": "seeker", "text": "Hey there, is it okay to talk? I'm just feeling a bit overwhelmed with emotions right now."}, "H015:T001": {"id": "H015:T001", "role": "supporter", "text": "Of course, Taylor. I'm here for you. What's been going on lately?"}, "H015:T002": {"id": "H015:T002", "role": "seeker", "text": "It's Nate, my ex. He reached out to apologize recently, and it's stirred up a lot of old memories and feelings."}, "H015:T003": {"id": "H015:T003", "role": "supporter", "text": "I can imagine that must be really tough. How did it feel when he reached out to you?"}, "H015:T004": {"id": "H015:T004", "role": "seeker", "text": "Confusing, honestly. Part of me was glad he apologized, but another part isn't sure if I can trust his intentions."}, "H015:T005": {"id": "H015:T005", "role": "supporter", "text": "That's completely valid. Trust can be hard to rebuild, especially after everything you've been through."}, "H015:T006": {"id": "H015:T006", "role": "seeker", "text": "Exactly. I keep thinking about our past arguments and how they made me feel. It's all just resurfacing now."}, "H015:T007": {"id": "H015:T007", "role": "supporter", "text": "It sounds like those memories are really triggering some deep emotions. How are you handling them right now?"}, "H015:T008": {"id": "H015:T008", "role": "seeker", "text": "Not too well, if I'm honest. I'm finding it hard to focus on my studies and my writing, and this time of year is already stressful."}, "H015:T009": {"id": "H015:T009", "role": "supporter", "text": "It's completely understandable. Between the pressure from studies and your relationship history, it sounds like you're dealing with a lot."}, "H015:T010": {"id": "H015:T010", "role": "seeker", "text": "It feels like too much sometimes, especially after failing a mid-term recently. My self-worth is really taking a hit."}, "H015:T011": {"id": "H015:T011", "role": "supporter", "text": "I'm really sorry you're feeling this way, Taylor. Remember, one exam doesn't define your abilities or worth. You've achieved so much already."}, "H015:T012": {"id": "H015:T012", "role": "seeker", "text": "Thanks for saying that. My therapist did mention the importance of focusing on self-worth, but it’s hard to internalize it sometimes."}, "H015:T013": {"id": "H015:T013", "role": "supporter", "text": "It’s a process, and it’s okay to have days where it feels more challenging. Have you tried any of the strategies your therapist suggested?"}, "H015:T014": {"id": "H015:T014", "role": "seeker", "text": "I've been trying to focus on my writing and stay active in the online community I found. It helps to some extent."}, "H015:T015": {"id": "H015:T015", "role": "supporter", "text": "That’s a great outlet for your emotions. Writing can be such a powerful way to process your thoughts and experiences."}, "H015:T016": {"id": "H015:T016", "role": "seeker", "text": "Yeah, it's one of the few things that helps me clear my mind. But the writer's block is still a bit persistent."}, "H015:T017": {"id": "H015:T017", "role": "supporter", "text": "Writer's block can be really frustrating, especially when you're already feeling overwhelmed. Is there anything specific about writing that's been challenging?"}, "H015:T018": {"id": "H015:T018", "role": "seeker", "text": "It's like I'm second-guessing everything I put down on paper, feeling like it’s not good enough compared to my peers."}, "H015:T019": {"id": "H015:T019", "role": "supporter", "text": "Imposter syndrome is really tough to deal with. Just remember, your voice is unique and valuable in its own right."}, "H015:T020": {"id": "H015:T020", "role": "seeker", "text": "Thanks for reminding me. I often forget that when I'm deep in self-doubt. It means a lot to have your support."}, "H015:T021": {"id": "H015:T021", "role": "supporter", "text": "I'm always here for you, Taylor. Make sure to be kind to yourself and take things one day at a time. You're doing your best."}, "H015:T022": {"id": "H015:T022", "role": "seeker", "text": "Thanks. I really needed to hear that. I’ll try to focus on what's within my control and take small steps forward."}, "H015:T023": {"id": "H015:T023", "role": "supporter", "text": "That's a great approach. You're stronger than you realize, and I'm proud of you for reaching out and talking this through."}, "H015:T024": {"id": "H015:T024", "role": "seeker", "text": "I appreciate it. It feels good to get everything off my chest and know I'm not facing this alone."}, "H016:T000": {"id": "H016:T000", "role": "seeker", "text": "Hey, are you online? I really need someone to talk to right now."}, "H016:T001": {"id": "H016:T001", "role": "supporter", "text": "Hey Taylor, I'm here. What's going on?"}, "H016:T002": {"id": "H016:T002", "role": "seeker", "text": "I had a panic attack today, just before a social event. It was terrifying."}, "H016:T003": {"id": "H016:T003", "role": "supporter", "text": "I'm so sorry to hear that. Panic attacks can be really overwhelming. Do you want to share more about what happened?"}, "H016:T004": {"id": "H016:T004", "role": "seeker", "text": "I was supposed to go to this gathering with some classmates, and out of nowhere, I just felt completely frozen."}, "H016:T005": {"id": "H016:T005", "role": "supporter", "text": "That sounds incredibly tough. It makes sense you might feel that way given everything you've been dealing with lately. How are you feeling now?"}, "H016:T006": {"id": "H016:T006", "role": "seeker", "text": "A bit better, but still shaky. I keep thinking about all the stress from before—school, my ex, even stuff at home. It all feels like too much at times."}, "H016:T007": {"id": "H016:T007", "role": "supporter", "text": "You’ve been through a lot recently, so it’s understandable you're feeling overwhelmed. It’s good that you’re reaching out and acknowledging what you’re experiencing."}, "H016:T008": {"id": "H016:T008", "role": "seeker", "text": "Thanks. I thought I was doing better with the writing workshop and finding that online community, but days like this hit hard."}, "H016:T009": {"id": "H016:T009", "role": "supporter", "text": "Those were really positive steps forward, and they still are. It’s okay to have setbacks. They don’t define you or erase your progress."}, "H016:T010": {"id": "H016:T010", "role": "seeker", "text": "I guess I just feel like I'm falling behind everyone else. The imposter syndrome keeps creeping in, especially when I see peers succeeding."}, "H016:T011": {"id": "H016:T011", "role": "supporter", "text": "Those feelings are difficult, but remember that you're not alone in experiencing them. You've achieved so much already, and you deserve to be proud of your journey."}, "H016:T012": {"id": "H016:T012", "role": "seeker", "text": "I know, it's just hard to see sometimes. My therapist said something about self-worth the other day, but I'm struggling to internalize it."}, "H016:T013": {"id": "H016:T013", "role": "supporter", "text": "That’s a common struggle. Maybe try to focus on one small thing you like or are proud of about yourself each day. It can slowly shift your perspective over time."}, "H016:T014": {"id": "H016:T014", "role": "seeker", "text": "That's a good idea. I’ll try to start doing that. I think just talking about it now is helping a bit."}, "H016:T015": {"id": "H016:T015", "role": "supporter", "text": "I'm really glad to hear that. Remember, it’s okay to have hard days. Just keep reaching out and taking things one step at a time."}, "H016:T016": {"id": "H016:T016", "role": "seeker", "text": "Thanks for being here. I was feeling really alone after today."}, "H016:T017": {"id": "H016:T017", "role": "supporter", "text": "You’re never alone in this. I’m here anytime you need to talk. We can get through this together."}, "H017:T000": {"id": "H017:T000", "role": "supporter", "text": "Hey Taylor, how have you been feeling lately?"}, "H017:T001": {"id": "H017:T001", "role": "seeker", "text": "Honestly, not great. I found out that my grade slipped again even after I reattempted the exam."}, "H017:T002": {"id": "H017:T002", "role": "supporter", "text": "I’m really sorry to hear that. I can imagine how frustrating that must be after putting in all that effort."}, "H017:T003": {"id": "H017:T003", "role": "seeker", "text": "Yeah, it's pretty crushing. I thought that notifying my professor and putting in the extra work would help, but apparently not."}, "H017:T004": {"id": "H017:T004", "role": "supporter", "text": "It sounds like you’ve been trying really hard to make things right. It must feel discouraging to not see the progress you were expecting."}, "H017:T005": {"id": "H017:T005", "role": "seeker", "text": "Exactly. It's like nothing I do is ever enough. And it doesn't help that I still feel this disconnect with my professor after everything."}, "H017:T006": {"id": "H017:T006", "role": "supporter", "text": "That can be incredibly tough, especially when the relationship with your professor is strained. Do you think it might be worth discussing your feelings with them?"}, "H017:T007": {"id": "H017:T007", "role": "seeker", "text": "I've thought about it, but it's intimidating. What if they don’t take me seriously or think I’m just making excuses?"}, "H017:T008": {"id": "H017:T008", "role": "supporter", "text": "It's understandable to feel that way. However, sharing your concerns could potentially help rebuild that trust and understanding between you both."}, "H017:T009": {"id": "H017:T009", "role": "seeker", "text": "I guess you're right. I did have a good talk with my therapist about self-worth, and maybe I should try to use those insights to approach this situation."}, "H017:T010": {"id": "H017:T010", "role": "supporter", "text": "That sounds like a strong plan. You've already taken steps to understand yourself better, and using that knowledge could really help in this case."}, "H017:T011": {"id": "H017:T011", "role": "seeker", "text": "I hope so. It’s just hard not to feel like an imposter when I see my peers succeeding so easily."}, "H017:T012": {"id": "H017:T012", "role": "supporter", "text": "Imposter syndrome can be really tough to battle. Remember, everyone's journey is different, and your progress is valuable too."}, "H017:T013": {"id": "H017:T013", "role": "seeker", "text": "Thank you for saying that. It's just been difficult to see my own value lately, especially with everything else piling up."}, "H017:T014": {"id": "H017:T014", "role": "supporter", "text": "It definitely sounds like a lot is on your plate right now. Just know that it's okay to feel overwhelmed, and that you're doing your best."}, "H017:T015": {"id": "H017:T015", "role": "seeker", "text": "I appreciate you reminding me of that. Things have felt really heavy since the argument with my ex and all these academic pressures."}, "H017:T016": {"id": "H017:T016", "role": "supporter", "text": "You’ve been through so much. It’s important to give yourself credit for handling these challenges. How have you been managing?"}, "H017:T017": {"id": "H017:T017", "role": "seeker", "text": "I've been journaling a lot and trying to keep up with my creative writing. It helps sometimes, but I still feel stuck occasionally."}, "H017:T018": {"id": "H017:T018", "role": "supporter", "text": "Writing can be a powerful outlet. It’s great that you’re turning to creativity as a way of processing your emotions."}, "H017:T019": {"id": "H017:T019", "role": "seeker", "text": "Yeah, it's been a lifeline, honestly. That, and the supportive online community I found for writers."}, "H017:T020": {"id": "H017:T020", "role": "supporter", "text": "I’m glad you have that. Connecting with others who understand what you're going through can be really comforting."}, "H017:T021": {"id": "H017:T021", "role": "seeker", "text": "It truly is. Sometimes hearing from others who have faced similar struggles makes everything feel a bit more manageable."}, "H017:T022": {"id": "H017:T022", "role": "supporter", "text": "Absolutely. Remember, it's completely okay to lean on those communities and your support system. You’re not alone in this."}, "H017:T023": {"id": "H017:T023", "role": "seeker", "text": "I’ll try to keep that in mind. Thank you for listening and offering your support. It means a lot."}, "H017:T024": {"id": "H017:T024", "role": "supporter", "text": "Anytime, Taylor. I’m here whenever you need to talk. Take each day as it comes, and be gentle with yourself."}, "H017:T025": {"id": "H017:T025", "role": "seeker", "text": "I’ll do my best. Thanks again for being there."}, "H018:T000": {"id": "H018:T000", "role": "supporter", "text": "Hey Taylor, I've been thinking about you. How are you holding up today?"}, "H018:T001": {"id": "H018:T001", "role": "seeker", "text": "Hey... It's been a rough day. I found out my close friend was hospitalized, and it just feels like too much right now."}, "H018:T002": {"id": "H018:T002", "role": "supporter", "text": "I'm so sorry to hear about your friend. That must be really hard to process. Do you want to talk more about it?"}, "H018:T003": {"id": "H018:T003", "role": "seeker", "text": "Yeah, it's just...she've always been there for me, especially through the whole thing with my ex and when I was struggling at school. It feels surreal not being able to support her now."}, "H018:T004": {"id": "H018:T004", "role": "supporter", "text": "It sounds like they mean a lot to you, and not being able to be there for her must be really tough. It’s understandable to feel overwhelmed."}, "H018:T005": {"id": "H018:T005", "role": "seeker", "text": "Exactly. And it's like all these emotions from the past are surfacing again - the argument with my parents, the panic attacks, the trust issues with my professor. Everything seems to be piling up."}, "H018:T006": {"id": "H018:T006", "role": "supporter", "text": "It’s okay to have all these emotions. You've been through a lot recently. How are you managing to cope with everything?"}, "H018:T007": {"id": "H018:T007", "role": "seeker", "text": "Well, I'm trying to stick to some of the things my therapist suggested, like journaling and mindfulness exercises, but sometimes it feels like I’m just going through the motions."}, "H018:T008": {"id": "H018:T008", "role": "supporter", "text": "Journaling and mindfulness can be great tools, but it’s also okay to not have it all figured out right now. Are there moments where you feel a bit more at ease?"}, "H018:T009": {"id": "H018:T009", "role": "seeker", "text": "Maybe when I'm writing, or when I'm engaging with the online writing community. I get what it feels like to be overwhelmed creatively and emotionally."}, "H018:T010": {"id": "H018:T010", "role": "supporter", "text": "That's wonderful to hear. It’s important to have spaces where you feel understood and supported. What’s been inspiring your writing lately?"}, "H018:T011": {"id": "H018:T011", "role": "seeker", "text": "I haven’t been writing as much because of the writer's block, but the supportive messages from the community have been motivating me to start again, even if it's just jotting down ideas."}, "H018:T012": {"id": "H018:T012", "role": "supporter", "text": "It sounds like you're slowly finding your way back to your passion, which is amazing. Give yourself time and space; creativity can be a healing process too."}, "H018:T013": {"id": "H018:T013", "role": "seeker", "text": "True. I guess I just need to be kinder to myself. It’s just hard when everything feels so uncertain and unstable."}, "H018:T014": {"id": "H018:T014", "role": "supporter", "text": "It makes sense to feel that way, given everything you’re dealing with. Remember, it's okay to reach out to your support system whenever needed."}, "H018:T015": {"id": "H018:T015", "role": "seeker", "text": "Thank you. It’s reassuring to know I can share this with you. I guess I just needed to talk it out without judgement."}, "H018:T016": {"id": "H018:T016", "role": "supporter", "text": "I'm always here for you, Taylor. You’re doing your best, and that’s more than enough. How about we plan for some self-care activities together soon?"}, "H018:T017": {"id": "H018:T017", "role": "seeker", "text": "I’d really like that. Maybe a virtual writing session or just a chat would be nice. I really appreciate your support."}, "H018:T018": {"id": "H018:T018", "role": "supporter", "text": "That sounds perfect. Let's plan something soon. Remember, you’re not alone in this. Anytime you need to talk, I’m just a message away."}, "H019:T000": {"id": "H019:T000", "role": "seeker", "text": "Hey, are you around? I could use someone to talk to."}, "H019:T001": {"id": "H019:T001", "role": "supporter", "text": "Hi Taylor, of course I'm here. What's on your mind?"}, "H019:T002": {"id": "H019:T002", "role": "seeker", "text": "I've just been feeling really anxious lately. I had this realization that I have no idea where I'm going with my studies."}, "H019:T003": {"id": "H019:T003", "role": "supporter", "text": "I'm sorry to hear that, Taylor. It's completely normal to feel uncertain about the future. What's been the most challenging part for you?"}, "H019:T004": {"id": "H019:T004", "role": "seeker", "text": "I think it's the feeling of being stuck. I mean, I'm supposed to be excited about creative writing, but I just feel... lost."}, "H019:T005": {"id": "H019:T005", "role": "supporter", "text": "Feeling stuck can be tough. Have you talked to anyone about how you're feeling?"}, "H019:T006": {"id": "H019:T006", "role": "seeker", "text": "Not really. I tried talking to my professor, but our relationship is strained. It’s hard to trust his advice."}, "H019:T007": {"id": "H019:T007", "role": "supporter", "text": "That sounds frustrating, especially when you don't feel supported. What happened?"}, "H019:T008": {"id": "H019:T008", "role": "seeker", "text": "Well, after failing the mid-term, I put in so much effort to improve, but my grades still slipped. It's like nothing I do is enough."}, "H019:T009": {"id": "H019:T009", "role": "supporter", "text": "It's so tough when efforts feel unrewarded. I'm proud of you for trying so hard, though. You deserve credit for that."}, "H019:T010": {"id": "H019:T010", "role": "seeker", "text": "Thank you. It just feels like everything's coming down at once—my writing, my studies, and even my relationship with my ex."}, "H019:T011": {"id": "H019:T011", "role": "supporter", "text": "You've been through a lot recently. How are you coping with everything?"}, "H019:T012": {"id": "H019:T012", "role": "seeker", "text": "Honestly, I don't know. My friend's hospitalization was another big hit. I feel so helpless."}, "H019:T013": {"id": "H019:T013", "role": "supporter", "text": "I'm really sorry to hear about your friend. It's okay to feel overwhelmed with everything going on."}, "H019:T014": {"id": "H019:T014", "role": "seeker", "text": "Thanks. It just feels like I'm constantly worrying, and the future seems so uncertain."}, "H019:T015": {"id": "H019:T015", "role": "supporter", "text": "Uncertainty can be scary. Have you found anything helpful in managing these feelings?"}, "H019:T016": {"id": "H019:T016", "role": "seeker", "text": "I've been trying to write again, but it's hard to get past this block. The online community has been supportive, though."}, "H019:T017": {"id": "H019:T017", "role": "supporter", "text": "That's good to hear. Sometimes sharing with people who understand can help. Maybe focusing on small writing goals could be a start?"}, "H019:T018": {"id": "H019:T018", "role": "seeker", "text": "Yeah, I guess taking it slow might lighten the load. It's just hard accepting that progress takes time."}, "H019:T019": {"id": "H019:T019", "role": "supporter", "text": "It's definitely tough, but small steps can lead to big changes. Have you considered speaking more with your therapist about these feelings?"}, "H019:T020": {"id": "H019:T020", "role": "seeker", "text": "I think I will. She was really helpful last time with the self-worth issues. I need that perspective again."}, "H019:T021": {"id": "H019:T021", "role": "supporter", "text": "It sounds like a good plan. It's important to feel supported as you navigate through these challenges."}, "H019:T022": {"id": "H019:T022", "role": "seeker", "text": "Thanks for listening. I feel a bit lighter just talking about it."}, "H019:T023": {"id": "H019:T023", "role": "supporter", "text": "Anytime, Taylor. Remember, you're not alone in this. Take things one day at a time."}, "H020:T000": {"id": "H020:T000", "role": "seeker", "text": "Hey, I wanted to talk if you have some time."}, "H020:T001": {"id": "H020:T001", "role": "supporter", "text": "Of course, Taylor. What's been on your mind lately?"}, "H020:T002": {"id": "H020:T002", "role": "seeker", "text": "Well, I recently participated in a poetry slam. It was quite a new experience for me."}, "H020:T003": {"id": "H020:T003", "role": "supporter", "text": "That sounds exciting! How did it go for you?"}, "H020:T004": {"id": "H020:T004", "role": "seeker", "text": "It went surprisingly well! I mean, I was really nervous at first."}, "H020:T005": {"id": "H020:T005", "role": "supporter", "text": "That's totally understandable! Performing can be nerve-wracking. How did you manage those nerves?"}, "H020:T006": {"id": "H020:T006", "role": "seeker", "text": "I just kept telling myself to focus on the words and the message I wanted to convey."}, "H020:T007": {"id": "H020:T007", "role": "supporter", "text": "That's a great strategy. Sounds like you were really in the moment."}, "H020:T008": {"id": "H020:T008", "role": "seeker", "text": "Yeah, and when I finished, the applause was unexpected. It boosted my confidence so much."}, "H020:T009": {"id": "H020:T009", "role": "supporter", "text": "Wow, that must have felt amazing! How are you feeling about it now, a few days later?"}, "H020:T010": {"id": "H020:T010", "role": "seeker", "text": "Honestly, it's a mix of pride and a bit of self-doubt. Like, was it a fluke?"}, "H020:T011": {"id": "H020:T011", "role": "supporter", "text": "I hear you. It's normal to question yourself sometimes, but remember how powerful that moment was."}, "H020:T012": {"id": "H020:T012", "role": "seeker", "text": "True. I guess it's just hard not to compare myself to others who've been doing this longer."}, "H020:T013": {"id": "H020:T013", "role": "supporter", "text": "It's easy to fall into that trap, but your journey and experiences are uniquely yours."}, "H020:T014": {"id": "H020:T014", "role": "seeker", "text": "Thanks, I needed to hear that. I think the poetry slam reminded me of why I love writing."}, "H020:T015": {"id": "H020:T015", "role": "supporter", "text": "That's wonderful to hear. You have so much passion, and it shows. Embrace it."}, "H020:T016": {"id": "H020:T016", "role": "seeker", "text": "I will. It's been tough lately, especially after struggling with direction in my studies."}, "H020:T017": {"id": "H020:T017", "role": "supporter", "text": "I remember you mentioning that. How are things going with your studies now?"}, "H020:T018": {"id": "H020:T018", "role": "seeker", "text": "Still figuring it out, but the poetry slam was a reminder that I can achieve things I set my mind to."}, "H020:T019": {"id": "H020:T019", "role": "supporter", "text": "That's the spirit! And don't forget, it's okay to take your time to find your path."}, "H020:T020": {"id": "H020:T020", "role": "seeker", "text": "I appreciate that. I guess I'm learning to be more patient with myself."}, "H020:T021": {"id": "H020:T021", "role": "supporter", "text": "Patience is key, and you're doing great. Just keep moving forward at your own pace."}, "H020:T022": {"id": "H020:T022", "role": "seeker", "text": "Thanks for the support. It really means a lot."}, "H020:T023": {"id": "H020:T023", "role": "supporter", "text": "Anytime, Taylor. You've got this."}, "H021:T000": {"id": "H021:T000", "role": "seeker", "text": "Hey, do you have a moment to chat?"}, "H021:T001": {"id": "H021:T001", "role": "supporter", "text": "Of course, Taylor. What's on your mind?"}, "H021:T002": {"id": "H021:T002", "role": "seeker", "text": "I got this opportunity to co-author a short story for a college magazine."}, "H021:T003": {"id": "H021:T003", "role": "supporter", "text": "That's fantastic news! How are you feeling about it?"}, "H021:T004": {"id": "H021:T004", "role": "seeker", "text": "A bit unsure, honestly. Part of me is excited, but another part is scared."}, "H021:T005": {"id": "H021:T005", "role": "supporter", "text": "It's completely normal to feel that mix of emotions. What about it feels scary?"}, "H021:T006": {"id": "H021:T006", "role": "seeker", "text": "I guess it's the pressure. I don't want to disappoint my co-author or myself."}, "H021:T007": {"id": "H021:T007", "role": "supporter", "text": "Pressure can definitely be intense. Remember, they chose you for a reason. You have talent and a unique voice."}, "H021:T008": {"id": "H021:T008", "role": "seeker", "text": "Yeah, I know. I keep thinking about the writer's block I had earlier though."}, "H021:T009": {"id": "H021:T009", "role": "supporter", "text": "That was a challenging time, but look how far you've come since then. You even enrolled in that creative writing workshop and it seems to be helping."}, "H021:T010": {"id": "H021:T010", "role": "seeker", "text": "The workshop has been great. It reminded me why I love writing. I'm just scared of losing that creative spark again."}, "H021:T011": {"id": "H021:T011", "role": "supporter", "text": "It’s understandable to worry about that. But remember, creativity isn’t constant. It ebbs and flows, and that's okay."}, "H021:T012": {"id": "H021:T012", "role": "seeker", "text": "That's a comforting thought. I guess I just need to trust the process more."}, "H021:T013": {"id": "H021:T013", "role": "supporter", "text": "Exactly. Trusting yourself and the process is key. And don't hesitate to lean on your online writing community for support if you feel stuck."}, "H021:T014": {"id": "H021:T014", "role": "seeker", "text": "They have been a great support in the past. I should definitely reach out more."}, "H021:T015": {"id": "H021:T015", "role": "supporter", "text": "Yes, they can provide so much inspiration. And remember, you've dealt with similar feelings before, and you managed them well."}, "H021:T016": {"id": "H021:T016", "role": "seeker", "text": "True, I did get through it. I just need to keep believing in my abilities."}, "H021:T017": {"id": "H021:T017", "role": "supporter", "text": "Absolutely. You've shown so much resilience. You've got this, Taylor."}, "H021:T018": {"id": "H021:T018", "role": "seeker", "text": "Thanks for listening. I feel a bit more confident now."}, "H021:T019": {"id": "H021:T019", "role": "supporter", "text": "I'm glad to hear that. Remember, I'm here whenever you need to talk. Good luck with the story!"}, "H021:T020": {"id": "H021:T020", "role": "seeker", "text": "Thank you! I’ll definitely keep you updated on how it goes."}, "H022:T000": {"id": "H022:T000", "role": "seeker", "text": "Hey, do you have a moment? I really need to talk."}, "H022:T001": {"id": "H022:T001", "role": "supporter", "text": "Of course, Taylor. I'm here for you. What's on your mind?"}, "H022:T002": {"id": "H022:T002", "role": "seeker", "text": "It's Nate again. He reached out and wants to meet up."}, "H022:T003": {"id": "H022:T003", "role": "supporter", "text": "Oh wow, that must have been unexpected. How are you feeling about it?"}, "H022:T004": {"id": "H022:T004", "role": "seeker", "text": "Honestly? Conflicted. Part of me thinks it's a bad idea, but there's another part that wants closure."}, "H022:T005": {"id": "H022:T005", "role": "supporter", "text": "It makes sense to feel torn, especially after everything you've been through with him. Have you thought about what you might say or ask if you do meet up?"}, "H022:T006": {"id": "H022:T006", "role": "seeker", "text": "Not really... I mean, there's a lot to unpack. I don't even know where to start. Plus, there’s the whole thing with my studies being a mess lately."}, "H022:T007": {"id": "H022:T007", "role": "supporter", "text": "It sounds overwhelming. Balancing academics and these personal feelings can be a lot. Remember just to take things one step at a time. Maybe making a list of points you want closure on might help?"}, "H022:T008": {"id": "H022:T008", "role": "seeker", "text": "That's a good idea. I suppose if I had a clearer picture of what I need closure on, it'd be easier to navigate the conversation."}, "H022:T009": {"id": "H022:T009", "role": "supporter", "text": "Exactly, it can help keep the conversation focused on what's most important to you. How are things going with your writing and school? Are you getting support from your professors or peers?"}, "H022:T010": {"id": "H022:T010", "role": "seeker", "text": "The writing's been better since I found that supportive community. The college magazine project keeps me busy, but school overall... It's still a struggle, especially with grades slipping."}, "H022:T011": {"id": "H022:T011", "role": "supporter", "text": "It's great to hear about your progress with the creative writing project. Hopefully, things will stabilize with academics too, but remember it's okay to seek extra help if you need it."}, "H022:T012": {"id": "H022:T012", "role": "seeker", "text": "Yeah, I should probably reach out to my professors. I just hate admitting that I’m struggling, you know?"}, "H022:T013": {"id": "H022:T013", "role": "supporter", "text": "Admitting you're struggling takes strength. No one expects you to handle everything perfectly. Have you found your chats with your therapist helpful in this regard?"}, "H022:T014": {"id": "H022:T014", "role": "seeker", "text": "Definitely, talking things through with my therapist has been invaluable. She’s helped me see that it’s okay to ask for help, but old habits die hard."}, "H022:T015": {"id": "H022:T015", "role": "supporter", "text": "Old habits can be persistent, but you're making progress, and that's what counts. Maybe soon, you'll find it a bit easier to reach out when you need."}, "H022:T016": {"id": "H022:T016", "role": "seeker", "text": "I hope so. Thanks for being there and listening. I really appreciate it."}, "H022:T017": {"id": "H022:T017", "role": "supporter", "text": "Always here for you, Taylor. Remember, you’re doing your best, and that's enough."}, "H023:T000": {"id": "H023:T000", "role": "supporter", "text": "Hey Taylor! How are you doing today? How's everything at the writing retreat?"}, "H023:T001": {"id": "H023:T001", "role": "seeker", "text": "Hi. It's been a whirlwind, honestly. It's both exciting and emotionally challenging."}, "H023:T002": {"id": "H023:T002", "role": "supporter", "text": "That sounds intense. What's been the most challenging part for you so far?"}, "H023:T003": {"id": "H023:T003", "role": "seeker", "text": "I guess it's dealing with so many thoughts about my future and my self-worth. The retreat's really brought that into focus."}, "H023:T004": {"id": "H023:T004", "role": "supporter", "text": "It's completely normal to have those feelings, especially with everything you've been juggling. What does the retreat involve?"}, "H023:T005": {"id": "H023:T005", "role": "seeker", "text": "Well, we have workshops during the day and writing prompts in the evening. It's structured, but also very introspective."}, "H023:T006": {"id": "H023:T006", "role": "supporter", "text": "Sounds like a great opportunity for reflection. How's it been helping with your writing, especially after the writer's block?"}, "H023:T007": {"id": "H023:T007", "role": "seeker", "text": "It's interesting. I've started to write again, more freely. But sometimes I still feel like I'm not good enough."}, "H023:T008": {"id": "H023:T008", "role": "supporter", "text": "I remember you talking about feeling like an impostor after seeing your peers succeed. It's tough, but every writer has their unique voice."}, "H023:T009": {"id": "H023:T009", "role": "seeker", "text": "Yeah, I try to remind myself of that. I did have some confidence after the poetry slam, but it fluctuates."}, "H023:T010": {"id": "H023:T010", "role": "supporter", "text": "Confidence can be such a fickle thing, especially after setbacks like with your ex and classes. Do you think the retreat is helping you focus on what truly matters to you?"}, "H023:T011": {"id": "H023:T011", "role": "seeker", "text": "I think so. I'm recognizing how much writing means to me beyond grades or accolades."}, "H023:T012": {"id": "H023:T012", "role": "supporter", "text": "That's powerful, Taylor. Reconnecting with your passions sounds like a huge step forward. Have you been able to enjoy some of the small victories during your retreat?"}, "H023:T013": {"id": "H023:T013", "role": "seeker", "text": "Yeah, there are moments when I read back what I've written and I actually like it. It feels rare but rewarding."}, "H023:T014": {"id": "H023:T014", "role": "supporter", "text": "Those moments are incredible! They're a testament to your growth and talent. What about the people at the retreat? Have you connected with anyone?"}, "H023:T015": {"id": "H023:T015", "role": "seeker", "text": "I've met some amazing fellow writers. It's nice to share our struggles and triumphs. It makes me feel less alone in all this."}, "H023:T016": {"id": "H023:T016", "role": "supporter", "text": "It's great to hear you're building connections. You're never alone in this; we're all rooting for you. Anything specific that you've learned or any piece of advice that resonated with you during the retreat?"}, "H023:T017": {"id": "H023:T017", "role": "seeker", "text": "One thing that stood out was the idea of writing for myself first before thinking about how others will perceive it. It relieves a lot of pressure."}, "H023:T018": {"id": "H023:T018", "role": "supporter", "text": "That's such a valuable insight. Prioritizing your own voice over external validation is key. How's it affecting your approach to writing going forward?"}, "H023:T019": {"id": "H023:T019", "role": "seeker", "text": "I think I'm starting to trust myself more. There's still fear, but I'm learning to confront it rather than avoid it."}, "H023:T020": {"id": "H023:T020", "role": "supporter", "text": "Confronting fear is a big deal. Remember your worth and the journey you've overcome to get here. Do you have any goals or plans after the retreat?"}, "H023:T021": {"id": "H023:T021", "role": "seeker", "text": "I want to finish the short story for the college magazine and maybe explore more poetry. Both give me joy, and I want to hold onto that."}, "H023:T022": {"id": "H023:T022", "role": "supporter", "text": "Those sound like wonderful goals. Stay connected to what makes you happy, and I'm confident you'll do great things. Anything else on your mind?"}, "H023:T023": {"id": "H023:T023", "role": "seeker", "text": "Just working on being okay with mistakes and self-doubt. Thank you for listening—it means a lot."}, "H023:T024": {"id": "H023:T024", "role": "supporter", "text": "Always here to listen, Taylor. Keep going, and remember you're doing better than you think. Reach out anytime you need to talk."}, "H023:T025": {"id": "H023:T025", "role": "seeker", "text": "Thanks. I will. Take care!"}}, "current_date": "2025-04-05", "last_seeker": "We talked about all the pressures I've been feeling with my studies and how I've been questioning my direction. I also brought up how the argument between Mom and Dad affected me."}, "a4e2563a04ce0cdc789d3b5329bbfbb671549d928c7c5dfde929c9f7b2caeac9": {"turns": {"C:T000": {"id": "C:T000", "role": "supporter", "text": "Hello, how is your life at the moment? Do you want to talk about anything? "}, "C:T001": {"id": "C:T001", "role": "seeker", "text": "I am doing ok. I just broke up with my girlfriend and sad about it"}, "C:T002": {"id": "C:T002", "role": "supporter", "text": "so I hear you are not feeling at all your best at the moment? "}, "C:T003": {"id": "C:T003", "role": "seeker", "text": "That is correct."}, "C:T004": {"id": "C:T004", "role": "supporter", "text": "Do you feel as though you have no-one to talk to about this situation? I am happy to listen. "}, "C:T005": {"id": "C:T005", "role": "seeker", "text": "I am so sad and just wonder why did it happen!!!"}, "C:T006": {"id": "C:T006", "role": "supporter", "text": "Do you have no idea? Do you think you might have done something wrong or perhaps she was being unfaithful to you? "}, "C:T007": {"id": "C:T007", "role": "seeker", "text": "We had simple disagreement and both of us were keep fighting.. now I can not get over it."}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "How are you today?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "I'm doing pretty good."}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "I'm glad to hear you're doing well in these trying times."}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Yah they are very difficult."}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "How have you been managing everything?"}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "Fine I've been pretty much just trying to go out as little as possible and stay safe."}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "Same here, it's a tough time to do that after doing it so long. Especially with the holidays coming up."}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "Yes I would have to agree."}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "Are you in close proximity to your family?"}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "Yeah I'm staying with them for the holidays and then going back home in January."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "I imagine that can create some stress?"}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "No not really it's all good over here."}, "H001:T012": {"id": "H001:T012", "role": "supporter", "text": "Well I'm glad to hear it, sounds like you've been managing pretty well then.  "}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "Yes because I am on winter break now."}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "I assume that means you're in college then? So the stress of finals is over now?"}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "Yes I am. And yeah I just finished finals."}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "That's good, I hope they went well for you."}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "They did. Some were hard, but at least they're over now."}, "H001:T018": {"id": "H001:T018", "role": "supporter", "text": "Yes, now you can relax and spend time with your family without the added stress."}, "H001:T019": {"id": "H001:T019", "role": "seeker", "text": "Yes, exactly."}, "H001:T020": {"id": "H001:T020", "role": "supporter", "text": "Well I hope you and your family enjoy the holidays and stay safe."}, "H001:T021": {"id": "H001:T021", "role": "seeker", "text": "Thank you, you too. "}, "H001:T022": {"id": "H001:T022", "role": "supporter", "text": "Thanks so much!"}, "H001:T023": {"id": "H001:T023", "role": "seeker", "text": "Are you with family?"}, "H001:T024": {"id": "H001:T024", "role": "supporter", "text": "Yes, just my immediate family."}, "H001:T025": {"id": "H001:T025", "role": "seeker", "text": "Oh that's good. Staying safe."}, "H001:T026": {"id": "H001:T026", "role": "supporter", "text": "Absolutely, the best thing we can do right now. Even though it's kind of a bummer."}, "H001:T027": {"id": "H001:T027", "role": "seeker", "text": "Yeah, hopefully things will go back to normal soon. "}, "H001:T028": {"id": "H001:T028", "role": "supporter", "text": "I hope so too, this has been such a crazy year."}, "H001:T029": {"id": "H001:T029", "role": "seeker", "text": "I agree."}, "H002:T000": {"id": "H002:T000", "role": "supporter", "text": "Hi, what I can help you with today?"}, "H002:T001": {"id": "H002:T001", "role": "seeker", "text": "Hi"}, "H002:T002": {"id": "H002:T002", "role": "seeker", "text": "I had problems in the past and somehow right now"}, "H002:T003": {"id": "H002:T003", "role": "supporter", "text": "What sort of problems were in your past and now?"}, "H002:T004": {"id": "H002:T004", "role": "seeker", "text": "I loved physics and I decided to attend university, but soon after I slowly lost my interest and became unmotivated"}, "H002:T005": {"id": "H002:T005", "role": "supporter", "text": "What was happening in your life that made you lose interest?"}, "H002:T006": {"id": "H002:T006", "role": "seeker", "text": "Actually the professors and the class atmosphere was the reason, and of course the quality of teaching"}, "H002:T007": {"id": "H002:T007", "role": "seeker", "text": "so I started to skipping the classes and failing"}, "H002:T008": {"id": "H002:T008", "role": "supporter", "text": "It sounds like that is a lot of reasons to be stressed. Have you spoken to a school counselor?"}, "H002:T009": {"id": "H002:T009", "role": "seeker", "text": "Yes lots of stress and pressure. I did not, because we didn't have such things or at least I wasn't aware"}, "H002:T010": {"id": "H002:T010", "role": "seeker", "text": "But nobody even pointed that why I'm failing, they just didn't care"}, "H002:T011": {"id": "H002:T011", "role": "supporter", "text": "I agree it is a lot of pressure, but do not let bad teachers deter you. I would reach out to a school counselor and let them know your situation. Every school must have one. "}, "H002:T012": {"id": "H002:T012", "role": "supporter", "text": "Also, physics is a difficult course to study, but if you chose it, that means you have a very strong mind. "}, "H002:T013": {"id": "H002:T013", "role": "seeker", "text": "I loved physics a lot more than now, but what's the point of studying when the teachers are pulsing you not to study! (because of the quality of teaching)"}, "H002:T014": {"id": "H002:T014", "role": "seeker", "text": "I hope there was someone, but I don't think we have a counselor"}, "H002:T015": {"id": "H002:T015", "role": "supporter", "text": "More reason to speak to a school counselor or school administrator. We need to provide help to students, not have bad teachers deter them. "}, "H002:T016": {"id": "H002:T016", "role": "seeker", "text": "Yeah, same with me! I wish I could attend a better univeristy"}, "H002:T017": {"id": "H002:T017", "role": "supporter", "text": "What made you choose this particular university you are at?"}, "H002:T018": {"id": "H002:T018", "role": "seeker", "text": "I didn't have another choice but this"}, "H002:T019": {"id": "H002:T019", "role": "supporter", "text": "Have you looked into other Universities for the possibility of transferring"}, "H002:T020": {"id": "H002:T020", "role": "seeker", "text": "Hmmm, actually I didn't think about this option"}, "H002:T021": {"id": "H002:T021", "role": "supporter", "text": "Just think about what you want in a good university and research from there"}, "H002:T022": {"id": "H002:T022", "role": "seeker", "text": "Yeah, I should do it"}, "H002:T023": {"id": "H002:T023", "role": "seeker", "text": "Thanks for the talk"}, "H002:T024": {"id": "H002:T024", "role": "seeker", "text": "you've been more helpful than my teachers!"}, "H002:T025": {"id": "H002:T025", "role": "supporter", "text": "You're welcome I hope you find the perfect university for you"}, "H002:T026": {"id": "H002:T026", "role": "seeker", "text": "Thanks, I wish  you luck in your future endeavours"}, "H002:T027": {"id": "H002:T027", "role": "seeker", "text": "Bye then ; )"}, "H002:T028": {"id": "H002:T028", "role": "supporter", "text": "Goodbye"}, "H003:T000": {"id": "H003:T000", "role": "seeker", "text": "Hello. Is anyone there"}, "H003:T001": {"id": "H003:T001", "role": "supporter", "text": "Hello. How are you today?"}, "H003:T002": {"id": "H003:T002", "role": "seeker", "text": "I'm doing good. I need some advice"}, "H003:T003": {"id": "H003:T003", "role": "supporter", "text": "What can I help you with?"}, "H003:T004": {"id": "H003:T004", "role": "seeker", "text": "Lately, my friends started to make jokes about my face being ugly. They even called my face as flat as a pan! What should I do? I see them everyday on the bus"}, "H003:T005": {"id": "H003:T005", "role": "supporter", "text": "Have you tried confronting them and asking why they are being bullies?"}, "H003:T006": {"id": "H003:T006", "role": "seeker", "text": "I did and they respond by saying that they are just joking and that I'm handsome. But it's starting to get on my nerves because it's all they make fun about every time they see me!"}, "H003:T007": {"id": "H003:T007", "role": "supporter", "text": "I'm sure you are very handsome! They could just be jealous."}, "H003:T008": {"id": "H003:T008", "role": "seeker", "text": "Haha I would hope so"}, "H003:T009": {"id": "H003:T009", "role": "seeker", "text": "Still though, it makes me want to avoid them when I go to school on the bus"}, "H003:T010": {"id": "H003:T010", "role": "seeker", "text": "What do you think I should do then?"}, "H003:T011": {"id": "H003:T011", "role": "supporter", "text": "I understand, school was tough for me too."}, "H003:T012": {"id": "H003:T012", "role": "supporter", "text": "I suggest you tell them to knock it off or you can sit somewhere away from the bus."}, "H003:T013": {"id": "H003:T013", "role": "seeker", "text": "Should I just beat them up with my backpack"}, "H003:T014": {"id": "H003:T014", "role": "supporter", "text": "No, beating them up will only get you in trouble and that won't help."}, "H003:T015": {"id": "H003:T015", "role": "seeker", "text": "There's another bus route. Should I just take that instead"}, "H003:T016": {"id": "H003:T016", "role": "supporter", "text": "I think that could be a good idea if it's not too far out of your way."}, "H003:T017": {"id": "H003:T017", "role": "seeker", "text": "I think I will. Their comments make me very insecure"}, "H003:T018": {"id": "H003:T018", "role": "supporter", "text": "You could also tell a teacher what is happening. They will help you out."}, "H003:T019": {"id": "H003:T019", "role": "supporter", "text": "I bet you are handsome! Don't let it get to you."}, "H003:T020": {"id": "H003:T020", "role": "seeker", "text": "The teacher would probably make fun of me!"}, "H003:T021": {"id": "H003:T021", "role": "seeker", "text": "Thanks it's hard to look in the mirror now"}, "H003:T022": {"id": "H003:T022", "role": "supporter", "text": "Try to tell yourself you are good looking and deserve good things to happen every morning! Look in that mirror and tell yourself good things."}, "H003:T023": {"id": "H003:T023", "role": "seeker", "text": "I'll try to be positive for once."}, "H003:T024": {"id": "H003:T024", "role": "seeker", "text": "Do you believe working out will help"}, "H003:T025": {"id": "H003:T025", "role": "supporter", "text": "Working out will help a lot! When I was feeling down on myself I decided to go to the gym three times a week. It was a great confidence boost."}, "H003:T026": {"id": "H003:T026", "role": "seeker", "text": "Awesome. I will start to take care of myself and not worry about others then."}, "H003:T027": {"id": "H003:T027", "role": "supporter", "text": "That sounds like a fantastic idea."}, "H004:T000": {"id": "H004:T000", "role": "supporter", "text": "Hey Nick, how have you been feeling lately?"}, "H004:T001": {"id": "H004:T001", "role": "seeker", "text": "Hey... I've been feeling pretty down recently."}, "H004:T002": {"id": "H004:T002", "role": "supporter", "text": "I'm sorry to hear that. Do you want to talk about what's been going on?"}, "H004:T003": {"id": "H004:T003", "role": "seeker", "text": "Yeah, it's about Henry. We argued again, and this time it got ugly."}, "H004:T004": {"id": "H004:T004", "role": "supporter", "text": "That sounds tough. What happened between you two?"}, "H004:T005": {"id": "H004:T005", "role": "seeker", "text": "It started with some jokes they made. I found them really insensitive and hurtful."}, "H004:T006": {"id": "H004:T006", "role": "supporter", "text": "I can understand why that would be upsetting. Did you talk to them about how you felt?"}, "H004:T007": {"id": "H004:T007", "role": "seeker", "text": "I tried, but it just turned into a shouting match. I didn't expect it would escalate."}, "H004:T008": {"id": "H004:T008", "role": "supporter", "text": "That sounds really frustrating. It can be hard when someone you care about doesn't understand your perspective."}, "H004:T009": {"id": "H004:T009", "role": "seeker", "text": "Exactly. I mean, we've been friends for so long. I thought we'd be on the same page about these things."}, "H004:T010": {"id": "H004:T010", "role": "supporter", "text": "It's natural to feel disappointed in situations like this. It's okay to feel hurt."}, "H004:T011": {"id": "H004:T011", "role": "seeker", "text": "Thanks. I just can't help but think if maybe I'm overreacting."}, "H004:T012": {"id": "H004:T012", "role": "supporter", "text": "Your feelings are valid, Nick. It's important to acknowledge when something bothers you."}, "H004:T013": {"id": "H004:T013", "role": "seeker", "text": "True, but what if I drive him away by holding onto this?"}, "H004:T014": {"id": "H004:T014", "role": "supporter", "text": "It might help to express why those jokes affected you deeply. If he's a true friend, he should understand and respect your feelings."}, "H004:T015": {"id": "H004:T015", "role": "seeker", "text": "Yeah, I think I should try talking to him when things cool down. I don't want to lose our friendship over this."}, "H004:T016": {"id": "H004:T016", "role": "supporter", "text": "That sounds like a good plan. Give it some time, and approach it when you're both calmer."}, "H004:T017": {"id": "H004:T017", "role": "seeker", "text": "I will. Thanks for listening. It really helps to talk it through."}, "H004:T018": {"id": "H004:T018", "role": "supporter", "text": "Anytime, Nick. I'm here whenever you need to chat or get things off your chest."}, "H004:T019": {"id": "H004:T019", "role": "seeker", "text": "I appreciate that. Hopefully, next time we'll be talking about something more positive!"}, "H004:T020": {"id": "H004:T020", "role": "supporter", "text": "I'm sure we will. Hang in there, Nick. You've got this."}, "H005:T000": {"id": "H005:T000", "role": "supporter", "text": "Hey Nick, it's nice to see you online. How are you doing today?"}, "H005:T001": {"id": "H005:T001", "role": "seeker", "text": "Hey, I'm feeling a mix of things actually. There's a lot on my mind."}, "H005:T002": {"id": "H005:T002", "role": "supporter", "text": "I’m here to listen. What's been going on?"}, "H005:T003": {"id": "H005:T003", "role": "seeker", "text": "Well, remember how I had that fallout with Henry because of those jokes?"}, "H005:T004": {"id": "H005:T004", "role": "supporter", "text": "Yeah, I remember. That was really tough for you both. How’s that been playing out?"}, "H005:T005": {"id": "H005:T005", "role": "seeker", "text": "We finally talked again, and it was... unexpectedly emotional. We actually sorted things out."}, "H005:T006": {"id": "H005:T006", "role": "supporter", "text": "That’s great to hear, Nick! How did the conversation go?"}, "H005:T007": {"id": "H005:T007", "role": "seeker", "text": "It started off a bit awkward, but we both apologized. We realized how much we missed each other."}, "H005:T008": {"id": "H005:T008", "role": "supporter", "text": "Sometimes those tough conversations are what make friendships stronger. You must have felt a lot lighter afterward."}, "H005:T009": {"id": "H005:T009", "role": "seeker", "text": "Yeah, I did. But it also made me think about how close I came to losing a really important person in my life."}, "H005:T010": {"id": "H005:T010", "role": "supporter", "text": "That realization can be a lot to take in. It sounds like you value that friendship deeply."}, "H005:T011": {"id": "H005:T011", "role": "seeker", "text": "I really do. We've been friends for so long, and it just felt wrong not having him around."}, "H005:T012": {"id": "H005:T012", "role": "supporter", "text": "It’s understandable. When someone is that integral in your life, their absence can feel enormous."}, "H005:T013": {"id": "H005:T013", "role": "seeker", "text": "Exactly. I guess part of me is still worried we might slip back into old patterns."}, "H005:T014": {"id": "H005:T014", "role": "supporter", "text": "That's a valid concern. Have you both talked about how to avoid that?"}, "H005:T015": {"id": "H005:T015", "role": "seeker", "text": "A bit. We agreed to be more open when things bother us, instead of letting them build up."}, "H005:T016": {"id": "H005:T016", "role": "supporter", "text": "That sounds like a solid plan. Communication is so key. How are you feeling about that agreement?"}, "H005:T017": {"id": "H005:T017", "role": "seeker", "text": "Hopeful, mostly. I guess I'm just trying to stay positive about it."}, "H005:T018": {"id": "H005:T018", "role": "supporter", "text": "That’s a great mindset, Nick. It takes courage to forgive and move forward."}, "H005:T019": {"id": "H005:T019", "role": "seeker", "text": "Thanks. It helps to talk about it, honestly. I guess I needed to process it out loud."}, "H005:T020": {"id": "H005:T020", "role": "supporter", "text": "I’m always here for that. It’s important to have spaces to express what you’re going through."}, "H005:T021": {"id": "H005:T021", "role": "seeker", "text": "Definitely. It’s nice to know I'm not alone in this."}, "H005:T022": {"id": "H005:T022", "role": "supporter", "text": "You’re certainly not alone, Nick. Anytime you need to talk, just reach out."}, "H005:T023": {"id": "H005:T023", "role": "seeker", "text": "Thanks again. I really appreciate our chats."}, "H005:T024": {"id": "H005:T024", "role": "supporter", "text": "Anytime, Nick. Take care of yourself and keep nurturing that friendship."}, "H006:T000": {"id": "H006:T000", "role": "seeker", "text": "Hey, do you have a moment to chat? I'm feeling a bit overwhelmed."}, "H006:T001": {"id": "H006:T001", "role": "supporter", "text": "Of course, Nick. What's going on?"}, "H006:T002": {"id": "H006:T002", "role": "seeker", "text": "I've been swamped with assignments, and it's starting to really wear me down."}, "H006:T003": {"id": "H006:T003", "role": "supporter", "text": "That sounds really tough. Are these assignments from your physics course?"}, "H006:T004": {"id": "H006:T004", "role": "seeker", "text": "Yeah, mostly. It's just been so relentless, and I really don't feel any support from the university."}, "H006:T005": {"id": "H006:T005", "role": "supporter", "text": "I remember you mentioning before how the teaching quality has been lacking. Has it gotten worse?"}, "H006:T006": {"id": "H006:T006", "role": "seeker", "text": "Pretty much. It feels like I'm teaching myself. I'm even thinking of dropping the course."}, "H006:T007": {"id": "H006:T007", "role": "supporter", "text": "That's such a hard decision. Dropping a course can feel like a big step, but you're the one who knows what's best for you."}, "H006:T008": {"id": "H006:T008", "role": "seeker", "text": "Exactly. I just feel like I'm drowning in work with no payoff, you know? It's exhausting."}, "H006:T009": {"id": "H006:T009", "role": "supporter", "text": "Definitely. It's important to weigh the pros and cons though. How do you feel about physics overall?"}, "H006:T010": {"id": "H006:T010", "role": "seeker", "text": "I used to love it, but now it's just become a source of stress. I miss being excited about it."}, "H006:T011": {"id": "H006:T011", "role": "supporter", "text": "It's really tough when something you used to love becomes stressful. Is there anything you've considered doing differently to reignite that passion?"}, "H006:T012": {"id": "H006:T012", "role": "seeker", "text": "I've thought about seeking outside resources or maybe talking to a different professor, but it feels daunting."}, "H006:T013": {"id": "H006:T013", "role": "supporter", "text": "That's understandable. Sometimes reaching out for help can feel challenging, but it could make a difference. You shouldn't have to tackle this all alone."}, "H006:T014": {"id": "H006:T014", "role": "seeker", "text": "I guess I could try, but I'm worried about failing either way. I hate feeling this uncertain."}, "H006:T015": {"id": "H006:T015", "role": "supporter", "text": "It's okay to feel uncertain, Nick. Remember when you and Henry had that fallout and reconciled? You took a brave step then and it worked out."}, "H006:T016": {"id": "H006:T016", "role": "seeker", "text": "True, I appreciate you bringing that up. It's nice to remember that things can turn around."}, "H006:T017": {"id": "H006:T017", "role": "supporter", "text": "Exactly. You've got the resilience to turn this around too. Maybe start with small steps and see how it feels?"}, "H006:T018": {"id": "H006:T018", "role": "seeker", "text": "Yeah, maybe reaching out to a professor wouldn't be so bad to start with. Thank you for talking this through with me."}, "H006:T019": {"id": "H006:T019", "role": "supporter", "text": "Anytime, Nick. I'm always here to support you in any way I can. Let me know how it goes when you take that first step."}, "H006:T020": {"id": "H006:T020", "role": "seeker", "text": "Will do. I'm actually feeling a bit lighter talking about it now."}, "H006:T021": {"id": "H006:T021", "role": "supporter", "text": "I'm glad to hear that. Keep taking care of yourself, okay?"}, "H007:T000": {"id": "H007:T000", "role": "supporter", "text": "Hey Nick, how have you been doing lately?"}, "H007:T001": {"id": "H007:T001", "role": "seeker", "text": "Hey, it's been a bit tough honestly. I decided to talk to my family about everything that's been happening."}, "H007:T002": {"id": "H007:T002", "role": "supporter", "text": "I'm glad you opened up to them. How did that conversation go?"}, "H007:T003": {"id": "H007:T003", "role": "seeker", "text": "It was a relief in some ways. They listened to me, which was good."}, "H007:T004": {"id": "H007:T004", "role": "supporter", "text": "That's great to hear! Did they offer any advice or support?"}, "H007:T005": {"id": "H007:T005", "role": "seeker", "text": "They did offer support, but it still feels like they don't fully understand the pressure I'm under with my physics course."}, "H007:T006": {"id": "H007:T006", "role": "supporter", "text": "I can imagine that's frustrating. Do you feel like you got to express everything you wanted to?"}, "H007:T007": {"id": "H007:T007", "role": "seeker", "text": "Mostly, yes. But it's hard for them to really grasp the academic stress when they haven't experienced it themselves."}, "H007:T008": {"id": "H007:T008", "role": "supporter", "text": "It's definitely tough when others can't fully relate. How are you handling the pressure now?"}, "H007:T009": {"id": "H007:T009", "role": "seeker", "text": "I'm trying to stay on top of my assignments, but the quality of teaching hasn't improved. It feels like a constant uphill battle."}, "H007:T010": {"id": "H007:T010", "role": "supporter", "text": "That sounds really challenging, especially when support isn't available. Have you thought again about possibly dropping the course?"}, "H007:T011": {"id": "H007:T011", "role": "seeker", "text": "I have, but it's also hard to think about leaving something unfinished. I don't want to feel like I've failed."}, "H007:T012": {"id": "H007:T012", "role": "supporter", "text": "It's understandable. Remember, taking a step back doesn't mean you're failing—it can be a strategic move for your well-being."}, "H007:T013": {"id": "H007:T013", "role": "seeker", "text": "That's a good point. I just wish there was more support from the university, like better teaching or someone I could talk to."}, "H007:T014": {"id": "H007:T014", "role": "supporter", "text": "Have you considered reaching out to a student advisor or counseling services at your university?"}, "H007:T015": {"id": "H007:T015", "role": "seeker", "text": "I've thought about it, but it's a bit intimidating to take that step. I guess I'm worried about not being taken seriously."}, "H007:T016": {"id": "H007:T016", "role": "supporter", "text": "It's totally normal to feel that way. Maybe starting with a small step, like emailing an advisor, could make it feel more manageable."}, "H007:T017": {"id": "H007:T017", "role": "seeker", "text": "That sounds like a good way to ease into it. I think I'll give it a try."}, "H007:T018": {"id": "H007:T018", "role": "supporter", "text": "I'm proud of you for taking this step, Nick. Remember, I'm here for you and you're not alone in this."}, "H007:T019": {"id": "H007:T019", "role": "seeker", "text": "Thanks, I really appreciate it. It helps to know there's someone who understands what I'm going through."}, "H007:T020": {"id": "H007:T020", "role": "supporter", "text": "Anytime, Nick. Keep me posted on how things go with the advisor, okay?"}, "H007:T021": {"id": "H007:T021", "role": "seeker", "text": "Will do. Thanks again for being there for me."}, "H008:T000": {"id": "H008:T000", "role": "seeker", "text": "Hey, I guess I just need someone to talk to right now."}, "H008:T001": {"id": "H008:T001", "role": "supporter", "text": "Of course, Nick. I'm here for you. What's on your mind?"}, "H008:T002": {"id": "H008:T002", "role": "seeker", "text": "It's about my physics course again. My professor contacted me today to offer help."}, "H008:T003": {"id": "H008:T003", "role": "supporter", "text": "That sounds like a positive step. How do you feel about it?"}, "H008:T004": {"id": "H008:T004", "role": "seeker", "text": "I feel a bit conflicted. On one hand, it's great to know someone cares, but on the other, I'm just so stressed and unsure it can make a difference."}, "H008:T005": {"id": "H008:T005", "role": "supporter", "text": "It's understandable to feel that way, especially after the struggles you've had. Did the professor offer any specific advice?"}, "H008:T006": {"id": "H008:T006", "role": "seeker", "text": "Yeah, they suggested a few resources and offered to arrange a tutoring session. But honestly, I'm not sure if it'll help with how behind I am now."}, "H008:T007": {"id": "H008:T007", "role": "supporter", "text": "It's good that they provided some options, but I get that feeling of being in over your head. Have you tried reaching out to other students for support?"}, "H008:T008": {"id": "H008:T008", "role": "seeker", "text": "I haven't. I guess I'm just embarrassed by how far I've fallen behind."}, "H008:T009": {"id": "H008:T009", "role": "supporter", "text": "It's tough to ask for help, but remember you're not alone in this. Many students face similar challenges. It might be worth trying to find a study group or even just one buddy to tackle things with."}, "H008:T010": {"id": "H008:T010", "role": "seeker", "text": "That makes sense. I think I could try talking to that one classmate who seemed in a similar spot last semester."}, "H008:T011": {"id": "H008:T011", "role": "supporter", "text": "That's a great idea! You might find you're stronger when working together. And don't forget, you've been through difficult times before, like with your friend incident. You managed to turn things around then."}, "H008:T012": {"id": "H008:T012", "role": "seeker", "text": "Yeah, you're right. I did sort things out with him. It was tough, but I'm glad I pushed through."}, "H008:T013": {"id": "H008:T013", "role": "supporter", "text": "Exactly. You've shown resilience. It's okay to feel stressed, but you've got the strength to push through this as well."}, "H008:T014": {"id": "H008:T014", "role": "seeker", "text": "I hope so. It's just hard to keep motivated when it feels like everything's piling up."}, "H008:T015": {"id": "H008:T015", "role": "supporter", "text": "That's completely valid. Taking small steps can help make those piles seem less overwhelming. Maybe set one small goal to start with."}, "H008:T016": {"id": "H008:T016", "role": "seeker", "text": "That's a good idea. Perhaps I could start by organizing my notes and seeing what's most urgent."}, "H008:T017": {"id": "H008:T017", "role": "supporter", "text": "That sounds like a solid plan, and it'll help clear your head. Remember, you're doing your best and that counts for a lot."}, "H008:T018": {"id": "H008:T018", "role": "seeker", "text": "Thanks for listening. I really appreciate having someone to talk to."}, "H008:T019": {"id": "H008:T019", "role": "supporter", "text": "Anytime, Nick. I'm glad you're opening up, and I'm here whenever you need to talk."}, "H009:T000": {"id": "H009:T000", "role": "seeker", "text": "Hey, I've been reflecting a lot on my studies lately, and I've decided to make a big change."}, "H009:T001": {"id": "H009:T001", "role": "supporter", "text": "Hey Nick, that sounds like a significant step. What change are you thinking about?"}, "H009:T002": {"id": "H009:T002", "role": "seeker", "text": "Well, I've decided to switch my major. I realized physics just wasn't the right fit for me."}, "H009:T003": {"id": "H009:T003", "role": "supporter", "text": "That's a huge decision, Nick. How are you feeling about it?"}, "H009:T004": {"id": "H009:T004", "role": "seeker", "text": "I'm a mix of relieved and anxious. Relieved because I've been struggling with it for a while, but anxious because it's a big shift."}, "H009:T005": {"id": "H009:T005", "role": "supporter", "text": "It's understandable to feel both relief and anxiety, especially after making such an important decision. What led you to finally decide?"}, "H009:T006": {"id": "H009:T006", "role": "seeker", "text": "I kept remembering how overwhelmed I felt with the assignments and the stress it brought. Talking to my professor helped too, but it made me see I needed a change."}, "H009:T007": {"id": "H009:T007", "role": "supporter", "text": "Your professor seemed like a great support. It's good that they were there for guidance. What new direction are you considering?"}, "H009:T008": {"id": "H009:T008", "role": "seeker", "text": "I'm thinking of switching to a major in psychology. I've always been fascinated by how the mind works, and it feels more aligned with my interests."}, "H009:T009": {"id": "H009:T009", "role": "supporter", "text": "Psychology sounds like a fascinating field. It's wonderful that you've found something that resonates more with you. How have your family and friends reacted to your decision?"}, "H009:T010": {"id": "H009:T010", "role": "seeker", "text": "I told my family first. They were really understanding, which helped a lot, especially since they know I've been struggling."}, "H009:T011": {"id": "H009:T011", "role": "supporter", "text": "Family support can make a big difference. It's great that they’re understanding about your choice. Have you talked to your classmates or your best friend?"}, "H009:T012": {"id": "H009:T012", "role": "seeker", "text": "Not yet. I'm a bit nervous about their reactions, especially since some of them are sticking with physics."}, "H009:T013": {"id": "H009:T013", "role": "supporter", "text": "It’s normal to feel nervous, Nick. Remember, it's about what's right for you. Those who care will likely understand and support your decision."}, "H009:T014": {"id": "H009:T014", "role": "seeker", "text": "Yeah, I guess that's true. Just want to feel like I'm doing the right thing, you know?"}, "H009:T015": {"id": "H009:T015", "role": "supporter", "text": "Finding the right path for you is important, and it sounds like you're taking thoughtful steps. Trust yourself in this process."}, "H009:T016": {"id": "H009:T016", "role": "seeker", "text": "Thanks, that means a lot. I'm hoping this new path will be a better fit and lead to less stress."}, "H009:T017": {"id": "H009:T017", "role": "supporter", "text": "I believe you're on the right track, Nick. And remember, it's okay to reach out if you ever need to talk through any worries or changes."}, "H009:T018": {"id": "H009:T018", "role": "seeker", "text": "I will. Thanks for listening and being supportive. It really helps to talk it through."}, "H009:T019": {"id": "H009:T019", "role": "supporter", "text": "Anytime, Nick. I'm here for you. Good luck with everything, and I'm sure you'll do great in psychology."}}, "current_date": "2025-09-06", "last_seeker": "We had simple disagreement and both of us were keep fighting.. now I can not get over it."}, "348791845b3d46b47c6c0b09417d64eb2f693c08163e3b6bf4a142c774c33cb7": {"turns": {"C:T000": {"id": "C:T000", "role": "seeker", "text": "Yo"}, "C:T001": {"id": "C:T001", "role": "supporter", "text": "Hi, how are you doing?"}, "C:T002": {"id": "C:T002", "role": "seeker", "text": "I am decent. I am here because my friend talks way too much on the phone, and it frustrates me."}, "C:T003": {"id": "C:T003", "role": "seeker", "text": "They never want to hang up, and the talk can literally go on for hours."}, "C:T004": {"id": "C:T004", "role": "supporter", "text": "It sounds like it would be quite frustrating for your friend to talk way too much on the phone. "}, "C:T005": {"id": "C:T005", "role": "seeker", "text": "No, he loves it! I'm the one who hates it."}, "C:T006": {"id": "C:T006", "role": "supporter", "text": "My goodness! How do they respond when you ask to end the conversation?"}, "C:T007": {"id": "C:T007", "role": "seeker", "text": "I tell him, but he just doesn't get it. Or, he says he understands, but then just goes back to talking!"}, "C:T008": {"id": "C:T008", "role": "seeker", "text": "Or, he may finally end the talk, but the next time we talk, he will just do it all over again!"}, "C:T009": {"id": "C:T009", "role": "supporter", "text": "I wonder what it would be like for him if you hung up the phone even after he said he still wanted to talk."}, "C:T010": {"id": "C:T010", "role": "supporter", "text": "Wow--that does sound annoying that he will repeat the same pattern the next time."}, "C:T011": {"id": "C:T011", "role": "seeker", "text": "He will literally talk up to 10 minutes without letting you have a word in. As far as that advice, I have hung up, but he gets extremely offended easily."}, "C:T012": {"id": "C:T012", "role": "supporter", "text": "That sounds really difficult if he gets offended so easily. I find it hard to talk to some of those kinds of friends."}, "C:T013": {"id": "C:T013", "role": "seeker", "text": "I'm at my wits end. I tell him all the time. \"You talk too much. You gotta stop talking at me. You gotta give the other person a turn. You gotta respect other's time.\""}, "C:T014": {"id": "C:T014", "role": "supporter", "text": "What do you get out of the friendship with this other person?"}, "C:T015": {"id": "C:T015", "role": "seeker", "text": "Well, I've been friends with him for a long time. He's funny and can have interesting perspectives on things. Also, we have done a lot together in the past."}, "C:T016": {"id": "C:T016", "role": "supporter", "text": "That sounds like a lot that the two of you have been through. Were there other times that your friends was more equally responsive or attuned to you in conversations?"}, "C:T017": {"id": "C:T017", "role": "seeker", "text": "Oh, yes, I have other friends in conversations who can take turns and understand the concept of time just fine."}, "C:T018": {"id": "C:T018", "role": "seeker", "text": "I just don't know what to do about this guy in particular. I still want to be his friend, but he just doesn't change."}, "C:T019": {"id": "C:T019", "role": "supporter", "text": "I wonder if there is anything nice you could do for yourself when you are talking to him that would make it easier to talk to him."}, "C:T020": {"id": "C:T020", "role": "seeker", "text": "Do you think I should just have a timer that goes off at 1 minute and let it beep in his face if he goes on for too long to train him like a monkey?"}, "C:T021": {"id": "C:T021", "role": "supporter", "text": "I can see that you are feeling upset and angry when he talks so much and that is totally understandable. "}, "C:T022": {"id": "C:T022", "role": "seeker", "text": "I just need a method. Talking to him is just not working."}, "C:T023": {"id": "C:T023", "role": "seeker", "text": "He is hard to condition."}, "C:T024": {"id": "C:T024", "role": "supporter", "text": "Would it hurt his feelings to use a timer like that? It may for some other people. "}, "C:T025": {"id": "C:T025", "role": "seeker", "text": "Yea, but I might be able to slip some humour in there to take the edge off because it is so silly."}, "C:T026": {"id": "C:T026", "role": "supporter", "text": "Humor is really helpful for a lot of people. "}, "C:T027": {"id": "C:T027", "role": "seeker", "text": "Any other ideas?"}, "C:T028": {"id": "C:T028", "role": "supporter", "text": "Sometimes, people draw or do something else distracting with their hands when talking to someone who dominates the conversation."}, "C:T029": {"id": "C:T029", "role": "seeker", "text": "So your option is to start just doing something else when he is talking? He might get the message in a subtle way?"}, "C:T030": {"id": "C:T030", "role": "supporter", "text": "Sometimes that is a less offensive way to retrain someone who is being obnoxious or dominant and yet who is easily offended. And, it can help preserve your sense of being grounded."}, "C:T031": {"id": "C:T031", "role": "supporter", "text": "The strategy works well for me with some of my family members who seem like they will never change. But, with distraction, I enjoy them all the more."}, "C:T032": {"id": "C:T032", "role": "seeker", "text": "This is true, and it isn't bade advice. Haha! That is funny. Yes, maybe I should find something to carry around with me that I can enjoy."}, "C:T033": {"id": "C:T033", "role": "seeker", "text": "I don't really like to draw..."}, "C:T034": {"id": "C:T034", "role": "supporter", "text": "Is there anything else that you like to do that would be distracting while also letting you somewhat participate in the conversation?"}, "C:T035": {"id": "C:T035", "role": "seeker", "text": "Yes, perhaps I should just use the internet when he starts talking too much. "}, "C:T036": {"id": "C:T036", "role": "seeker", "text": "I have a phone."}, "C:T037": {"id": "C:T037", "role": "supporter", "text": "That sounds really helpful. Sometimes people also play phone games or with a fidget spinner. I like your idea of looking on the internet."}, "C:T038": {"id": "C:T038", "role": "seeker", "text": "This solves the problem in person, but it doesn't solve the talks over the phone, but it has been 15 minutes now and this has been helpful enough. Thank you for your solutions. You have been very supportive and kind to me"}, "C:T039": {"id": "C:T039", "role": "seeker", "text": "I don't want to take up any more of your time. It has been a good conversation. "}, "H001:T000": {"id": "H001:T000", "role": "supporter", "text": "How may I help you?"}, "H001:T001": {"id": "H001:T001", "role": "seeker", "text": "Hi I am feeling quite sad today."}, "H001:T002": {"id": "H001:T002", "role": "supporter", "text": "Ohh, sorry to hear that. Any partucular reason?"}, "H001:T003": {"id": "H001:T003", "role": "seeker", "text": "Yes I feel like my friends just don't care about me much at all."}, "H001:T004": {"id": "H001:T004", "role": "supporter", "text": "You saying that your friend does not care about you any more. Is that correct?"}, "H001:T005": {"id": "H001:T005", "role": "seeker", "text": "Yes, when we get together all they want to do is talk about themselves. When I raise something that is bothering me they just ignore what I say and go back to what they want to talk about."}, "H001:T006": {"id": "H001:T006", "role": "supporter", "text": "That's not good. You must be feeling left out. "}, "H001:T007": {"id": "H001:T007", "role": "seeker", "text": "Yes I feel left out and unsupported by them."}, "H001:T008": {"id": "H001:T008", "role": "supporter", "text": "Any particular reason they are doing such thing?"}, "H001:T009": {"id": "H001:T009", "role": "seeker", "text": "Well I think they don't care about me and are just selfish about their needs."}, "H001:T010": {"id": "H001:T010", "role": "supporter", "text": "In that case, should you consider them as your friends?"}, "H001:T011": {"id": "H001:T011", "role": "seeker", "text": "Well they are the only friends I have and I have known them a long time. Do you think I should stop being friends with them ?"}, "H001:T012": {"id": "H001:T012", "role": "supporter", "text": "If someone is not friendly they are not real friend. You need to find someone who will stand by you no matter what.."}, "H001:T013": {"id": "H001:T013", "role": "seeker", "text": "Oh well that makes me feel sad too.  I will be saying goodbye to some long friendships. Do you think that is the only answer ?"}, "H001:T014": {"id": "H001:T014", "role": "supporter", "text": "Ok.. how about hosting them in your place for a gettogether.. "}, "H001:T015": {"id": "H001:T015", "role": "seeker", "text": "Ok how do you think that would help me ?"}, "H001:T016": {"id": "H001:T016", "role": "supporter", "text": "They might open up if you are hosting .. people are generally nice to the host.. "}, "H001:T017": {"id": "H001:T017", "role": "seeker", "text": "Yes that is true, it's a good idea.  I could also take the opportunity to tell them how I am feeling."}, "H001:T018": {"id": "H001
