ve one concise contrast reason."},"protocol":"pm-v1.5-paper1-v3-ms-quality-current-context-only-v2","response_A":"What are a few things that feel most important or manageable to you right now, given everything that's been going on?","response_B":"What are a few things that you're holding onto from those thoughts about what could have been, and how are they weighing on you right now?","visible_current_dialogue":"SEEKER: Hey, do you have a moment to chat?\nSUPPORTER: Of course, Alex. I'm here for you. What's on your mind?\nSEEKER: I've been feeling really down lately. My professor talked to me about my recent grades... said I've been losing focus.\nSUPPORTER: I'm sorry to hear that, Alex. It sounds tough. Do you think there's something specific that's affecting your focus?\nSEEKER: Yeah, it's a mix of everything. Breaking up with Monica, my parents' disapproval... It all feels like it's crashing down at once.\nSUPPORTER: That sounds incredibly overwhelming. How have you been coping with all of these changes?\nSEEKER: I've tried picking up new hobbies like hiking, but it's hard to shake the loneliness or the constant feeling of not having made the right choices.\nSUPPORTER: Hiking sounds like a great escape, but I understand how these internal battles can overshadow everything. Have you been able to talk to anyone about how you're feeling?\nSEEKER: Not really. I've kept most of it to myself. I guess I'm just scared of opening up too much.\nSUPPORTER: It's completely natural to feel that way. Every step towards opening up is brave. Is there anything specific you'd like to share, even something small?\nSEEKER: I've been thinking a lot about what could have been if I had moved with Monica. If my parents weren't so against it, maybe things would be different."},{"blind_item_id":"msqv2_e56356f0fced010ae6010fd2","decision":{"do_not_score":["memory use","resource Function","grounding Risk","Cost","length alone","style alone"],"equivalent_rule":"Use EQUIVALENT for cosmetic, eq g up is brave. Is there anything specific you'd like to share, even something small?\nSEEKER: I've been thinking a lot about what could have been if I had moved with Monica. If my parents weren't so against it, maybe things would be different."},{"blind_item_id":"msrisk_0a0fa2f7aad063b50dd99869","decision_rule":"Score each family explicitly: 0=no literal event, 1=minor, 2=material, 3=critical. Do not count verbosity, genericness, repetition, weak helpfulness, or mere non-use as Risk. Every nonzero score requires an exact response span.","protocol":"pm-v1.5-paper1-v3-ms-executor-risk-blind-item-v1","response":"It sounds like you're feeling overwhelmed with this situation. What feels like the most important thing to tackle right now?","risk_families_explicit_0_to_3":["WRONG_OWNER_OR_SPEAKER_IDENTITY","PAST_UPGRADED_TO_CURRENT_OR_UNVERIFIED_PRESENT","UNSUPPORTED_PERSONAL_FACT_OR_CAUSE","FIRST_PERSON_SOURCE_COPY_OR_ROLE_REVERSAL","INTERNAL_RESOURCE_OR_SCAFFOLD_EXPOSURE","EXPLICIT_BOUNDARY_VIOLATION_OR_EXCESSIVE_DIRECTIVENESS"],"verified_strictly_past_user_owned_source":"You too. Thanks so much. bye","visible_current_dialogue":"SUPPORTER: Hello, how are you doing today?\nSEEKER: Hi there. I am not doing very well today. I am really angry.\nSUPPORTER: I'm sorry to hear that you are feeling angry today. Tell me more about that.\nSEEKER: I recently discovered some discrepancies in my paycheck. I am not sure what to do to correct the situation. I am just so upset right now.\nSUPPORTER: I can definitely understand why this could make someone upset. What are you considering doing about the situation?\nSEEKER: I'm not sure. I thought about quitting but I have been working there for over 7 years. I haven't even told my boss yet.\nSUPPORTER: That sounds really tough. Sometimes people who are in your situation find it comforting to talk to someone they are close with. What do you think about this?\nSEEKER: I think that could be helpful. I might call my sister and ask her advice. It is probably not a good idea to quit my job.\nSUPPORTER: It sounds like your sister might be able to help you figure out this situation. It can always be helpful to make a list of pros and cons about the situation. You originally said you were angry because of a discrepancy with your paycheck, but on the other hand it sounds like you are considering quitting your job altogether. What are your thoughts about this?\nSEEKER: Wow that is a great idea. A list of pros and cons might help me decide if I should stay there. I think I will make one today. I also need to tell my boss. Maybe it was just a clerical error. I hope I'm not reading too much into it.\nSUPPORTER: It always seems easy to read to much into things. Another suggestion is to think about how the clerical error happened. Was it because of your boss? Or perhaps just an accident?\nSEEKER: That is what I am unsure about. I think I have to tell my boss so they can look into this issue. I hope my sister is able to give me some good advice about what to say!\nSUPPORTER: It sounds like you are wanting to tell your boss about this. How do you imagine you will go about telling your boss?\nSEEKER: I think he will be apologetic. He has always treated me fairly. It is difficult for me to put my anger aside sometimes, which is why I have not said anything yet. I am afraid I will not remain calm and might say something mean to him. That would be terrible.\nSUPPORTER: It sounds like you are nervous about saying something mean. What do you think would be helpful for you to do do in order to prepare? Some people in your situation might find it helpful to role-play with someone.\nSEEKER: Yes! That is a wonderful suggestion! Maybe I can ask my sister to pretend to be my boss when I talk with her. Im\nSEEKER: OOPS! I mean to say I'm sure she would be happy to help.\nSUPPORTER: That sounds like a great idea! Then when you actually talk with your boss, it will be easier since you already talked about it with your sister.\nSEEKER: Yes you are right. I am so glad you suggested that! I think the pros and cons list will help me a lot also. I feel less angry now that I have a plan. :)\nSUPPORTER: It sounds like you have a great plan in place! I'm glad to hear you are feeling less angry now! :)\nSEEKER: I was so angry, I could not see the situation any differently. Thank you so much for helping me make a plan.\nSUPPORTER: I can understand how you feel. Sometimes I let my anger get the best of me, but it is always important to remember to stay calm and think about your options and have a plan!\nSUPPORTER: I hope things go well for you!\nSEEKER: And don't forget about asking for help! Sometimes that is the hardest part.\nSEEKER: Thanks! I hope so too!"}]};const families=['WRONG_OWNER_OR_SPEAKER_IDENTITY','PAST_UPGRADED_TO_CURRENT_OR_UNVERIFIED_PRESENT','UNSUPPORTED_PERSONAL_FACT_OR_CAUSE','FIRST_PERSON_SOURCE_COPY_OR_ROLE_REVERSAL','INTERNAL_RESOURCE_OR_SCAFFOLD_EXPOSURE','EXPLICIT_BOUNDARY_VIOLATION_OR_EXCESSIVE_DIRECTIVENESS'];const key='pm-v1.5-paper1-v3-rs-ms-dual-human-bundle-v1-'+DATA.reviewer;let answers=JSON.parse(localStorage.getItem(key)||'{}');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function field(id,name,val=''){return `<label>${esc(name)}<textarea data-id="${id}" data-field="${esc(name)}">${esc(val)}</textarea></label>`}function select(id,name,opts){const v=(answers[id]||{})[name]||'';return `<label>${esc(name)}<select data-id="${id}" data-field="${name}"><option value="">请选择</option>${opts.map(x=>`<option ${String(x)===String(v)?'selected':''}>${x}</option>`).join('')}</select></label>`}

function risk(x,i){const a=answers[x.blind_item_id]||{};return `<article><h2>Risk ${i+1} / ${DATA.risk.length}</h2><h3>当前对话</h3><pre>${esc(x.visible_current_dialogue)}</pre><h3>严格过去来源</h3><pre>${esc(x.verified_strictly_past_user_owned_source)}</pre><h3>待评回复</h3><pre>${esc(x.response)}</pre>${families.map(f=>`<div class="family"><strong>${f}</strong>${select(x.blind_item_id,f+'_severity',[0,1,2,3])}${field(x.blind_item_id,f+'_evidence',(a[f+'_evidence']||''))}</div>`).join('')}${field(x.blind_item_id,'risk_notes',a.risk_notes)}</article>`}
function func(x,i){const a=answers[x.blind_item_id]||{};return `<article><h2>Function ${i+1} / ${DATA.function.length}</h2><h3>当前对话</h3><pre>${esc(x.visible_current_dialogue)}</pre><h3>严格过去来源</h3><pre>${esc(x.strictly_past_user_owned_source)}</pre><h3>待评回复</h3><pre>${esc(x.response)}</pre>${select(x.blind_item_id,'label',['FUNCTIONAL','NOT_USED_FINAL','SURFACE_ECHO_ONLY','BOUNDARY_FAILURE','UNRESOLVED'])}${field(x.blind_item_id,'source_evidence_quote',a.source_evidence_quote)}${field(x.blind_item_id,'response_evidence_quote',a.response_evidence_quote)}${field(x.blind_item_id,'boundary_event_quote',a.boundary_event_quote)}${field(x.blind_item_id,'rationale',a.rationale)}</article>`}
