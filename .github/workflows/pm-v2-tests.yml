name: PM tests

on:
  pull_request:
    paths:
      - "project/**"
      - ".github/workflows/pm-v2-tests.yml"
  push:
    branches:
      - main
      - "codex/**"
      - "agent/**"
      - "work/paper1-*"
    paths:
      - "project/**"
      - ".github/workflows/pm-v2-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep dependency resolution isolated from runner-level user packages.
      # Reportable Paper-1 stages enforce the same invariant at runtime.
      PYTHONNOUSERSITE: "1"
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - name: Install CPU PyTorch for non-GPU CI
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch==2.3.1+cpu"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile PM-v2 modules
        run: python -m compileall -q src scripts tests
      - name: Run blocking public-only Paper-1 suite
        run: pytest -q -m "not gpu" tests/test_paper1_*.py
      - name: Validate Paper-1 integration base and outcome lock
        run: python scripts/paper1/00_validate_integration_base.py
